<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Curso SEC RIC</title>
<meta name="description" content="Curso de preparación para la certificación SEC en instalaciones eléctricas domiciliarias de baja tensión: DS N°8/2019 y Pliegos Técnicos Normativos RIC N°01 a N°19.">
<meta name="theme-color" content="#0B2545">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F4F6F9;--surface:#FFFFFF;--surface2:#EEF2F7;--ink:#0F1B2D;--muted:#4B5A6E;--line:#D5DCE6;
  --blue:#1D4ED8;--blue-ink:#1E3A8A;--blue-soft:#E6EDFC;--nav:#0B2545;--nav2:#13315C;--nav-ink:#E6ECF5;--nav-mut:#A9B8CF;
  --warn:#8A4B00;--warn-bg:#FFF4DB;--warn-line:#E8A317;--ok:#166534;--ok-bg:#E5F4EA;--bad:#B42318;--bad-bg:#FDECEA;
  --fase:#1D4ED8;--neutro:#9CA3AF;--pe:#15803D;--pe2:#EAB308;--l2:#111827;--l3:#C81E1E;--cu:#C27A2C;
  --r:12px;--sh:0 1px 2px rgba(15,27,45,.06),0 2px 8px rgba(15,27,45,.06);
  --fb:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fm:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1220;--surface:#111B2E;--surface2:#18243B;--ink:#E6ECF5;--muted:#A6B3C7;--line:#2A3852;
  --blue:#8DB2FF;--blue-ink:#BFD3FF;--blue-soft:#1A2A4D;--nav:#060D1A;--nav2:#0C1A33;
  --warn:#F5C26B;--warn-bg:#33260C;--warn-line:#B7811A;--ok:#7EDC9C;--ok-bg:#0F2C1D;--bad:#FF9E94;--bad-bg:#3B1513;
  --fase:#6F9BFF;--neutro:#D1D5DB;--l2:#9CA3AF;--l3:#FF6B6B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1220;--surface:#111B2E;--surface2:#18243B;--ink:#E6ECF5;--muted:#A6B3C7;--line:#2A3852;
  --blue:#8DB2FF;--blue-ink:#BFD3FF;--blue-soft:#1A2A4D;--nav:#060D1A;--nav2:#0C1A33;
  --warn:#F5C26B;--warn-bg:#33260C;--warn-line:#B7811A;--ok:#7EDC9C;--ok-bg:#0F2C1D;--bad:#FF9E94;--bad-bg:#3B1513;
  --fase:#6F9BFF;--neutro:#D1D5DB;--l2:#9CA3AF;--l3:#FF6B6B;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;font:16px/1.6 var(--fb);color:var(--ink);background:var(--bg)}
a{color:var(--blue)}
h1,h2,h3,h4{line-height:1.25;letter-spacing:-.01em;margin:0 0 .5em}
h1{font-size:clamp(24px,4vw,32px)}h2{font-size:20px}h3{font-size:17px}h4{font-size:15px}
p{margin:0 0 .8em}
code,.mono{font-family:var(--fm);font-size:.92em}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}
.skip{position:absolute;left:8px;top:-60px;background:var(--blue);color:#fff;padding:10px 14px;border-radius:8px;z-index:200}.skip:focus{top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Shell */
.top{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,var(--nav),var(--nav2));color:var(--nav-ink);border-bottom:1px solid rgba(255,255,255,.08)}
.top .in{display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-left));min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:#fff;text-decoration:none;white-space:nowrap}
.brand .lg{width:30px;height:30px;border-radius:8px;background:#E8A317;display:grid;place-items:center;flex:none}
.brand small{display:block;font-weight:500;color:var(--nav-mut);font-size:11.5px}
.menu-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff}
.search{flex:1;min-width:0;position:relative;max-width:520px;margin-left:auto}
.search input{width:100%;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;padding:0 12px 0 36px;font:15px var(--fb)}
.search input::placeholder{color:var(--nav-mut)}
.search svg{position:absolute;left:10px;top:11px;width:20px;height:20px;stroke:var(--nav-mut);fill:none;stroke-width:2}
.tbtn{margin-left:auto;width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;flex:none}
.prog-top{height:4px;background:rgba(255,255,255,.12)}.prog-top i{display:block;height:100%;background:#E8A317;transition:width .4s}
.layout{display:grid;grid-template-columns:1fr;max-width:1320px;margin:0 auto}
.side{position:fixed;inset:64px 0 0 0;z-index:40;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px 40px;transform:translateX(-102%);transition:transform .2s;width:min(86vw,300px)}
.side.open{transform:none;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.scrim{position:fixed;inset:64px 0 0;background:rgba(5,10,20,.45);z-index:39}
.side h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 10px 6px}
.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14.5px;min-height:40px}
.side a:hover{background:var(--surface2)}
.side a[aria-current="page"]{background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.side .num{font:600 11px var(--fm);color:var(--muted);min-width:22px}
.side .done{margin-left:auto;color:var(--ok);font-size:13px}
@media (max-width:640px){.top .in{flex-wrap:wrap}.search{order:5;flex-basis:100%;max-width:none;margin:0}.themewrap{margin-left:auto}
  .side{top:0;z-index:60}.scrim{top:0;z-index:55}}
@media (min-width:980px){
  .menu-btn{display:none}
  .layout{grid-template-columns:280px minmax(0,1fr)}
  .side{position:sticky;top:64px;height:calc(100vh - 64px);transform:none;width:auto;box-shadow:none}
  .scrim{display:none}}
main{padding:16px max(16px,env(safe-area-inset-left)) 60px;min-width:0;max-width:1040px}
main:focus{outline:0}
.crumbs{font-size:13.5px;color:var(--muted);margin:2px 0 12px;display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--muted)}.crumbs span[aria-current]{color:var(--ink);font-weight:600}

/* Components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(14px,2.4vw,22px);margin:0 0 14px;box-shadow:var(--sh)}
.eb{display:inline-block;font:600 11.5px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink);background:var(--blue-soft);padding:4px 10px;border-radius:99px;margin-bottom:8px}
.lead{color:var(--muted);font-size:17px;max-width:72ch}
.muted{color:var(--muted)}.small{font-size:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.tile{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--blue);transform:translateY(-1px)}
.tile b{display:block}.tile small{color:var(--muted);display:block;font-size:13.5px}
.tile .tag{margin-top:8px}
.tag{display:inline-block;font:600 11.5px var(--fb);padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.tag.prio{background:var(--blue-soft);color:var(--blue-ink);border-color:transparent}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.ref{display:inline-block;font:600 12px var(--fm);color:var(--blue-ink);background:var(--blue-soft);padding:1px 7px;border-radius:6px;overflow-wrap:anywhere;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.vf{display:inline-block;font:600 12px var(--fb);color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line);padding:0 6px;border-radius:6px;white-space:nowrap}
.note{padding:12px 14px;border-radius:10px;background:var(--blue-soft);color:var(--ink);border-left:4px solid var(--blue);margin:0 0 14px;font-size:15px}
.note.warn{background:var(--warn-bg);border-left-color:var(--warn-line)}
.note.ok{background:var(--ok-bg);border-left-color:var(--ok)}
.note.bad{background:var(--bad-bg);border-left-color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0A1220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0A1220}}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.bar{height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--blue);transition:width .4s}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0 0 14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;border-left:4px solid var(--blue)}
.kpi span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}.kpi b{font-size:24px}
.kpi.ok{border-left-color:var(--ok)}.kpi.bad{border-left-color:var(--bad)}.kpi.warn{border-left-color:var(--warn-line)}
.tw{overflow-x:auto;margin:0 0 12px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
caption{text-align:left;font-weight:600;padding:0 0 6px;color:var(--ink)}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--surface2)}
ul.clean{list-style:none;padding:0;margin:0}
ul.err li{margin-bottom:6px}
dl.defs{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 14px;margin:0}
dl.defs dt{font-weight:700}dl.defs dd{margin:0}
@media (max-width:560px){dl.defs{grid-template-columns:1fr}dl.defs dd{margin-bottom:8px}}
.exam{border-left:4px solid var(--warn-line)}
details{border:1px solid var(--line);border-radius:10px;padding:0 12px;margin:0 0 10px;background:var(--surface)}
details>summary{cursor:pointer;font-weight:600;padding:10px 0;min-height:44px;display:flex;align-items:center}
details[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
input[type=number],input[type=text],select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:16px var(--fb);padding:6px 10px;width:100%}
label.f{display:block}label.f span{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr))}
.out{font:600 15px var(--fm);background:var(--surface2);border-radius:10px;padding:12px;border:1px solid var(--line)}
.formula{font:500 15px var(--fm);background:var(--surface2);padding:10px 12px;border-radius:8px;overflow-x:auto;white-space:nowrap;margin:0 0 10px}

/* Figures */
figure.fig{margin:0 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--sh)}
figure.fig .sv{overflow-x:auto}
figure.fig svg{display:block;width:100%;height:auto;max-width:760px;margin:0 auto;min-width:520px}
figure.fig figcaption{font-size:14px;color:var(--muted);margin-top:8px}
figure.fig figcaption b{color:var(--ink)}
.errbox{margin-top:8px}
svg text{font:12.5px var(--fb);fill:var(--ink)}
svg .t-b{font-weight:700}svg .t-m{fill:var(--muted);font-size:11.5px}svg .t-bad{fill:var(--bad);font-weight:700}svg .t-ok{fill:var(--ok);font-weight:700}
svg .bx{fill:var(--surface2);stroke:var(--muted);stroke-width:1.5}
svg .bx2{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
svg .ln{stroke:var(--ink);stroke-width:1.6;fill:none}
svg .dim{stroke:var(--muted);stroke-width:1;fill:none;stroke-dasharray:4 3}
svg .wf{stroke:var(--fase);stroke-width:3.2;fill:none;stroke-linecap:round}
svg .wn{stroke:var(--neutro);stroke-width:3.2;fill:none;stroke-linecap:round}
svg .wpe{stroke:var(--pe);stroke-width:3.2;fill:none;stroke-linecap:round}
svg .wl2{stroke:var(--l2);stroke-width:3.2;fill:none}svg .wl3{stroke:var(--l3);stroke-width:3.2;fill:none}
svg .bad{stroke:var(--bad);stroke-width:3;fill:none}svg .badf{fill:var(--bad)}
svg .okf{fill:var(--ok)}svg .okl{stroke:var(--ok);stroke-width:3;fill:none}
svg .soil{fill:#B98552;opacity:.28}svg .cu{fill:var(--cu)}svg .cus{stroke:var(--cu);stroke-width:5;fill:none;stroke-linecap:round}
svg .ins{fill:#3B3F46}svg .tape{fill:#111;opacity:.85}
svg .brk{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.5}
svg .rcd{fill:var(--warn-bg);stroke:var(--warn-line);stroke-width:1.5}
svg .dot{fill:var(--ink)}svg .wall{fill:var(--surface2);stroke:var(--muted);stroke-width:1}
svg .curveB{stroke:var(--blue);stroke-width:3;fill:none}svg .curveC{stroke:var(--warn-line);stroke-width:3;fill:none}svg .curveD{stroke:var(--bad);stroke-width:3;fill:none}
svg .ax{stroke:var(--muted);stroke-width:1.5;fill:none}
svg .flowb{fill:var(--surface);stroke:var(--blue);stroke-width:1.5}
svg .hl{fill:none;stroke:var(--bad);stroke-width:2.5;stroke-dasharray:5 3}

/* Quiz */
.q{font-weight:600;font-size:clamp(16px,2.3vw,19px);margin-bottom:10px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ops{display:grid;gap:8px}
.op{display:flex;gap:10px;align-items:center;text-align:left;width:100%;min-height:48px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.op:hover:not([disabled]){border-color:var(--blue)}
.op .ol{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:7px;background:var(--surface2);font-weight:700}
.op.sel{border-color:var(--blue);background:var(--blue-soft)}
.op.ok{border-color:var(--ok);background:var(--ok-bg)}.op.ok .ol{background:var(--ok);color:#fff}
.op.bad{border-color:var(--bad);background:var(--bad-bg)}.op.bad .ol{background:var(--bad);color:#fff}
.op[disabled]{cursor:default}
.fb{margin-top:10px;padding:12px;border-radius:10px;border:1px solid}.fb.ok{background:var(--ok-bg);border-color:var(--ok)}.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.qimg svg{max-width:560px;min-width:0}
.timer{font:700 18px var(--fm);padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.rev li{margin-bottom:10px}

/* Flow */
.flow{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));counter-reset:st}
.flow button{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px 10px 44px;min-height:62px}
.flow button::before{counter-increment:st;content:counter(st);position:absolute;left:10px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font:700 12px var(--fb)}
.flow button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.flow button small{display:block;color:var(--muted);font-size:12.5px}
.steps{counter-reset:s;list-style:none;padding:0}
.steps>li{position:relative;padding:0 0 12px 40px}
.steps>li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.chk li{list-style:none;margin:0 0 6px}.chk{padding:0}.chk label{display:flex;gap:10px;align-items:flex-start}.chk input{width:20px;height:20px;margin-top:3px;flex:none}
.sres a{display:block;padding:10px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.sres a:hover{background:var(--surface2)}
.sres small{color:var(--muted)}
mark{background:#FDE68A;color:#111;border-radius:3px;padding:0 2px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}.btn.big{min-height:52px;font-size:16.5px;padding:10px 18px}
.tile.big{padding:18px;border-left:4px solid var(--blue)}.tile.big b{font-size:17px;margin-bottom:4px}
.bnav{display:none}
@media (max-width:979px){
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border:0;background:none;color:var(--muted);text-decoration:none;font:600 11px var(--fb);border-radius:10px}
  .bnav span{font-size:20px;line-height:1}
  .bnav [aria-current="page"]{color:var(--blue-ink);background:var(--blue-soft)}
  .bnav .ev{color:var(--blue-ink)}}
@media print{.bnav{display:none!important}}
footer.foot{border-top:1px solid var(--line);margin-top:30px;padding-top:14px;color:var(--muted);font-size:13.5px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
  .top,.side,.scrim,.row,.no-print,.crumbs,.op[disabled]:not(.ok),.errbtn{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .layout{display:block}main{max-width:none;padding:0}
  .card,figure.fig{box-shadow:none;border:1px solid #999;break-inside:avoid}
  details{border:0}details>summary{display:none}
  details:not([open])>*:not(summary){display:block!important}
  figure.fig svg{min-width:0;max-width:16cm}
  a{color:#000;text-decoration:none}
  .ref,.vf{border:1px solid #888;background:#fff;color:#000}
  @page{margin:16mm}}
</style>
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>
<header class="top">
  <div class="in">
    <button class="menu-btn" id="menuBtn" aria-label="Abrir menú de módulos" aria-expanded="false" aria-controls="side">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="#/inicio" aria-label="Inicio del curso SEC RIC">
      <span class="lg" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="#0B2545"/></svg></span>
      <span>Curso SEC · RIC<small>Instalaciones domiciliarias BT</small></span>
    </a>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <label class="sr" for="q">Buscar en todo el curso</label>
      <input id="q" type="search" placeholder="Buscar: diferencial, RIC 06, TE1…" autocomplete="off">
    </div>
    <button class="tbtn" id="themeBtn" aria-label="Cambiar entre modo claro y oscuro" title="Modo claro / oscuro">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <div class="prog-top" role="progressbar" aria-label="Progreso global del curso" aria-valuemin="0" aria-valuemax="100" id="progTop"><i style="width:0"></i></div>
