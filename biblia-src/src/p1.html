<style>
/* =====================================================================
   SISTEMA DE DISEÑO · tokens
   Un color de marca, neutros, semánticos y uno por área. Espaciado base 4,
   escala tipográfica modular (razón 1,125), radios, sombras y duraciones.
   Los nombres antiguos (--blue, --copper, --c3…) quedan como alias.
   ===================================================================== */
:root{
  /* tipografía: fuentes del sistema (sin descargas) */
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-display:var(--f-body);
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --f-math:"Cambria Math","STIX Two Math","Latin Modern Math","STIX Two Text",Cambria,"Times New Roman",serif;
  --fs--2:.79rem; --fs--1:.889rem; --fs-0:1rem; --fs-1:1.125rem; --fs-2:1.266rem; --fs-3:1.424rem; --fs-4:1.602rem; --fs-5:1.802rem; --fs-6:2.027rem;
  --lh-tight:1.25; --lh-base:1.6;
  --fw-reg:400; --fw-med:500; --fw-semi:600; --fw-bold:700;
  /* espaciado (base 4) */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:28px; --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;
  /* radios */
  --r-1:4px; --r-2:6px; --r-3:8px; --r-4:12px; --r-5:16px; --r-full:999px;
  /* movimiento */
  --dur-1:150ms; --dur-2:200ms; --dur-3:250ms; --ease:cubic-bezier(.2,.7,.2,1);
  /* tamaños táctiles y de lectura */
  --tap:44px; --measure:70ch;

  /* color · claro */
  --brand:#2350C4; --brand-hover:#1C43A8; --brand-soft:#EAF0FC; --on-brand:#FFFFFF;
  --n-0:#FFFFFF; --n-50:#F6F7F9; --n-100:#EEF1F5; --n-200:#E2E6EC; --n-300:#CBD1DA; --n-500:#596273; --n-700:#323A47; --n-900:#111827;
  --bg:var(--n-50); --surface:var(--n-0); --surface2:var(--n-100); --ink:var(--n-900); --ink-2:var(--n-700); --muted:var(--n-500); --line:var(--n-200); --line2:var(--n-300);
  --ok:#17724A; --ok-soft:#E8F5EE; --warn:#93560A; --warn-soft:#FDF3E1; --bad:#B42318; --bad-soft:#FDECEA; --info:var(--brand); --info-soft:var(--brand-soft);

  --a-mat:#4F46E5; --a-est:#7C3AED; --a-io:#2563EB; --a-prod:#0F766E; --a-cal:#166534; --a-log:#0E7490; --a-eco:#A04A07; --a-ges:#BE123C; --a-prog:#475569; --a-seg:#C2410C; --a-car:#A21CAF; --a-ref:#6B645F;
  /* series de gráficos (categóricas) */
  --cat-1:var(--brand); --cat-2:#C2560F; --cat-3:#17724A; --cat-4:#6E56B8; --cat-5:#0E7C86; --cat-6:#B42356;
  /* sombras */
  --sh-1:0 1px 2px rgba(17,24,39,.06); --sh-2:0 2px 8px rgba(17,24,39,.08); --sh-3:0 12px 32px rgba(17,24,39,.16);
  --scrim:rgba(10,14,20,.45);
  /* documento simulado (Word): imita a propósito los colores de Word */
  --doc-paper:#FFFFFF; --doc-ink:#1B1B1B; --doc-h1:#1F3864; --doc-h2:#2F5496; --doc-cap:#44546A; --doc-rule:#888888; --doc-head:#DCE6F2; --doc-quote:#444444; --doc-quote-rule:#BBBBBB; --doc-toc:#F7F9FC; --doc-toc-rule:#99AAAA;

  /* alias de nombres anteriores */
  --blue:var(--brand); --blue-soft:var(--brand-soft); --copper:var(--cat-2); --copper-soft:#FBF0E8; --c3:var(--cat-4); --c4:var(--cat-5); --shadow:var(--sh-1);
}

  --brand:#8DB0FF; --brand-hover:#A9C3FF; --brand-soft:#1A2338; --on-brand:#0B1220;

  --cat-2:#F0A36E; --cat-3:#6FCF9A; --cat-4:#B6A2F0; --cat-5:#5FCFD6; --cat-6:#F48FB1; --copper-soft:#33231A;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 2px 8px rgba(0,0,0,.45); --sh-3:0 12px 32px rgba(0,0,0,.55);

  --cat-2:#F0A36E; --cat-3:#6FCF9A; --cat-4:#B6A2F0; --cat-5:#5FCFD6; --cat-6:#F48FB1; --copper-soft:#33231A;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 2px 8px rgba(0,0,0,.45); --sh-3:0 12px 32px rgba(0,0,0,.55);

/* Layout: herramienta técnica de consulta — barra superior y menú lateral sobrios, contenido en una columna de lectura; secciones como listas desplegables con divisores, sin cajas de colores. Un solo acento azul; los colores de estado solo comunican estado. */
*{box-sizing:border-box}

.backb[hidden]{display:none}
.layout{max-width:1240px;margin:0 auto;padding-left:max(var(--sp-4),env(safe-area-inset-left,0px));padding-right:max(var(--sp-4),env(safe-area-inset-right,0px));padding-block:var(--sp-5) 80px;display:grid;grid-template-columns:262px minmax(0,1fr);gap:var(--sp-7);align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding-bottom:var(--sp-3)}
.side button{display:flex;gap:var(--sp-3);align-items:baseline;width:100%;text-align:left;border:0;background:none;color:var(--ink);font-family:var(--f-body);font-size:var(--fs--1);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-2);cursor:pointer}

.card.result .sechead .tag{background:var(--copper-soft);color:var(--copper)}

/* ===== Capa visual: sobria y consistente ===== */
body{font-size:var(--fs-0);line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--blue-soft)}
h1{font-size:var(--fs-5);font-weight:600;letter-spacing:-.018em;line-height:1.25;margin:0 0 var(--sp-2)}
h2{font-size:var(--fs-1);font-weight:600;letter-spacing:-.01em}
h3{font-size:var(--fs-0);font-weight:600}
h4{font-weight:600}
.eyebrow{font-family:var(--f-body);font-size:var(--fs--2);font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:0 0 var(--sp-2)}
.lead{font-size:var(--fs-0);color:var(--muted);line-height:1.6;margin-bottom:var(--sp-6)}
/* barra superior */
.top{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(8px)}
.top-in{padding-block:var(--sp-2)}
.brand{font-family:var(--f-body);font-weight:600;font-size:var(--fs-0);letter-spacing:-.005em;gap:var(--sp-3)}
.brand b{color:inherit;font-weight:600}
.brand::before{content:"BI";width:28px;height:28px;border-radius:var(--r-3);background:var(--ink);color:var(--surface);display:grid;place-items:center;font:600 var(--fs--2)/1 var(--f-mono);letter-spacing:.02em}
.crumb{font-size:var(--fs--1)}
/* menú lateral */
.side{padding-right:var(--sp-1)}
.side button{font-size:var(--fs--1);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-2);color:var(--ink)}
.side button:hover{background:var(--surface2)}
.side button[aria-current="true"]{background:var(--blue-soft);color:var(--blue);font-weight:600}
.side button[aria-current="true"] .k{color:var(--blue)}
.side button[aria-current="true"] .done{color:var(--blue)}
.side button .k{font-size:var(--fs--2);min-width:22px;opacity:1}
.side details.sgp>summary{font-size:var(--fs--2);font-weight:600;letter-spacing:.07em;padding:var(--sp-4) var(--sp-3) var(--sp-2)}
.gsw input{border-radius:var(--r-3);background:var(--surface);font-size:var(--fs--1)}
/* tarjetas y secciones */
.card{border-radius:var(--r-4);padding:var(--sp-6);box-shadow:var(--shadow)}
.card.form,.card.result{border-top:1px solid var(--line)}
.sechead .tag,.card.result .sechead .tag{font-family:var(--f-body);font-size:var(--fs--2);font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--surface2);color:var(--muted);border:1px solid var(--line);padding:2px var(--sp-2);border-radius:var(--r-2)}
.sechead h2{font-size:var(--fs-1)}
/* desplegables: lista con divisores */
details.learn,details.item{border-radius:var(--r-4);margin-bottom:var(--sp-2);box-shadow:var(--shadow)}
details.learn{background:var(--surface)}
details.learn>summary,details.item>summary{padding:var(--sp-3) var(--sp-4);font-weight:600;font-family:var(--f-body);font-size:var(--fs--1)}
details.learn>summary::before,details.item>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg) translate(-1px,-1px);margin:0 var(--sp-2) 0 2px;flex:none;transition:transform var(--dur-1)}
details[open].item>summary::before,details[open].learn>summary::before{transform:rotate(45deg)}
details[open].item>summary,details[open].learn>summary{border-bottom:1px solid var(--line);margin-bottom:var(--sp-4)}
details.item>summary:hover,details.learn>summary:hover{background:var(--surface2);border-radius:var(--r-4)}
details[open].item>summary:hover,details[open].learn>summary:hover{border-radius:var(--r-4) var(--r-4) 0 0}
/* bloques explicativos: sin rieles de color */
.deep-b,.deep-b.why,.deep-b.use{border:1px solid var(--line);border-radius:var(--r-3);background:var(--surface);padding:var(--sp-4) var(--sp-4);margin:var(--sp-3) 0}
.deep-b h4,.deep-b.why h4,.deep-b.use h4{font-size:var(--fs--2);font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 var(--sp-2)}
.deep-b.why h4{color:var(--blue)}
.deep-b.use h4{color:var(--ok)}
.deep-b.ejr{background:var(--surface2)}
.howto{border:1px solid var(--line);border-radius:var(--r-4);background:var(--surface2)}
.howto summary{color:var(--ink);font-weight:600}
.chain div{border-left:2px solid var(--line2);border-radius:0}
.chain div.root{border-color:var(--blue);background:var(--blue-soft)}
/* avisos */
.note{font-size:var(--fs--1);border:1px solid color-mix(in srgb,var(--warn) 28%,transparent);border-radius:var(--r-3);padding:var(--sp-3) var(--sp-4)}
.note.info{border-color:color-mix(in srgb,var(--blue) 25%,transparent)}
.note.bad{border-color:color-mix(in srgb,var(--bad) 28%,transparent)}
.note.ok{border-color:color-mix(in srgb,var(--ok) 28%,transparent)}
/* botones y campos */

.top{border-bottom:1px solid var(--line)}
.top-in{max-width:none;padding-block:var(--sp-1);gap:var(--sp-1);min-height:56px}
