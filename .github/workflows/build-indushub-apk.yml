name: Build INDUSHUB APK

# Compila el APK de Android de INDUSHUB en las máquinas de GitHub (gratis).
# NO requiere cuenta de Expo, ni token, ni configuración previa.
# Cómo usarlo desde el celular:
#   1. Ve a la pestaña "Actions" del repositorio en GitHub.
#   2. Elige "Build INDUSHUB APK" y pulsa "Run workflow".
#   3. Espera ~10-15 min. Al terminar, abre la ejecución y descarga el
#      artefacto "INDUSHUB-apk" (un .zip con app-debug.apk dentro).
#   4. Descomprime, abre el APK e instálalo (permite "orígenes desconocidos").

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK (Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias
        working-directory: indushub
        run: npm install

      - name: Generar el proyecto Android (expo prebuild)
        working-directory: indushub
        run: npx expo prebuild --platform android --no-install

      - name: Preparar SDK/NDK de Android
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" >/dev/null 2>&1 || true

      - name: Ajustar memoria de Gradle (evita OutOfMemory)
        working-directory: indushub/android
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "android.enableJetifier=false"
          } >> gradle.properties

      - name: Compilar APK (release, autónomo — el JS va empaquetado)
        working-directory: indushub/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --max-workers=2

      - name: Renombrar el APK
        run: cp indushub/android/app/build/outputs/apk/release/app-release.apk INDUSHUB.apk

      - name: Publicar el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: INDUSHUB-apk
          path: INDUSHUB.apk
          if-no-files-found: error

      - name: Publicar Release con enlace directo al APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: indushub-app
          name: INDUSHUB · App Android
          body: |
            APK instalable de INDUSHUB (Android).
            Descarga **INDUSHUB.apk** aquí abajo, ábrelo e instálalo
            (permite "instalar apps de orígenes desconocidos").
          files: INDUSHUB.apk
