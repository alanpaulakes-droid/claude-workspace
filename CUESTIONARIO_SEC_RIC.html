<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Curso SEC RIC</title>
<meta name="description" content="Curso de preparación para la certificación SEC en instalaciones eléctricas domiciliarias de baja tensión: DS N°8/2019 y Pliegos Técnicos Normativos RIC N°01 a N°19.">
<meta name="theme-color" content="#0B2545">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F4F6F9;--surface:#FFFFFF;--surface2:#EEF2F7;--ink:#0F1B2D;--muted:#4B5A6E;--line:#D5DCE6;
  --blue:#1D4ED8;--blue-ink:#1E3A8A;--blue-soft:#E6EDFC;--nav:#0B2545;--nav2:#13315C;--nav-ink:#E6ECF5;--nav-mut:#A9B8CF;
  --warn:#8A4B00;--warn-bg:#FFF4DB;--warn-line:#E8A317;--ok:#166534;--ok-bg:#E5F4EA;--bad:#B42318;--bad-bg:#FDECEA;
  --fase:#1D4ED8;--neutro:#9CA3AF;--pe:#15803D;--pe2:#EAB308;--l2:#111827;--l3:#C81E1E;--cu:#C27A2C;
  --r:12px;--sh:0 1px 2px rgba(15,27,45,.06),0 2px 8px rgba(15,27,45,.06);
  --fb:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fm:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1220;--surface:#111B2E;--surface2:#18243B;--ink:#E6ECF5;--muted:#A6B3C7;--line:#2A3852;
  --blue:#8DB2FF;--blue-ink:#BFD3FF;--blue-soft:#1A2A4D;--nav:#060D1A;--nav2:#0C1A33;
  --warn:#F5C26B;--warn-bg:#33260C;--warn-line:#B7811A;--ok:#7EDC9C;--ok-bg:#0F2C1D;--bad:#FF9E94;--bad-bg:#3B1513;
  --fase:#6F9BFF;--neutro:#D1D5DB;--l2:#9CA3AF;--l3:#FF6B6B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1220;--surface:#111B2E;--surface2:#18243B;--ink:#E6ECF5;--muted:#A6B3C7;--line:#2A3852;
  --blue:#8DB2FF;--blue-ink:#BFD3FF;--blue-soft:#1A2A4D;--nav:#060D1A;--nav2:#0C1A33;
  --warn:#F5C26B;--warn-bg:#33260C;--warn-line:#B7811A;--ok:#7EDC9C;--ok-bg:#0F2C1D;--bad:#FF9E94;--bad-bg:#3B1513;
  --fase:#6F9BFF;--neutro:#D1D5DB;--l2:#9CA3AF;--l3:#FF6B6B;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;font:16px/1.6 var(--fb);color:var(--ink);background:var(--bg)}
a{color:var(--blue)}
h1,h2,h3,h4{line-height:1.25;letter-spacing:-.01em;margin:0 0 .5em}
h1{font-size:clamp(24px,4vw,32px)}h2{font-size:20px}h3{font-size:17px}h4{font-size:15px}
p{margin:0 0 .8em}
code,.mono{font-family:var(--fm);font-size:.92em}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}
.skip{position:absolute;left:8px;top:-60px;background:var(--blue);color:#fff;padding:10px 14px;border-radius:8px;z-index:200}.skip:focus{top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Shell */
.top{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,var(--nav),var(--nav2));color:var(--nav-ink);border-bottom:1px solid rgba(255,255,255,.08)}
.top .in{display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-left));min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:#fff;text-decoration:none;white-space:nowrap}
.brand .lg{width:30px;height:30px;border-radius:8px;background:#E8A317;display:grid;place-items:center;flex:none}
.brand small{display:block;font-weight:500;color:var(--nav-mut);font-size:11.5px}
.menu-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff}
.search{flex:1;min-width:0;position:relative;max-width:520px;margin-left:auto}
.search input{width:100%;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;padding:0 12px 0 36px;font:15px var(--fb)}
.search input::placeholder{color:var(--nav-mut)}
.search svg{position:absolute;left:10px;top:11px;width:20px;height:20px;stroke:var(--nav-mut);fill:none;stroke-width:2}
.tbtn{margin-left:auto;width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;flex:none}
.prog-top{height:4px;background:rgba(255,255,255,.12)}.prog-top i{display:block;height:100%;background:#E8A317;transition:width .4s}
.layout{display:grid;grid-template-columns:1fr;max-width:1320px;margin:0 auto}
.side{position:fixed;inset:64px 0 0 0;z-index:40;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px 40px;transform:translateX(-102%);transition:transform .2s;width:min(86vw,300px)}
.side.open{transform:none;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.scrim{position:fixed;inset:64px 0 0;background:rgba(5,10,20,.45);z-index:39}
.side h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 10px 6px}
.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14.5px;min-height:40px}
.side a:hover{background:var(--surface2)}
.side a[aria-current="page"]{background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.side .num{font:600 11px var(--fm);color:var(--muted);min-width:22px}
.side .done{margin-left:auto;color:var(--ok);font-size:13px}
@media (max-width:640px){.top .in{flex-wrap:wrap}.search{order:5;flex-basis:100%;max-width:none;margin:0}.themewrap{margin-left:auto}
  .side{top:0;z-index:60}.scrim{top:0;z-index:55}}
@media (min-width:980px){
  .menu-btn{display:none}
  .layout{grid-template-columns:280px minmax(0,1fr)}
  .side{position:sticky;top:64px;height:calc(100vh - 64px);transform:none;width:auto;box-shadow:none}
  .scrim{display:none}}
main{padding:16px max(16px,env(safe-area-inset-left)) 60px;min-width:0;max-width:1040px}
main:focus{outline:0}
.crumbs{font-size:13.5px;color:var(--muted);margin:2px 0 12px;display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--muted)}.crumbs span[aria-current]{color:var(--ink);font-weight:600}

/* Components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(14px,2.4vw,22px);margin:0 0 14px;box-shadow:var(--sh)}
.eb{display:inline-block;font:600 11.5px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink);background:var(--blue-soft);padding:4px 10px;border-radius:99px;margin-bottom:8px}
.lead{color:var(--muted);font-size:17px;max-width:72ch}
.muted{color:var(--muted)}.small{font-size:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.tile{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--blue);transform:translateY(-1px)}
.tile b{display:block}.tile small{color:var(--muted);display:block;font-size:13.5px}
.tile .tag{margin-top:8px}
.tag{display:inline-block;font:600 11.5px var(--fb);padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.tag.prio{background:var(--blue-soft);color:var(--blue-ink);border-color:transparent}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.ref{display:inline-block;font:600 12px var(--fm);color:var(--blue-ink);background:var(--blue-soft);padding:1px 7px;border-radius:6px;overflow-wrap:anywhere;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.vf{display:inline-block;font:600 12px var(--fb);color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line);padding:0 6px;border-radius:6px;white-space:nowrap}
.note{padding:12px 14px;border-radius:10px;background:var(--blue-soft);color:var(--ink);border-left:4px solid var(--blue);margin:0 0 14px;font-size:15px}
.note.warn{background:var(--warn-bg);border-left-color:var(--warn-line)}
.note.ok{background:var(--ok-bg);border-left-color:var(--ok)}
.note.bad{background:var(--bad-bg);border-left-color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0A1220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0A1220}}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.bar{height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--blue);transition:width .4s}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0 0 14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;border-left:4px solid var(--blue)}
.kpi span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}.kpi b{font-size:24px}
.kpi.ok{border-left-color:var(--ok)}.kpi.bad{border-left-color:var(--bad)}.kpi.warn{border-left-color:var(--warn-line)}
.tw{overflow-x:auto;margin:0 0 12px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
caption{text-align:left;font-weight:600;padding:0 0 6px;color:var(--ink)}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--surface2)}
ul.clean{list-style:none;padding:0;margin:0}
ul.err li{margin-bottom:6px}
dl.defs{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 14px;margin:0}
dl.defs dt{font-weight:700}dl.defs dd{margin:0}
@media (max-width:560px){dl.defs{grid-template-columns:1fr}dl.defs dd{margin-bottom:8px}}
.exam{border-left:4px solid var(--warn-line)}
details{border:1px solid var(--line);border-radius:10px;padding:0 12px;margin:0 0 10px;background:var(--surface)}
details>summary{cursor:pointer;font-weight:600;padding:10px 0;min-height:44px;display:flex;align-items:center}
details[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
input[type=number],input[type=text],select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:16px var(--fb);padding:6px 10px;width:100%}
label.f{display:block}label.f span{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr))}
.out{font:600 15px var(--fm);background:var(--surface2);border-radius:10px;padding:12px;border:1px solid var(--line)}
.formula{font:500 15px var(--fm);background:var(--surface2);padding:10px 12px;border-radius:8px;overflow-x:auto;white-space:nowrap;margin:0 0 10px}

/* Figures */
figure.fig{margin:0 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--sh)}
figure.fig .sv{overflow-x:auto}
figure.fig svg{display:block;width:100%;height:auto;max-width:760px;margin:0 auto;min-width:520px}
figure.fig figcaption{font-size:14px;color:var(--muted);margin-top:8px}
figure.fig figcaption b{color:var(--ink)}
.errbox{margin-top:8px}
svg text{font:12.5px var(--fb);fill:var(--ink)}
svg .t-b{font-weight:700}svg .t-m{fill:var(--muted);font-size:11.5px}svg .t-bad{fill:var(--bad);font-weight:700}svg .t-ok{fill:var(--ok);font-weight:700}
svg .bx{fill:var(--surface2);stroke:var(--muted);stroke-width:1.5}
svg .bx2{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
svg .ln{stroke:var(--ink);stroke-width:1.6;fill:none}
svg .dim{stroke:var(--muted);stroke-width:1;fill:none;stroke-dasharray:4 3}
svg .wf{stroke:var(--fase);stroke-width:3.2;fill:none;stroke-linecap:round}
svg .wn{stroke:var(--neutro);stroke-width:3.2;fill:none;stroke-linecap:round}
svg .wpe{stroke:var(--pe);stroke-width:3.2;fill:none;stroke-linecap:round}
svg .wl2{stroke:var(--l2);stroke-width:3.2;fill:none}svg .wl3{stroke:var(--l3);stroke-width:3.2;fill:none}
svg .bad{stroke:var(--bad);stroke-width:3;fill:none}svg .badf{fill:var(--bad)}
svg .okf{fill:var(--ok)}svg .okl{stroke:var(--ok);stroke-width:3;fill:none}
svg .soil{fill:#B98552;opacity:.28}svg .cu{fill:var(--cu)}svg .cus{stroke:var(--cu);stroke-width:5;fill:none;stroke-linecap:round}
svg .ins{fill:#3B3F46}svg .tape{fill:#111;opacity:.85}
svg .brk{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.5}
svg .rcd{fill:var(--warn-bg);stroke:var(--warn-line);stroke-width:1.5}
svg .dot{fill:var(--ink)}svg .wall{fill:var(--surface2);stroke:var(--muted);stroke-width:1}
svg .curveB{stroke:var(--blue);stroke-width:3;fill:none}svg .curveC{stroke:var(--warn-line);stroke-width:3;fill:none}svg .curveD{stroke:var(--bad);stroke-width:3;fill:none}
svg .ax{stroke:var(--muted);stroke-width:1.5;fill:none}
svg .flowb{fill:var(--surface);stroke:var(--blue);stroke-width:1.5}
svg .hl{fill:none;stroke:var(--bad);stroke-width:2.5;stroke-dasharray:5 3}

/* Quiz */
.q{font-weight:600;font-size:clamp(16px,2.3vw,19px);margin-bottom:10px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ops{display:grid;gap:8px}
.op{display:flex;gap:10px;align-items:center;text-align:left;width:100%;min-height:48px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.op:hover:not([disabled]){border-color:var(--blue)}
.op .ol{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:7px;background:var(--surface2);font-weight:700}
.op.sel{border-color:var(--blue);background:var(--blue-soft)}
.op.ok{border-color:var(--ok);background:var(--ok-bg)}.op.ok .ol{background:var(--ok);color:#fff}
.op.bad{border-color:var(--bad);background:var(--bad-bg)}.op.bad .ol{background:var(--bad);color:#fff}
.op[disabled]{cursor:default}
.fb{margin-top:10px;padding:12px;border-radius:10px;border:1px solid}.fb.ok{background:var(--ok-bg);border-color:var(--ok)}.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.qimg svg{max-width:560px;min-width:0}
.timer{font:700 18px var(--fm);padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.rev li{margin-bottom:10px}

/* Flow */
.flow{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));counter-reset:st}
.flow button{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px 10px 44px;min-height:62px}
.flow button::before{counter-increment:st;content:counter(st);position:absolute;left:10px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font:700 12px var(--fb)}
.flow button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.flow button small{display:block;color:var(--muted);font-size:12.5px}
.steps{counter-reset:s;list-style:none;padding:0}
.steps>li{position:relative;padding:0 0 12px 40px}
.steps>li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.chk li{list-style:none;margin:0 0 6px}.chk{padding:0}.chk label{display:flex;gap:10px;align-items:flex-start}.chk input{width:20px;height:20px;margin-top:3px;flex:none}
.sres a{display:block;padding:10px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.sres a:hover{background:var(--surface2)}
.sres small{color:var(--muted)}
mark{background:#FDE68A;color:#111;border-radius:3px;padding:0 2px}
footer.foot{border-top:1px solid var(--line);margin-top:30px;padding-top:14px;color:var(--muted);font-size:13.5px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
  .top,.side,.scrim,.row,.no-print,.crumbs,.op[disabled]:not(.ok),.errbtn{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .layout{display:block}main{max-width:none;padding:0}
  .card,figure.fig{box-shadow:none;border:1px solid #999;break-inside:avoid}
  details{border:0}details>summary{display:none}
  details:not([open])>*:not(summary){display:block!important}
  figure.fig svg{min-width:0;max-width:16cm}
  a{color:#000;text-decoration:none}
  .ref,.vf{border:1px solid #888;background:#fff;color:#000}
  @page{margin:16mm}}
</style>
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>
<header class="top">
  <div class="in">
    <button class="menu-btn" id="menuBtn" aria-label="Abrir menú de módulos" aria-expanded="false" aria-controls="side">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="#/inicio" aria-label="Inicio del curso SEC RIC">
      <span class="lg" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="#0B2545"/></svg></span>
      <span>Curso SEC · RIC<small>Instalaciones domiciliarias BT</small></span>
    </a>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <label class="sr" for="q">Buscar en todo el curso</label>
      <input id="q" type="search" placeholder="Buscar: diferencial, RIC 06, TE1…" autocomplete="off">
    </div>
    <button class="tbtn" id="themeBtn" aria-label="Cambiar entre modo claro y oscuro" title="Modo claro / oscuro">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <div class="prog-top" role="progressbar" aria-label="Progreso global del curso" aria-valuemin="0" aria-valuemax="100" id="progTop"><i style="width:0"></i></div>
</header>
<div class="layout">
  <nav class="side" id="side" aria-label="Módulos del curso"></nav>
  <div class="scrim" id="scrim" hidden></div>
  <main id="main" tabindex="-1"></main>
</div>
<script>
"use strict";
/* ============================================================
   FICHAS RIC N°01 a N°19
   Convenciones de texto: «RIC N°xx, punto» → cita resaltada · ⚠ → «verificar en pliego vigente»
   Campos: n, t (título), prio (relevante vivienda), obj, defs [[término, definición]],
           req [{cap, cols, rows, ref}], err [..], exam [..], dg [claves FIG]
   El mini-quiz de cada ficha toma 5 preguntas del banco con ric = n.
   ============================================================ */
const MARCO={
  ds:"DS N°8/2019 del Ministerio de Energía — Reglamento de seguridad de las instalaciones de consumo de energía eléctrica.",
  res:"Pliegos Técnicos Normativos RIC N°01 a N°19, dictados por la SEC (Res. Ex. N°33.877/2020, publicada en el Diario Oficial en enero de 2021) y sus actualizaciones posteriores (p. ej., RIC N°15, versión 2024).",

const TEORIA=[
{id:"ohm",t:"Ley de Ohm y potencia",html:`<div class="formula">V = I × R   ·   P = V × I × cos φ (monofásico)   ·   P = √3 × V<sub>L</sub> × I × cos φ (trifásico)</div>
<p>En la red domiciliaria chilena: 220 V entre fase y neutro y 380 V entre fases, 50 Hz.</p>
<div class="tw"><table><caption>Ejemplos rápidos</caption><thead><tr><th>Caso</th><th>Cálculo</th><th>Resultado</th></tr></thead><tbody>
<tr><td>Hervidor 2.200 W, 220 V</td><td>2.200 ÷ 220</td><td>10 A</td></tr>
<tr><td>Motor trifásico 380 V, 10 A, cos φ 0,85</td><td>√3 × 380 × 10 × 0,85</td><td>5.594 W</td></tr>
<tr><td>Carga 1.760 W, cos φ 0,8, 220 V</td><td>1.760 ÷ (220 × 0,8)</td><td>10 A</td></tr></tbody></table></div>`},
{id:"fp",t:"Factor de potencia",html:`<p>cos φ = P ÷ S. Potencia activa P (W), reactiva Q (VAr), aparente S (VA): S² = P² + Q². Con cos φ bajo, para la misma potencia útil circula más corriente: más pérdidas, más caída de tensión y conductores mayores. Se corrige con condensadores en instalaciones con motores.</p>`},
{id:"caida",t:"Caída de tensión",html:`<div class="formula">Monofásico: ΔV = 2 × ρ × L × I ÷ S    ·    Trifásico: ΔV = √3 × ρ × L × I ÷ S    ·    ΔV% = ΔV ÷ V × 100</div>
<p>ρ cobre ≈ 0,018 Ω·mm²/m (valor de cálculo usado en este curso; a temperatura de servicio es mayor). L en metros (solo ida), S en mm². Límites: 3 % por tramo y 5 % total «RIC N°03, 5.1.3».</p><div id="calcCaida"></div>`},
{id:"secc",t:"Dimensionamiento de conductores",html:`<ol class="steps"><li><b>Corriente de proyecto Ib</b>: P ÷ (V × cos φ).</li><li><b>Protección In</b>: In ≥ 1,1 × Ib (alumbrado «RIC N°10, 5.1.4.1») y Σ P ≤ 0,9 × V × In «RIC N°10, 5.1.4.4».</li><li><b>Capacidad corregida</b>: Iz' = Iz(tabla) × ft × fn «RIC N°04, Tablas 4.4, 4.6 y 4.7». Condición: Ib ≤ In ≤ Iz'.</li><li><b>Sección mínima por uso</b>: 1,5 / 2,5 / 4 mm² «RIC N°04, 5.4».</li><li><b>Caída de tensión</b>: ≤ 3 % el tramo y ≤ 5 % total. Si no cumple, subir sección.</li></ol><div id="calcSecc"></div>`},
{id:"selec",t:"Selectividad y curvas B / C / D",html:`<p>La <b>selectividad</b> consigue que ante una falla dispare solo la protección inmediatamente aguas arriba. Se logra escalonando calibres (y curvas) entre general y circuitos, y entre diferenciales (p. ej., 300 mA selectivo «S» aguas arriba de 30 mA instantáneos).</p>
<div class="tw"><table><thead><tr><th>Curva</th><th>Disparo magnético</th><th>Uso de referencia «RIC N°10, 5.1.4.2»</th></tr></thead><tbody><tr><td>B</td><td>3 a 5 × In</td><td>Iluminación, cargas resistivas, circuitos largos</td></tr><tr><td>C</td><td>5 a 10 × In</td><td>Enchufes, cargas mixtas</td></tr><tr><td>D</td><td>10 a 20 × In</td><td>Generales, motores, transformadores</td></tr></tbody></table></div>`,dg:["curvas"]},
{id:"dif",t:"Diferencial de 30 mA",html:`<p>Mide la diferencia entre corriente de ida (fase) y de retorno (neutro). Con IΔn = 30 mA protege a las personas como medida complementaria. Rango de disparo: entre 0,5 × IΔn (15 mA) y IΔn (30 mA). Tiempos de referencia para diferenciales generales: ≤ 300 ms a IΔn y ≤ 40 ms a 5 × IΔn (IEC 61008) ⚠. Tipos: AC (alterna senoidal), A (+ pulsante continua), B (+ continua lisa; cargadores VE, variadores).</p>`,dg:["diferencial"]},
{id:"esq",t:"Sistemas TT / TN / IT",html:`<p>Primera letra: relación de la fuente con tierra (T = a tierra, I = aislada). Segunda: relación de las masas (T = tierra local, N = unidas al neutro de la fuente). En TN, S = N y PE separados, C = combinados (PEN). La vivienda en Chile debe ser <b>TN-S</b> «RIC N°10, 5.2 f)».</p>`,dg:["esquemas"]}

/* ---------- Motor de preguntas ---------- */
function Quiz(el,qs,o={}){
  const st={i:0,ans:Array(qs.length).fill(null),done:Array(qs.length).fill(false),fin:false,t0:Date.now(),limit:o.minutes?o.minutes*60:0};
  let timer=null;
  const exam=o.mode==="exam";
  const qimg=q=>q.img&&QIMG[q.img]?`<div class="qimg fig" style="padding:8px;margin:0 0 10px">${QIMG[q.img]()}</div>`:"";
  const tick=()=>{if(!st.limit||st.fin)return;const left=st.limit-Math.floor((Date.now()-st.t0)/1000);const t=el.querySelector(".timer");if(t){const m=Math.max(0,left);t.textContent=`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;t.classList.toggle("low",m<300)}if(left<=0)finish()};
  function draw(focus){
    if(st.fin)return drawEnd();
    const q=qs[st.i],a=st.ans[st.i],shown=!exam&&st.done[st.i];
    el.innerHTML=`<div class="card" aria-live="polite">
     <div class="row" style="margin-top:0;justify-content:space-between"><span class="tag">Pregunta ${st.i+1} de ${qs.length}</span>${st.limit?`<span class="timer" role="timer" aria-label="Tiempo restante">--:--</span>`:""}</div>
     <div class="qmeta" style="margin-top:8px"><span class="tag prio">${ricName(q.ric)}</span><span class="tag">Dificultad ${"●".repeat(q.d)}${"○".repeat(3-q.d)}</span>${q.img?'<span class="tag">Con imagen</span>':""}</div>
     <p class="q" id="qt">${esc(q.q)}</p>${qimg(q)}
     <div class="ops" role="radiogroup" aria-labelledby="qt">${q.o.map((t,i)=>`<button class="op ${shown?(i===q.a?"ok":i===a?"bad":""):(a===i?"sel":"")}" role="radio" aria-checked="${a===i}" data-op="${i}" ${shown?"disabled":""}><span class="ol">${"ABCD"[i]}</span><span>${esc(t)}</span></button>`).join("")}</div>
     ${shown?`<div class="fb ${a===q.a?"ok":"bad"}" tabindex="-1" id="fb"><b>${a===q.a?"✓ Correcto":"✗ Incorrecto · respuesta: "+"ABCD"[q.a]}</b><p style="margin:6px 0">${esc(q.e)}</p><span class="ref">${fmtRef(q.ref)}</span>${q.v?" "+VF:""}</div>`:""}
     <div class="row">${st.i>0&&exam?'<button class="btn" data-nav="-1">← Anterior</button>':""}
      ${exam?`<button class="btn ${st.i<qs.length-1?"pri":""}" data-nav="1" ${st.i>=qs.length-1?"disabled":""}>Siguiente →</button><button class="btn ${st.i>=qs.length-1?"pri":""}" data-submit>Entregar examen</button>`:
       shown?`<button class="btn pri" data-nav="1">${st.i<qs.length-1?"Siguiente →":"Ver resultado"}</button>`:`<button class="btn pri" data-check ${a==null?"disabled":""}>Responder</button>`}
     </div>
     ${exam?`<details class="no-print" style="margin-top:12px"><summary>Mapa de preguntas (${st.ans.filter(x=>x!=null).length}/${qs.length} respondidas)</summary><div class="row" style="margin:0 0 10px">${qs.map((_,i)=>`<button class="btn sm ${i===st.i?"pri":""}" data-go="${i}" aria-label="Ir a pregunta ${i+1}${st.ans[i]!=null?", respondida":""}">${i+1}${st.ans[i]!=null?"✓":""}</button>`).join("")}</div></details>`:""}
     <p class="small muted no-print" style="margin-top:8px">Atajo: teclas A–D o 1–4 para elegir; Enter para responder.</p></div>`;
    tick();
    if(focus==="fb")el.querySelector("#fb")?.focus();else if(focus)el.querySelector(".op")?.focus();
  }
  function choose(i){if(!exam&&st.done[st.i])return;st.ans[st.i]=i;draw();el.querySelector(`[data-op="${i}"]`)?.focus()}
  function check(){if(st.ans[st.i]==null)return;st.done[st.i]=true;record(qs[st.i],st.ans[st.i]===qs[st.i].a);draw("fb")}
  function finish(){if(st.fin)return;st.fin=true;clearInterval(timer);if(exam)qs.forEach((q,i)=>record(q,st.ans[i]===q.a));drawEnd();o.onDone&&o.onDone(res())}
  function res(){const ok=qs.filter((q,i)=>st.ans[i]===q.a).length;const by={};qs.forEach((q,i)=>{const b=by[q.ric]||(by[q.ric]={n:0,ok:0});b.n++;if(st.ans[i]===q.a)b.ok++});return{ok,n:qs.length,by,min:Math.round((Date.now()-st.t0)/60000)}}
  function drawEnd(){
    const r=res(),p=pct(r.ok,r.n),pass=o.pass?p>=o.pass:null;
    const weak=Object.entries(r.by).filter(([,b])=>pct(b.ok,b.n)<(o.pass||60)).sort((a,b)=>pct(a[1].ok,a[1].n)-pct(b[1].ok,b[1].n));
    el.innerHTML=`<div class="card" tabindex="-1" id="endc"><h2>${exam?"Resultado del simulador":"Resultado"}</h2>
     <div class="kpis"><div class="kpi ${pass===false?"bad":"ok"}"><span>Puntaje</span><b>${p} %</b></div><div class="kpi"><span>Correctas</span><b>${r.ok}/${r.n}</b></div>${pass!=null?`<div class="kpi ${pass?"ok":"bad"}"><span>Estado (mínimo ${o.pass} %)</span><b>${pass?"Aprobado":"Reprobado"}</b></div>`:""}<div class="kpi"><span>Minutos</span><b>${r.min}</b></div></div>
     <h3>Resultado por pliego</h3>${Object.entries(r.by).sort().map(([k,b])=>`<div class="row" style="margin-top:6px"><span style="min-width:150px">${k==="GEN"?"Teoría y generales":`<a href="#/ric/${k}">RIC N°${k}</a>`}</span><span class="bar" aria-hidden="true"><i style="width:${pct(b.ok,b.n)}%"></i></span><span class="small">${b.ok}/${b.n} (${pct(b.ok,b.n)} %)</span></div>`).join("")}
     ${weak.length?`<div class="note warn" style="margin-top:14px"><b>Refuerza:</b> ${weak.map(([k])=>k==="GEN"?'<a href="#/teoria">Teoría</a>':`<a href="#/ric/${k}">RIC N°${k} — ${esc(RIC.find(x=>x.n===k)?.t||"")}</a>`).join(" · ")}</div>`:`<div class="note ok" style="margin-top:14px">Sin pliegos débiles en esta sesión.</div>`}
     <details><summary>Revisión de respuestas</summary><ol class="rev">${qs.map((q,i)=>{const ok=st.ans[i]===q.a;return `<li><b>${ok?"✓":"✗"} ${esc(q.q)}</b><br>${ok?"":`<span class="small">Tu respuesta: ${st.ans[i]!=null?esc(q.o[st.ans[i]]):"sin responder"} · </span>`}<span class="small">Correcta: <b>${esc(q.o[q.a])}</b></span><br><span class="small">${esc(q.e)}</span> <span class="ref">${fmtRef(q.ref)}</span>${q.v?" "+VF:""}</li>`}).join("")}</ol></details>
     <div class="row no-print">${o.again?`<button class="btn pri" data-again>Repetir con otras preguntas</button>`:""}<a class="btn" href="#/repaso">Repasar falladas (${Object.keys(S.fails).length})</a></div></div>`;
    el.querySelector("#endc").focus();
  }
  el.onclick=e=>{const b=e.target.closest("button");if(!b||!el.contains(b))return;
    if(b.dataset.op!=null)choose(+b.dataset.op);
    else if(b.dataset.check!=null)check();
    else if(b.dataset.nav){const n=st.i+ +b.dataset.nav;if(n>=qs.length){finish();return}st.i=Math.max(0,n);draw(true)}
    else if(b.dataset.go!=null){st.i=+b.dataset.go;draw(true)}
    else if(b.dataset.submit!=null){const sin=st.ans.filter(x=>x==null).length;if(!sin||confirm(`Quedan ${sin} preguntas sin responder. ¿Entregar de todas formas?`))finish()}
    else if(b.dataset.again!=null)o.again()};
  el.onkeydown=e=>{if(st.fin||e.target.closest("input,select,textarea,summary"))return;const k=e.key.toLowerCase();const m={a:0,b:1,c:2,d:3,1:0,2:1,3:2,4:3}[k];if(m!=null&&!e.ctrlKey&&!e.metaKey){e.preventDefault();choose(m)}else if(k==="enter"&&!exam&&!st.done[st.i]&&st.ans[st.i]!=null&&!e.target.closest("button")){e.preventDefault();check()}};
  if(st.limit)timer=setInterval(tick,1000);
  draw();
  return{stop:()=>clearInterval(timer)};
}
let activeQuiz=null;
const startQuiz=(el,qs,o)=>{activeQuiz&&activeQuiz.stop();activeQuiz=Quiz(el,qs,o)};

/* ---------- Calculadoras ---------- */
const izOf=(tc,met,s)=>IZ[tc][met][IZ.secc.indexOf(s)];
const ftOf=(tc,t)=>{const i=IZ.ft.t.findIndex(x=>t<=x);return IZ.ft[tc][i<0?IZ.ft.t.length-1:i]};
const fnOf=n=>IZ.fn.f[IZ.fn.hasta.findIndex(x=>n<=x)];
const protFor=(P,V,ib,min=6)=>IZ.prot.find(x=>x>=1.1*ib-1e-9&&x>=min&&P<=0.9*V*x+1e-9);
const dV=(tri,L,I,S,rho=0.018)=>(tri?Math.sqrt(3):2)*rho*L*I/S;
function calcCaida(el){
  el.innerHTML=`<div class="card no-print-break"><h3>Calculadora de caída de tensión</h3><div class="form">
   <label class="f"><span>Sistema</span><select id="cc-s"><option value="m">Monofásico 220 V</option><option value="t">Trifásico 380 V</option></select></label>
   <label class="f"><span>Largo L (m, solo ida)</span><input id="cc-l" type="number" min="1" value="25" inputmode="decimal"></label>
   <label class="f"><span>Corriente I (A)</span><input id="cc-i" type="number" min="0.1" step="0.1" value="16" inputmode="decimal"></label>
   <label class="f"><span>Sección S (mm²)</span><select id="cc-x">${IZ.secc.map(s=>`<option ${s===2.5?"selected":""}>${s}</option>`).join("")}</select></label>
   <label class="f"><span>Caída previa aguas arriba (%)</span><input id="cc-p" type="number" min="0" step="0.1" value="0" inputmode="decimal"></label></div>
   <div class="out" id="cc-o" role="status" aria-live="polite" style="margin-top:12px"></div></div>`;
  const run=()=>{const tri=$("#cc-s").value==="t",V=tri?380:220,L=+$("#cc-l").value,I=+$("#cc-i").value,s=+$("#cc-x").value,pr=+$("#cc-p").value||0;
    if(!(L>0&&I>0)){$("#cc-o").textContent="Ingresa largo y corriente mayores que cero.";return}
    const v=dV(tri,L,I,s),p=v/V*100,tot=p+pr;
    $("#cc-o").innerHTML=`ΔV = ${tri?"√3":"2"} × 0,018 × ${nf(L)} × ${nf(I,1)} ÷ ${nf(s,1)} = <b>${nf(v,2)} V</b> → <b>${nf(p,2)} %</b><br>Tramo: ${p<=3?'<span style="color:var(--ok)">cumple ≤ 3 %</span>':'<span style="color:var(--bad)">supera 3 %: sube la sección</span>'} · Total acumulado ${nf(tot,2)} %: ${tot<=5?'<span style="color:var(--ok)">cumple ≤ 5 %</span>':'<span style="color:var(--bad)">supera 5 %</span>'} <span class="ref">RIC N°03, 5.1.3</span>`};
  el.querySelectorAll("input,select").forEach(i=>i.oninput=run);run();
}
function calcSecc(el){
  el.innerHTML=`<div class="card"><h3>Dimensionamiento de conductor y protección</h3><div class="form">
   <label class="f"><span>Potencia P (W)</span><input id="cs-p" type="number" min="1" value="3000" inputmode="decimal"></label>
   <label class="f"><span>Sistema</span><select id="cs-s"><option value="m">Monofásico 220 V</option><option value="t">Trifásico 380 V</option></select></label>
   <label class="f"><span>cos φ</span><input id="cs-c" type="number" min="0.5" max="1" step="0.01" value="1"></label>
   <label class="f"><span>Uso</span><select id="cs-u"><option value="1.5">Iluminación (mín. 1,5 mm²)</option><option value="2.5" selected>Enchufes / mixto (mín. 2,5 mm²)</option><option value="4">Alimentador (mín. 4 mm²)</option></select></label>
   <label class="f"><span>Método</span><select id="cs-m"><option>A1</option><option>B1</option><option>E</option></select></label>
   <label class="f"><span>Aislación</span><select id="cs-t"><option value="70">70 °C (THWN, H07V…)</option><option value="90">90 °C (THHN, RV-K…)</option></select></label>
   <label class="f"><span>T° ambiente (°C)</span><input id="cs-a" type="number" value="30" min="10" max="60"></label>
   <label class="f"><span>Conductores activos en el ducto</span><input id="cs-n" type="number" value="2" min="1" max="60"></label>
   <label class="f"><span>Largo (m)</span><input id="cs-l" type="number" value="20" min="1"></label></div>
   <div class="out" id="cs-o" role="status" aria-live="polite" style="margin-top:12px"></div>
   <p class="small muted">Criterio del curso: Ib ≤ In ≤ Iz × ft × fn; In ≥ 1,1 × Ib y P ≤ 0,9 × V × In «RIC N°10»; sección mínima por uso; ΔV ≤ 3 %. Para motores y cargas especiales aplica además el pliego correspondiente.</p></div>`;
  el.querySelector("p.small").innerHTML=fmt(el.querySelector("p.small").textContent);
  const run=()=>{const P=+$("#cs-p").value,tri=$("#cs-s").value==="t",V=tri?380:220,c=+$("#cs-c").value||1,mn=+$("#cs-u").value,met=$("#cs-m").value,tc=$("#cs-t").value,ta=+$("#cs-a").value,n=+$("#cs-n").value||1,L=+$("#cs-l").value;
    const ib=P/((tri?Math.sqrt(3):1)*V*c),In=IZ.prot.find(x=>x>=1.1*ib-1e-9&&(tri||P<=0.9*V*x*c+1e-9));
    if(!In){$("#cs-o").textContent="Carga fuera del rango de la tabla del curso (> 125 A).";return}
    const ft=ftOf(tc,ta),fn=fnOf(n);
    const s=IZ.secc.find(x=>x>=mn&&izOf(tc,met,x)*ft*fn>=In&&dV(tri,L,ib,x)/V*100<=3);
    if(!s){$("#cs-o").textContent="Ninguna sección de la tabla cumple: revisa el largo o divide la carga.";return}
    const iz=izOf(tc,met,s),d=dV(tri,L,ib,s)/V*100;
    $("#cs-o").innerHTML=`Ib = ${nf(ib,2)} A · In = <b>${In} A</b> (≥ 1,1 × Ib = ${nf(1.1*ib,2)} A)<br>ft = ${nf(ft,2)} · fn = ${nf(fn,2)} → sección <b>${nf(s,1)} mm²</b> (Iz tabla ${iz} A → corregida ${nf(iz*ft*fn,1)} A ≥ ${In} A)<br>ΔV = ${nf(d,2)} % ${d<=3?"≤ 3 % ✓":""} <span class="ref">RIC N°04, Tablas 4.4, 4.6, 4.7</span>`};
  el.querySelectorAll("input,select").forEach(i=>i.oninput=run);run();
}

/* ---------- Casos prácticos (cálculo) ---------- */
function resolverCaso(c){
  const fd=P=>Math.min(P,3000)+Math.max(0,Math.min(P,120000)-3000)*.35+Math.max(0,P-120000)*.25;
  const rows=c.circ.map(x=>{const ib=x.p/220;const min=x.tipo==="luz"?10:16;const In=protFor(x.p,220,ib,min);const smin=x.tipo==="luz"?1.5:2.5;const s=IZ.secc.find(z=>z>=smin&&izOf("70",c.met,z)>=In);const d=dV(false,x.L,ib,s)/220*100;return Object.assign({},x,{ib,In,curva:x.tipo==="luz"?"B":"C",s,iz:izOf("70",c.met,s),d})});
  const general=rows.filter(r=>r.tipo!=="esp100"),esp=rows.filter(r=>r.tipo==="esp100");
  const Pinst=rows.reduce((a,r)=>a+r.p,0),Pg=general.reduce((a,r)=>a+r.p,0),Pdg=fd(Pg),Pd=Pdg+esp.reduce((a,r)=>a+r.p,0);
  let Imax,fases=null;
  if(c.tipo==="tri"){fases={L1:0,L2:0,L3:0};esp.forEach(r=>fases[r.f]+=r.p);fases.L3+=Pdg;Imax=Math.max(...Object.values(fases))/220}else Imax=Pd/220;
  const IG=IZ.prot.find(x=>x>=Imax&&x>=25);
  const sAl=IZ.secc.find(z=>z>=4&&izOf("70",c.met,z)>=IG);
  const dAl=c.tipo==="tri"?dV(true,c.Lal,Imax,sAl)/380*100:dV(false,c.Lal,Imax,sAl)/220*100;
  const DR=[25,40,63].find(x=>x>=IG);
  return{rows,Pinst,Pg,Pdg,Pd,Imax,IG,sAl,dAl,DR,fases};
}
function uniCaso(c,r){
  const w=Math.max(760,140+r.rows.length*62);const drs=[...new Set(r.rows.map(x=>x.dr))];
  let x0=110,body=`${T(20,26,(c.tipo==="tri"?"Empalme trifásico ":"Empalme ")+r.IG+" A","t-b")}<circle cx="60" cy="60" r="18" class="bx"/>${T(60,64,"kWh","t-b","middle")}<path d="M60 78V100" class="ln"/>${T(72,94,`Alim. ${nf(r.sAl,1)} mm² + PE`,"t-m")}<rect x="46" y="100" width="28" height="30" rx="3" class="brk"/>${T(84,120,`IG ${c.tipo==="tri"?"4P":"2P"} ${r.IG} A`,"t-m")}<path d="M60 130V150H${w-30}" class="ln" stroke-width="2.5"/>`;
  drs.forEach(d=>{const cs=r.rows.filter(z=>z.dr===d);const xa=x0,xb=x0+(cs.length-1)*62,xm=(xa+xb)/2;
   body+=`<path d="M${xm} 150V166" class="ln"/><rect x="${xm-16}" y="166" width="32" height="28" rx="3" class="rcd"/>${T(xm,210,d.replace(" ⚠",""),"t-m","middle")}${T(xm,222,(d.includes("tipo B")?"":r.DR+" A ")+"30 mA","t-m","middle")}<path d="M${xm} 194V232M${xa} 232H${xb}" class="ln"/>`;
   cs.forEach((z,i)=>{const x=xa+i*62;body+=`<path d="M${x} 232V242" class="ln"/><rect x="${x-12}" y="242" width="24" height="28" rx="3" class="brk"/>${T(x,284,z.c,"t-b","middle")}${T(x,298,z.In+"A "+z.curva,"t-m","middle")}${T(x,312,nf(z.s,1)+" mm²","t-m","middle")}`});x0=xb+90});
  return SV(`0 0 ${Math.max(w,x0)} 330`,"Diagrama unilineal — "+c.t,"Unilineal calculado del caso: empalme, alimentador, interruptor general, diferenciales y circuitos con calibre, curva y sección.",body);
}

const V={};

 RIC.forEach(r=>IDX.push({t:`RIC N°${r.n} — ${r.t}`,s:"Ficha",h:"#/ric/"+r.n,x:strip([r.t,r.obj,...r.defs.flat(),...r.req.flatMap(t=>t.rows.flat()),...r.err,...r.exam].join(" "))}));
 TEORIA.forEach(t=>IDX.push({t:t.t,s:"Teoría",h:"#/teoria",x:strip(t.t+" "+t.html)}));
 Object.entries(FIG).forEach(([k,f])=>IDX.push({t:f.t,s:"Diagrama",h:"#/diagramas",j:"fig-"+k,x:strip(f.t+" "+f.cap+" "+f.err+" "+f.ref)}));
 GLOSARIO.forEach(([a,b])=>IDX.push({t:a,s:"Glosario",h:"#/recursos",x:strip(a+" "+b)}));
 PROYECTO.forEach(p=>IDX.push({t:p.t,s:"Proceso del proyecto",h:"#/proyecto",x:strip(Object.values(p).join(" "))}));
 PRUEBAS.forEach(p=>IDX.push({t:p.t,s:"Pruebas",h:"#/pruebas",x:strip(Object.values(p).join(" "))}));
 PREGUNTAS.forEach(q=>IDX.push({t:q.q,s:"Pregunta · "+ricName(q.ric),h:"#/banco",x:strip(q.q+" "+q.o[q.a]+" "+q.e+" "+q.ref)}));
 IDX.forEach(e=>e.n=norm(e.t+" "+e.x));}
V.buscar=q=>{if(!IDX)buildIdx();const ws=norm(q).split(/\s+/).filter(w=>w.length>1);
 const res=ws.length?IDX.map(e=>({e,sc:ws.reduce((a,w)=>a+(e.n.includes(w)?(norm(e.t).includes(w)?3:1):-99),0)})).filter(r=>r.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,60):[];
 const hl=s=>{let h=esc(s);ws.forEach(w=>{h=h.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>")});return h};
 const snip=e=>{const i=e.n.indexOf(ws[0]);return i<0?"":"…"+e.x.substr(Math.max(0,i-60),160)+"…"};
 return `${crumbs([["Búsqueda"]])}<h1>Resultados para «${esc(q)}»</h1><p class="muted" role="status">${res.length} resultado(s)</p><div class="card sres" style="padding:0">${res.map(({e})=>`<a href="${e.h}" ${e.j?`data-jump="${e.j}"`:""}><b>${hl(e.t)}</b><br><small>${e.s} · ${hl(snip(e))}</small></a>`).join("")||'<p style="padding:14px">Sin resultados. Prueba con otra palabra (p. ej., «diferencial», «IP44», «TE1»).</p>'}</div>`};
let sT;$("#q").addEventListener("input",e=>{clearTimeout(sT);sT=setTimeout(()=>{const v=e.target.value.trim();if(v.length<2)return;history.replaceState(null,"","#/buscar/"+encodeURIComponent(v));route(false)},250)});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("#main").focus()}});

/* ---------- Router ---------- */
let pendingJump=null,stepFn=null;
function route(focus=true){
  activeQuiz&&activeQuiz.stop();activeQuiz=null;
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,""))||"inicio";const [a,b]=h.split("/");
  let html,cur=a;
  if(a==="ric"&&b){html=V.ricN(b);cur="ric/"+b}else if(a==="buscar")html=V.buscar(h.slice(7));else html=(V[a]||V.inicio)();
  const m=$("#main");m.innerHTML=html+`<footer class="foot"><p>${esc(MARCO.aviso)} Datos con ${VF} deben confirmarse en el pliego vigente.</p></footer>`;
  renderSide(V[a]?cur:"inicio");setProg();closeMenu();
  document.title=(a==="ric"&&b?`RIC N°${b} · `:"")+"Curso SEC RIC";
  after(a,b);
  if(pendingJump){const el=document.getElementById(pendingJump);pendingJump=null;if(el){el.scrollIntoView();el.querySelector("button,a")?.focus();return}}
  if(focus){window.scrollTo(0,0);m.focus({preventScroll:true})}
}
function after(a,b){
  stepFn=null;
  if(a==="ric"&&b){const qs=shuffle(PREGUNTAS.filter(q=>q.ric===b)).slice(0,5);if(qs.length)startQuiz($("#mini"),qs,{mode:"practice",onDone:r=>{S.mini[b]=pct(r.ok,r.n);save()},again:()=>after(a,b)})}
  if(a==="teoria"){calcCaida($("#calcCaida"));calcSecc($("#calcSecc"))}
  if(a==="proyecto"){const show=i=>{const p=PROYECTO[i];$("#stepd").innerHTML=`<h2>${i+1} · ${esc(p.t)}</h2><dl class="defs"><dt>Responsable</dt><dd>${esc(p.r)}</dd><dt>Documentos</dt><dd>${esc(p.d)}</dd><dt>Detalle</dt><dd>${fmt(p.x)}</dd></dl><div class="row">${i>0?`<button class="btn" data-step="${i-1}">← Anterior</button>`:""}${i<PROYECTO.length-1?`<button class="btn pri" data-step="${i+1}">Siguiente etapa →</button>`:""}</div>`;document.querySelectorAll(".flow button").forEach(x=>x.setAttribute("aria-pressed",String(+x.dataset.step===i)))};show(0);stepFn=show}
  if(a==="banco"){const sel=()=>{const r=$("#bf-r").value,d=+$("#bf-d").value,t=+$("#bf-i").value;return PREGUNTAS.filter(q=>(r==="todos"||q.ric===r)&&(!d||q.d===d)&&(t!==1||q.img)&&(t!==2||!S.ans[q.id]))};
   const upd=()=>{const s=sel();$("#bf-c").textContent=`${s.length} preguntas en la selección`;$("#bl").innerHTML=s.map(q=>`<li style="margin-bottom:10px"><b>${esc(q.q)}</b> <span class="tag">${ricName(q.ric)} · ${"●".repeat(q.d)}</span><ol type="A">${q.o.map((o,i)=>`<li${i===q.a?' style="font-weight:700"':""}>${esc(o)}${i===q.a?" ✓":""}</li>`).join("")}</ol><span class="small">${esc(q.e)}</span> <span class="ref">${fmtRef(q.ref)}</span></li>`).join("")};
   ["#bf-r","#bf-d","#bf-i"].forEach(s=>$(s).onchange=upd);upd();
   $("#bf-go").onclick=()=>{const s=sel();if(!s.length)return;const n=+$("#bf-n").value;startQuiz($("#bq"),shuffle(s).slice(0,n),{mode:"practice",again:()=>$("#bf-go").click()});$("#bq").scrollIntoView()}}
  if(a==="simulador"){$("#sm-go").onclick=()=>{const n=+$("#sm-n").value,t=+$("#sm-t").value,p=+$("#sm-p").value;let qs;
    if($("#sm-f").value==="vivienda"){const pr=new Set(RIC.filter(r=>r.prio).map(r=>r.n).concat("GEN"));const A=shuffle(PREGUNTAS.filter(q=>pr.has(q.ric))),B=shuffle(PREGUNTAS.filter(q=>!pr.has(q.ric)));const k=Math.round(n*.8);qs=shuffle(A.slice(0,k).concat(B.slice(0,n-k)))}else qs=shuffle(PREGUNTAS).slice(0,n);
    $("#simcfg").hidden=true;startQuiz($("#simq"),qs,{mode:"exam",minutes:t,pass:p,onDone:r=>{const pp=pct(r.ok,r.n);S.sims.push({f:Date.now(),p:pp,ok:pp>=p,n:r.n});save()},again:()=>route()})}}
  if(a==="repaso"){const go=$("#rp-go");if(go)go.onclick=()=>{const qs=shuffle(PREGUNTAS.filter(q=>S.fails[q.id])).slice(0,20);startQuiz($("#rpq"),qs,{mode:"practice",again:()=>route()})};
   const c=$("#rp-clr");if(c)c.onclick=()=>{S.fails={};save();route()};
   $("#rp-reset").onclick=()=>{if(confirm("¿Borrar todo tu progreso (lecturas, respuestas, simulacros)?")){Object.assign(S,{read:{},ans:{},fails:{},sims:[],mini:{}});save();route()}}}
  if(a==="recursos")document.querySelectorAll("[data-chk]").forEach(c=>c.onchange=()=>{S.read["chk:"+c.dataset.chk]=c.checked;save()});
}
document.addEventListener("click",e=>{
  const st=e.target.closest("[data-step]");if(st&&stepFn){stepFn(+st.dataset.step);return}
  const r=e.target.closest("[data-read]");if(r){const k=r.dataset.read;S.read[k]=!S.read[k];save();r.textContent=S.read[k]?"✓ Marcado como leído":"Marcar como leído";r.classList.toggle("pri",!S.read[k]);r.setAttribute("aria-pressed",String(S.read[k]));renderSide(location.hash.slice(2)||"inicio");setProg();return}
  if(e.target.closest("[data-print]")){document.querySelectorAll("details").forEach(d=>d.open=true);window.print();return}
  const er=e.target.closest("[data-err]");if(er){const k=er.dataset.err,f=document.getElementById("fig-"+k),on=er.getAttribute("aria-pressed")!=="true";f.querySelector(".sv").innerHTML=FIG[k].svg(on?"err":"ok");f.querySelector(".errbox").hidden=!on;er.setAttribute("aria-pressed",String(on));er.textContent=on?"✓ Ver instalación correcta":"⚠ Ver error común";return}
  const j=e.target.closest("[data-jump]");if(j){e.preventDefault();const id=j.dataset.jump,href=j.getAttribute("href");if(location.hash===href){const el=document.getElementById(id);el&&el.scrollIntoView();el?.querySelector("button")?.focus()}else{pendingJump=id;location.hash=href}}
});
window.addEventListener("hashchange",()=>route());
window.addEventListener("beforeprint",()=>document.querySelectorAll("details").forEach(d=>d.open=true));
route(false);
})();
</script>
</body>
</html>
