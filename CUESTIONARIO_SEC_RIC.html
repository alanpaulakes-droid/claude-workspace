 punto más desfavorable de la instalación?",o:["3 %","4 %","5 %","10 %"],a:2,e:"La caída total en el punto más desfavorable no debe exceder el 5 %.",ref:"RIC N°03, 5.1.3"},{id:"r03c",n:3,t:"Demanda",q:"Una casa tiene 10 kW de potencia instalada de alumbrado. ¿Cuál es su demanda según la Tabla 3.1?",o:["10.000 W","5.450 W","3.500 W","7.000 W"],a:1,e:"Primeros 3 kW al 100 % y de 3 a 120 kW al 35 %: 3.000 + 7.000 × 0,35 = 5.450 W.",ref:"RIC N°03, Tabla 3.1"},{id:"r03d",n:3,t:"Demanda",q:"¿Qué factor de simultaneidad corresponde a 10 viviendas con un solo empalme?",o:["1,00","0,92","0,85","0,73"],a:2,e:"La Tabla 3.2 asigna 0,85 a 10 viviendas.",ref:"RIC N°03, Tabla 3.2"},{id:"r03e",n:2,t:"Secciones mínimas",q:"¿Cuál es la sección mínima de un alimentador?",o:["1,5 mm²","2,5 mm²","4 mm²","6 mm²"],a:2,e:"La sección mínima del alimentador es 4 mm² y la del subalimentador 2,5 mm².",ref:"RIC N°03, 5.1.2 · RIC N°04, 5.4"},{id:"r04a",n:1,t:"Secciones mínimas",q:"¿Cuál es la sección mínima de un circuito de iluminación?",o:["1 mm²","1,5 mm²","2,5 mm²","4 mm²"],a:1,e:"Circuitos de iluminación: 1,5 mm²; enchufes y mixtos: 2,5 mm².",ref:"RIC N°04, 5.4"},{id:"r04b",n:1,t:"Secciones mínimas",q:"¿Cuál es la sección mínima de un circuito de enchufes?",o:["1,5 mm²","2,5 mm²","4 mm²","6 mm²"],a:1,e:"Circuitos de enchufes y mixtos: 2,5 mm² como mínimo.",ref:"RIC N°04, 5.4"},{id:"r04c",n:1,t:"Colores",q:"¿De qué color es el conductor neutro?",o:["Azul","Negro","Blanco","Verde"],a:2,e:"Neutro y tierra de servicio: blanco. Fases: azul, negro y rojo. Protección: verde o verde/amarillo.",ref:"RIC N°04, 5.32"},{id:"r04d",n:1,t:"Colores",q:"Según el código de colores, ¿de qué color es la fase 2?",o:["Azul","Negro","Rojo","Blanco"],a:1,e:"Fase 1 azul, fase 2 negro, fase 3 rojo.",ref:"RIC N°04, 5.32"},{id:"r04e",n:1,t:"Colores",q:"¿Qué colores solo pueden usarse para el conductor de protección?",o:["Rojo o negro","Verde o verde/amarillo","Blanco o gris","Azul o celeste"],a:1,e:"Las aislaciones verde o verde/amarillo se reservan para el conductor de protección.",ref:"RIC N°04, 5.32"},{id:"r04f",n:2,t:"Canalizaciones",q:"¿Qué porcentaje máximo de la sección de un tubo pueden ocupar 3 conductores?",o:["33 %","40 %","50 %","60 %"],a:0,e:"Con 2 o más conductores, 33 %; con 1 conductor, 50 %. El conductor de tierra se incluye en el cálculo.",ref:"RIC N°04, Tabla 4.21"},{id:"r04g",n:2,t:"Canalizaciones",q:"¿En qué caso se acepta hasta un 60 % de ocupación de un tubo?",o:["En tubos enterrados","En tuberías de unión de gabinetes de tableros de hasta 1 m","En tubos metálicos","Nunca"],a:1,e:"Para uniones de gabinetes de tableros o similares de longitud no superior a 1 m se puede considerar hasta 60 %.",ref:"RIC N°04, Tabla 4.21"},{id:"r04h",n:2,t:"Capacidad de corriente",q:"Si en un ducto van 5 conductores activos, ¿qué factor de corrección fn se aplica?",o:["1,0","0,8","0,7","0,5"],a:1,e:"De 4 a 6 conductores activos, fn = 0,8. La tierra no cuenta como conductor activo.",ref:"RIC N°04, Tabla 4.6"},{id:"r04i",n:2,t:"Capacidad de corriente",q:"¿Qué corriente soporta un cable de 2,5 mm² de 70 °C en método A1 (embutido) a 30 °C?",o:["15 A","18 A","21 A","24 A"],a:1,e:"Tabla 4.4, 70 °C, método A1: 2,5 mm² → 18 A.",ref:"RIC N°04, Tabla 4.4"},{id:"r04j",n:3,t:"Capacidad de corriente",q:"Con 40 °C de ambiente, ¿qué factor ft se aplica a un cable de 70 °C?",o:["1,00","0,94","0,87","0,71"],a:2,e:"Entre 36 y 40 °C, ft = 0,87 para cables de 70 °C.",ref:"RIC N°04, Tabla 4.7"},{id:"r04k",n:2,t:"Capacidad de corriente",q:"En un circuito trifásico, ¿se cuenta el neutro como cuarto conductor activo al aplicar la Tabla 4.6?",o:["Sí, siempre","No","Solo si es de igual sección","Solo en ductos metálicos"],a:1,e:"En circuitos trifásicos el neutro no se considera cuarto conductor, y el de protección nunca es conductor activo.",ref:"RIC N°04, 6.2.4"},{id:"r10a",n:1,t:"Diferenciales",q:"¿Qué sensibilidad máxima debe tener el diferencial de un circuito de alumbrado o enchufes?",o:["10 mA","30 mA","100 mA","300 mA"],a:1,e:"Todo circuito de alumbrado (iluminación y enchufes) debe tener diferencial de no más de 30 mA.",ref:"RIC N°10, 5.1.3.5"},{id:"r10b",n:3,t:"Diferenciales",q:"¿Cuántos circuitos como máximo pueden derivarse de un diferencial?",o:["2","3","4","6"],a:1,e:"Desde un diferencial no se pueden derivar más de 3 circuitos (salvo los de 300 mA de la protección general).",ref:"RIC N°10, 5.1.3.7"},{id:"r10c",n:3,t:"Circuitos",q:"¿Con qué margen se determina la capacidad de un circuito de alumbrado?",o:["La potencia exacta","La potencia más un 10 %","La potencia más un 25 %","El doble de la potencia"],a:1,e:"La capacidad es la potencia requerida más un 10 % adicional; se elige la protección comercial inmediatamente superior.",ref:"RIC N°10, 5.1.4.1"},{id:"r10d",n:3,t:"Circuitos",q:"Un circuito de 10 A en 220 V con centros de 100 W, ¿cuántos centros admite como máximo?",o:["22","20","19","10"],a:2,e:"Se iguala la suma de potencias al 90 % de la capacidad: 0,9 × 220 × 10 = 1.980 W → 19 centros de 100 W.",ref:"RIC N°10, 5.1.4.4 y 5.1.4.5"},{id:"r10e",n:1,t:"Circuitos",q:"Si no se conoce la potencia de un centro de iluminación, ¿cuánto se considera?",o:["60 W","100 W","150 W","250 W"],a:1,e:"Se considera una potencia mínima de 100 W por centro.",ref:"RIC N°10, 5.1.4.5"},{id:"r10f",n:1,t:"Circuitos",q:"¿Qué potencia unitaria se considera para cada enchufe en un circuito de alumbrado?",o:["100 W","150 W","250 W","500 W"],a:2,e:"Cada enchufe hembra se considera de 250 W (un enchufe múltiple de hasta 3 salidas equivale a un centro de 250 W).",ref:"RIC N°10, 5.1.4.6"},{id:"r10g",n:2,t:"Vivienda",q:"¿Cuántos circuitos como mínimo debe tener una vivienda de 45 m²?",o:["1","2","3","4"],a:2,e:"Mínimo 2 circuitos bajo 30 m² y 3 circuitos para 30 m² o más.",ref:"RIC N°10, 5.2 b)"},{id:"r10h",n:2,t:"Vivienda",q:"¿Qué capacidad mínima tiene el circuito exclusivo de enchufes de cocina y lavadero?",o:["10 A","16 A","20 A","25 A"],a:1,e:"Se debe proyectar al menos un circuito exclusivo para enchufes de cocina y/o lavadero de 16 A como mínimo.",ref:"RIC N°10, 5.2 d)"},{id:"r10i",n:1,t:"Vivienda",q:"Un dormitorio de 12 m², ¿cuántos centros de iluminación necesita como mínimo?",o:["1","2","3","Ninguno"],a:1,e:"Hasta 10 m² basta un centro; sobre 10 m² se instalan dos como mínimo, cada uno con su interruptor.",ref:"RIC N°10, 5.2 a)"},{id:"r10j",n:2,t:"Vivienda",q:"Un living tiene 14 m de perímetro. ¿Cuántos enchufes dobles o triples necesita como mínimo?",o:["1","2","3","4"],a:1,e:"Un enchufe por cada 8 m de perímetro o fracción: 14 m → 2 enchufes.",ref:"RIC N°10, 5.2 b)"},{id:"r10k",n:1,t:"Vivienda",q:"¿Cuántos enchufes como mínimo se instalan en una cocina?",o:["1","2","3","4"],a:2,e:"En cocinas al menos tres enchufes dobles o triples del tipo 10/16 A.",ref:"RIC N°10, 5.2 c)"},{id:"r10l",n:2,t:"Vivienda",q:"¿Con qué potencia mínima se proyecta el enchufe de un horno eléctrico?",o:["1.000 W","1.500 W","2.000 W","3.500 W"],a:1,e:"La potencia de estos enchufes es la del equipo, pero nunca inferior a 1.500 W.",ref:"RIC N°10, 5.2 e)"},{id:"r10m",n:2,t:"Vivienda",q:"¿Qué esquema de conexión a tierra se usa en viviendas?",o:["TT","IT","TN-S","TN-C"],a:2,e:"El esquema de conexión de tierra de la vivienda debe ser TN-S.",ref:"RIC N°10, 5.2 f)"},{id:"r10n",n:2,t:"Vivienda",q:"¿Cuál es la capacidad mínima de la protección del empalme de una vivienda?",o:["16 A","20 A","25 A","32 A"],a:2,e:"El empalme de una vivienda tiene una protección de al menos 25 A y su alimentador no menos de 4 mm².",ref:"RIC N°10, 5.2"},{id:"r10o",n:2,t:"Protecciones",q:"¿Qué curva de disparo se usa como referencia para circuitos de enchufes?",o:["B","C","D","Z"],a:1,e:"Referencia: curva B para iluminación, C para enchufes, D o K para protecciones generales.",ref:"RIC N°10, 5.1.4.2"},{id:"r10p",n:1,t:"Protecciones",q:"¿Se pueden usar los automáticos como interruptores para encender y apagar cargas?",o:["Sí, es lo recomendado","Solo en cocinas","No","Solo si son curva C"],a:2,e:"Las protecciones eléctricas no deben usarse como elementos de maniobra.",ref:"RIC N°10, 5.1.3.8"},{id:"r10q",n:2,t:"Conductores",q:"En instalaciones de uso general, ¿qué sección tiene como mínimo el neutro de un circuito?",o:["La mitad de la fase","Igual a la fase","1,5 mm² siempre","La que indique el fabricante"],a:1,e:"La sección del neutro de los circuitos es como mínimo igual a la de la fase.",ref:"RIC N°10, 5.1.5.3"},{id:"r06a",n:4,t:"Puesta a tierra",q:"¿Cuál es el valor máximo general de la puesta a tierra de servicio?",o:["5 Ω","10 Ω","20 Ω","80 Ω"],a:2,e:"La tierra de servicio no debe superar 20 Ω; solo con las condiciones del punto 6.2 se acepta hasta 80 Ω.",ref:"RIC N°06, 6.1 y 6.2"},{id:"r06b",n:5,t:"Puesta a tierra",q:"¿En qué caso puede la tierra de servicio llegar hasta 80 Ω?",o:["En cualquier vivienda","Con potencia instalada ≤ 10 kW, general omnipolar, diferencial de 300 mA en alimentadores y de 30 mA en todos los circuitos","Si el terreno es rocoso","Si hay pararrayos"],a:1,e:"Es una de las condiciones del punto 6.2 (6.2.1); la otra exige protecciones de sobretensión permanente y transitoria.",ref:"RIC N°06, 6.2.1 y 6.2.2"},{id:"r06c",n:4,t:"Puesta a tierra",q:"Una pica vertical de 2 m en terreno de 100 Ω·m, ¿qué resistencia aproximada tiene?",o:["20 Ω","50 Ω","100 Ω","200 Ω"],a:1,e:"Fórmula de estimación para pica vertical: R = ρ / L = 100 / 2 = 50 Ω.",ref:"RIC N°06, Tabla 6.4"},{id:"r05a",n:4,t:"Seguridad",q:"¿Cuál es la tensión de seguridad en corriente alterna en lugares húmedos?",o:["12 V","24 V","50 V","120 V"],a:1,e:"Tensión de seguridad: 50 V CA en lugares secos y 24 V CA en lugares húmedos.",ref:"RIC N°05, 5.8"},{id:"r05b",n:4,t:"Seguridad",q:"En un esquema TT con diferencial, ¿qué condición debe cumplir la tierra de protección?",o:["RA ≤ 20 Ω","RA × IΔn ≤ UL","RA ≥ UL","RA × In ≤ 220 V"],a:1,e:"La resistencia de tierra por la sensibilidad del diferencial no debe superar la tensión límite UL.",ref:"RIC N°05 (RA × Id ≤ UL)"},{id:"
