<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recorrido 3D realista</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#DDE6EC;--card:rgba(255,255,255,.88);--ink:#1F2D3A;--mute:#52616E;--accent:#F2B71E;--onacc:#1F2D3A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171C;--card:rgba(22,30,38,.86);--ink:#E8EEF2;--mute:#9AA9B5}}
:root[data-theme="dark"]{--bg:#10171C;--card:rgba(22,30,38,.86);--ink:#E8EEF2;--mute:#9AA9B5}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;position:relative;-webkit-user-select:none;user-select:none}
canvas#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;background:var(--card);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:12px;padding:8px 12px;font-size:.9rem;box-shadow:0 2px 12px rgba(0,0,0,.14)}
#room{top:calc(10px + env(safe-area-inset-top,0px));left:10px;font-weight:700}
#btns{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 150px)}
#btns button{position:static;font:inherit;font-weight:700;border:0;min-height:44px;cursor:pointer;color:var(--ink)}
#tour{background:var(--accent)!important;color:var(--onacc)!important}
#cap{left:10px;right:10px;bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;line-height:1.4}
#cap small{color:var(--mute);display:block;margin-top:2px}
#joy{position:absolute;left:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;background:var(--card);touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:var(--accent)}
#go{position:absolute;right:10px;bottom:calc(34px + env(safe-area-inset-bottom,0px));font:inherit;min-height:44px;border-radius:12px;border:0;padding:0 10px;background:var(--card);color:var(--ink)}
#map{position:absolute;left:10px;top:calc(56px + env(safe-area-inset-top,0px));width:200px;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.2);background:#fff;display:none}
#map.on{display:block}
#map img{display:block;width:100%}
#map canvas{position:absolute;inset:0;width:100%;height:100%}
#load{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);font-weight:700;z-index:9;text-align:center;padding:16px}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:520px){#map{width:150px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="room">Acceso (1)</div>
<div id="btns">

 <button class="hud" id="mode" type="button">Ver de noche</button>
 <button class="hud" id="tour" type="button">Visita guiada</button>
</div>
