hist:"<p>El <b>GHG Protocol</b>, creado por el World Resources Institute y el World Business Council for Sustainable Development, publicó su estándar corporativo en 2001 (revisado en 2004). La norma ISO 14064 se publicó en 2006. En Chile, el Ministerio del Medio Ambiente lanzó el programa <b>HuellaChile</b> en 2013 para que las organizaciones midan y reduzcan sus emisiones, y la <b>Ley 21.455</b> (2022), ley marco de cambio climático, fijó la meta de carbono neutralidad al 2050.</p>",
como:"<ul><li>Emisiones = dato de actividad × factor de emisión.</li><li>Datos de actividad: kWh, litros de diésel, m³ de gas, kilómetros recorridos.</li><li>Factores: kg de CO₂e por unidad, publicados por el GHG Protocol, el IPCC o fuentes nacionales. El factor de la electricidad depende de la matriz del Sistema Eléctrico Nacional y ha bajado con el aumento de la energía solar y eólica.</li><li>Intensidad: emisiones por unidad producida, útil para comparar en el tiempo.</li></ul>",
pasos:"<ol><li>Define los límites organizacionales y operacionales.</li><li>Recopila datos de consumo de 12 meses.</li><li>Aplica factores vigentes para el año evaluado.</li><li>Identifica las mayores fuentes y planifica reducciones (eficiencia energética, electromovilidad, contratos de energía renovable).</li><li>Verifica con un tercero si se va a comunicar públicamente.</li></ol>",
caso:"<p><b>Caso tipo: planta con calderas y flota propia.</b> La mayor fuente suele ser la electricidad (alcance 2) o el diésel de la flota (alcance 1). Un contrato de suministro con certificados de energía renovable reduce el alcance 2 contabilizado, mientras que cambiar grúas horquilla de combustión por eléctricas reduce el alcance 1 y además el ruido y las emisiones locales.</p>",
err:"<ul><li>Usar factores de emisión desactualizados.</li><li>Sumar unidades distintas (litros con kWh) sin convertir.</li><li>Omitir fuentes como refrigerantes (fugas de gases con alto potencial de calentamiento).</li></ul>",
src:["World Resources Institute y WBCSD. (2004). <i>The Greenhouse Gas Protocol: A Corporate Accounting and Reporting Standard</i> (Revised ed.).", "ISO 14064-1:2018. Gases de efecto invernadero.", "Ministerio del Medio Ambiente. Programa HuellaChile (huellachile.mma.gob.cl).", "Ley 21.455 (2022). Ley marco de cambio climático. BCN."]
};

GUIDE["foda"] = {
que:"<p>El <b>análisis FODA</b> (en inglés SWOT) ordena la situación de una organización o proyecto en cuatro cuadrantes: <b>Fortalezas</b> y <b>Debilidades</b> (internas, controlables) y <b>Oportunidades</b> y <b>Amenazas</b> (externas, del entorno). Su valor no está en la lista sino en las <b>estrategias cruzadas</b> que se derivan de ella.</p>",
hist:"<p>Su origen se atribuye a los cursos de política de negocios de la Harvard Business School en los años sesenta (Learned, Christensen, Andrews y Guth, <i>Business Policy</i>, 1965) y a trabajos de Albert Humphrey en el Stanford Research Institute, aunque la autoría exacta es discutida. Heinz Weihrich propuso en 1982 la <b>matriz TOWS</b>, que cruza los cuadrantes para generar estrategias FO, DO, FA y DA.</p>",
como:"<ul><li><b>FO (ofensivas):</b> usar fortalezas para aprovechar oportunidades.</li><li><b>DO (adaptativas):</b> superar debilidades aprovechando oportunidades.</li><li><b>FA (defensivas):</b> usar fortalezas para reducir amenazas.</li><li><b>DA (supervivencia):</b> minimizar debilidades y evitar amenazas.</li></ul><p>Para el análisis externo conviene usar <b>PESTEL</b> (político, económico, social, tecnológico, ecológico, legal) y las <b>cinco fuerzas de Porter</b> (1979); para el interno, la <b>cadena de valor</b> de Porter (1985) y los recursos y capacidades de la empresa.</p>",
pasos:"<ol><li>Define el objeto (empresa, área, proyecto) y el horizonte.</li><li>Haz el análisis externo con datos (mercado, regulación, competencia).</li><li>Haz el análisis interno con indicadores (costos, calidad, OEE, clima).</li><li>Prioriza 3 a 5 ítems por cuadrante.</li><li>Cruza y redacta estrategias concretas con responsable y plazo.</li></ol>",
caso:"<p><b>Caso tipo: planta de envases plásticos.</b> Una fortaleza (personal experimentado e ISO 9001) cruzada con una oportunidad (Ley REP que impulsa envases reciclables) da una estrategia FO: desarrollar una línea de envases con material reciclado certificado. Una debilidad (cambios de formato de 90 minutos) frente a una amenaza (importaciones de bajo costo) lleva a una estrategia DA: aplicar SMED para competir en pedidos pequeños y variados, donde los importadores no son competitivos.</p>",
err:"<ul><li>Confundir oportunidades con acciones («ampliar la planta» no es una oportunidad).</li><li>Poner en fortalezas cosas que no distinguen a la empresa.</li><li>Quedarse en las cuatro listas sin estrategias.</li></ul>",
src:["Weihrich, H. (1982). The TOWS matrix: A tool for situational analysis. <i>Long Range Planning, 15</i>(2), 54–66.", "Porter, M. E. (1980). <i>Competitive Strategy</i>. Free Press.", "David, F. R. (2013). <i>Conceptos de administración estratégica</i> (14.ª ed.). Pearson."]
};
GUIDE["ishikawa"] = {
que:"<p>El <b>diagrama de Ishikawa</b> (causa-efecto o espina de pescado) organiza las posibles causas de un problema en categorías. La cabeza es el efecto y las espinas, las familias de causas. Las categorías clásicas de manufactura son las <b>6M</b>: mano de obra, método, máquina, material, medición y medio ambiente. En servicios se usan las 4P (políticas, procedimientos, personas, planta) o categorías propias.</p>",
hist:"<p>Lo creó <b>Kaoru Ishikawa</b>, profesor de la Universidad de Tokio, y lo aplicó en 1943 en la planta de Kawasaki Steel. Se difundió en los círculos de calidad japoneses de los años sesenta y forma parte de las siete herramientas básicas de la calidad descritas en su <i>Guide to Quality Control</i> (1968).</p>",
como:"<ol><li>Escribe el efecto de forma específica y medible («35 % de piezas con rebaba en la inyectora 4»).</li><li>Dibuja las categorías.</li><li>Haz una lluvia de ideas en equipo y ubica cada causa.</li><li>Profundiza cada causa preguntando «¿por qué?».</li><li>Marca las causas más probables y verifícalas con datos.</li></ol><p>El diagrama genera hipótesis; no prueba nada por sí solo.</p>",
pasos:"<ol><li>Reúne a operadores, mantención, calidad y supervisión.</li><li>Construye el diagrama en un papelógrafo o con la herramienta.</li><li>Vota las 3 causas más probables.</li><li>Diseña una verificación para cada una (medición, prueba, comparación entre turnos).</li><li>Actúa sobre las causas confirmadas.</li></ol>",
caso:"<p><b>Caso tipo: rebaba en piezas inyectadas.</b> El diagrama del ejemplo propone causas en todas las categorías. La verificación mostró que la resina húmeda (material) y el desgaste del molde (máquina) explicaban la mayor parte de las rebabas: se instaló un secador de resina y se programó el rectificado del molde. La capacitación (mano de obra) era una causa real pero menor.</p>",
err:"<ul><li>Efecto vago («problemas de calidad»).</li><li>Tratar todas las causas como igualmente probables.</li><li>Saltar a soluciones sin verificar causas.</li></ul>",
src:["Ishikawa, K. (1986). <i>Guide to Quality Control</i> (2nd rev. ed.). Asian Productivity Organization.", "Ishikawa, K. (1986). <i>¿Qué es el control total de calidad? La modalidad japonesa</i>. Norma.", "Tague, N. R. (2005). <i>The Quality Toolbox</i> (2nd ed.). ASQ Quality Press."]
};
GUIDE["porques"] = {
que:"<p>Los <b>5 porqués</b> son una técnica para llegar a la causa raíz de un problema preguntando «¿por qué?» de forma sucesiva hasta encontrar una causa sobre la que se pueda actuar y que, al eliminarla, impida que el problema se repita. El número 5 es una guía, no una regla.</p>",
hist:"<p>Fue desarrollada por <b>Sakichi Toyoda</b>, fundador de Toyota Industries, y difundida por <b>Taiichi Ohno</b> como parte del Sistema de Producción Toyota. En su libro (1978, en inglés 1988) Ohno describe el ejemplo de una máquina detenida por sobrecarga cuya causa raíz era la falta de un filtro en la bomba de lubricación.</p>",
como:"<ul><li>Parte de un hecho observado, no de una opinión.</li><li>Cada respuesta debe ser verificable.</li><li>Si hay varias causas, abre una rama por cada una (análisis en árbol).</li><li>Detente cuando llegues a una causa de sistema (procedimiento, diseño, plan, capacitación) que puedas cambiar.</li><li>Prueba la cadena al revés con «por lo tanto».</li></ul>",
pasos:"<ol><li>Ve al lugar del problema (gemba) con quienes lo vivieron.</li><li>Describe el problema con datos.</li><li>Pregunta por qué y registra cada respuesta.</li><li>Define una acción correctiva y una preventiva con responsable y plazo.</li><li>Verifica que el problema no se repita.</li></ol>",
caso:"<p><b>Caso tipo: detención de una línea.</b> El motor se detuvo por sobrecarga → el rodamiento estaba agarrotado → no tenía lubricación → la lubricación no estaba en el plan → no existía plan preventivo para las cintas. La acción no es «lubricar el rodamiento» (eso es corrección) sino crear el plan preventivo (acción correctiva sistémica).</p>",
err:"<ul><li>Terminar en «error humano» o «falta de cuidado».</li><li>Responder con suposiciones no verificadas.</li><li>Seguir una sola rama cuando hay varias causas.</li></ul>",
src:["Ohno, T. (1988). <i>Toyota Production System: Beyond Large-Scale Production</i>. Productivity Press.", "Liker, J. K. (2004). <i>The Toyota Way</i>. McGraw-Hill.", "Serrat, O. (2017). The five whys technique. En <i>Knowledge Solutions</i> (pp. 307–310). Springer."]
};
GUIDE["sipoc"] = {
que:"<p>El <b>SIPOC</b> describe un proceso a alto nivel en una tabla de cinco columnas: <b>proveedores</b> (Suppliers), <b>entradas</b> (Inputs), <b>proceso</b> (Process, en 4 a 7 pasos), <b>salidas</b> (Outputs) y <b>clientes</b> (Customers). Delimita el alcance de un proyecto de mejora y alinea al equipo sobre dónde empieza y termina el proceso.</p>",
hist:"<p>Surgió en los programas de gestión de la calidad total de los años ochenta y se consolidó como herramienta de la fase Definir del DMAIC en Seis Sigma, especialmente en General Electric en los noventa.</p>",
como:"<ol><li>Nombra el proceso y define su inicio y fin.</li><li>Escribe los pasos principales (verbo + objeto).</li><li>Identifica salidas y clientes (internos y externos).</li><li>Identifica entradas y proveedores.</li><li>Agrega los requisitos críticos del cliente (CTQ) para cada salida.</li></ol>",
pasos:"<ol><li>Trabaja con el dueño del proceso.</li><li>Empieza por el centro (proceso) y luego hacia los extremos.</li><li>Valida con un recorrido en terreno.</li><li>Usa el SIPOC como portada del proyecto y luego detalla con un diagrama de flujo o VSM.</li></ol>",
caso:"<p><b>Caso tipo: despacho de pedidos.</b> El SIPOC mostró que el cliente interno «facturación» necesitaba la guía firmada el mismo día y que eso no estaba en el alcance de nadie. Se agregó un paso de digitalización de guías y bajaron las facturas atrasadas.</p>",
err:"<ul><li>Detallar demasiado (para eso está el diagrama de flujo).</li><li>Olvidar clientes internos.</li></ul>",
src:["Pyzdek, T., y Keller, P. (2014). <i>The Six Sigma Handbook</i> (4th ed.). McGraw-Hill.", "George, M. L., Rowlands, D., Price, M., y Maxey, J. (2005). <i>The Lean Six Sigma Pocket Toolbook</i>. McGraw-Hill."]
};
GUIDE["canvas"] = {
que:"<p>El <b>Business Model Canvas</b> describe en una lámina cómo una organización crea, entrega y captura valor, con nueve bloques: segmentos de clientes, propuesta de valor, canales, relación con clientes, fuentes de ingresos, recursos clave, actividades clave, socios clave y estructura de costos. Es la herramienta estándar de los talleres de innovación y emprendimiento.</p>",
hist:"<p><b>Alexander Osterwalder</b> lo propuso en su tesis doctoral en la Universidad de Lausana (2004) y lo publicó con Yves Pigneur en <i>Business Model Generation</i> (2010), libro creado con la colaboración de 470 personas de 45 países. Ash Maurya propuso el <b>Lean Canvas</b> (2010) para startups, y Steve Blank y Eric Ries (<i>The Lean Startup</i>, 2011) difundieron la validación de hipótesis con clientes.</p>",
como:"<ul><li>El lado derecho (clientes, propuesta, canales, relación, ingresos) es el valor; el izquierdo (actividades, recursos, socios, costos), la eficiencia.</li><li>Cada bloque es una hipótesis que debe validarse con clientes reales.</li><li>El <b>Value Proposition Canvas</b> detalla el encaje entre los trabajos, dolores y ganancias del cliente y los productos, aliviadores y creadores de ganancia.</li></ul>",
pasos:"<ol><li>Empieza por el segmento y la propuesta de valor.</li><li>Completa el resto con post-its.</li><li>Marca las hipótesis más riesgosas.</li><li>Diseña experimentos (entrevistas, prototipos, preventas).</li><li>Itera el canvas con lo aprendido.</li></ol>",
caso:"<p><b>Caso tipo: mantenimiento predictivo con sensores.</b> La hipótesis más riesgosa no era técnica sino comercial: ¿pagarían las plantas una suscripción mensual en vez de un servicio puntual? Diez entrevistas con jefes de mantención mostraron que preferían pagar por equipo monitoreado con resultados garantizados, lo que cambió el bloque de fuentes de ingresos.</p>",
err:"<ul><li>Llenarlo una vez y no validarlo.</li><li>Segmentos demasiado amplios («todas las empresas»).</li></ul>",
src:["Osterwalder, A., y Pigneur, Y. (2011). <i>Generación de modelos de negocio</i>. Deusto.", "Ries, E. (2012). <i>El método Lean Startup</i>. Deusto.", "Blank, S., y Dorf, B. (2013). <i>El manual del emprendedor</i>. Gestión 2000."]
};
GUIDE["raci"] = {
que:"<p>La <b>matriz RACI</b> asigna roles a cada actividad de un proceso o proyecto: <b>R</b> (Responsible, quien ejecuta), <b>A</b> (Accountable, quien aprueba y responde por el resultado; uno solo), <b>C</b> (Consulted, a quien se consulta antes) e <b>I</b> (Informed, a quien se informa después). Evita tareas sin dueño y conflictos por decisiones.</p>",
hist:"<p>Proviene de los «gráficos de responsabilidad lineal» usados en la gestión de proyectos desde los años cincuenta y setenta, y se popularizó con los marcos de gestión de proyectos y de procesos (PMBOK, COBIT, ITIL).</p>",
como:"<ul><li>Filas: actividades o decisiones. Columnas: roles (no personas).</li><li>Exactamente una A por actividad; al menos una R.</li><li>Demasiadas C hacen lento el proceso; demasiadas I saturan de correos.</li><li>Un rol con muchas R puede ser un cuello de botella.</li></ul>",
pasos:"<ol><li>Lista actividades del proyecto o proceso.</li><li>Define roles.</li><li>Asigna letras en taller con los involucrados.</li><li>Valida reglas (una A) y equilibra cargas.</li><li>Publícala y úsala al iniciar el proyecto.</li></ol>",
caso:"<p><b>Caso tipo: implementación de una mejora en planta.</b> Antes de la matriz, nadie aprobaba formalmente la capacitación de operadores y quedó sin hacer. Al asignar la A al jefe de proyecto y la R al ingeniero de procesos, la actividad entró al cronograma.</p>",
err:"<ul><li>Varias A en la misma actividad.</li><li>Usar nombres de personas en vez de roles.</li></ul>",
src:["Project Management Institute. (2021). <i>PMBOK Guide</i> (7th ed.).", "Kerzner, H. (2017). <i>Project Management: A Systems Approach to Planning, Scheduling, and Controlling</i> (12th ed.). Wiley."]
};
GUIDE["generador-informe"] = {
que:"<p>El <b>informe técnico</b> es el producto final del trabajo de ingeniería: comunica un problema, el método usado, los resultados y una recomendación para que alguien tome una decisión. Un buen análisis con un mal informe no se implementa. Este generador arma la estructura estándar y permite descargarla en Word o PDF con portada, índice, numeración de tablas y figuras, y pie de página.</p>",
hist:"<p>La redacción técnica como disciplina se desarrolló en la industria y el ejército estadounidense durante la Segunda Guerra Mundial, cuando la complejidad de los equipos exigió manuales e informes estandarizados. La estructura IMRyD (introducción, métodos, resultados y discusión) se impuso en los artículos científicos desde mediados del siglo XX. Barbara Minto, de McKinsey, propuso en los años setenta el <b>principio de la pirámide</b>: comenzar por la conclusión y luego respaldarla, base del resumen ejecutivo moderno.</p>",
como:"<ul><li><b>Resumen ejecutivo:</b> problema, método, resultado principal con cifras y recomendación, en media página.</li><li><b>Objetivos:</b> uno general y 3 a 5 específicos, con verbos medibles.</li><li><b>Metodología:</b> qué se hizo, con qué datos y herramientas, para que otro pueda repetirlo.</li><li><b>Resultados:</b> hechos y cifras, con tablas y figuras numeradas.</li><li><b>Conclusiones:</b> responden a cada objetivo en el mismo orden.</li><li><b>Recomendaciones:</b> acciones con responsable, plazo y costo.</li></ul><p>Anexa solo la memoria de cálculo que respalda el informe: marca en el formulario las herramientas que correspondan al tema. Mezclar cálculos de otros temas confunde al lector.</p>",
pasos:"<ol><li>Escribe primero los resultados y las conclusiones; al final, el resumen.</li><li>Elige los cálculos que respaldan el informe (casillas «Anexar memoria de cálculo»).</li><li>Genera el documento y revisa la coherencia: las cifras del resumen deben coincidir con los resultados.</li><li>Descarga en Word para ajustar al formato de tu institución, o en PDF para enviar.</li><li>En Word, actualiza el índice con clic derecho → «Actualizar campos».</li></ol>",
caso:"<p>El ejemplo precargado es un informe de reducción del tiempo de cambio de formato con SMED en una inyectora. Todos sus números (78 a 31 minutos, 5 cambios por semana, horas liberadas, ahorro anual) salen de la herramienta SMED con sus datos de ejemplo, que se anexa como memoria de cálculo.</p>",
err:"<ul><li>Resumen que no incluye el resultado principal.</li><li>Conclusiones que introducen información nueva.</li><li>Tablas y figuras sin numerar ni comentar.</li><li>Anexar cálculos que no tienen relación con el tema del informe.</li></ul>",
src:["Minto, B. (2009). <i>The Pyramid Principle: Logic in Writing and Thinking</i> (3rd ed.). Pearson.", "American Psychological Association. (2020). <i>Publication Manual of the American Psychological Association</i> (7th ed.).", "Real Academia Española. (2010). <i>Ortografía de la lengua española</i>. Espasa."]
};
GUIDE["citas-apa"] = {
que:"<p>Las <b>normas APA</b> son un estilo de citación y presentación de trabajos académicos. Citar correctamente da crédito a los autores, permite verificar las fuentes y evita el plagio. La mayoría de las universidades chilenas exigen APA 7.ª edición en informes, tesis y memorias.</p>",
hist:"<p>La American Psychological Association publicó sus primeras pautas en 1929. La 7.ª edición del <i>Publication Manual</i> se publicó en octubre de 2019 y simplificó varias reglas: ya no se indica la ciudad de la editorial, «et al.» se usa desde la primera cita con tres o más autores y los DOI se escriben como URL.</p>",
como:"<ul><li><b>Cita parentética:</b> (Apellido, año). <b>Narrativa:</b> Apellido (año).</li><li>Dos autores: (Pérez y Soto, 2020). Tres o más: (Pérez et al., 2020).</li><li>Cita textual de menos de 40 palabras: entre comillas con número de página. Más de 40: bloque aparte con sangría.</li><li>Lista de referencias en orden alfabético, con sangría francesa y doble espacio.</li><li>Libro: Autor, A. A. (Año). <i>Título</i> (ed.). Editorial.</li><li>Artículo: Autor, A. A. (Año). Título. <i>Revista, volumen</i>(número), páginas. https://doi.org/…</li></ul>",
pasos:"<ol><li>Mientras investigas, guarda los datos completos de cada fuente.</li><li>Usa un gestor de referencias (Zotero o Mendeley son gratuitos) o esta herramienta.</li><li>Verifica que cada cita del texto esté en la lista y viceversa.</li></ol>",
caso:"<p>Para citar la norma de calidad: Organización Internacional de Normalización. (2015). <i>Sistemas de gestión de la calidad: requisitos</i> (ISO 9001:2015). ISO. En el texto: (Organización Internacional de Normalización [ISO], 2015) la primera vez y (ISO, 2015) después.</p>",
err:"<ul><li>Citar Wikipedia o sitios sin autor identificable como fuente principal.</li><li>Copiar texto sin comillas aunque se cite la fuente.</li><li>Referencias sin año o con formatos mezclados.</li></ul>",
src:["American Psychological Association. (2020). <i>Publication Manual of the American Psychological Association</i> (7th ed.).", "Sitio oficial de estilo APA: apastyle.apa.org."]
};
GUIDE["conversor"] = {
que:"<p>El conversor transforma valores entre unidades del Sistema Internacional (SI) y del sistema inglés. Las conversiones de unidades son una fuente frecuente de errores en ingeniería, sobre todo con catálogos de equipos importados (psi, HP, BTU, galones, pulgadas).</p>",
hist:"<p>El sistema métrico nació en Francia en 1795 y el Sistema Internacional de Unidades se adoptó en 1960 en la XI Conferencia General de Pesas y Medidas. En 2019 se redefinieron el kilogramo, el amperio, el kelvin y el mol a partir de constantes fundamentales. Un caso célebre de error de unidades fue la pérdida de la sonda Mars Climate Orbiter de la NASA en 1999: un equipo usó libras-fuerza por segundo y otro newtons por segundo.</p>",
como:"<p>Toda conversión se hace pasando por la unidad base: valor × factor de origen ÷ factor de destino. La temperatura es la excepción porque las escalas tienen distinto cero: °F = °C × 9/5 + 32 y K = °C + 273,15.</p>",
pasos:"<ol><li>Elige la magnitud.</li><li>Ingresa el valor y la unidad de origen.</li><li>Lee la equivalencia en todas las unidades.</li><li>En los informes, usa unidades SI y deja la unidad original entre paréntesis si viene de un catálogo.</li></ol>",
caso:"<p>Un compresor con presión de trabajo de 120 psi opera a unos 8,3 bar (827 kPa). Un motor de 50 HP equivale a unos 37,3 kW, dato necesario para calcular su consumo eléctrico y la huella de carbono.</p>",
err:"<ul><li>Confundir HP mecánico con CV (caballo de vapor métrico).</li><li>Confundir galón estadounidense e imperial.</li><li>Presión manométrica vs absoluta (diferencia de 1 atm).</li></ul>",
src:["Bureau International des Poids et Mesures. (2019). <i>The International System of Units (SI)</i> (9th ed.).", "NASA. (1999). Mars Climate Orbiter Mishap Investigation Board Phase I Report."]
};

function pgPractica(){

      ["Antes de la práctica", "<ul><li>Postula con 3 a 4 meses de anticipación (bolsas de la universidad, LinkedIn, ferias laborales).</li><li>Prepara un CV de una página y un párrafo que diga qué problema te gustaría resolver.</li><li>Pregunta en la entrevista qué proyecto tendrás y quién será tu supervisor.</li></ul>"],

function pgEstructura(){

    acc([
      ["Objetivos bien redactados", "<p>Verbo en infinitivo + qué + para qué o con qué alcance. Usa verbos medibles: <i>determinar, cuantificar, diseñar, evaluar, proponer, comparar, reducir</i>. Evita <i>conocer, entender, estudiar</i>.</p><p><b>Mal:</b> «Estudiar la bodega». <b>Bien:</b> «Diseñar un layout de bodega que reduzca en 20 % la distancia recorrida en el picking».</p>"],
      ["Tablas y figuras", "<ul><li>Numeradas y con título: «Tabla 3. Costos anuales por alternativa». En APA, el título va arriba tanto en tablas como en figuras.</li><li>Cita la fuente debajo («Fuente: elaboración propia con datos de la empresa»).</li><li>Toda tabla o figura se menciona y se comenta en el texto.</li><li>Unidades en el encabezado de la columna, no en cada celda.</li><li>Gráficos: barras para comparar categorías, líneas para tendencias, dispersión para relaciones. Evita tortas con más de 4 partes y gráficos 3D.</li></ul>"],
      ["Números y unidades (SI)", "<ul><li>En Chile: coma decimal y punto o espacio para miles (1.250,5).</li><li>Espacio entre número y unidad: 25 kg, 3,5 m, 12 %. Símbolos sin punto ni plural (kg, no Kg. ni kgs).</li><li>Moneda: $ 1.250.000 o MM$ 1,25; indica si incluye IVA y la fecha de los precios (UF del día).</li><li>Cifras significativas coherentes con la precisión del dato.</li></ul>"],
      ["Errores frecuentes", "<ul><li>Conclusiones que no responden a los objetivos.</li><li>Resultados sin análisis, o análisis sin datos.</li><li>Marco teórico copiado de libros que no se usa después.</li><li>Recomendaciones vagas («mejorar la comunicación»).</li><li>Texto en primera persona coloquial; usa impersonal («se midió», «se propone»).</li><li>Párrafos de una sola oración o de media página.</li></ul>"],
      ["Lista de verificación antes de entregar", "<ul><li>¿El resumen se entiende sin leer el resto?</li><li>¿Cada objetivo tiene su resultado y su conclusión?</li><li>¿Todas las tablas y figuras están numeradas, tituladas y citadas en el texto?</li><li>¿Las cifras del resumen coinciden con las del cuerpo?</li><li>¿Las referencias tienen formato APA y aparecen citadas?</li><li>¿Revisaste ortografía y formato uniforme (fuente, interlineado, márgenes)?</li></ul>"]

}

function pgQuiz(){
  const st = S.quiz || {}, done = Object.keys(st).length, ok = Object.values(st).filter(x => x === true).length;
  const ar = [...new Set(QZ.map(q => q[0]))];
  return pg("Aprender · Autoevaluación", "Quiz de ingeniería industrial", QZ.length + " preguntas de todas las áreas, con explicación. Tu avance se guarda en este navegador.",
    kpis([kpi("Respondidas", done + " de " + QZ.length), kpi("Correctas", ok, "", "ok"), kpi("Rendimiento", done ? pc(ok / done, 0) : "—", "", "hi")]) +
    '<div class="actions no-print" style="margin:0 0 14px;border:0;padding:0"><button class="btn ghost small" type="button" data-act="quizreset">Reiniciar quiz</button></div>' +
    ar.map(a => h3(a) + QZ.map((q, i) => [q, i]).filter(x => x[0][0] === a).map(([q, i]) => { const ans = st[i]; const sel = S.quizSel && S.quizSel[i];
      return '<div class="qz"><p>' + (i + 1) + ". " + q[1] + '</p><div class="qopts">' + q[2].map((o, j) => '<button type="button" class="qo' + (ans !== undefined ? (j === q[3] ? " ok" : j === sel ? " bad" : "") : "") + '" data-qz="' + i + '" data-op="' + j + '"' + (ans !== undefined ? " disabled" : "") + ">" + o + "</button>").join("") + "</div>" + (ans !== undefined ? '<p class="qexp">' + (ans ? "✓ Correcto. " : "✗ Incorrecto. ") + q[4] + "</p>" : "") + "</div>"; }).join("")).join(""));
}
