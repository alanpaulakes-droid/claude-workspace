<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Biblia del Ingeniero Industrial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: manual de ingeniería — menú lateral por áreas (carrera, cálculos, gestión, informes, aprender); cada herramienta = Datos → Calcular → Resultado con desarrollo numerado → Aprende más */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface2:#F5F7F9; --ink:#14202C; --muted:#56657A; --line:#D2DAE2;
  --blue:#1E4E78; --blue-soft:#E2EBF4; --copper:#B0522A; --copper-soft:#F7E8DF;
  --ok:#2A7848; --ok-soft:#E3F1E8; --warn:#93600A; --warn-soft:#F9EED7; --bad:#AE2A21; --bad-soft:#FAE4E2;
  --c3:#6A4C93; --c4:#2B8A8A;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"Source Sans 3","Segoe UI",Arial,sans-serif; --f-mono:"JetBrains Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F161D; --surface:#17212B; --surface2:#1D2935; --ink:#E6ECF2; --muted:#9AA9B8; --line:#2C3A48;
  --blue:#8DB8E0; --blue-soft:#1C3046; --copper:#E89366; --copper-soft:#3A2519;
  --ok:#6CC490; --ok-soft:#173326; --warn:#E5B357; --warn-soft:#382A11; --bad:#F08A80; --bad-soft:#3D1C1A;
  --c3:#B79CE0; --c4:#6FD0CF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161D; --surface:#17212B; --surface2:#1D2935; --ink:#E6ECF2; --muted:#9AA9B8; --line:#2C3A48;
  --blue:#8DB8E0; --blue-soft:#1C3046; --copper:#E89366; --copper-soft:#3A2519;
  --ok:#6CC490; --ok-soft:#173326; --warn:#E5B357; --warn-soft:#382A11; --bad:#F08A80; --bad-soft:#3D1C1A;
  --c3:#B79CE0; --c4:#6FD0CF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
.top-in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:14px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;cursor:pointer;background:none;border:0;color:var(--ink);padding:0;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand b{color:var(--copper)}
.brand::before{content:"";width:26px;height:26px;border-radius:6px;flex:none;background:linear-gradient(135deg,var(--blue) 0 50%,var(--copper) 50% 100%)}
.crumb{color:var(--muted);font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backb[hidden]{display:none}
.layout{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px;display:grid;grid-template-columns:262px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding-bottom:10px}
.side button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;background:none;color:var(--ink);font-family:var(--f-body);font-size:15px;padding:6px 10px;border-radius:6px;cursor:pointer}
.side button .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:18px}
.side button:hover{background:var(--surface)}
.side button[aria-current="true"]{background:var(--blue);color:var(--surface);font-weight:600}
.side button[aria-current="true"] .k{color:var(--surface)}
.side .done{margin-left:auto;font-size:12px;color:var(--ok)}
.side button[aria-current="true"] .done{color:var(--surface)}
.side details.sgp{margin:2px 0 6px}
.side details.sgp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;padding:10px 10px 6px;border-radius:8px;user-select:none}
.side details.sgp>summary::-webkit-details-marker{display:none}
.side details.sgp>summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .18s;margin-right:4px;opacity:.7}
.side details.sgp:not([open])>summary::after{transform:rotate(-45deg)}
.gsw{padding:0 0 8px}.gsw input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:500 14px var(--f-body);background:var(--surface);color:var(--ink)}
#gsres{display:flex;flex-direction:column}#gsres small{margin-left:auto}
main{min-width:0}
h1{font-family:var(--f-display);font-size:30px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0 0 8px}
.eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--copper);letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px}
.lead{color:var(--muted);max-width:72ch;margin:0 0 20px;font-size:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
.card.form{border-top:3px solid var(--blue)}
.card.result{border-top:3px solid var(--copper)}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sechead h2{margin:0}
.sechead .tag{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:3px 9px;border-radius:5px;background:var(--blue-soft);color:var(--blue)}
.card.result .sechead .tag{background:var(--copper-soft);color:var(--copper)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:14.5px;font-weight:700}
.field .unit{font-weight:400;color:var(--muted)}
.field small{color:var(--muted);font-size:13px;line-height:1.4}
input,select,textarea{font-family:var(--f-body);font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--ink);width:100%;min-width:0}
textarea{font-family:var(--f-mono);font-size:14px;line-height:1.5;resize:vertical}
textarea.prose{font-family:var(--f-body);font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
input[type=checkbox]{width:18px;height:18px;margin-top:3px;flex:0 0 auto}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:14.5px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.btn{font-family:var(--f-body);font-weight:700;font-size:15px;padding:10px 18px;border-radius:7px;border:1px solid var(--blue);background:var(--blue);color:var(--surface);cursor:pointer}
.btn.calc{background:var(--copper);border-color:var(--copper);font-size:16px;padding:11px 24px}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.hint{font-size:13.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin:6px 0 12px}
.tbl-wrap.tall{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.tbl-wrap.tall th{position:sticky;top:0;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{font-weight:700;text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:13.5px;white-space:nowrap}
th.num{font-family:var(--f-body);font-size:12px}
tr.sel td{background:var(--ok-soft)}
tr.badr td{background:var(--bad-soft)}
tr.tot td{border-top:2px solid var(--ink);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;font-family:var(--f-body)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--blue-soft);color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
.kpi.ok{border-color:var(--ok)} .kpi.bad{border-color:var(--bad)} .kpi.hi{border-color:var(--copper);background:var(--copper-soft)}
.steps{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px}
.step .sn{width:34px;height:34px;border-radius:50%;background:var(--blue);color:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px}
.step.ok .sn{background:var(--ok)} .step.bad .sn{background:var(--bad)} .step.warn .sn{background:var(--warn)}
.step .sb{min-width:0;border-bottom:1px solid var(--line);padding-bottom:14px}
.step:last-child .sb{border-bottom:0;padding-bottom:0}
.step h4{font-family:var(--f-display);font-size:16.5px;margin:4px 0 4px}
.step .q{margin:0 0 6px}
.f{font-family:var(--f-mono);font-size:14px;background:var(--blue-soft);color:var(--blue);padding:8px 11px;border-radius:7px;overflow-x:auto;white-space:pre;margin:4px 0}
.f.s{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.r{margin:8px 0 0;font-weight:700;font-size:16px}
.r span{font-family:var(--f-mono);color:var(--copper)}
.why{margin:8px 0 0;font-size:15px;color:var(--muted)}
.why b{color:var(--ink)}
.note{font-size:14.5px;padding:11px 13px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin:12px 0}
.note.info{background:var(--blue-soft);color:var(--blue)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.stale{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
details.learn,details.item{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:12px}
details.learn>summary,details.item>summary{cursor:pointer;padding:14px 16px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
details>summary::-webkit-details-marker{display:none}
details.learn>summary::before,details.item>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details.learn .body,details.item .body{padding:0 16px 16px;min-width:0}
details.learn{background:var(--surface2)}
details.learn>summary{font-family:var(--f-display)}
.learn p,.prose p,.prose li{max-width:76ch}
.prose h3{margin-top:18px}
.prose ul,.prose ol{padding-left:22px}
.prose li{margin-bottom:4px}
.gl{display:grid;grid-template-columns:minmax(90px,180px) minmax(0,1fr);gap:8px 16px;margin:0}
.gl dt{font-weight:700;color:var(--copper)}
.gl dd{margin:0}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:8px 0 22px}
.mod{display:grid;grid-template-columns:52px minmax(0,1fr);grid-template-rows:auto auto;gap:2px 12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;font:inherit;color:inherit;transition:transform .12s,border-color .12s,box-shadow .12s}
.mod:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.mod .mi{grid-row:1/3;width:52px;height:52px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:22px;font-weight:700;font-family:var(--f-mono)}
.mod .mt{font-family:var(--f-display);font-weight:800;font-size:17px}.mod .md{font-size:13px;color:var(--muted)}
.sh{font-size:18px;margin:22px 0 10px}
.resume{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--copper);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px var(--f-body);cursor:pointer;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:18px}
.tile{display:grid;grid-template-columns:44px minmax(0,1fr);gap:2px 12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit;min-height:72px}
.tile:hover{border-color:var(--blue)}
.tile .ti{grid-row:1/3;width:44px;height:44px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:15px}
.tile .tt{font-family:var(--f-display);font-weight:700;font-size:15.5px;line-height:1.25}
.tile .td{font-size:13px;color:var(--muted);line-height:1.35}
.tile.done .ti{background:var(--ok-soft);color:var(--ok)}
.flow{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow li{display:flex;align-items:center}.flow li+li::before{content:"→";color:var(--muted);margin:0 4px}
.flow button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px 6px 6px;font:600 13.5px var(--f-body);cursor:pointer}
.flow button span{width:22px;height:22px;border-radius:50%;background:var(--copper);color:#fff;display:grid;place-items:center;font-size:12px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;padding:7px 12px;font-family:var(--f-body);font-size:14px;font-weight:600;cursor:pointer}
.chip span{color:var(--muted);font-weight:400}
.chip[aria-pressed="true"]{background:var(--copper);border-color:var(--copper);color:#fff}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.tabbar{display:none}
figure.ch{margin:10px 0 16px;padding:12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px}
figure.ch .sv{overflow-x:auto}
figure.ch svg{display:block;width:100%;height:auto;min-width:520px}
figure.ch figcaption{font-size:13.5px;color:var(--muted);margin-top:6px}
svg .ax{stroke:var(--muted);stroke-width:1}
svg .gr{stroke:var(--line);stroke-width:1}
svg text{fill:var(--ink);font-family:var(--f-body);font-size:12px}
svg text.mu{fill:var(--muted);font-size:11px}
svg .s1{stroke:var(--blue);fill:none;stroke-width:2.2}
svg .s2{stroke:var(--copper);fill:none;stroke-width:2.2}
svg .s3{stroke:var(--ok);fill:none;stroke-width:2.2}
svg .s4{stroke:var(--c3);fill:none;stroke-width:2.2}
svg .s5{stroke:var(--c4);fill:none;stroke-width:2.2}
svg .sb{stroke:var(--bad);fill:none;stroke-width:1.6;stroke-dasharray:6 4}
svg .sm{stroke:var(--muted);fill:none;stroke-width:1.4;stroke-dasharray:4 4}
svg .d1{fill:var(--blue)} svg .d2{fill:var(--copper)} svg .d3{fill:var(--ok)} svg .d4{fill:var(--c3)} svg .d5{fill:var(--c4)} svg .db{fill:var(--bad)}
svg .bar1{fill:var(--blue)} svg .bar2{fill:var(--copper)} svg .bar3{fill:var(--ok)} svg .barm{fill:var(--line)}
svg .reg{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.5}
svg .box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
svg .boxc{fill:var(--copper-soft);stroke:var(--copper);stroke-width:1.5}
svg .lg{fill:var(--muted);font-size:11.5px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px}
.doc{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:28px 32px;max-width:860px}
.doc h1{font-size:26px}.doc h2{font-size:18px;border-bottom:2px solid var(--line);padding-bottom:4px;margin-top:22px}
.doc .meta{color:var(--muted);font-size:14px;margin-bottom:12px}
.doc p,.doc li{max-width:80ch}
pre.tpl{font-family:var(--f-mono);font-size:13px;line-height:1.5;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 10px;max-height:420px;overflow:auto}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.foda{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foda>div{border-radius:10px;padding:12px 14px;border:1px solid var(--line);min-width:0}
.foda h3{font-size:15px;margin-bottom:6px}.foda ul{margin:0;padding-left:18px;font-size:14.5px}
.foda .q1{background:var(--ok-soft)}.foda .q2{background:var(--blue-soft)}.foda .q3{background:var(--warn-soft)}.foda .q4{background:var(--bad-soft)}
.canvas9{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:auto auto auto;gap:6px;min-width:700px}
.canvas9>div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface2);font-size:13.5px;min-width:0}
.canvas9 h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--copper)}
.canvas9 ul{margin:0;padding-left:16px}
.chain{display:flex;flex-direction:column;gap:6px}
.chain div{border-left:4px solid var(--blue);background:var(--surface2);padding:8px 12px;border-radius:0 8px 8px 0}
.chain div.root{border-color:var(--copper);background:var(--copper-soft);font-weight:700}
.qz{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--surface)}
.qz p{margin:0 0 8px;font-weight:600}
.qopts{display:flex;flex-direction:column;gap:6px}
.qo{text-align:left;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:9px;padding:9px 12px;font:15px var(--f-body);cursor:pointer}
.qo:hover:not(:disabled){border-color:var(--blue)}
.qo.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.qo.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qo:disabled{cursor:default}
.qexp{margin-top:8px;font-size:14px;color:var(--muted)}
.linkb{border:0;background:none;color:var(--blue);font:inherit;text-decoration:underline;cursor:pointer;padding:0;text-align:left}
.rep-s{margin-top:18px;padding-top:12px;border-top:2px solid var(--line)}
.ftab td:first-child{font-weight:700;white-space:normal;min-width:38%}

<script>
(function(){

/* ============ ESTADÍSTICA ============ */
function erf(x){ const t = 1 / (1 + 0.3275911 * Math.abs(x)); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return x >= 0 ? y : -y; }

function gammaln(x){ const g = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5]; let y = x, t = x + 5.5; t -= (x + 0.5) * Math.log(t); let s = 1.000000000190015; for (let j = 0; j < 6; j++) s += g[j] / ++y; return -t + Math.log(2.5066282746310005 * s / x); }
function betacf(a, b, x){ let qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap; if (Math.abs(d) < 1e-30) d = 1e-30; d = 1 / d; let h = d;
  for (let m = 1; m <= 200; m++) { const m2 = 2 * m; let aa = m * (b - m) * x / ((qam + m2) * (a + m2)); d = 1 + aa * d; if (Math.abs(d) < 1e-30) d = 1e-30; c = 1 + aa / c; if (Math.abs(c) < 1e-30) c = 1e-30; d = 1 / d; h *= d * c;

/* ============ FINANZAS ============ */

/* ============ PROGRAMACIÓN LINEAL (simplex de dos fases) ============ */
function lpSolve(c, A, ops, b, maxim){

    else { row[ai] = 1; isArt[ai] = true; basis[i] = ai; dcol[i] = ai; ai++; }

    while (it++ < 5000) { let k = -1; for (let j = 0; j < N; j++) if (allow(j) && z[j] < -EPS) { k = j; break; }

    const st = run(z, () => true); if (st === "it") return { status:"it" };

def("johnson", "ops", {
  t:"Regla de Johnson (2 máquinas)", ico:"Jn", d:"Secuencia óptima que minimiza el makespan en flujo de dos etapas",
  ey:"Programación de operaciones · Flow shop",
  lead:"Encuentra el orden que termina antes todos los trabajos cuando cada uno pasa primero por la máquina 1 y luego por la 2.",
  f:[MAT("jobs", "Trabajos: id ; tiempo M1 ; tiempo M2", "A;5;2\nB;1;6\nC;9;7\nD;3;8\nE;10;4")],
  c(v){
    const J = rows(v.jobs).map(r => { const a = num(r[1]), b = num(r[2]); if (!fin(a) || !fin(b)) fail("Revisa la fila «" + r[0] + "»."); return { id:r[0], a, b }; });
    if (J.length < 2) fail("Ingresa al menos 2 trabajos.");
    const pool = J.slice(), front = [], back = [], log = [];
    while (pool.length) { let m = Infinity, x = null, where = ""; pool.forEach(j => { if (j.a < m) { m = j.a; x = j; where = "M1"; } if (j.b < m) { m = j.b; x = j; where = "M2"; } });
      if (where === "M1") front.push(x); else back.unshift(x); log.push(x.id + " (mín. " + nf(m, 1) + " en " + where + " → " + (where === "M1" ? "al inicio" : "al final") + ")"); pool.splice(pool.indexOf(x), 1); }
    const seq = front.concat(back); let t1 = 0, t2 = 0, idle = 0; const G = [];
    seq.forEach(j => { const s1 = t1; t1 += j.a; const s2 = Math.max(t1, t2); idle += s2 - t2; t2 = s2 + j.b; G.push({ j, s1, e1:t1, s2, e2:t2 }); });
    let h = kpis([kpi("Secuencia óptima", seq.map(j => j.id).join(" → "), "", "hi"), kpi("Makespan", nf(t2, 1), "u. de tiempo"), kpi("Ocio de M2", nf(idle, 1))]);
    h += steps([{ t:"Regla de Johnson", q:"Repite: busca el menor tiempo entre todos los trabajos pendientes. Si está en M1, el trabajo va lo más adelante posible; si está en M2, lo más atrás posible.", s:log.join("\n"), r:seq.map(j => j.id).join(" → "), c:"ok", why:"así M2 empieza a trabajar lo antes posible y termina con los trabajos que menos la retrasan." }]);
    h += table(["Trabajo", "Inicio M1", "Fin M1", "Inicio M2", "Fin M2"], G.map(g => [g.j.id, nf(g.s1, 1), nf(g.e1, 1), nf(g.s2, 1), nf(g.e2, 1)]), { num:[1, 2, 3, 4] });
    h += gantt(G.map(g => ({ id:g.j.id + " · M1", s:g.s1, d:g.j.a })).concat(G.map(g => ({ id:g.j.id + " · M2", s:g.s2, d:g.j.b, crit:true }))), { leg:'<span><i style="background:var(--blue)"></i>Máquina 1</span><span><i style="background:var(--copper)"></i>Máquina 2</span>' });
    return h;
  },
  rel:["secuenciacion"]
});

def("mrp", "ops", {
  t:"MRP: registro de un ítem", ico:"MRP", d:"Necesidades netas, recepciones y lanzamientos de órdenes planeadas",
  ey:"Planificación de requerimientos de materiales",

      if (nn > 0) { if (v.lote === "L4L") q = nn; else if (v.lote === "FQ") { if (!(Q > 0)) fail("Ingresa la cantidad fija."); q = Math.ceil(nn / Q) * Q; } else { q = nn + sum(RB.slice(t + 1, t + P)); } }

    h += steps([

      { t:"Tamaño de lote", f:v.lote === "L4L" ? "Recepción = NN (lote a lote)" : v.lote === "FQ" ? "Recepción = múltiplo de Q = " + n0(Q) : "Recepción = NN_t + RB de los " + (P - 1) + " períodos siguientes", why:"lote a lote minimiza inventario; lotes mayores reducen el número de pedidos y setups." },

    ]);
    return h;
  },
  learn:"<p>En un MRP completo, los <b>lanzamientos</b> del producto padre se multiplican por la cantidad indicada en la lista de materiales (BOM) y pasan a ser los <b>requerimientos brutos</b> de cada componente del nivel siguiente. Se procesa nivel por nivel (codificación de nivel más bajo).</p>",

def("colas", "ops", {

    const mm = k => { const r = lam / mu, rho = r / k; if (rho >= 1) return null; let s0 = 0, f = 1; for (let n = 0; n < k; n++) { if (n > 0) f *= n; s0 += Math.pow(r, n) / f; } const fk = f * (k > 0 ? k : 1); const tail = Math.pow(r, k) / (fk * (1 - rho)); const P0 = 1 / (s0 + tail); const Lq = P0 * Math.pow(r, k) * rho / (fk * Math.pow(1 - rho, 2)); const Wq = Lq / lam, W = Wq + 1 / mu, L = lam * W, Pw = tail * P0; return { k, rho, P0, Lq, Wq, W, L, Pw, CT:k * cs + L * cw }; };

  learn:"<p>Notación de Kendall A/B/s: llegadas Poisson (M), servicio exponencial (M) y s servidores en paralelo con una sola fila. Una fila única que alimenta a varios servidores siempre es mejor que filas separadas por servidor. La <b>ley de Little</b> (L = λW) vale para cualquier sistema estable, también en inventarios y procesos.</p>",

/* ---------------- INVESTIGACIÓN DE OPERACIONES ---------------- */
function parseLP(v){
  const c = list(v.obj, "la función objetivo"), n = c.length; if (!n) fail("Ingresa los coeficientes de la función objetivo.");
  const A = [], ops = [], b = [], txt = [];
  rows(v.res).forEach(r0 => { const r = r0.join(" ").replace(/≤/g, "<=").replace(/≥/g, ">=").replace(/([<>]=?|=)/g, " $1 ").trim().split(/\s+/); const k = r.findIndex(t => /^(<=|>=|=|<|>)$/.test(t)); if (k < 0) fail("Falta el operador (<=, >= o =) en: «" + r0.join(" ") + "»."); const co = r.slice(0, k).map(num), rhs = num(r[k + 1]);
    if (co.length !== n || co.some(x => !fin(x)) || !fin(rhs)) fail("La restricción «" + r0.join(" ") + "» debe tener " + n + " coeficientes y un lado derecho numérico.");
    A.push(co); ops.push(r[k].replace(/^<$/, "<=").replace(/^>$/, ">=")); b.push(rhs); txt.push(r0.join(" ")); });
  if (!A.length) fail("Ingresa al menos una restricción.");
  const nm = (v.vars || "").split(/[\s;,]+/).filter(Boolean); while (nm.length < n) nm.push("x" + (nm.length + 1));
  return { c, A, ops, b, n, nm:nm.slice(0, n), txt };
}
def("programacion-lineal", "io", {

  f:[SEL("tipo", "Objetivo", "max", [["max", "Maximizar"], ["min", "Minimizar"]]), LST("obj", "Coeficientes de la función objetivo", "3000 5000", { h:"Ej.: utilidad por unidad de cada producto." }), TXT("vars", "Nombres de las variables (opcional)", "Puertas Ventanas"),
     MAT("res", "Restricciones: coeficientes  operador  lado derecho", "1 0 <= 4\n0 2 <= 12\n3 2 <= 18", { h:"Una por línea, ej.: 3 2 <= 18. Se asume que todas las variables son ≥ 0." })],

function lpGraph(P, R){
  const pts = [], cand = [];

  cand.filter(feas).forEach(p => { if (!pts.some(q => Math.abs(q[0] - p[0]) < 1e-7 && Math.abs(q[1] - p[1]) < 1e-7)) pts.push(p); });

  const xm = Math.max(1, ...pts.map(p => p[0])) * 1.3, ym = Math.max(1, ...pts.map(p => p[1])) * 1.3;
  const ser = P.A.map((a, i) => { const s = []; if (Math.abs(a[1]) > 1e-12) { s.push([0, P.b[i] / a[1]]); s.push([xm, (P.b[i] - a[0] * xm) / a[1]]); } else { s.push([P.b[i] / a[0], 0]); s.push([P.b[i] / a[0], ym]); } return { pts:s, cls:"sm" }; });
  const z = R.z, iso = Math.abs(P.c[1]) > 1e-12 ? [[0, z / P.c[1]], [xm, (z - P.c[0] * xm) / P.c[1]]] : [[z / P.c[0], 0], [z / P.c[0], ym]];
  return chart({ title:"Método gráfico", poly:[{ pts, cls:"reg" }], series:ser.concat([{ pts:iso, cls:"s2", dash:true }, { pts:pts, cls:"s1", dot:"d1", only:true, tags:pts.map(p => "(" + nf(p[0], 1) + "; " + nf(p[1], 1) + ")") }, { pts:[[R.x[0], R.x[1]]], cls:"s2", dot:"d2", only:true, r:7 }]), xmin:0, ymin:0, xmax:xm, ymax:ym, xlab:esc(P.nm[0]), ylab:esc(P.nm[1]), h0:360, legend:[["--ok", "Región factible"], ["--muted", "Restricciones"], ["--copper", "Recta de Z óptimo"]], cap:"El óptimo de un problema lineal siempre está en un vértice de la región factible." });
}

  f:[MAT("m", "Tarea o peligro ; probabilidad (1, 2 o 4) ; consecuencia (1, 2 o 4) ; medida de control propuesta", "Trabajo en altura sin línea de vida;4;4;Instalar línea de vida y permiso de trabajo\nManejo manual de sacos de 25 kg;4;2;Ayuda mecánica y capacitación MMC\nRuido en sala de compresores;2;2;Encierro acústico y protectores auditivos\nCorte con esmeril angular;2;4;Guarda, careta facial y bloqueo LOTO\nTropiezo con cables en oficina;2;1;Canalizar cables\nContacto con químicos de limpieza;1;2;Hojas de seguridad (HDS) y guantes de nitrilo")],
  c(v){
    const lvl = x => x >= 16 ? ["bad", "Intolerable", "Detener la actividad hasta controlar el riesgo"] : x >= 8 ? ["bad", "Importante", "Controlar antes de continuar; asignar recursos urgentes"] : x >= 4 ? ["warn", "Moderado", "Reducir el riesgo en un plazo definido"] : ["ok", "Tolerable", "Mantener controles y monitorear"];
    const R = rows(v.m).map(r => { const P = num(r[1]), C0 = num(r[2]); if (![1, 2, 4].includes(P) || ![1, 2, 4].includes(C0)) fail("En «" + r[0] + "» la probabilidad y la consecuencia deben ser 1, 2 o 4."); return { nm:r[0], P, C:C0, V:P * C0, med:r[3] || "" }; });
    if (!R.length) fail("Ingresa al menos un peligro.");

    h += table(["Peligro / tarea", "P", "C", "VEP", "Nivel", "Acción", "Medida de control"], R.map(r => { const l = lvl(r.V); return [esc(r.nm), r.P, r.C, "<b>" + r.V + "</b>", pill(l[0], l[1]), '<span class="hint">' + l[2] + "</span>", esc(r.med)]; }), { num:[1, 2, 3] });

    h += steps([{ t:"Jerarquía de controles", q:"Aplica las medidas en este orden de eficacia: <b>1) eliminación, 2) sustitución, 3) controles de ingeniería, 4) controles administrativos</b> (procedimientos, señalización, capacitación) y <b>5) elementos de protección personal</b>.", why:"el EPP es la última barrera: protege solo a quien lo usa bien y no reduce el peligro." }]);
    return h;

def("niosh", "seg", {

  c(v){

    const HM = H <= 25 ? 1 : H > 63 ? 0 : 25 / H, VM = V > 175 ? 0 : 1 - 0.003 * Math.abs(V - 75), DM = D < 25 ? 1 : D > 175 ? 0 : 0.82 + 4.5 / D, AM = A > 135 ? 0 : 1 - 0.0032 * A;

      { t:"Índice de levantamiento", f:"IL = Peso ÷ LPR", s:nf(w, 1) + " ÷ " + nf(LPR, 2) + " = " + (fin(LI) ? nf(LI, 2) : "∞"), r:fin(LI) ? nf(LI, 2) : "∞", c:cls[0] === "ok" ? "ok" : "bad", why:"IL ≤ 1 la mayoría de los trabajadores lo tolera; > 3 la mayoría tiene alto riesgo de lesión lumbar." }

    const worst = [["HM", HM, "acerca la carga al cuerpo (reduce H)"], ["VM", VM, "levanta desde altura de nudillos (~75 cm)"], ["DM", DM, "reduce el recorrido vertical"], ["AM", AM, "evita girar el tronco"], ["FM", FM, "reduce la frecuencia o rota tareas"], ["CM", CM, "usa cajas con asas"]].sort((a, b) => a[1] - b[1]);

      let node = o; if (b.lvl === 1) { delete o.headlineLevel; node = { stack:[o, { canvas:[{ type:"line", x1:0, y1:0, x2:451, y2:0, lineWidth:0.7, lineColor:BLUE }], margin:[0, -3, 0, 6] }], headlineLevel:1 }; }
      if (first) { node.pageBreak = "before"; first = false; } C.push(node); }
    else if (b.t === "p") { const st = { small:{ fontSize:9, color:MU }, why:{ margin:[14, 0, 0, 6], color:"#3C4A5A" }, res:{ margin:[14, 0, 0, 6] }, note:{ fillColor:"#F7EFE3", margin:[0, 4, 0, 8] }, formula:{ fontSize:9, margin:[14, 2, 0, 6], background:"#EEF3F8" }, stepT:{ bold:true, color:BLUE, margin:[0, 8, 0, 3] }, code:{ fontSize:8.5, margin:[0, 0, 0, 0] } }[b.style] || {};
      if (b.style === "note") C.push({ table:{ widths:["*"], body:[[{ text:R(b.runs), margin:[6, 4, 6, 4] }]] }, layout:{ hLineWidth:() => 0, vLineWidth:i => i === 0 ? 3 : 0, vLineColor:() => CU, fillColor:() => "#F7EFE3" }, margin:[0, 4, 0, 10] });
      else C.push(Object.assign({ text:R(b.runs), margin:[0, 0, 0, 6], alignment:b.style ? "left" : "justify" }, st)); }
    else if (b.t === "li") C.push({ columns:[{ width:14 + b.lvl * 12, text:b.ord ? b.n + "." : "•", alignment:"right" }, { width:"*", text:R(b.runs) }], columnGap:6, margin:[b.lvl * 6, 0, 0, 3] });
    else if (b.t === "table") { tab++; const nc = Math.max.apply(null, b.rows.map(r => r.cells.length));
      C.push({ text:[{ text:"Tabla " + tab + ". ", bold:true }, pdfTxt(b.cap || "Resultados")], italics:true, color:BLUE, fontSize:9, margin:[0, 8, 0, 3] });
      C.push({ table:{ headerRows:b.rows[0].head ? 1 : 0, widths:Array(nc).fill("*"), body:b.rows.map(r => { const cs = r.cells.map(c => ({ text:pdfTxt(c.text || ""), bold:!!(c.b || r.head), color:r.head ? "#FFFFFF" : "#14202C", fillColor:r.head ? BLUE : null, alignment:c.num && !r.head ? "right" : "left", fontSize:8.5 })); while (cs.length < nc) cs.push({ text:"" }); return cs; }) },
        layout:{ hLineWidth:(i, n) => i === 0 || i === n.table.body.length ? 1 : 0.4, vLineWidth:() => 0, hLineColor:i => i === 0 ? BLUE : "#C8D2DC", paddingTop:() => 3, paddingBottom:() => 3 }, margin:[0, 0, 0, 2] });
      C.push({ text:"Fuente: elaboración propia.", italics:true, fontSize:8, color:MU, margin:[0, 2, 0, 10] }); }
    else if (b.t === "img") { fig++; C.push({ image:b.url, width:450, alignment:"center", margin:[0, 6, 0, 3] }, { text:[{ text:"Figura " + fig + ". ", bold:true }, pdfTxt(b.cap + (b.note ? ". " + b.note : ""))], italics:true, fontSize:9, color:BLUE, margin:[0, 0, 0, 10] }); }
  });
  const dd = { pageSize:"LETTER", pageMargins:[72, 64, 64, 64], info:{ title:meta.title, author:meta.author || "" }, content:C, defaultStyle:{ fontSize:10.5, lineHeight:1.25, color:"#14202C" },
    footer:(p, n) => p === 1 ? null : { columns:[{ text:pdfTxt(meta.title).slice(0, 80), color:MU, fontSize:8 }, { text:"Página " + p + " de " + n, alignment:"right", color:MU, fontSize:8 }], margin:[72, 20, 64, 0] },
    pageBreakBefore:(cur, after) => cur.headlineLevel === 1 && after.length === 0 };
  return await new Promise(ok => window.pdfMake.createPdf(dd).getBlob(ok));

async function saveFile(name, blob){
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) {}
  if (dl) { try { await dl.save({ filename:name, data:blob }); toast("Archivo listo: " + name); } catch (e) { if (e && e.code !== "declined") toast("No se pudo guardar el archivo (" + (e.code || "error") + ")"); } return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); toast("Descargando " + name);
}
const fileBase = s => String(s || "documento").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "_").slice(0, 60) || "documento";
async function exportDoc(fmt, meta, el){

  catch (e) { toast(e.message || "No se pudo generar el archivo"); }
}
