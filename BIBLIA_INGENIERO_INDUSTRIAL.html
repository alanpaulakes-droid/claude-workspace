como:"<ul><li><b>FCFS:</b> primero en llegar, primero en ser atendido. Justo, pero no eficiente.</li><li><b>SPT:</b> menor tiempo de proceso primero. Minimiza el flujo promedio y el inventario en proceso; puede dejar esperando mucho a los trabajos largos.</li><li><b>LPT:</b> mayor tiempo primero. Útil para balancear máquinas en paralelo.</li><li><b>EDD:</b> fecha de entrega más temprana primero. Minimiza la tardanza máxima.</li><li><b>Razón crítica (CR):</b> tiempo hasta la entrega ÷ tiempo de proceso; menor CR primero. Se recalcula a medida que pasa el tiempo.</li></ul><p><b>Métricas:</b> tiempo de flujo promedio, tardanza promedio y máxima, número de atrasados, utilización y número promedio de trabajos en el sistema.</p>",
pasos:"<ol><li>Lista los trabajos con tiempo de proceso y fecha comprometida.</li><li>Define el objetivo principal: cumplir fechas o reducir el inventario en proceso.</li><li>Compara reglas con la herramienta.</li><li>Publica la secuencia en un tablero visual.</li></ol>",
caso:"<p><b>Caso tipo: taller de mantención de componentes.</b> El taller atendía por orden de llegada y casi la mitad de los componentes se entregaba atrasada a la faena. Al ordenar por fecha de entrega (EDD) para los componentes críticos y por SPT para el resto, se redujeron los atrasos y bajó el número de componentes esperando en el taller.</p>",
err:"<ul><li>Cambiar la secuencia todo el tiempo por urgencias (el «trabajo urgente» permanente destruye la productividad).</li><li>Ignorar tiempos de preparación que dependen del orden (en ese caso conviene agrupar trabajos similares).</li></ul>",
src:["Smith, W. E. (1956). Various optimizers for single-stage production. <i>Naval Research Logistics Quarterly, 3</i>, 59–66.", "Pinedo, M. L. (2016). <i>Scheduling: Theory, Algorithms, and Systems</i> (5th ed.). Springer.", "Heizer, J., y Render, B. (2014). <i>Principios de administración de operaciones</i>, cap. 15. Pearson."]
};
GUIDE["johnson"] = {
que:"<p>La <b>regla de Johnson</b> encuentra el orden óptimo para procesar trabajos que pasan todos por dos máquinas en el mismo orden (primero la máquina 1, luego la 2), minimizando el tiempo total hasta terminar el último trabajo (makespan). Es uno de los pocos problemas de programación con solución exacta y sencilla.</p>",
hist:"<p>Fue publicada por <b>Selmer M. Johnson</b>, matemático de la RAND Corporation, en 1954 en el primer número de <i>Naval Research Logistics Quarterly</i>. Es considerado uno de los artículos fundacionales de la teoría de scheduling.</p>",
como:"<ol><li>Busca el menor tiempo entre todos los trabajos pendientes, en ambas máquinas.</li><li>Si está en la máquina 1, el trabajo se ubica lo más al inicio posible; si está en la máquina 2, lo más al final posible.</li><li>Retira el trabajo y repite hasta asignar todos.</li></ol><p>La lógica: conviene empezar con trabajos rápidos en la máquina 1 para que la máquina 2 empiece pronto, y terminar con trabajos rápidos en la máquina 2 para que no quede trabajo pendiente al final.</p>",
pasos:"<ol><li>Verifica que todos los trabajos sigan la misma ruta de dos etapas.</li><li>Aplica la regla con la herramienta.</li><li>Revisa la carta Gantt y el ocio de la máquina 2.</li></ol>",
caso:"<p><b>Caso tipo: imprenta con impresión y terminación (corte y doblado).</b> Cinco pedidos pasan por la impresora y luego por la guillotina. Ordenándolos con Johnson, todos se terminan antes que en el orden de llegada, y la guillotina espera menos. También se aplica en procesos de lavado y secado, mecanizado y tratamiento térmico, o revisión y firma de documentos.</p>",
err:"<ul><li>Aplicarla a más de dos máquinas sin adaptar (para tres máquinas hay una extensión válida solo bajo ciertas condiciones; en general se usan heurísticas como NEH).</li><li>Ignorar fechas de entrega: Johnson minimiza el makespan, no los atrasos.</li></ul>",
src:["Johnson, S. M. (1954). Optimal two- and three-stage production schedules with setup times included. <i>Naval Research Logistics Quarterly, 1</i>(1), 61–68.", "Pinedo, M. L. (2016). <i>Scheduling: Theory, Algorithms, and Systems</i>. Springer."]
};
GUIDE["colas"] = {
que:"<p>La <b>teoría de colas</b> estudia las líneas de espera: clientes en un banco, camiones en una romana, llamadas en un call center, pacientes en urgencias, órdenes en un servidor. Permite calcular cuánto esperan los clientes, cuántos hay en fila y cuántos servidores conviene tener, equilibrando el costo de dar servicio con el costo de hacer esperar.</p>",
hist:"<p>Nació con <b>Agner Krarup Erlang</b>, ingeniero de la Compañía Telefónica de Copenhague, que en 1909 publicó su primer trabajo sobre llamadas telefónicas y en 1917 las fórmulas que llevan su nombre (Erlang B y Erlang C), aún usadas para dimensionar call centers. David Kendall propuso en 1953 la notación A/B/s. <b>John Little</b> demostró en 1961 la ley L = λW, válida para cualquier sistema estable.</p>",
como:"<ul><li><b>λ</b>: tasa de llegada (clientes por hora). <b>μ</b>: tasa de servicio de un servidor. <b>s</b>: número de servidores.</li><li><b>ρ</b> = λ ÷ (sμ): utilización; debe ser menor que 1 o la fila crece sin límite.</li><li><b>M/M/1:</b> Lq = λ² ÷ [μ(μ − λ)], Wq = Lq ÷ λ.</li><li><b>M/M/s:</b> requiere P₀ y la fórmula de Erlang C (la herramienta la calcula).</li><li><b>Ley de Little:</b> L = λW, Lq = λWq.</li></ul><p><b>Lección clave:</b> el tiempo de espera crece en forma explosiva cuando la utilización se acerca a 100 %. Pasar de 80 % a 95 % de utilización puede multiplicar varias veces la espera. Por eso un sistema «sin holgura» siempre tiene filas.</p>",
pasos:"<ol><li>Mide llegadas por intervalo (cada 15 minutos) y tiempos de atención.</li><li>Verifica que las llegadas se parezcan a Poisson (varianza parecida a la media) y los tiempos a exponencial; si no, usa simulación.</li><li>Calcula indicadores para distintos números de servidores.</li><li>Elige el número que minimiza el costo total o cumple la meta de servicio (por ejemplo, 80 % atendidos en menos de 20 segundos).</li></ol>",
caso:"<p><b>Caso tipo: romana de camiones en un puerto.</b> Llegan en promedio 22 camiones por hora en la punta y cada puesto de control atiende 8 por hora. Con 3 puestos la utilización es cercana a 92 % y la espera es larga; con 4 puestos baja notoriamente. Considerando el costo por hora de un camión detenido frente al costo de habilitar un puesto, el costo total mínimo indica cuántos puestos abrir en la punta. Los terminales portuarios usan este tipo de análisis, junto con simulación, para dimensionar accesos.</p>",
err:"<ul><li>Dimensionar con el promedio del día y no con la hora punta.</li><li>Olvidar que si ρ ≥ 1 el sistema es inestable.</li><li>Usar fórmulas exponenciales cuando la atención es muy regular (en ese caso la espera real es menor).</li></ul>",
src:["Erlang, A. K. (1917). Solution of some problems in the theory of probabilities of significance in automatic telephone exchanges. <i>Elektroteknikeren, 13</i>.", "Little, J. D. C. (1961). A proof for the queuing formula L = λW. <i>Operations Research, 9</i>(3), 383–387.", "Hillier, F. S., y Lieberman, G. J. (2010). <i>Introducción a la investigación de operaciones</i> (9.ª ed.), cap. 17. McGraw-Hill.", "Taha, H. A. (2012). <i>Investigación de operaciones</i> (9.ª ed.), cap. 18. Pearson."]
};
/* ============ GUÍAS: ESTUDIO DEL TRABAJO Y CALIDAD ============ */
GUIDE["tiempo-estandar"] = {
que:"<p>El <b>tiempo estándar</b> es el tiempo que necesita un operario calificado, trabajando a ritmo normal con el método establecido, para completar una tarea, incluyendo tolerancias por necesidades personales, fatiga y demoras inevitables. Es la base para planificar la producción, balancear líneas, calcular la dotación, costear la mano de obra, fijar incentivos y comparar métodos de trabajo.</p>",
hist:"<p><b>Frederick W. Taylor</b> comenzó a cronometrar tareas en la acería Midvale Steel en la década de 1880 y publicó <i>The Principles of Scientific Management</i> en 1911. Frank y Lillian Gilbreth desarrollaron el estudio de movimientos y los <i>therbligs</i> (las 17 micromotivaciones básicas). En 1927 Lowry, Maynard y Stegemerten publicaron el sistema de valoración Westinghouse, y en 1948 Maynard, Stegemerten y Schwab crearon el sistema de tiempos predeterminados MTM. La Organización Internacional del Trabajo (OIT) difundió estos métodos en su manual <i>Introducción al estudio del trabajo</i>, publicado por primera vez en 1957, y elaboró las tablas de suplementos que se usan en Latinoamérica.</p><p>El estudio del trabajo tiene también una historia de conflicto: los sindicatos se opusieron al taylorismo por la intensificación del trabajo. Hoy se entiende que un estándar legítimo debe ser medido con transparencia, con participación de los trabajadores y respetando la ergonomía.</p>",
como:"<ol><li><b>Dividir la tarea en elementos</b> con puntos de inicio y término claros.</li><li><b>Cronometrar</b> varios ciclos (vuelta a cero o continuo).</li><li><b>Tiempo observado (TO):</b> promedio de las lecturas, descartando anomalías.</li><li><b>Valoración del ritmo (V):</b> comparación del ritmo observado con el normal (100 %). Westinghouse suma factores de habilidad, esfuerzo, condiciones y consistencia.</li><li><b>Tiempo normal:</b> TN = TO × V.</li><li><b>Suplementos (S):</b> porcentaje por necesidades personales (5 a 7 %), fatiga básica (4 %) y variables según postura, peso, ambiente y monotonía (tabla OIT).</li><li><b>Tiempo estándar:</b> TE = TN × (1 + S).</li></ol><p><b>Número de observaciones (95 % de confianza, ±5 %):</b> n' = [40 √(nΣx² − (Σx)²) ÷ Σx]². Si n' es mayor que las lecturas tomadas, hay que cronometrar más.</p>",
pasos:"<ol><li>Estandariza el método antes de medir (no tiene sentido medir un método malo).</li><li>Informa al operario y al supervisor; elige un trabajador calificado.</li><li>Registra condiciones (máquina, material, herramientas).</li><li>Toma 10 a 20 lecturas iniciales y verifica cuántas faltan.</li><li>Aplica valoración y suplementos justificados.</li><li>Publica el estándar y revísalo cuando cambie el método.</li></ol>",
caso:"<p><b>Caso tipo: armado de kits de despacho.</b> El ciclo observado promedia unos 25 segundos, el operario trabajó algo más rápido que lo normal (105 %) y se asignan 14 % de suplementos (personales, fatiga y trabajo de pie). El tiempo estándar resulta cercano a 30 segundos, es decir, unas 120 unidades por hora. Con una demanda de 4.000 kits diarios, se requieren entre 4 y 5 puestos en una jornada de 8 horas (34 horas de trabajo estándar al día). Antes, la dotación se definía «a ojo» y se pagaban horas extra todos los días.</p>",
err:"<ul><li>Medir a un operario nuevo o en un día anormal.</li><li>Aplicar suplementos sin justificarlos con la tabla.</li><li>Confundir valoración con eficiencia: la valoración corrige el ritmo, no el método.</li><li>Usar estándares antiguos después de cambiar el proceso.</li></ul>",
src:["Freivalds, A., y Niebel, B. W. (2014). <i>Ingeniería industrial de Niebel: métodos, estándares y diseño del trabajo</i> (13.ª ed.). McGraw-Hill.", "Kanawaty, G. (Ed.). (1996). <i>Introducción al estudio del trabajo</i> (4.ª ed.). Oficina Internacional del Trabajo.", "Taylor, F. W. (1911). <i>The Principles of Scientific Management</i>. Harper & Brothers.", "Meyers, F. E., y Stewart, J. R. (2000). <i>Estudios de tiempos y movimientos para la manufactura ágil</i> (2.ª ed.). Pearson."]
};
GUIDE["muestreo"] = {
que:"<p>El <b>muestreo del trabajo</b> estima qué porcentaje del tiempo una persona o máquina dedica a cada actividad (trabajando, esperando, en traslado, detenida) mediante observaciones instantáneas en momentos aleatorios. Es más barato que cronometrar todo el día y sirve para tareas largas o variadas: mantención, oficinas, enfermería, grúas, cargadores frontales.</p>",
hist:"<p>Fue desarrollado por el estadístico británico <b>L. H. C. Tippett</b> en 1934 en la industria textil (British Cotton Industry Research Association), con el nombre de <i>snap-reading method</i>. Se difundió en Estados Unidos en los años cuarenta y cincuenta como <i>work sampling</i>.</p>",
como:"<ul><li>Se basa en la distribución binomial: si en n observaciones la actividad aparece x veces, p = x ÷ n estima la proporción del tiempo.</li><li><b>Tamaño de muestra:</b> n = z² p(1 − p) ÷ e², con e el error absoluto aceptado.</li><li><b>Precisión lograda:</b> e = z √[p(1 − p) ÷ n].</li><li><b>Tiempo estándar por muestreo:</b> TE = [T × (1 − p<sub>inactivo</sub>) × V ÷ unidades] × (1 + S).</li></ul><p>Los momentos de observación deben ser aleatorios (tabla de números aleatorios o una planilla con ALEATORIO.ENTRE) para que el trabajador no anticipe la visita y para cubrir todo el turno.</p>",
pasos:"<ol><li>Define las categorías de actividad de forma inequívoca.</li><li>Haz un estudio piloto para estimar p.</li><li>Calcula n y distribuye las observaciones en varios días y turnos.</li><li>Registra cada observación en el instante en que ves al trabajador.</li><li>Calcula p, verifica la precisión y analiza las causas de inactividad.</li></ol>",
caso:"<p><b>Caso tipo: equipo de mantención de una planta.</b> Con 620 observaciones durante dos semanas se encontró que los técnicos pasaban casi un 17 % del tiempo esperando repuestos o permisos de trabajo. El análisis de esas esperas llevó a preparar los kits de repuestos y los permisos el día anterior, lo que aumentó el tiempo efectivo de trabajo sin aumentar la dotación.</p>",
err:"<ul><li>Observar siempre a la misma hora.</li><li>Categorías ambiguas («trabajando» vs «preparando»).</li><li>Muestras muy pequeñas para actividades poco frecuentes.</li></ul>",
src:["Tippett, L. H. C. (1935). A snap-reading method of making time studies of machines and operatives in factory surveys. <i>Journal of the Textile Institute, 26</i>, T51–T55.", "Freivalds, A., y Niebel, B. W. (2014). <i>Ingeniería industrial de Niebel</i>, cap. 10. McGraw-Hill.", "Kanawaty, G. (Ed.). (1996). <i>Introducción al estudio del trabajo</i>. OIT."]
};
GUIDE["aprendizaje"] = {
que:"<p>La <b>curva de aprendizaje</b> describe cómo disminuye el tiempo (o el costo) por unidad a medida que se acumula experiencia. Una curva de 85 % significa que cada vez que se duplica la producción acumulada, el tiempo de la última unidad cae al 85 % del anterior. Se usa para cotizar contratos de varias unidades, planificar la puesta en marcha de una línea, estimar la dotación y negociar precios con proveedores.</p>",
hist:"<p><b>Theodore P. Wright</b>, ingeniero aeronáutico de Curtiss-Wright, publicó en 1936 «Factors affecting the cost of airplanes», donde mostró que el número de horas para fabricar un avión bajaba alrededor de 20 % cada vez que se duplicaba la producción. Durante la Segunda Guerra Mundial la industria aeronáutica estadounidense la usó para planificar la producción. En los años sesenta, Bruce Henderson y el Boston Consulting Group generalizaron la idea a la <b>curva de experiencia</b> de costos de toda una industria.</p>",
como:"<ul><li><b>Modelo de Wright:</b> T<sub>n</sub> = T<sub>1</sub> × n<sup>b</sup>, con b = log(r) ÷ log(2).</li><li>Con r = 80 %, b ≈ −0,322.</li><li>Tiempo total de n unidades: suma de T<sub>k</sub> desde 1 a n.</li><li>Tasas típicas: ensamble aeronáutico 75 a 85 %; electrónica 90 a 95 %; procesos muy automatizados cercanos a 100 % (poco aprendizaje porque la máquina impone el ritmo).</li></ul>",
pasos:"<ol><li>Registra el tiempo de las primeras unidades o lotes.</li><li>Grafica en escala log-log: la curva debería parecer una recta.</li><li>Estima r con la pendiente (o usa valores típicos de la industria).</li><li>Proyecta tiempos y costos de las unidades siguientes.</li></ol>",
caso:"<p><b>Caso tipo: fabricación de 64 módulos habitacionales para un campamento minero.</b> El primer módulo toma 120 horas. Con una curva de 85 %, el módulo 64 tomaría cerca de 45 horas. Cotizar todos los módulos al tiempo del primero habría dejado a la empresa fuera de la licitación; cotizar todos al tiempo del último habría generado pérdidas en las primeras unidades. El precio correcto se basa en el tiempo total acumulado.</p>",
err:"<ul><li>Suponer aprendizaje infinito: en algún momento el tiempo se estabiliza (estándar).</li><li>Ignorar el olvido cuando hay interrupciones largas entre lotes.</li><li>Aplicar la misma tasa a tareas manuales y automatizadas.</li></ul>",
src:["Wright, T. P. (1936). Factors affecting the cost of airplanes. <i>Journal of the Aeronautical Sciences, 3</i>(4), 122–128.", "Heizer, J., y Render, B. (2014). <i>Principios de administración de operaciones</i>, suplemento E. Pearson.", "Henderson, B. D. (1974). <i>The Experience Curve Reviewed</i>. Boston Consulting Group."]
};
GUIDE["productividad"] = {
que:"<p>La <b>productividad</b> es la relación entre lo que se produce y los recursos que se usan para producirlo. La <b>productividad parcial</b> mide un solo recurso (unidades por hora hombre, toneladas por kWh); la <b>multifactorial o total</b> considera todos los insumos valorizados. Es el indicador que en último término determina los salarios reales y la competitividad de un país o empresa.</p>",
hist:"<p>El concepto se usó desde los economistas clásicos, pero su medición sistemática se desarrolló en el siglo XX. Robert Solow (Nobel 1987) mostró en 1957 que la mayor parte del crecimiento de largo plazo se explica por la productividad total de los factores. En Chile, la Comisión Nacional de Productividad (creada en 2015, hoy Comisión Nacional de Evaluación y Productividad) estudia la productividad de sectores como la minería, el retail y la salud. David Sumanth propuso en 1979 el modelo de productividad total para empresas.</p>",
como:"<ul><li><b>Parcial:</b> producción ÷ un insumo.</li><li><b>Multifactorial:</b> producción valorizada ÷ suma de insumos valorizados.</li><li><b>Variación:</b> P<sub>2</sub> ÷ P<sub>1</sub> − 1.</li><li>Usa <b>precios constantes</b> del período base para que la inflación no parezca productividad.</li></ul><p>Eficiencia, eficacia y productividad no son lo mismo: eficacia es lograr el objetivo; eficiencia, usar bien los recursos; productividad, la relación producto/insumo.</p>",
pasos:"<ol><li>Define la unidad de producción (toneladas, unidades equivalentes, pacientes atendidos).</li><li>Reúne los insumos del período: horas, materiales, energía, capital.</li><li>Calcula productividades parciales y total.</li><li>Analiza qué insumo explica el cambio y por qué.</li></ol>",
caso:"<p><b>Caso tipo:</b> una planta aumentó su producción 12 % pero su productividad de materiales bajó porque subieron las mermas al usar una materia prima más barata. La productividad total mejoró menos de lo que parecía al mirar solo la mano de obra. Este tipo de análisis evita celebrar mejoras parciales que esconden problemas en otro recurso.</p><p><b>Dato de contexto:</b> diversos estudios de la Comisión Nacional de Productividad han documentado la caída de la productividad de la minería del cobre chilena desde mediados de los años 2000, asociada a menores leyes de mineral y mayores distancias de acarreo, un ejemplo de cómo la productividad depende también de factores físicos y no solo de la gestión.</p>",
err:"<ul><li>Comparar productividad en pesos corrientes de años distintos.</li><li>Mirar solo la productividad laboral cuando se automatiza.</li><li>Cambiar la definición de la unidad de producción entre períodos.</li></ul>",
src:["Sumanth, D. J. (1994). <i>Productivity Engineering and Management</i>. McGraw-Hill.", "Solow, R. M. (1957). Technical change and the aggregate production function. <i>Review of Economics and Statistics, 39</i>(3), 312–320.", "Comisión Nacional de Evaluación y Productividad. Estudios sectoriales (cnep.cl)."]
};
GUIDE["descriptiva"] = {
que:"<p>La <b>estadística descriptiva</b> resume un conjunto de datos con medidas de tendencia central (media, mediana, moda), de dispersión (desviación estándar, rango, rango intercuartil) y de forma (asimetría, curtosis), y lo representa con gráficos como el histograma. Es el primer paso de cualquier análisis: antes de modelar, hay que entender los datos.</p>",
hist:"<p>La media aritmética se usa desde la Antigüedad; la desviación estándar fue nombrada por Karl Pearson en 1894. Carl Friedrich Gauss (1809) desarrolló la distribución normal al estudiar errores de medición astronómica. Herbert Sturges propuso en 1926 la regla para el número de clases de un histograma. John Tukey, en <i>Exploratory Data Analysis</i> (1977), introdujo el diagrama de caja y el análisis exploratorio moderno.</p>",
como:"<ul><li><b>Media:</b> x̄ = Σx ÷ n. Sensible a valores extremos.</li><li><b>Mediana:</b> valor central; robusta ante extremos (útil para sueldos o tiempos de espera).</li><li><b>Desviación estándar muestral:</b> s = √[Σ(x − x̄)² ÷ (n − 1)].</li><li><b>Coeficiente de variación:</b> s ÷ x̄, permite comparar dispersión entre variables de distinta escala.</li><li><b>Cuartiles:</b> Q1 y Q3; rango intercuartil Q3 − Q1. Los valores más allá de 1,5 RIC suelen considerarse atípicos.</li><li><b>Histograma:</b> k ≈ 1 + 3,322 log₁₀(n) clases (Sturges).</li><li><b>Intervalo de confianza de la media:</b> x̄ ± t × s ÷ √n.</li></ul>",
pasos:"<ol><li>Revisa la calidad de los datos (vacíos, errores de digitación, unidades).</li><li>Calcula las medidas y grafica el histograma.</li><li>Observa la forma: ¿simétrica?, ¿dos peaks (dos poblaciones mezcladas)?, ¿cola larga?</li><li>Estratifica por turno, máquina o proveedor si ves mezclas.</li><li>En Excel: PROMEDIO, MEDIANA, DESVEST.M, CUARTIL.INC, y Análisis de datos → Estadística descriptiva.</li></ol>",
caso:"<p><b>Caso tipo: peso de bolsas de 50 g.</b> Treinta bolsas pesan en promedio 50,1 g con desviación cercana a 0,3 g. El histograma es simétrico y no hay atípicos. Esa información permite pasar al análisis de capacidad: ¿cuántas bolsas quedarán bajo el peso mínimo declarado? En otro caso, un histograma con dos peaks reveló que dos máquinas llenadoras tenían ajustes distintos.</p>",
err:"<ul><li>Reportar solo el promedio, sin la dispersión.</li><li>Usar la media con datos muy asimétricos (usa la mediana).</li><li>Sacar conclusiones con muestras muy pequeñas.</li></ul>",
src:["Montgomery, D. C., y Runger, G. C. (2014). <i>Applied Statistics and Probability for Engineers</i> (6th ed.). Wiley.", "Walpole, R., Myers, R., Myers, S., y Ye, K. (2012). <i>Probabilidad y estadística para ingeniería y ciencias</i> (9.ª ed.). Pearson.", "Tukey, J. W. (1977). <i>Exploratory Data Analysis</i>. Addison-Wesley."]
};
GUIDE["control-xr"] = {
que:"<p>Un <b>gráfico de control</b> distingue la variación normal de un proceso (causas comunes, inherentes al sistema) de la variación anormal (causas asignables: un ajuste mal hecho, un lote de material distinto, un operario sin capacitación). El par <b>X̄–R</b> controla una variable medible: el gráfico X̄ vigila el centrado y el gráfico R la dispersión.</p><p>Permite actuar solo cuando hay una señal real, evitando dos errores costosos: ajustar un proceso que estaba bien (sobreajuste) y no actuar cuando algo cambió.</p>",
hist:"<p><b>Walter A. Shewhart</b>, de los Bell Telephone Laboratories, propuso el gráfico de control en un memorando del 16 de mayo de 1924 y publicó en 1931 <i>Economic Control of Quality of Manufactured Product</i>. <b>W. Edwards Deming</b> llevó estas ideas a Japón a partir de 1950, invitado por la Unión de Científicos e Ingenieros Japoneses (JUSE), lo que contribuyó al ascenso de la calidad japonesa. Las reglas de detección de patrones se publicaron en el <i>Statistical Quality Control Handbook</i> de Western Electric (1956).</p>",
como:"<ul><li>Se toman k subgrupos (20 a 25) de n unidades consecutivas (típicamente 4 o 5).</li><li>X̿ = promedio de las medias; R̄ = promedio de los rangos.</li><li>Gráfico X̄: LSC = X̿ + A₂R̄, LIC = X̿ − A₂R̄.</li><li>Gráfico R: LSC = D₄R̄, LIC = D₃R̄.</li><li>Las constantes A₂, D₃, D₄ y d₂ dependen de n (ver Tablas). σ estimada = R̄ ÷ d₂.</li><li>Los límites equivalen a ±3σ del estadístico: con un proceso estable, solo 0,27 % de los puntos caería fuera por azar.</li></ul><p><b>Reglas de Western Electric:</b> 1 punto fuera de ±3σ; 2 de 3 consecutivos más allá de 2σ del mismo lado; 4 de 5 más allá de 1σ; 8 consecutivos del mismo lado de la línea central.</p>",
pasos:"<ol><li>Elige la característica crítica y verifica el sistema de medición (estudio R&R).</li><li>Define tamaño y frecuencia de subgrupo (subgrupos racionales: unidades producidas en condiciones homogéneas).</li><li>Fase I: con 20 a 25 subgrupos calcula límites, elimina causas asignables y recalcula.</li><li>Fase II: usa los límites para vigilar el proceso en tiempo real.</li><li>Ante una señal: detén, investiga, corrige y registra la causa.</li></ol>",
caso:"<p><b>Caso tipo: diámetro de un eje mecanizado.</b> El ejemplo de la herramienta muestra un subgrupo con promedio fuera del límite superior. La investigación encontró que ese turno se había cambiado el inserto de corte sin reajustar la compensación. Se agregó el reajuste al procedimiento de cambio de herramienta y el punto se excluyó del cálculo de los límites.</p>",
err:"<ul><li>Dibujar los límites de especificación en el gráfico X̄ (son conceptos distintos).</li><li>Calcular límites con un proceso inestable sin limpiar las causas asignables.</li><li>Formar subgrupos con unidades de distintas máquinas.</li><li>Ajustar el proceso ante cada variación dentro de los límites.</li></ul>",
src:["Shewhart, W. A. (1931). <i>Economic Control of Quality of Manufactured Product</i>. Van Nostrand.", "Montgomery, D. C. (2013). <i>Introduction to Statistical Quality Control</i> (7th ed.). Wiley. (Ed. en español: <i>Control estadístico de la calidad</i>, Limusa Wiley).", "Gutiérrez Pulido, H., y de la Vara Salazar, R. (2013). <i>Control estadístico de la calidad y Seis Sigma</i> (3.ª ed.). McGraw-Hill.", "Western Electric Company. (1956). <i>Statistical Quality Control Handbook</i>.", "Deming, W. E. (1986). <i>Out of the Crisis</i>. MIT Press."]
};
GUIDE["control-p"] = {
que:"<p>El <b>gráfico p</b> controla la proporción de unidades defectuosas cuando la característica no se mide sino que se clasifica (pasa / no pasa, conforme / no conforme). Sirve para inspección visual, verificación de documentos, pedidos con error, llamadas no resueltas o cualquier proceso con resultados de tipo sí/no.</p>",
hist:"<p>Forma parte de los gráficos por atributos propuestos por Shewhart en los años veinte y se basa en la distribución binomial. Los gráficos np, c y u son variantes para número de defectuosos y número de defectos.</p>",
como:"<ul><li>p̄ = Σ defectuosos ÷ Σ inspeccionados.</li><li>LSC<sub>i</sub> = p̄ + 3√[p̄(1 − p̄) ÷ n<sub>i</sub>]; LIC<sub>i</sub> = máx(0, p̄ − 3√[…]).</li><li>Con tamaño de muestra variable los límites cambian en cada muestra.</li><li><b>Gráfico np:</b> número de defectuosos (n constante). <b>Gráfico c:</b> defectos por unidad de inspección, c̄ ± 3√c̄. <b>Gráfico u:</b> defectos por unidad con n variable.</li></ul>",
pasos:"<ol><li>Define con claridad qué es un defectuoso (criterio de aceptación con fotos o muestras patrón).</li><li>Toma muestras de tamaño suficiente para que n p̄ sea mayor que 5.</li><li>Calcula límites y analiza patrones.</li><li>Investiga las muestras fuera de control.</li></ol>",
caso:"<p><b>Caso tipo: centro de distribución.</b> Se controla la proporción de pedidos despachados con error. Una muestra con proporción muy superior al límite coincidió con el ingreso de personal temporal sin inducción. Se creó una inducción de 2 horas con ejercicios de picking y la proporción volvió a su nivel habitual.</p>",
err:"<ul><li>Muestras pequeñas con p̄ muy bajo (el gráfico pierde sensibilidad).</li><li>Criterios de defecto que cambian según el inspector.</li></ul>",
src:["Montgomery, D. C. (2013). <i>Introduction to Statistical Quality Control</i>, cap. 7. Wiley.", "Gutiérrez Pulido, H., y de la Vara Salazar, R. (2013). <i>Control estadístico de la calidad y Seis Sigma</i>. McGraw-Hill."]
};
GUIDE["capacidad"] = {
que:"<p>La <b>capacidad de proceso</b> mide si un proceso estable es capaz de producir dentro de las especificaciones del cliente. <b>Cp</b> compara el ancho de la tolerancia con el ancho natural del proceso (6σ); <b>Cpk</b> además considera si el proceso está centrado. Son exigidos por clientes industriales, especialmente automotrices, aeronáuticos y de dispositivos médicos.</p>",
hist:"<p>Los índices de capacidad se difundieron en la industria japonesa y estadounidense en los años setenta y ochenta; Victor Kane los sistematizó en «Process capability indices» (<i>Journal of Quality Technology</i>, 1986). La industria automotriz estadounidense, a través del Automotive Industry Action Group (AIAG), los incorporó en sus manuales de aprobación de piezas (PPAP) y SPC, que son referencia obligada para los proveedores del sector.</p>",
como:"<ul><li>Cp = (LES − LEI) ÷ 6σ.</li><li>Cpk = mín[(LES − μ) ÷ 3σ ; (μ − LEI) ÷ 3σ].</li><li>Cp = Cpk solo si el proceso está perfectamente centrado.</li><li>PPM fuera = [Φ((LEI − μ)/σ) + 1 − Φ((LES − μ)/σ)] × 10⁶ (supone normalidad).</li><li><b>Cp/Cpk vs Pp/Ppk:</b> los primeros usan la σ de corto plazo (R̄/d₂, variación dentro de subgrupos); los segundos la σ total de largo plazo.</li></ul><p>Requisitos previos: el proceso debe estar bajo control estadístico y los datos deben ser aproximadamente normales. Con un proceso inestable, el Cpk no predice nada.</p>",
pasos:"<ol><li>Verifica estabilidad con un gráfico de control.</li><li>Verifica normalidad (histograma, gráfico de probabilidad normal).</li><li>Estima μ y σ y calcula los índices.</li><li>Si Cpk es bajo pero Cp es alto: centra el proceso. Si ambos son bajos: reduce la variación (método, máquina, material).</li></ol>",
caso:"<p><b>Caso tipo: pieza de 10,0 ± 0,6 mm.</b> Con μ = 10,08 y σ = 0,15, el Cp es 1,33 pero el Cpk baja a cerca de 1,16 porque el proceso está corrido hacia el límite superior. Solo centrando el proceso, sin ninguna inversión, el Cpk sube a 1,33 y las piezas fuera de especificación disminuyen notoriamente. La lección: antes de comprar una máquina más precisa, centra la que tienes.</p>",
err:"<ul><li>Calcular Cpk con un proceso fuera de control.</li><li>Usar pocos datos (se recomiendan al menos 100 mediciones).</li><li>Confundir límites de control con límites de especificación.</li></ul>",
src:["Kane, V. E. (1986). Process capability indices. <i>Journal of Quality Technology, 18</i>(1), 41–52.", "AIAG. (2005). <i>Statistical Process Control (SPC) Reference Manual</i> (2nd ed.).", "Montgomery, D. C. (2013). <i>Introduction to Statistical Quality Control</i>, cap. 8. Wiley."]
};
GUIDE["sigma"] = {
que:"<p>El <b>nivel sigma</b> expresa qué tan cerca está un proceso de la perfección. Se calcula a partir de los <b>defectos por millón de oportunidades (DPMO)</b>, lo que permite comparar procesos muy distintos: la soldadura de un chasis, la emisión de facturas o la atención de reclamos. Un proceso Seis Sigma produce 3,4 defectos por millón de oportunidades.</p>",
hist:"<p>Seis Sigma nació en <b>Motorola</b> en 1986, impulsado por el ingeniero Bill Smith y desarrollado por Mikel Harry. Motorola ganó el premio nacional de calidad Malcolm Baldrige en 1988. <b>General Electric</b>, bajo Jack Welch, lo adoptó masivamente desde 1995 y le dio fama mundial con la estructura de belts (Yellow, Green, Black, Master Black Belt) y la metodología DMAIC.</p>",
como:"<ul><li>DPU = defectos ÷ unidades.</li><li>DPO = defectos ÷ (unidades × oportunidades por unidad).</li><li>DPMO = DPO × 10⁶.</li><li>Nivel sigma = Φ⁻¹(1 − DPO) + 1,5. El 1,5 representa el desplazamiento de la media que, según Motorola, ocurre en el largo plazo.</li><li>Rendimiento al primer intento aproximado: e<sup>−DPU</sup>.</li></ul><p><b>Referencias:</b> 3σ ≈ 66.807 DPMO; 4σ ≈ 6.210; 5σ ≈ 233; 6σ ≈ 3,4.</p>",
pasos:"<ol><li>Define la unidad y qué cuenta como oportunidad de defecto (sé conservador: no infles las oportunidades para mejorar el indicador).</li><li>Cuenta defectos en un período representativo.</li><li>Calcula DPMO y nivel sigma.</li><li>Úsalo como línea base del proyecto DMAIC y mídelo al cerrar.</li></ol>",
caso:"<p><b>Caso tipo: emisión de órdenes de compra.</b> En 4.500 órdenes con 6 campos críticos se encontraron 186 errores: unos 6.900 DPMO, cerca de 4 sigma. Un proyecto Green Belt con validaciones automáticas en el ERP redujo los errores y se reportó la mejora en nivel sigma ante la gerencia.</p>",
err:"<ul><li>Inflar el número de oportunidades para obtener un nivel sigma mayor.</li><li>Comparar niveles sigma calculados con y sin el desplazamiento de 1,5.</li></ul>",
src:["Harry, M., y Schroeder, R. (2000). <i>Six Sigma</i>. Currency Doubleday.", "Pyzdek, T., y Keller, P. (2014). <i>The Six Sigma Handbook</i> (4th ed.). McGraw-Hill.", "Gutiérrez Pulido, H., y de la Vara Salazar, R. (2013). <i>Control estadístico de la calidad y Seis Sigma</i>. McGraw-Hill."]
};
GUIDE["pareto"] = {
que:"<p>El <b>diagrama de Pareto</b> es un gráfico de barras ordenadas de mayor a menor con una línea de porcentaje acumulado. Muestra que unas pocas causas explican la mayor parte del problema (los «pocos vitales») y ayuda a decidir dónde concentrar el esfuerzo.</p>",
hist:"<p>Vilfredo Pareto observó en 1896 la concentración de la riqueza en Italia. <b>Joseph M. Juran</b>, en los años cuarenta y en su <i>Quality Control Handbook</i> (1951), aplicó la idea a los problemas de calidad y la llamó principio de Pareto. Kaoru Ishikawa lo incluyó entre las siete herramientas básicas de la calidad.</p>",
como:"<ol><li>Define categorías mutuamente excluyentes.</li><li>Cuenta frecuencias (o mejor aún, costos: un defecto poco frecuente puede ser el más caro).</li><li>Ordena de mayor a menor y calcula porcentajes acumulados.</li><li>Marca el corte (usualmente cerca del 80 %).</li></ol><p>Un buen Pareto se hace en dos niveles: primero por tipo de problema y luego, dentro del problema principal, por causa, máquina o turno (Pareto estratificado).</p>",
pasos:"<ol><li>Recolecta datos con una hoja de verificación durante un período representativo.</li><li>Construye el Pareto con la herramienta.</li><li>Elige 1 o 2 categorías vitales y analiza sus causas con Ishikawa o 5 porqués.</li><li>Después de mejorar, repite el Pareto para mostrar el antes y después.</li></ol>",
caso:"<p><b>Caso tipo: reclamos de una línea de piezas pintadas.</b> Las rayas en superficie y las dimensiones fuera de tolerancia explican la mayoría de los rechazos. El equipo descubrió que las rayas venían del contacto entre piezas en los carros de traslado; separadores de espuma de bajo costo eliminaron buena parte del problema. Atacar «Otros» o los defectos menores no habría cambiado el resultado.</p>",
err:"<ul><li>Una categoría «Otros» demasiado grande (desagrégala).</li><li>Mezclar unidades (frecuencia y costo) en el mismo gráfico.</li><li>Usar datos de un período atípico.</li></ul>",
src:["Juran, J. M., y De Feo, J. A. (2010). <i>Juran's Quality Handbook</i> (6th ed.). McGraw-Hill.", "Ishikawa, K. (1986). <i>¿Qué es el control total de calidad? La modalidad japonesa</i>. Norma."]
};
GUIDE["amef"] = {
que:"<p>El <b>AMEF</b> (Análisis de Modo y Efecto de Falla, en inglés FMEA) es un método preventivo para identificar cómo puede fallar un producto o proceso, qué efecto tendría cada falla, qué la causa y qué controles existen, para priorizar acciones antes de que la falla ocurra. Existen AMEF de diseño, de proceso y de sistema.</p>",
hist:"<p>Se originó en el ejército de Estados Unidos con el procedimiento militar MIL-P-1629 (1949). La NASA lo usó en el programa Apolo en los años sesenta. Ford lo introdujo en la industria automotriz a fines de los setenta y el AIAG publicó su manual en 1993. En 2019, AIAG y la asociación alemana VDA publicaron un manual armonizado que reemplaza el NPR por la <b>Prioridad de Acción (AP)</b>, porque el NPR podía dar igual prioridad a riesgos muy diferentes.</p>",
como:"<ul><li><b>Severidad (S, 1–10):</b> gravedad del efecto para el cliente o la seguridad.</li><li><b>Ocurrencia (O, 1–10):</b> probabilidad de que la causa ocurra.</li><li><b>Detección (D, 1–10):</b> capacidad de detectar la falla antes de que llegue al cliente (10 = imposible de detectar).</li><li><b>NPR</b> = S × O × D (1 a 1.000).</li><li>Las fallas con severidad 9 o 10 (seguridad, incumplimiento legal) requieren acción aunque el NPR sea bajo.</li><li>Después de las acciones se recalculan O y D; S solo baja si cambia el diseño.</li></ul>",
pasos:"<ol><li>Forma un equipo multidisciplinario (diseño, producción, calidad, mantención).</li><li>Describe el proceso paso a paso (diagrama de flujo).</li><li>Para cada paso, lista modos de falla, efectos y causas.</li><li>Asigna S, O y D con escalas acordadas.</li><li>Prioriza y define acciones con responsable y fecha.</li><li>Actualiza el AMEF como documento vivo.</li></ol>",
caso:"<p><b>Caso tipo: AMEF de una correa transportadora.</b> El modo «perno mal apretado» tenía NPR intermedio pero severidad 9 (puede soltarse una pieza y herir a alguien). Se priorizó por severidad: se implementó un torque controlado con llave dinamométrica y marcas de verificación. El sobrecalentamiento del rodamiento, con el NPR más alto, se abordó con monitoreo de temperatura y lubricación programada.</p>",
err:"<ul><li>Hacerlo una sola vez para cumplir con un cliente y olvidarlo.</li><li>Priorizar solo por NPR ignorando la severidad.</li><li>Escalas distintas entre equipos.</li></ul>",
src:["AIAG y VDA. (2019). <i>Failure Mode and Effects Analysis – FMEA Handbook</i> (1st ed.).", "Stamatis, D. H. (2003). <i>Failure Mode and Effect Analysis: FMEA from Theory to Execution</i> (2nd ed.). ASQ Quality Press.", "United States Department of Defense. (1949). MIL-P-1629: Procedures for performing a failure mode, effects and criticality analysis."]
};
GUIDE["muestra"] = {
que:"<p>El <b>tamaño de muestra</b> es cuántos datos hay que recoger para estimar una media o una proporción con el error y la confianza deseados. Muestras pequeñas dan resultados poco confiables; muestras demasiado grandes desperdician tiempo y dinero. Se usa en encuestas de satisfacción, inspección de lotes, auditorías, estudios de tiempos y estudios de mercado.</p>",
hist:"<p>Jerzy Neyman formalizó los intervalos de confianza y el muestreo estratificado en 1934. William G. Cochran escribió <i>Sampling Techniques</i> (1953), texto clásico sobre diseño de muestras. William Gosset, químico de la cervecería Guinness, publicó en 1908 con el seudónimo «Student» la distribución t, necesaria cuando la muestra es pequeña.</p>",
como:"<ul><li><b>Proporción:</b> n₀ = z² p(1 − p) ÷ e². Si no se conoce p, se usa 0,5 (el caso más exigente).</li><li><b>Media:</b> n₀ = (zσ ÷ e)².</li><li><b>Población finita:</b> n = n₀ ÷ [1 + (n₀ − 1) ÷ N].</li><li>z = 1,645 (90 %), 1,96 (95 %), 2,576 (99 %).</li><li>Para reducir el error a la mitad se necesita cuatro veces la muestra.</li></ul>",
pasos:"<ol><li>Define la población y el marco muestral (lista de unidades).</li><li>Define error y confianza según el uso del resultado.</li><li>Calcula n y súmale una tasa de no respuesta en encuestas.</li><li>Selecciona al azar (o estratificado si hay grupos distintos).</li></ol>",
caso:"<p><b>Caso tipo: encuesta de satisfacción a 1.200 clientes.</b> Para un error de ±5 puntos con 95 % de confianza y sin información previa (p = 50 %), se necesitan unas 384 respuestas en población infinita, que bajan a cerca de 290 con la corrección por población finita. Si se espera 30 % de respuesta, hay que invitar a unos 970 clientes.</p>",
err:"<ul><li>Muestras por conveniencia (los que responden primero) que sesgan los resultados.</li><li>Olvidar la tasa de no respuesta.</li><li>Reportar porcentajes con decimales cuando el error es de ±5 puntos.</li></ul>",
src:["Cochran, W. G. (1977). <i>Sampling Techniques</i> (3rd ed.). Wiley.", "Walpole, R. et al. (2012). <i>Probabilidad y estadística para ingeniería y ciencias</i>. Pearson.", "Student (W. S. Gosset). (1908). The probable error of a mean. <i>Biometrika, 6</i>(1), 1–25."]
};
GUIDE["regresion"] = {
que:"<p>La <b>regresión lineal</b> ajusta una recta y = a + bx que describe cómo cambia una variable y cuando cambia otra x. La <b>correlación</b> mide la fuerza de esa relación lineal. Se usa para estimar costos fijos y variables, pronosticar demanda con variables explicativas, relacionar parámetros de proceso con calidad y estimar consumos de energía.</p>",
hist:"<p>El método de mínimos cuadrados fue publicado por Adrien-Marie Legendre en 1805 y desarrollado por Gauss en 1809. <b>Francis Galton</b> acuñó el término «regresión» en 1886 al estudiar la estatura de padres e hijos (los hijos de padres muy altos tendían a «regresar» hacia la media). Karl Pearson formalizó el coeficiente de correlación en 1896.</p>",
como:"<ul><li>b = Σ(x − x̄)(y − ȳ) ÷ Σ(x − x̄)²; a = ȳ − b x̄.</li><li>r = Sxy ÷ √(Sxx Syy), entre −1 y 1.</li><li>R² = r²: proporción de la variación de y explicada por x.</li><li>Error estándar de la estimación: s = √[SSE ÷ (n − 2)].</li><li>Prueba de la pendiente: t = b ÷ s<sub>b</sub>; si el p-valor es menor que 0,05, la relación es estadísticamente significativa.</li><li>Intervalo de predicción: más ancho que el de la media, y crece al alejarse de x̄.</li></ul>",
pasos:"<ol><li>Grafica la dispersión antes de calcular: verifica que la relación sea lineal.</li><li>Calcula la recta, R² y el p-valor.</li><li>Revisa los residuos: deben ser aleatorios, sin patrones.</li><li>Predice solo dentro del rango observado.</li><li>En Excel: PENDIENTE, INTERSECCION.EJE, COEF.DE.CORREL, o el complemento Análisis de datos → Regresión.</li></ol>",
caso:"<p><b>Caso tipo: separar costos fijos y variables.</b> Con datos mensuales de unidades producidas y costo total, la regresión da una pendiente (costo variable por unidad) y un intercepto (costo fijo mensual). Con un R² alto, esos valores alimentan el análisis de punto de equilibrio con mejor base que las estimaciones contables.</p>",
err:"<ul><li>Confundir correlación con causalidad.</li><li>Extrapolar fuera del rango de datos.</li><li>Ignorar valores atípicos que mueven la recta.</li></ul>",
src:["Montgomery, D. C., Peck, E., y Vining, G. (2012). <i>Introduction to Linear Regression Analysis</i> (5th ed.). Wiley.", "Walpole, R. et al. (2012). <i>Probabilidad y estadística para ingeniería y ciencias</i>, cap. 11. Pearson.", "Galton, F. (1886). Regression towards mediocrity in hereditary stature. <i>Journal of the Anthropological Institute, 15</i>, 246–263."]
};
/* ============ GUÍAS: INVESTIGACIÓN DE OPERACIONES Y SEGURIDAD ============ */
GUIDE["programacion-lineal"] = {
que:"<p>La <b>programación lineal (PL)</b> encuentra la mejor decisión posible (máxima utilidad, mínimo costo) cuando los recursos son limitados y todas las relaciones son lineales. Se define con <b>variables de decisión</b> (cuánto producir de cada producto), una <b>función objetivo</b> y <b>restricciones</b> (horas de máquina, materia prima, demanda, presupuesto).</p><p>Se usa en mezcla de productos, dietas y mezclas de mineral, planificación de producción, asignación de turnos, transporte, carteras de inversión, planes de cosecha forestal y planificación minera.</p>",
hist:"<p>El matemático soviético <b>Leonid Kantorovich</b> formuló problemas de PL en 1939 para planificar la producción de una fábrica de madera contrachapada. En Estados Unidos, <b>George Dantzig</b> desarrolló el <b>método Simplex</b> en 1947 mientras trabajaba para la Fuerza Aérea en el proyecto SCOOP de planificación logística. John von Neumann formuló ese mismo año la teoría de la dualidad. Kantorovich y Tjalling Koopmans recibieron el Nobel de Economía en 1975 por sus contribuciones a la asignación óptima de recursos. En 1984 Narendra Karmarkar propuso un método de punto interior que resuelve problemas enormes en tiempo polinomial.</p><p>En Chile, el grupo de investigación de operaciones de la Universidad de Chile desarrolló modelos de programación matemática para la planificación forestal y para la programación de los partidos del fútbol profesional (ANFP), casos publicados en la revista <i>Interfaces</i>.</p>",
como:"<p><b>Formulación:</b> Max (o Min) Z = c₁x₁ + c₂x₂ + … sujeto a a<sub>i1</sub>x₁ + a<sub>i2</sub>x₂ + … ≤ (≥, =) b<sub>i</sub> y x<sub>j</sub> ≥ 0.</p><p><b>Método gráfico (2 variables):</b> se dibuja cada restricción como una recta; la región que cumple todas es la región factible, un polígono convexo. El óptimo siempre está en un vértice: se evalúa Z en cada vértice o se desplaza la recta de Z.</p><p><b>Simplex:</b> se agregan variables de holgura (≤), excedente y artificiales (≥, =). El algoritmo se mueve de vértice en vértice mejorando Z hasta que ningún movimiento lo mejora. El método de dos fases primero encuentra un vértice factible y luego optimiza.</p><p><b>Análisis de sensibilidad:</b> el <b>precio sombra</b> (valor dual) de una restricción dice cuánto mejora Z por cada unidad adicional del recurso. Una restricción con holgura tiene precio sombra cero. Los <b>costos reducidos</b> indican cuánto debe mejorar el coeficiente de una variable para que convenga producirla.</p><p><b>Supuestos:</b> proporcionalidad, aditividad, divisibilidad (las variables pueden ser fraccionarias) y certeza en los datos.</p>",
pasos:"<ol><li>Define las variables con unidades claras (unidades por semana).</li><li>Escribe la función objetivo.</li><li>Escribe cada restricción y su lado derecho; revisa unidades.</li><li>Resuelve (esta app, Excel Solver con «Simplex LP», Python con PuLP u OR-Tools).</li><li>Interpreta: valores de las variables, restricciones activas, precios sombra.</li><li>Haz análisis de sensibilidad y comunica la recomendación en lenguaje de negocio.</li></ol>",
caso:"<p><b>Caso clásico (Hillier y Lieberman): Wyndor Glass.</b> Una fábrica de vidrio decide cuántas puertas y ventanas producir con capacidad limitada en tres plantas. La utilidad por lote es 3 y 5 (en miles de dólares) y las restricciones son x₁ ≤ 4, 2x₂ ≤ 12 y 3x₁ + 2x₂ ≤ 18. El óptimo es 2 puertas y 6 ventanas con Z = 36. Las plantas 2 y 3 están saturadas (precios sombra positivos) y la planta 1 tiene capacidad ociosa. Es el ejemplo precargado en la herramienta (con utilidades expresadas en pesos).</p><p><b>Aplicación típica en minería:</b> la mezcla de minerales de distintos frentes para alimentar la planta con una ley y una dureza dentro de rangos, maximizando el cobre fino recuperado, se modela con programación lineal o entera.</p>",
err:"<ul><li>Restricciones con unidades inconsistentes.</li><li>Olvidar restricciones obvias (demanda máxima) y obtener soluciones absurdas.</li><li>Redondear una solución fraccionaria cuando las variables deben ser enteras: puede quedar infactible o lejos del óptimo. Usa programación entera.</li><li>Interpretar el precio sombra fuera de su rango de validez.</li></ul>",
src:["Hillier, F. S., y Lieberman, G. J. (2010). <i>Introducción a la investigación de operaciones</i> (9.ª ed.). McGraw-Hill.", "Taha, H. A. (2012). <i>Investigación de operaciones</i> (9.ª ed.). Pearson.", "Dantzig, G. B. (1963). <i>Linear Programming and Extensions</i>. Princeton University Press.", "Winston, W. L. (2005). <i>Investigación de operaciones: aplicaciones y algoritmos</i> (4.ª ed.). Thomson."]
};
GUIDE["transporte"] = {
que:"<p>El <b>problema de transporte</b> decide cuánto enviar desde cada origen (plantas, bodegas, puertos) a cada destino (clientes, tiendas, faenas) para satisfacer la demanda al menor costo, sin exceder la capacidad de cada origen. Es un caso especial de programación lineal con una estructura que permite métodos de solución muy eficientes.</p>",
hist:"<p>Frank L. Hitchcock lo formuló en 1941 y Tjalling Koopmans lo estudió en 1947 al optimizar el transporte marítimo aliado durante la Segunda Guerra Mundial. El método de aproximación de Vogel (VAM) fue publicado por Reinfeld y Vogel en 1958. Charnes y Cooper desarrollaron el método del cruce del arroyo (stepping stone) en 1954, base del método MODI.</p>",
como:"<ul><li><b>Balanceo:</b> si la oferta total no es igual a la demanda, se agrega un origen o destino ficticio con costo cero.</li><li><b>Solución inicial:</b> esquina noroeste (rápida, ignora costos), costo mínimo o Vogel (calcula penalidades: diferencia entre los dos menores costos de cada fila y columna; asigna donde la penalidad es mayor).</li><li><b>Optimización (MODI):</b> se calculan multiplicadores u<sub>i</sub> + v<sub>j</sub> = c<sub>ij</sub> en las celdas usadas; el costo reducido de las demás es c<sub>ij</sub> − u<sub>i</sub> − v<sub>j</sub>. Si alguno es negativo, se mejora la solución con un ciclo de reasignación.</li><li>Una solución básica tiene m + n − 1 celdas asignadas.</li></ul>",
pasos:"<ol><li>Construye la matriz de costos unitarios (flete por unidad, considerando distancia y tarifa).</li><li>Verifica ofertas y demandas.</li><li>Resuelve y revisa rutas no usadas con costo reducido cercano a cero (alternativas casi óptimas).</li><li>Agrega restricciones reales (capacidad de camiones, rutas prohibidas con costo muy alto).</li></ol>",
caso:"<p><b>Caso tipo: distribución de cemento desde tres plantas a cuatro centros de consumo.</b> La solución de esquina noroeste cuesta notoriamente más que el óptimo, y Vogel queda muy cerca. En la práctica, las empresas de distribución resuelven versiones grandes de este problema (cientos de orígenes y destinos) con software de optimización, agregando costos fijos de apertura de bodegas.</p>",
err:"<ul><li>Olvidar balancear el problema.</li><li>Usar distancias en vez de costos (dos rutas de igual distancia pueden tener tarifas muy distintas).</li><li>No considerar la capacidad del transporte.</li></ul>",
src:["Hitchcock, F. L. (1941). The distribution of a product from several sources to numerous localities. <i>Journal of Mathematics and Physics, 20</i>, 224–230.", "Taha, H. A. (2012). <i>Investigación de operaciones</i>, cap. 5. Pearson.", "Ballou, R. H. (2004). <i>Logística</i>. Pearson."]
};
GUIDE["asignacion"] = {
que:"<p>El <b>problema de asignación</b> empareja recursos con tareas uno a uno: personas con puestos, máquinas con trabajos, camiones con rutas, auditores con sucursales, de modo que el costo o tiempo total sea mínimo (o el beneficio máximo).</p>",
hist:"<p><b>Harold Kuhn</b> publicó el <b>método húngaro</b> en 1955, nombrado en honor a los matemáticos húngaros Dénes Kőnig y Jenő Egerváry, cuyos trabajos de 1931 sobre teoría de grafos eran su base. James Munkres demostró en 1957 que el algoritmo es polinomial.</p>",
como:"<ol><li>Si la matriz no es cuadrada, agrega filas o columnas ficticias con ceros.</li><li>Resta el mínimo de cada fila.</li><li>Resta el mínimo de cada columna.</li><li>Cubre todos los ceros con el menor número de líneas.</li><li>Si el número de líneas es igual al tamaño de la matriz, asigna sobre los ceros. Si no, resta el menor valor no cubierto a los no cubiertos, súmalo en las intersecciones y vuelve al paso 4.</li></ol><p>Para maximizar, transforma la matriz restando cada valor del máximo.</p>",
pasos:"<ol><li>Construye la matriz de costos o tiempos (o puntajes de desempeño).</li><li>Marca con un costo muy alto las asignaciones imposibles.</li><li>Resuelve y verifica que cada fila y columna tenga una sola asignación.</li></ol>",
caso:"<p><b>Caso tipo:</b> asignar cuatro técnicos a cuatro máquinas según su tiempo de reparación histórico. El método húngaro asigna a cada técnico donde es relativamente más eficiente, no necesariamente donde es más rápido en términos absolutos, y el tiempo total baja respecto de la asignación habitual por antigüedad.</p>",
err:"<ul><li>Olvidar transformar la matriz para maximizar.</li><li>No marcar asignaciones prohibidas.</li></ul>",
src:["Kuhn, H. W. (1955). The Hungarian method for the assignment problem. <i>Naval Research Logistics Quarterly, 2</i>, 83–97.", "Hillier, F. S., y Lieberman, G. J. (2010). <i>Introducción a la investigación de operaciones</i>, cap. 8. McGraw-Hill."]
};
GUIDE["cpm"] = {
que:"<p>El <b>método de la ruta crítica (CPM)</b> y la <b>técnica PERT</b> planifican proyectos representando las actividades y sus dependencias como una red. Calculan la duración mínima del proyecto, las fechas más tempranas y más tardías de cada actividad, las holguras y la <b>ruta crítica</b>: la secuencia de actividades sin holgura, cuyo atraso atrasa todo el proyecto.</p><p>Se usa en construcción, montaje industrial, paradas de planta (shutdowns) en minería y celulosa, lanzamientos de productos, implementación de sistemas y organización de eventos.</p>",
hist:"<p>El CPM fue desarrollado en 1957 por <b>Morgan Walker</b> (DuPont) y <b>James Kelley</b> (Remington Rand) para planificar paradas de mantenimiento de plantas químicas. Casi al mismo tiempo, en 1958, la Armada de Estados Unidos creó el <b>PERT</b> con Booz Allen Hamilton y Lockheed para el programa de misiles Polaris, incorporando duraciones inciertas. Antes, Henry Gantt había creado su diagrama de barras (década de 1910) y el polaco Karol Adamiecki su «harmonograma» (1896).</p>",
como:"<ul><li><b>Pasada hacia adelante:</b> IC (inicio más cercano) = máximo TC de las precedentes; TC = IC + duración.</li><li><b>Pasada hacia atrás:</b> TL (término más lejano) = mínimo IL de las sucesoras; IL = TL − duración.</li><li><b>Holgura total</b> = IL − IC. <b>Holgura libre</b> = mínimo IC de las sucesoras − TC.</li><li><b>PERT:</b> te = (a + 4m + b) ÷ 6; σ² = [(b − a) ÷ 6]². La duración del proyecto se aproxima a una normal con media igual a la suma de te de la ruta crítica y varianza igual a la suma de varianzas.</li><li><b>Probabilidad de cumplir el plazo T:</b> z = (T − T<sub>esperado</sub>) ÷ σ.</li><li><b>Compresión (crashing):</b> se acortan actividades críticas empezando por la de menor costo de aceleración por día.</li></ul>",
pasos:"<ol><li>Construye la estructura de desglose del trabajo (EDT) y lista las actividades.</li><li>Define precedencias y duraciones (con los responsables de cada tarea).</li><li>Calcula la red y la ruta crítica.</li><li>Asigna recursos y nivela (dos actividades simultáneas pueden necesitar la misma grúa).</li><li>Controla el avance semanal y actualiza la red.</li></ol>",
caso:"<p><b>Caso tipo: mantención mayor de un molino SAG.</b> En las paradas programadas de una concentradora, cada hora de detención representa una gran pérdida de producción, por eso se planifican al detalle con ruta crítica. Las actividades críticas (por ejemplo, el cambio de revestimientos) reciben más cuadrillas y turnos continuos, mientras las que tienen holgura se programan para no competir por recursos.</p><p><b>Ejemplo de la herramienta:</b> la red de 8 actividades con tres estimaciones calcula la duración esperada y la probabilidad de terminar en 22 semanas.</p>",
err:"<ul><li>Precedencias incompletas (actividades que aparecen sin conexión).</li><li>Ignorar la disponibilidad de recursos.</li><li>Calcular la probabilidad solo con la ruta crítica cuando hay rutas casi críticas.</li><li>No actualizar el programa durante la ejecución.</li></ul>",
src:["Kelley, J. E., y Walker, M. R. (1959). Critical-path planning and scheduling. <i>Proceedings of the Eastern Joint Computer Conference</i>, 160–173.", "Project Management Institute. (2021). <i>Guía de los fundamentos para la dirección de proyectos (PMBOK)</i> (7.ª ed.).", "Taha, H. A. (2012). <i>Investigación de operaciones</i>, cap. 6. Pearson."]
};
GUIDE["decisiones"] = {
que:"<p>La <b>teoría de decisiones</b> ayuda a elegir entre alternativas cuando el resultado depende de un futuro incierto (demanda alta, media o baja; aprobación o rechazo de un permiso). Se distinguen decisiones bajo <b>incertidumbre</b> (no se conocen las probabilidades) y bajo <b>riesgo</b> (se pueden estimar).</p>",
hist:"<p>Pierre-Simon Laplace propuso en el siglo XVIII el principio de razón insuficiente (si no se sabe nada, se asignan probabilidades iguales). John von Neumann y Oskar Morgenstern fundaron la teoría de la utilidad esperada en <i>Theory of Games and Economic Behavior</i> (1944). Abraham Wald (1950) propuso el criterio maximin, Leonard Savage (1951) el del mínimo arrepentimiento y Leonid Hurwicz (1951) el criterio de optimismo ponderado. Howard Raiffa difundió el análisis de decisiones con árboles en <i>Decision Analysis</i> (1968).</p>",
como:"<ul><li><b>Maximax:</b> elige la alternativa con el mejor resultado posible (optimista).</li><li><b>Maximin:</b> elige la que tiene el mejor peor resultado (pesimista).</li><li><b>Hurwicz:</b> α × mejor + (1 − α) × peor.</li><li><b>Laplace:</b> promedio simple de los resultados.</li><li><b>Savage:</b> construye la matriz de arrepentimiento (lo que se deja de ganar por no elegir la mejor alternativa en cada escenario) y minimiza el máximo arrepentimiento.</li><li><b>Valor esperado:</b> Σ p × resultado.</li><li><b>VEIP:</b> valor esperado con información perfecta menos el mejor valor esperado; es el máximo que vale la pena pagar por un estudio.</li></ul><p><b>Árboles de decisión:</b> para decisiones secuenciales (hacer un estudio de mercado, luego decidir el tamaño de planta), se resuelven de derecha a izquierda calculando valores esperados en los nodos de azar y eligiendo el mejor en los nodos de decisión.</p>",
pasos:"<ol><li>Define alternativas y escenarios exhaustivos y excluyentes.</li><li>Estima el resultado de cada combinación.</li><li>Si puedes, estima probabilidades (datos históricos, expertos).</li><li>Aplica varios criterios y analiza si coinciden.</li><li>Calcula el VEIP antes de contratar estudios.</li></ol>",
caso:"<p><b>Caso tipo: tamaño de una nueva planta.</b> La planta grande gana mucho si la demanda es alta pero pierde mucho si es baja. El criterio optimista elige la grande; el pesimista, no invertir o la pequeña. Con probabilidades de 30 %, 50 % y 20 %, el valor esperado favorece a la planta mediana o grande según los montos. Una práctica habitual es optar por una planta modular que pueda ampliarse: es una forma de comprar flexibilidad (opción real).</p>",
err:"<ul><li>Probabilidades que no suman 1.</li><li>Elegir el criterio después de ver cuál da el resultado deseado.</li><li>Ignorar la aversión al riesgo en decisiones únicas y de gran tamaño.</li></ul>",
src:["Raiffa, H. (1968). <i>Decision Analysis</i>. Addison-Wesley.", "von Neumann, J., y Morgenstern, O. (1944). <i>Theory of Games and Economic Behavior</i>. Princeton University Press.", "Taha, H. A. (2012). <i>Investigación de operaciones</i>, cap. 15. Pearson."]
};
GUIDE["ruta-corta"] = {
que:"<p>El <b>problema de la ruta más corta</b> encuentra el camino de menor distancia, tiempo o costo entre dos puntos de una red: rutas de reparto, recorridos dentro de una bodega, cableado, redes de comunicación o secuencias de reemplazo de equipos (que pueden modelarse como redes).</p>",
hist:"<p><b>Edsger W. Dijkstra</b>, científico de la computación holandés, ideó su algoritmo en 1956 en unos veinte minutos mientras tomaba café en Ámsterdam, según contó después, y lo publicó en 1959. Hoy es la base de los algoritmos de navegación en mapas digitales (combinado con heurísticas como A*).</p>",
como:"<ol><li>Asigna distancia 0 al origen e infinito a los demás nodos.</li><li>Elige el nodo no visitado con menor distancia y márcalo como definitivo.</li><li>Actualiza a sus vecinos: si llegar por este nodo es más corto, actualiza su distancia y su predecesor.</li><li>Repite hasta fijar el destino.</li><li>Reconstruye la ruta siguiendo los predecesores.</li></ol><p>Funciona solo con distancias no negativas. Con costos negativos se usa Bellman-Ford.</p>",
pasos:"<ol><li>Representa la red: nodos (cruces, ciudades) y arcos (tramos con su costo).</li><li>Decide si los arcos son de una vía o doble vía.</li><li>Aplica el algoritmo y analiza rutas alternativas.</li></ol>",
caso:"<p><b>Caso tipo:</b> un distribuidor busca la ruta de menor tiempo desde su bodega a un cliente considerando tramos con peajes y congestión. Usando tiempos en hora punta como «distancia», la ruta más corta cambia respecto de la de menor kilometraje. Para repartir a muchos clientes en una misma salida el problema es otro (ruteo de vehículos, VRP), mucho más difícil.</p>",
err:"<ul><li>Usar distancia cuando lo que importa es tiempo o costo.</li><li>Confundir ruta más corta entre dos puntos con el problema del vendedor viajero (visitar todos).</li></ul>",
src:["Dijkstra, E. W. (1959). A note on two problems in connexion with graphs. <i>Numerische Mathematik, 1</i>, 269–271.", "Hillier, F. S., y Lieberman, G. J. (2010). <i>Introducción a la investigación de operaciones</i>, cap. 9. McGraw-Hill."]
};
GUIDE["localizacion"] = {
que:"<p>La <b>localización de instalaciones</b> decide dónde ubicar una planta, bodega, centro de distribución o tienda. El <b>método del centro de gravedad</b> encuentra el punto que minimiza el costo de transporte ponderado por los volúmenes que se mueven hacia o desde cada cliente o proveedor.</p>",
hist:"<p>El economista alemán <b>Alfred Weber</b> planteó en 1909, en <i>Über den Standort der Industrien</i>, el problema de ubicar una industria minimizando costos de transporte de materias primas y productos. Endre Weiszfeld propuso en 1937 un algoritmo iterativo para encontrar el punto que minimiza la suma de distancias ponderadas.</p>",
como:"<ul><li><b>Centro de gravedad:</b> C<sub>x</sub> = Σ(x<sub>i</sub>V<sub>i</sub>) ÷ ΣV<sub>i</sub>; C<sub>y</sub> = Σ(y<sub>i</sub>V<sub>i</sub>) ÷ ΣV<sub>i</sub>.</li><li><b>Weiszfeld:</b> mejora iterativa que minimiza Σ V<sub>i</sub> × distancia<sub>i</sub>.</li><li>El resultado es un punto de partida: luego se buscan terrenos reales cercanos y se evalúan con factores cualitativos.</li></ul>",
pasos:"<ol><li>Ubica clientes y proveedores en coordenadas (pueden ser latitud y longitud o un plano en km).</li><li>Asigna volúmenes anuales.</li><li>Calcula el centro y el óptimo euclidiano.</li><li>Busca alternativas reales cercanas y evalúalas con factores ponderados y costos de terreno.</li></ol>",
caso:"<p><b>Caso tipo: centro de distribución para la zona central.</b> Con volúmenes concentrados en Santiago y destinos hacia la costa y el sur, el centro de gravedad queda cerca de la capital, en dirección a los destinos de mayor volumen. Es coherente con la concentración de centros de distribución en comunas periféricas de Santiago con acceso a autopistas, como Pudahuel, Quilicura, Lampa o San Bernardo.</p>",
err:"<ul><li>Usar distancias en línea recta cuando la red vial es muy distinta.</li><li>Ignorar costos de terreno, permisos y mano de obra.</li></ul>",
src:["Weber, A. (1909). <i>Über den Standort der Industrien</i>. Mohr.", "Chopra, S., y Meindl, P. (2013). <i>Administración de la cadena de suministro</i>, cap. 5. Pearson.", "Heizer, J., y Render, B. (2014). <i>Principios de administración de operaciones</i>, cap. 8. Pearson."]
};
GUIDE["factores"] = {
que:"<p>La <b>evaluación por factores ponderados</b> (o matriz de decisión multicriterio) compara alternativas según varios criterios con distinta importancia: costo, calidad, plazo, riesgo, impacto ambiental, cercanía. Se usa para elegir localizaciones, proveedores, software, proyectos de mejora o candidatos.</p>",
hist:"<p>El modelo de suma ponderada es la forma más simple de la teoría de decisión multiatributo, formalizada por Ralph Keeney y Howard Raiffa en <i>Decisions with Multiple Objectives</i> (1976). Thomas Saaty propuso el <b>proceso analítico jerárquico (AHP)</b> en los años setenta para derivar los pesos con comparaciones por pares.</p>",
como:"<ol><li>Define los criterios y asigna pesos (que sumen 100 %).</li><li>Califica cada alternativa en cada criterio con una escala común (1 a 10).</li><li>Puntaje = Σ peso × nota.</li><li>Ordena y analiza la sensibilidad a los pesos.</li></ol><p>Los criterios eliminatorios (por ejemplo, permiso ambiental) se aplican antes, como filtro, no como un factor más.</p>",
pasos:"<ol><li>Define los criterios con los interesados.</li><li>Pondera con votación o AHP.</li><li>Califica con datos cuando sea posible (no solo opinión).</li><li>Calcula y prueba escenarios de pesos.</li><li>Documenta la decisión.</li></ol>",
caso:"<p><b>Caso tipo: elegir comuna para una bodega.</b> Con los pesos del ejemplo, la alternativa con mejor acceso y cercanía a clientes supera a la de terreno más barato. Si se aumenta el peso del costo del terreno, el orden puede cambiar: ese análisis de sensibilidad es lo que el comité necesita ver.</p>",
err:"<ul><li>Pesos definidos después de ver los resultados.</li><li>Criterios redundantes que cuentan dos veces lo mismo.</li><li>Notas sin respaldo.</li></ul>",
src:["Keeney, R. L., y Raiffa, H. (1976). <i>Decisions with Multiple Objectives</i>. Wiley.", "Saaty, T. L. (1980). <i>The Analytic Hierarchy Process</i>. McGraw-Hill.", "Krajewski, L., Ritzman, L., y Malhotra, M. (2013). <i>Administración de operaciones</i> (10.ª ed.). Pearson."]
};
GUIDE["simulacion-mc"] = {
que:"<p>La <b>simulación Monte Carlo</b> estudia el riesgo de una decisión repitiendo miles de veces el cálculo con valores al azar para las variables inciertas (precio, demanda, costos). En vez de un único VAN, entrega una distribución de resultados y la probabilidad de perder dinero.</p>",
hist:"<p>Fue desarrollada en 1946 por <b>Stanisław Ulam</b> y <b>John von Neumann</b> en Los Álamos para estudiar la difusión de neutrones; Nicholas Metropolis le dio el nombre del casino de Mónaco. Metropolis y Ulam publicaron el método en 1949. David Hertz la llevó a la evaluación de inversiones en el artículo «Risk analysis in capital investment» (<i>Harvard Business Review</i>, 1964).</p>",
como:"<ul><li>Se define una distribución para cada variable incierta: triangular (mínimo, más probable, máximo), normal, uniforme, etc.</li><li>En cada iteración se sortean valores y se calcula el resultado (VAN).</li><li>Con miles de iteraciones se obtiene la distribución: media, desviación, percentiles y probabilidad de VAN negativo.</li><li>La triangular se muestrea por transformada inversa.</li></ul>",
pasos:"<ol><li>Construye el modelo determinístico (flujo de caja).</li><li>Identifica las 3 a 5 variables más inciertas (análisis de sensibilidad).</li><li>Define sus distribuciones con datos o con expertos.</li><li>Simula (esta app, Excel con ALEATORIO, @Risk, Crystal Ball o Python).</li><li>Informa probabilidad de pérdida y rango P5–P95.</li></ol>",
caso:"<p><b>Caso tipo: proyecto agroindustrial.</b> El VAN determinístico es positivo, pero la simulación muestra una probabilidad apreciable de VAN negativo por la variabilidad del precio de exportación. El directorio decide avanzar solo con contratos de venta a precio fijo para una parte de la producción, lo que reduce la dispersión del VAN.</p>",
err:"<ul><li>Suponer independencia entre variables correlacionadas (precio y cantidad suelen moverse en direcciones opuestas).</li><li>Distribuciones sin respaldo (basura que entra, basura que sale).</li><li>Muy pocas iteraciones.</li></ul>",
src:["Metropolis, N., y Ulam, S. (1949). The Monte Carlo method. <i>Journal of the American Statistical Association, 44</i>(247), 335–341.", "Hertz, D. B. (1964). Risk analysis in capital investment. <i>Harvard Business Review, 42</i>(1), 95–106.", "Law, A. M. (2015). <i>Simulation Modeling and Analysis</i> (5th ed.). McGraw-Hill."]
};
GUIDE["iper"] = {
que:"<p>La <b>matriz IPER</b> (identificación de peligros y evaluación de riesgos) es el documento base de la prevención de riesgos: lista las tareas, sus peligros, evalúa cada riesgo según su probabilidad y consecuencia, y define las medidas de control. Un <b>peligro</b> es una fuente de daño (energía eléctrica, altura, ruido); el <b>riesgo</b> combina la probabilidad de que ocurra el daño con su gravedad.</p>",
hist:"<p>Herbert W. Heinrich publicó en 1931 <i>Industrial Accident Prevention</i>, con su famosa pirámide (por cada accidente grave hay muchos leves e incidentes) y la teoría del dominó. Frank Bird actualizó la pirámide en 1969 a partir de más de un millón y medio de accidentes. Las matrices de riesgo se difundieron con las normas OHSAS 18001 (1999) e ISO 45001 (2018). En Chile, el <b>Decreto Supremo 44</b> del Ministerio del Trabajo (publicado en 2024 y vigente desde 2025) exige a las empresas contar con una matriz de identificación de peligros y evaluación de riesgos, un programa de trabajo preventivo e informar los riesgos a los trabajadores; reemplazó al DS 40 de 1969.</p>",
como:"<ul><li><b>Matriz 3×3 tradicional (usada por mutualidades chilenas):</b> probabilidad baja (1), media (2), alta (4) × consecuencia ligeramente dañina (1), dañina (2), extremadamente dañina (4).</li><li><b>VEP</b> (valor esperado de la pérdida) = P × C: 1–2 tolerable, 4 moderado, 8 importante, 16 intolerable.</li><li>Otras matrices usan escalas 5×5; lo importante es usar criterios documentados y consistentes.</li><li><b>Jerarquía de controles:</b> eliminación, sustitución, controles de ingeniería, controles administrativos y elementos de protección personal.</li><li>Se evalúa el riesgo puro y el residual (después de los controles).</li></ul>",
pasos:"<ol><li>Lista procesos y tareas (rutinarias y no rutinarias).</li><li>Identifica peligros con los trabajadores en terreno.</li><li>Evalúa P y C con criterios escritos.</li><li>Define controles según la jerarquía y asigna responsables.</li><li>Revisa la matriz ante cambios, accidentes o al menos una vez al año.</li></ol>",
caso:"<p><b>Caso tipo: bodega de una distribuidora.</b> El trabajo en altura sobre racks sin línea de vida resulta intolerable. Se elimina subir a los racks usando una plataforma elevadora (control de ingeniería), se exige permiso de trabajo (administrativo) y se usa arnés (EPP). El manejo manual de sacos de 25 kg se reduce con un alza-sacos y rotación de tareas.</p>",
err:"<ul><li>Hacer la matriz en la oficina sin participación de los trabajadores.</li><li>Quedarse en el EPP como única medida.</li><li>No incluir tareas no rutinarias (mantención, limpieza), donde ocurren muchos accidentes graves.</li></ul>",
src:["Decreto Supremo N.º 44 (2024). Aprueba nuevo reglamento sobre gestión preventiva de los riesgos laborales para un entorno de trabajo seguro y saludable. Ministerio del Trabajo y Previsión Social.", "ISO 45001:2018. Sistemas de gestión de la seguridad y salud en el trabajo.", "Heinrich, H. W. (1931). <i>Industrial Accident Prevention</i>. McGraw-Hill.", "Bird, F. E., y Germain, G. L. (1985). <i>Practical Loss Control Leadership</i>. International Loss Control Institute."]
};
GUIDE["accidentabilidad"] = {
que:"<p>Los <b>indicadores de accidentabilidad</b> miden el desempeño en seguridad de una empresa: cuántos trabajadores se accidentan (tasa de accidentabilidad), cuántos días se pierden (tasa de siniestralidad), con qué frecuencia ocurren accidentes por horas trabajadas (índice de frecuencia) y su gravedad (índice de gravedad). En Chile definen además la <b>cotización adicional diferenciada</b> del seguro de la Ley 16.744.</p>",
hist:"<p>La <b>Ley 16.744</b>, promulgada en 1968 durante el gobierno de Eduardo Frei Montalva, creó el seguro social obligatorio contra accidentes del trabajo y enfermedades profesionales, administrado por las mutualidades de empleadores (ACHS, Mutual de Seguridad de la CChC, IST) y por el Instituto de Seguridad Laboral. El <b>DS 67</b> (1999) regula la cotización adicional según la siniestralidad. Los índices de frecuencia y gravedad por millón de horas provienen de normas estadounidenses (ANSI Z16.1, 1937) y de recomendaciones de la OIT.</p>",
como:"<ul><li><b>Tasa de accidentabilidad</b> = accidentes con tiempo perdido ÷ promedio de trabajadores × 100.</li><li><b>Tasa de siniestralidad temporal</b> = días perdidos ÷ promedio de trabajadores × 100.</li><li><b>Índice de frecuencia</b> = accidentes × 1.000.000 ÷ horas hombre trabajadas.</li><li><b>Índice de gravedad</b> = días perdidos × 1.000.000 ÷ HHT.</li><li><b>Cotización:</b> básica de 0,90 % más una adicional que va de 0 % a 6,8 % según la tasa de siniestralidad total (temporal más invalideces y muertes), evaluada con el promedio de tres períodos anuales.</li></ul>",
pasos:"<ol><li>Registra cada accidente y sus días perdidos (certificados del organismo administrador).</li><li>Calcula el promedio mensual de trabajadores y las HHT reales.</li><li>Calcula los indicadores mensuales y acumulados móviles de 12 meses.</li><li>Compara con la industria (estadísticas de la Superintendencia de Seguridad Social, SUSESO).</li><li>Analiza las causas y prioriza acciones.</li></ol>",
caso:"<p><b>Caso tipo:</b> una empresa de 250 trabajadores con 9 accidentes con tiempo perdido tiene una tasa de accidentabilidad de 3,6 %. Si los días perdidos suben por accidentes más graves, su tasa de siniestralidad puede pasar al tramo con cotización adicional, lo que encarece la planilla de remuneraciones. Este costo, sumado a los costos indirectos (reemplazos, horas extra, daños), suele justificar inversiones en prevención.</p>",
err:"<ul><li>Celebrar «cero accidentes» sin medir incidentes y casi accidentes (indicadores adelantados).</li><li>Comparar tasas de empresas con jornadas muy distintas (usa índices por HHT).</li><li>Presionar para no denunciar accidentes, lo que es ilegal y oculta los riesgos.</li></ul>",
src:["Ley 16.744 (1968). Establece normas sobre accidentes del trabajo y enfermedades profesionales. Biblioteca del Congreso Nacional.", "Decreto Supremo N.º 67 (1999). Ministerio del Trabajo y Previsión Social.", "Superintendencia de Seguridad Social (SUSESO). Informes anuales de estadísticas de seguridad social (suseso.cl)."]
};
GUIDE["niosh"] = {
que:"<p>La <b>ecuación revisada de NIOSH</b> calcula el <b>límite de peso recomendado (LPR)</b> para una tarea de levantamiento manual, considerando la postura, la distancia, la altura, el giro del tronco, la frecuencia y el agarre. El <b>índice de levantamiento</b> (peso real ÷ LPR) indica el nivel de riesgo de lesión lumbar.</p>",
hist:"<p>El Instituto Nacional de Seguridad y Salud Ocupacional de Estados Unidos (NIOSH) publicó su primera guía en 1981 y la ecuación revisada en 1991 (Waters, Putz-Anderson, Garg y Fine, 1993); el manual de aplicación se publicó en 1994. En Chile, la Ley 20.001 de 2005 («ley del saco») limitó la carga manual a 50 kg y la <b>Ley 20.949</b> de 2016 la bajó a 25 kg para hombres, y a 20 kg para mujeres y menores de 18 años. La Guía Técnica para la Evaluación y Control de los Riesgos Asociados al Manejo o Manipulación Manual de Carga del Ministerio del Trabajo detalla los métodos de evaluación.</p>",
como:"<p>LPR = 23 kg × HM × VM × DM × AM × FM × CM.</p><ul><li><b>HM</b> (horizontal) = 25 ÷ H: alejar la carga del cuerpo aumenta mucho la carga sobre la columna.</li><li><b>VM</b> (vertical) = 1 − 0,003 |V − 75|: lo ideal es tomar la carga a la altura de los nudillos.</li><li><b>DM</b> (desplazamiento) = 0,82 + 4,5 ÷ D.</li><li><b>AM</b> (asimetría) = 1 − 0,0032 A.</li><li><b>FM</b> (frecuencia) y <b>CM</b> (agarre): de tablas.</li><li>IL ≤ 1: aceptable para la mayoría; 1 a 3: riesgo moderado; &gt; 3: alto.</li></ul>",
pasos:"<ol><li>Observa y filma la tarea; mide H, V, D y A al inicio y al final del levantamiento.</li><li>Registra la frecuencia y la duración.</li><li>Calcula LPR e IL en el origen y el destino (usa el peor).</li><li>Rediseña: acercar la carga, subir la altura de toma, reducir el peso por unidad, usar ayudas mecánicas.</li></ol>",
caso:"<p><b>Caso tipo: paletizado manual de cajas de 18 kg.</b> El IL resultó mayor que 1 porque las cajas se tomaban del piso y con giro del tronco. Se instaló una mesa elevadora que mantiene la carga a la altura de los nudillos y se reubicó el pallet para eliminar el giro: el IL bajó de forma importante sin cambiar el producto.</p>",
err:"<ul><li>Evaluar solo el peso y no la postura.</li><li>Aplicar la ecuación a tareas de empuje, arrastre o transporte (requieren otros métodos, como las tablas de Snook y Ciriello).</li><li>No evaluar tanto el origen como el destino.</li></ul>",
src:["Waters, T. R., Putz-Anderson, V., y Garg, A. (1994). <i>Applications Manual for the Revised NIOSH Lifting Equation</i> (DHHS NIOSH Publication 94-110).", "Waters, T. R., Putz-Anderson, V., Garg, A., y Fine, L. J. (1993). Revised NIOSH equation for the design and evaluation of manual lifting tasks. <i>Ergonomics, 36</i>(7), 749–776.", "Ley 20.949 (2016). Modifica el Código del Trabajo para reducir el peso de las cargas de manipulación manual. BCN.", "Ministerio del Trabajo y Previsión Social. Guía técnica para la evaluación y control de los riesgos asociados al manejo o manipulación manual de carga."]
};
GUIDE["ruido"] = {
que:"<p>La <b>dosis de ruido</b> expresa qué fracción de la exposición máxima permitida recibió un trabajador durante la jornada. Una dosis de 100 % equivale a 85 dB(A) durante 8 horas. La exposición prolongada sobre ese nivel causa hipoacusia sensorioneural, una enfermedad profesional irreversible y una de las más frecuentes en Chile.</p>",
hist:"<p>El <b>DS 594</b> del Ministerio de Salud (1999) fija los límites de exposición a ruido en los lugares de trabajo. En 2011 el Ministerio de Salud aprobó el <b>Protocolo de Exposición Ocupacional a Ruido (PREXOR)</b>, que define cómo evaluar, vigilar la salud auditiva y controlar el ruido. El principio de igual energía con tasa de intercambio de 3 dB es el recomendado internacionalmente; la agencia estadounidense OSHA usa 5 dB por razones históricas.</p>",
como:"<ul><li>Tiempo permitido a un nivel L: T = 8 h ÷ 2<sup>(L − 85) ÷ 3</sup>. A 88 dB(A) se permiten 4 h; a 91, 2 h; a 94, 1 h.</li><li>Dosis = Σ (tiempo expuesto ÷ tiempo permitido).</li><li>NPSeq,8h = 10 log₁₀[Σ t<sub>i</sub> 10<sup>L<sub>i</sub>/10</sup> ÷ 8].</li><li>Nivel de acción (PREXOR): dosis ≥ 50 %, equivalente a 82 dB(A) en 8 h; el trabajador ingresa a vigilancia con audiometrías.</li><li>Ruido impulsivo: máximo 140 dB(C) peak.</li></ul>",
pasos:"<ol><li>Mide con sonómetro integrador o dosímetro según PREXOR.</li><li>Identifica tareas y tiempos de exposición.</li><li>Calcula la dosis y el nivel equivalente.</li><li>Controla en la fuente (encierros, silenciadores, mantención), en el medio (barreras, absorción) y, al final, con protectores auditivos.</li></ol>",
caso:"<p><b>Caso tipo: taller metalmecánico.</b> Con 1,5 h de esmerilado a 94 dB(A) más 3 h junto a una prensa de 88 dB(A), la dosis supera el 100 % aunque el resto del turno sea en oficina. Un encierro acústico para la prensa y la rotación del esmerilado entre más personas bajan la dosis bajo el límite.</p>",
err:"<ul><li>Promediar decibeles aritméticamente (la escala es logarítmica).</li><li>Confiar solo en los protectores auditivos.</li><li>Medir en un día de baja producción.</li></ul>",
src:["Decreto Supremo N.º 594 (1999). Reglamento sobre condiciones sanitarias y ambientales básicas en los lugares de trabajo. Ministerio de Salud.", "Ministerio de Salud. (2011). Protocolo sobre normas mínimas para el desarrollo de programas de vigilancia de la pérdida auditiva por exposición a ruido en los lugares de trabajo (PREXOR).", "Instituto de Salud Pública de Chile. Guía para la aplicación del DS 594 en ruido (ispch.cl)."]
};
GUIDE["huella"] = {
que:"<p>La <b>huella de carbono</b> cuantifica las emisiones de gases de efecto invernadero (GEI) de una organización o producto, expresadas en toneladas de CO₂ equivalente. El <b>alcance 1</b> son las emisiones directas (combustibles quemados en la empresa); el <b>alcance 2</b>, las indirectas por la electricidad comprada; el <b>alcance 3</b>, el resto de la cadena de valor (proveedores, transporte de terceros, uso del producto).</p>",
