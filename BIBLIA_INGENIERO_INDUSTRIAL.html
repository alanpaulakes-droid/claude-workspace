GUIDE["van-tir"] = {
que:"<p>El <b>Valor Actual Neto (VAN)</b> mide cuánta riqueza crea un proyecto, expresada en dinero de hoy. Se obtiene trayendo al presente todos los flujos de caja futuros con una tasa de descuento que representa lo que el inversionista podría ganar en otra alternativa de riesgo parecido (su costo de oportunidad) y restando la inversión inicial.</p><p>La <b>Tasa Interna de Retorno (TIR)</b> es la rentabilidad propia del proyecto: la tasa de descuento que hace que el VAN sea exactamente cero. El <b>Período de Recuperación de la Inversión (PRI)</b> indica cuánto tiempo pasa hasta que los flujos acumulados devuelven lo invertido.</p><p>Son los tres indicadores más usados para decidir inversiones: comprar una máquina, abrir una sucursal, automatizar una línea, lanzar un producto o comparar ofertas de proveedores con distintos plazos de pago. En la práctica profesional chilena aparecen en todo estudio de prefactibilidad y factibilidad, en los comités de inversión de las empresas y en la evaluación social de proyectos del Sistema Nacional de Inversiones (SNI).</p><p><b>Por qué se usa el VAN y no simplemente la suma de flujos:</b> porque el dinero tiene valor en el tiempo. Un millón de pesos hoy vale más que un millón dentro de cinco años, ya que hoy se puede invertir, porque existe inflación y porque el futuro es incierto. El VAN corrige esa diferencia y permite comparar flujos que ocurren en distintos momentos.</p>",
hist:"<p>La idea de descontar flujos futuros es antigua: Leonardo de Pisa (Fibonacci) ya resolvía problemas de valor presente en el <i>Liber Abaci</i> (1202). La teoría moderna se debe al economista estadounidense <b>Irving Fisher</b>, que en <i>The Rate of Interest</i> (1907) y <i>The Theory of Interest</i> (1930) formuló el principio de que una inversión debe evaluarse por el valor presente de sus ingresos netos. En 1936 John Maynard Keynes definió la «eficiencia marginal del capital», concepto equivalente a la TIR.</p><p>En las empresas estos métodos se difundieron después de la Segunda Guerra Mundial. El libro <i>Capital Budgeting</i> de Joel Dean (1951) llevó el flujo de caja descontado a la gestión corporativa, y en las décadas de 1960 y 1970 se convirtió en la práctica estándar de las grandes compañías. En Chile, la obra de Nassir y Reinaldo Sapag Chain, <i>Preparación y evaluación de proyectos</i> (primera edición en 1985), se transformó en el texto de referencia de las carreras de ingeniería.</p>",
como:"<p><b>Fórmula del VAN:</b> VAN = Σ F<sub>t</sub> ÷ (1 + r)<sup>t</sup>, sumando desde t = 0 hasta n.</p><ul><li><b>F<sub>t</sub></b>: flujo neto de caja del período t (ingresos menos egresos efectivos). F<sub>0</sub> suele ser la inversión, con signo negativo.</li><li><b>r</b>: tasa de descuento por período. Para una empresa suele ser el WACC; para un inversionista individual, su rentabilidad exigida (TMAR).</li><li><b>(1 + r)<sup>t</sup></b>: factor que convierte un peso del período t en pesos de hoy.</li></ul><p><b>Regla de decisión:</b> VAN &gt; 0 se acepta (el proyecto paga la inversión, la rentabilidad exigida y además deja un excedente); VAN &lt; 0 se rechaza; VAN = 0 es indiferente (rinde justo lo exigido).</p><p><b>TIR:</b> no tiene fórmula cerrada. Se busca por prueba y error la tasa que cumple 0 = Σ F<sub>t</sub> ÷ (1 + TIR)<sup>t</sup>. Esta app usa el método de bisección; Excel usa iteración de Newton con la función TIR. Se acepta el proyecto si TIR ≥ r.</p><p><b>PRI simple:</b> se acumulan los flujos y se interpola dentro del año en que el acumulado pasa de negativo a positivo. El <b>PRI descontado</b> hace lo mismo con los flujos ya traídos a valor presente, por lo que siempre es mayor o igual.</p><p><b>IVAN</b> (VAN ÷ inversión) sirve para ordenar proyectos cuando el capital es limitado: indica cuánto VAN genera cada peso invertido. La <b>razón beneficio/costo</b> compara el valor presente de los beneficios con el de los costos; es mayor que 1 cuando el VAN es positivo.</p>",
pasos:"<ol><li><b>Define el horizonte</b>: normalmente la vida útil del activo principal o 5 a 10 años. Más allá, agrega un valor de desecho.</li><li><b>Construye el flujo de caja incremental</b>: solo lo que cambia por hacer el proyecto. Usa la herramienta «Flujo de caja de un proyecto» para incluir impuestos, depreciación y capital de trabajo.</li><li><b>Elige la tasa</b>: WACC de la empresa, tasa exigida por el inversionista o tasa social (en Chile la publica el Ministerio de Desarrollo Social para proyectos públicos).</li><li><b>Calcula VAN, TIR y PRI</b>. En Excel: =VNA(tasa; F1:Fn) + F0 (ojo: VNA no incluye el año 0) y =TIR(F0:Fn).</li><li><b>Sensibiliza</b>: cambia precio, cantidad, costos y tasa en ±10 % y ±20 % para ver qué variable hace cambiar la decisión. Complementa con la herramienta de simulación Monte Carlo.</li><li><b>Decide y comunica</b>: presenta el VAN como cifra principal, la TIR como apoyo y el PRI como medida de riesgo y liquidez.</li></ol>",
caso:"<p><b>Caso tipo: automatización de una línea de embalaje.</b> Una empresa de alimentos del Maule evalúa reemplazar el embalaje manual por una encajonadora automática que cuesta $ 1.000 millones. Ahorra mano de obra, reduce mermas y permite aumentar la producción, con flujos netos estimados de $ 280, 320, 350, 380 y 300 millones en los años 1 a 5. El directorio exige 12 % anual.</p><p>Con esos datos (los mismos del ejemplo de la herramienta), el VAN es positivo, cercano a $ 166 millones, y la TIR ronda 18 %. La inversión se recupera en poco más de 3 años en términos simples y en unos 4 años en términos descontados. Conclusión para el informe: <i>«El proyecto crea valor a la tasa exigida, con un margen de seguridad de unos seis puntos entre la TIR y la tasa de descuento. Si los flujos netos resultaran más de un 14 % inferiores a lo proyectado, el VAN sería negativo»</i> (la última afirmación se obtiene sensibilizando, no de los indicadores por sí solos).</p><p><b>Ejemplo histórico:</b> el análisis de flujos descontados es el que usan las empresas mineras para decidir si abren una nueva fase de una mina. Por eso el precio de largo plazo del cobre que se supone en la evaluación es tan importante: con flujos a 20 o 30 años, pequeños cambios en precio o en tasa cambian el VAN en miles de millones de dólares.</p>",
err:"<ul><li><b>Incluir costos hundidos</b>, como un estudio ya pagado. Lo gastado no cambia con la decisión.</li><li><b>Mezclar flujos nominales con tasa real</b> o al revés. Si los flujos incluyen inflación, la tasa también debe incluirla.</li><li><b>Restar la depreciación como si fuera un egreso de caja.</b> Solo afecta el impuesto.</li><li><b>Elegir entre proyectos excluyentes por TIR.</b> Un proyecto pequeño puede tener mayor TIR y menor VAN. Para excluyentes manda el VAN.</li><li><b>TIR múltiples</b>: si el flujo cambia de signo más de una vez (por ejemplo, un cierre de faena con costos al final) puede haber varias TIR o ninguna. Usa el VAN.</li><li><b>Olvidar el capital de trabajo</b> y su recuperación al final.</li><li><b>Usar el PRI como criterio único</b>: ignora todo lo que ocurre después de recuperar la inversión.</li></ul>",
src:["Sapag Chain, N., Sapag Chain, R., y Sapag Puelma, J. M. (2014). <i>Preparación y evaluación de proyectos</i> (6.ª ed.). McGraw-Hill.", "Blank, L., y Tarquin, A. (2012). <i>Ingeniería económica</i> (7.ª ed.). McGraw-Hill.", "Brealey, R., Myers, S., y Allen, F. (2020). <i>Principios de finanzas corporativas</i> (13.ª ed.). McGraw-Hill.", "Fisher, I. (1930). <i>The Theory of Interest</i>. Macmillan.", "Dean, J. (1951). <i>Capital Budgeting</i>. Columbia University Press.", "Ministerio de Desarrollo Social y Familia. Precios sociales y metodologías del Sistema Nacional de Inversiones (sitio web del SNI)."]
};
GUIDE["flujo-caja"] = {
que:"<p>El <b>flujo de caja de un proyecto</b> es la proyección ordenada, año por año, de todo el dinero que entra y sale por causa del proyecto. Es la base de la evaluación económica: el VAN y la TIR solo son tan buenos como el flujo que se descuenta.</p><p>Se distinguen tres tipos: el <b>flujo puro</b> (o del proyecto), que supone que todo se financia con capital propio y mide la rentabilidad del negocio en sí; el <b>flujo del inversionista</b>, que incorpora el préstamo, los intereses y la amortización de la deuda; y el <b>flujo social</b>, usado en proyectos públicos, que valora beneficios y costos para el país con precios sociales.</p><p>Sirve para responder preguntas como: ¿conviene abrir una nueva planta?, ¿arrendar o comprar camiones?, ¿cuánto capital de trabajo necesito?, ¿qué pasa con la rentabilidad si el precio del producto baja 10 %?</p>",
hist:"<p>El estado de flujos de efectivo como reporte contable se hizo obligatorio en Estados Unidos con la norma SFAS 95 (1987) y hoy es parte de las normas internacionales (NIC 7, adoptada en Chile con la convergencia a IFRS desde 2009). En evaluación de proyectos, la estructura usada en las universidades chilenas viene de la escuela de Nassir Sapag, que ordenó el flujo en cinco etapas para no olvidar ningún efecto tributario. En el sector público, la metodología del Sistema Nacional de Inversiones (creado a mediados de los años setenta en ODEPLAN, hoy Ministerio de Desarrollo Social) estandarizó cómo evaluar socialmente hospitales, caminos o colegios.</p>",
como:"<p><b>Estructura en cinco etapas (Sapag):</b></p><ol><li><b>Ingresos y egresos afectos a impuesto</b>: ventas, costos variables, costos fijos, gastos de administración y ventas, venta de activos.</li><li><b>Gastos no desembolsables</b>: depreciación, amortización de intangibles, valor libro de los activos vendidos. Se restan porque reducen la base del impuesto.</li><li><b>Cálculo del impuesto</b>: tasa de impuesto a la renta sobre la utilidad antes de impuesto. En Chile, el régimen general de primera categoría es 27 %; el régimen Pro Pyme tiene una tasa menor (revisa la vigente en el SII). Si hay pérdida, se arrastra a los años siguientes.</li><li><b>Ajuste por gastos no desembolsables</b>: se vuelven a sumar la depreciación y el valor libro, porque no son salidas de dinero.</li><li><b>Costos y beneficios no afectos a impuesto</b>: inversión inicial, capital de trabajo (inversión y recuperación) y valor de desecho.</li></ol><p><b>Capital de trabajo</b>: dinero inmovilizado para operar (inventarios, cuentas por cobrar menos cuentas por pagar). Métodos: contable, período de desfase (costo diario × días de desfase) o déficit acumulado máximo.</p><p><b>Valor de desecho</b>: lo que vale el proyecto al final del horizonte. Métodos: contable (valor libro), comercial (precio de venta de los activos menos el impuesto a la ganancia) o económico (flujo perpetuo: flujo normal ÷ tasa).</p>",
pasos:"<ol><li>Lista todos los ingresos y costos que cambian con el proyecto (enfoque incremental).</li><li>Proyecta las cantidades (estudio de mercado) y los precios (en moneda constante o nominal, pero de forma coherente).</li><li>Calcula la depreciación con las vidas útiles tributarias del SII.</li><li>Arma el flujo con las cinco etapas en una planilla, un año por columna.</li><li>Calcula VAN, TIR y PRI.</li><li>Haz análisis de sensibilidad y escenarios (pesimista, base, optimista).</li><li>Si hay financiamiento, construye el flujo del inversionista y compáralo con el puro: la diferencia muestra el efecto del apalancamiento y del ahorro tributario de los intereses.</li></ol>",
caso:"<p><b>Caso tipo: nueva línea de producción de envases.</b> Inversión en maquinaria de $ 120 millones, capital de trabajo de $ 15 millones, ventas iniciales de $ 95 millones que crecen 5 % al año, costos variables de 42 % de las ventas, costos fijos de $ 18 millones, vida útil contable de 8 años, venta de los equipos al año 6 en $ 35 millones e impuesto de 27 %. Con estos datos (los del ejemplo de la herramienta) la línea es rentable a una tasa de 12 %. Observa en la tabla cómo la venta del activo genera una ganancia tributable (venta menos valor libro) y cómo el capital de trabajo vuelve al final.</p><p><b>Lectura profesional:</b> antes de presentar, pregúntate qué supuesto es más incierto. En este tipo de proyectos suele ser la velocidad con que se llena la capacidad (curva de ventas). Un año de retraso en alcanzar las ventas proyectadas puede reducir el VAN a la mitad.</p>",
err:"<ul><li>Olvidar el capital de trabajo o no recuperarlo al final.</li><li>Calcular el impuesto sobre el flujo en vez de sobre la utilidad contable.</li><li>No considerar que el valor de desecho comercial paga impuesto sobre la ganancia.</li><li>Incluir intereses en el flujo puro (van solo en el del inversionista).</li><li>Usar vidas útiles inventadas en vez de las tablas del SII.</li><li>Proyectar crecimientos constantes sin justificarlos con el estudio de mercado.</li></ul>",
src:["Sapag Chain, N., Sapag Chain, R., y Sapag Puelma, J. M. (2014). <i>Preparación y evaluación de proyectos</i> (6.ª ed.). McGraw-Hill.", "Fontaine, E. (2008). <i>Evaluación social de proyectos</i> (13.ª ed.). Pearson.", "Servicio de Impuestos Internos. Tabla de vidas útiles de los bienes físicos del activo inmovilizado (sii.cl).", "Ministerio de Desarrollo Social y Familia. Metodología general de preparación y evaluación de proyectos (SNI)."]
};
GUIDE["equivalencias"] = {
que:"<p>Las <b>equivalencias financieras</b> permiten mover dinero en el tiempo: saber cuánto vale hoy un pago futuro, qué cuota mensual equivale a un monto actual o cuánto se acumula ahorrando una cantidad fija. Se basan en cuatro tipos de flujo: valor presente (P), valor futuro (F), serie uniforme o anualidad (A) y gradiente aritmético (G).</p><p>Se usan para calcular cuotas de créditos, comparar formas de pago de un proveedor («¿pago contado o en 12 cuotas?»), convertir costos de mantención crecientes en un costo anual o valorizar un contrato de arriendo.</p>",
hist:"<p>Las tablas de interés compuesto aparecen en Europa en el siglo XVII: Richard Witt publicó en 1613 <i>Arithmeticall Questions</i>, con tablas para préstamos y anualidades. Jacob Bernoulli, estudiando la capitalización continua en 1683, llegó al número e. La ingeniería económica como disciplina nace con Arthur M. Wellington, ingeniero ferroviario que en <i>The Economic Theory of the Location of Railways</i> (1887) mostró que el trazado de una línea férrea debía decidirse comparando costos en el tiempo. Eugene Grant sistematizó los factores P/F/A en <i>Principles of Engineering Economy</i> (1930), libro que dio forma a los cursos que se enseñan hasta hoy.</p>",
como:"<p><b>Supuestos:</b> interés compuesto, tasa constante por período, flujos al final de cada período (convención de fin de período).</p><ul><li>(F/P, i, n) = (1 + i)<sup>n</sup>: cuánto crece hoy un monto en n períodos.</li><li>(P/F, i, n) = 1 ÷ (1 + i)<sup>n</sup>: cuánto vale hoy un monto futuro.</li><li>(A/P, i, n) = i(1 + i)<sup>n</sup> ÷ [(1 + i)<sup>n</sup> − 1]: factor de recuperación de capital; da la cuota que paga un préstamo P.</li><li>(P/A, i, n): inverso del anterior; valor hoy de n cuotas iguales.</li><li>(A/F, i, n) = i ÷ [(1 + i)<sup>n</sup> − 1]: fondo de amortización; cuánto ahorrar cada período para juntar F.</li><li>(F/A, i, n): cuánto se acumula ahorrando A cada período.</li><li>(P/G, i, n) y (A/G, i, n): para series que aumentan una cantidad fija G cada período (costos de mantención que crecen).</li></ul><p>Los factores se combinan: para pasar de A a F puedes usar directamente (F/A) o pasar por P con (P/A) y luego (F/P). El diagrama de flujo de caja (flechas hacia arriba para ingresos y hacia abajo para egresos sobre una línea de tiempo) es la herramienta para no equivocarse.</p>",
pasos:"<ol><li>Dibuja el diagrama de flujo de caja con todos los montos y sus períodos.</li><li>Verifica que tasa y períodos estén en la misma unidad (mensual con meses).</li><li>Identifica qué tipo de serie tienes (pago único, serie uniforme, gradiente) y desde qué período parte.</li><li>Aplica el factor; si la serie no parte en el período 1, trasládala con (P/F).</li><li>En Excel: VA(tasa; nper; pago; vf), VF(...), PAGO(...), NPER(...), TASA(...).</li></ol>",
caso:"<p><b>Caso tipo: compra de un montacargas.</b> Un proveedor ofrece un montacargas en $ 24.000.000 al contado o en 24 cuotas de $ 1.150.000. Si la empresa puede financiarse al 1,5 % mensual, el valor presente de las cuotas es 1.150.000 × (P/A; 1,5 %; 24) ≈ 1.150.000 × 20,03 ≈ $ 23.035.000. Las cuotas equivalen a pagar menos que el contado, así que conviene la opción en cuotas si la tasa de 1,5 % refleja realmente el costo del dinero de la empresa.</p><p><b>Gradiente:</b> si la mantención de un equipo cuesta $ 2 millones el año 1 y sube $ 300.000 cada año durante 8 años, su costo anual equivalente al 10 % es 2.000.000 + 300.000 × (A/G; 10 %; 8). Así se compara con un equipo nuevo de mantención constante.</p>",
err:"<ul><li>Usar tasa anual con períodos mensuales.</li><li>Suponer pagos anticipados cuando la fórmula es para pagos vencidos (multiplica por 1 + i si son anticipados).</li><li>Olvidar que el gradiente parte en el período 2.</li><li>Confundir la tasa nominal con la efectiva.</li></ul>",
src:["Blank, L., y Tarquin, A. (2012). <i>Ingeniería económica</i> (7.ª ed.). McGraw-Hill.", "Sullivan, W., Wicks, E., y Koelling, C. (2014). <i>Ingeniería económica de DeGarmo</i> (15.ª ed.). Pearson.", "Grant, E. L., Ireson, W. G., y Leavenworth, R. S. (1990). <i>Principles of Engineering Economy</i> (8th ed.). Wiley.", "Wellington, A. M. (1887). <i>The Economic Theory of the Location of Railways</i>. Wiley."]
};
GUIDE["tasas"] = {
que:"<p>Una misma tasa de interés puede expresarse de varias formas y, si no se convierten bien, se toman malas decisiones. La <b>tasa nominal</b> es una tasa anual que se divide en subperíodos (por ejemplo, 12 % anual capitalizable mensualmente equivale a 1 % mensual). La <b>tasa efectiva</b> es la que realmente se paga o gana en el período, incluido el interés sobre el interés. La <b>tasa real</b> descuenta la inflación y mide cuánto crece el poder de compra.</p><p>Sirve para comparar créditos y depósitos con distinta capitalización, transformar la tasa del banco al período del proyecto y separar inflación de rentabilidad.</p>",
hist:"<p>La relación entre tasa nominal, real e inflación la formuló Irving Fisher en <i>Appreciation and Interest</i> (1896), por eso se conoce como ecuación de Fisher. En Chile, la alta inflación del siglo XX llevó en 1967 a crear la <b>Unidad de Fomento (UF)</b>, unidad de cuenta que se reajusta según el IPC y que hoy calcula el Banco Central. Por eso muchos contratos, créditos hipotecarios y proyectos se evalúan en UF y con tasas reales. La Ley 20.555 (2011) obligó a informar la <b>CAE</b> (carga anual equivalente) para que los consumidores puedan comparar créditos incluyendo comisiones y seguros.</p>",
como:"<ul><li><b>Tasa periódica desde nominal:</b> i<sub>p</sub> = j ÷ m (j nominal anual, m capitalizaciones por año).</li><li><b>Efectiva anual:</b> TEA = (1 + i<sub>p</sub>)<sup>m</sup> − 1.</li><li><b>Equivalente a otro período:</b> i<sub>k</sub> = (1 + TEA)<sup>1/k</sup> − 1, con k períodos por año.</li><li><b>Capitalización continua:</b> TEA = e<sup>j</sup> − 1.</li><li><b>Fisher:</b> (1 + i<sub>nominal</sub>) = (1 + i<sub>real</sub>)(1 + π). Restar la inflación (i − π) es solo una aproximación que empeora cuando las tasas son altas.</li></ul>",
pasos:"<ol><li>Identifica si la tasa informada es nominal o efectiva y su período.</li><li>Conviértela a efectiva del período que usarás (mensual para cuotas, anual para proyectos).</li><li>Si el proyecto está en moneda constante o en UF, usa la tasa real.</li><li>Para comparar créditos, usa la CAE o la TEA, nunca la tasa mensual publicitada.</li></ol>",
caso:"<p><b>Caso tipo:</b> una tarjeta cobra 2,9 % mensual. Su tasa efectiva anual es (1,029)<sup>12</sup> − 1 ≈ 40,9 %, muy distinta del 34,8 % que resultaría de multiplicar por 12. Un crédito de consumo con CAE de 28 % es claramente más barato aunque su tasa mensual parezca parecida.</p><p><b>Caso de proyecto:</b> si un proyecto exige 10 % real y se espera una inflación de 4 %, la tasa nominal equivalente es 1,10 × 1,04 − 1 = 14,4 %, no 14 %.</p>",
err:"<ul><li>Multiplicar la tasa mensual por 12 para obtener la efectiva anual.</li><li>Descontar flujos en UF con una tasa nominal en pesos.</li><li>Comparar créditos sin considerar comisiones y seguros (para eso existe la CAE).</li></ul>",
src:["Fisher, I. (1896). <i>Appreciation and Interest</i>. American Economic Association.", "Banco Central de Chile. Unidad de Fomento: metodología de cálculo (bcentral.cl).", "Ley 20.555 (2011). Modifica la Ley 19.496 sobre protección de los derechos de los consumidores (SERNAC financiero). Biblioteca del Congreso Nacional.", "Blank, L., y Tarquin, A. (2012). <i>Ingeniería económica</i>, cap. 4. McGraw-Hill."]
};
GUIDE["amortizacion"] = {
que:"<p>La <b>amortización</b> es la devolución gradual del capital de un préstamo. La <b>tabla de desarrollo</b> muestra para cada período cuánto se paga de interés, cuánto de capital y cuánto se sigue debiendo. Los tres sistemas más usados son el <b>francés</b> (cuota fija), el <b>alemán</b> (amortización fija y cuotas decrecientes) y el <b>americano</b> (solo intereses y el capital al final).</p><p>El ingeniero la usa al evaluar proyectos con deuda (flujo del inversionista), al comparar ofertas de financiamiento de bancos o de leasing y al planificar la caja de la empresa.</p>",
hist:"<p>El sistema de cuota constante se asocia a Francia porque fue difundido por los matemáticos actuariales franceses del siglo XVIII y XIX para préstamos públicos y anualidades; el alemán, de amortización constante, se usó en préstamos hipotecarios y municipales en Europa central. El esquema americano corresponde a la estructura típica de los bonos corporativos, que pagan cupones periódicos y devuelven el capital al vencimiento.</p>",
como:"<ul><li><b>Francés:</b> C = P × i ÷ [1 − (1 + i)<sup>−n</sup>]. Interés<sub>t</sub> = i × Saldo<sub>t−1</sub>; Amortización<sub>t</sub> = C − Interés<sub>t</sub>. Al inicio se paga sobre todo interés.</li><li><b>Alemán:</b> Amortización = P ÷ n en todos los períodos; la cuota baja porque el interés se calcula sobre un saldo cada vez menor. El total de intereses es menor que en el francés.</li><li><b>Americano:</b> cuota = i × P y en el último período se agrega P. Máximo interés total, pero mínima presión de caja durante la vida del crédito.</li></ul><p><b>Efecto tributario:</b> los intereses son gasto deducible; la amortización no. Por eso en el flujo del inversionista los intereses van antes del impuesto y la amortización después.</p>",
pasos:"<ol><li>Obtén la tasa del período (mensual equivalente si la cuota es mensual).</li><li>Calcula la cuota o la amortización según el sistema.</li><li>Construye la tabla: saldo inicial, interés, amortización, cuota, saldo final.</li><li>Verifica que el saldo final sea cero.</li><li>En un proyecto, traslada intereses y amortizaciones al flujo del inversionista.</li></ol>",
caso:"<p><b>Caso tipo:</b> una pyme pide $ 25 millones a 48 meses al 1,1 % mensual para comprar una cortadora láser. Con sistema francés la cuota es cercana a $ 673.000 y paga alrededor de $ 7,3 millones en intereses. Con sistema alemán la primera cuota es más alta (unos $ 796.000), pero el interés total baja a cerca de $ 6,7 millones. Si la caja de los primeros meses es estrecha (la máquina aún no produce a plena capacidad), el francés es más cómodo; si hay holgura, el alemán es más barato.</p>",
err:"<ul><li>Restar la cuota completa como gasto tributario.</li><li>Olvidar comisiones, seguros de desgravamen e impuesto de timbres y estampillas, que encarecen el crédito.</li><li>Comparar ofertas por la cuota y no por la CAE.</li></ul>",
src:["Blank, L., y Tarquin, A. (2012). <i>Ingeniería económica</i>. McGraw-Hill.", "Sapag Chain, N. et al. (2014). <i>Preparación y evaluación de proyectos</i>, capítulo sobre financiamiento. McGraw-Hill.", "Comisión para el Mercado Financiero. Información al consumidor sobre créditos (cmfchile.cl)."]
};
GUIDE["depreciacion"] = {
que:"<p>La <b>depreciación</b> reparte el costo de un activo fijo (máquinas, vehículos, edificios) a lo largo de su vida útil. Refleja el desgaste y la obsolescencia. No es una salida de dinero, pero reduce la utilidad contable y, por lo tanto, el impuesto a pagar. En evaluación de proyectos importa precisamente por ese <b>ahorro tributario</b>.</p>",
hist:"<p>La depreciación como práctica contable se generalizó con los ferrocarriles del siglo XIX, que necesitaban mostrar resultados sin cargar todo el costo de las locomotoras en un solo año. Los sistemas tributarios la incorporaron en el siglo XX. En Chile, la Ley sobre Impuesto a la Renta (artículo 31 N.º 5) permite deducir la depreciación según vidas útiles fijadas por el SII, y contempla la <b>depreciación acelerada</b> (un tercio de la vida útil normal) y, en distintos períodos, regímenes de depreciación instantánea para incentivar la inversión.</p>",
como:"<ul><li><b>Línea recta:</b> D = (C − VR) ÷ n. Es la más usada y la exigida para efectos tributarios en Chile (con la opción acelerada).</li><li><b>Suma de dígitos de los años (SDA):</b> D<sub>t</sub> = (C − VR) × (n − t + 1) ÷ [n(n + 1) ÷ 2]. Más alta al principio.</li><li><b>Saldo doble decreciente:</b> D<sub>t</sub> = (2 ÷ n) × valor libro<sub>t−1</sub>, sin bajar del valor residual.</li><li><b>Unidades de producción:</b> D = (C − VR) × unidades del año ÷ unidades totales de vida. Útil para camiones mineros o máquinas cuyo desgaste depende del uso.</li></ul><p>Los métodos acelerados no cambian el total depreciado, pero adelantan el ahorro tributario, y como el dinero tiene valor en el tiempo, mejoran el VAN.</p>",
pasos:"<ol><li>Identifica el tipo de bien y su vida útil en la tabla del SII.</li><li>Define el valor residual (en Chile, tributariamente se suele dejar un valor de $ 1).</li><li>Elige el método (normal o acelerado) y calcula la depreciación anual.</li><li>Llévala al flujo de caja: se resta antes de impuesto y se suma después.</li><li>Al vender el activo, calcula la ganancia o pérdida respecto de su valor libro.</li></ol>",
caso:"<p><b>Caso tipo:</b> un camión de $ 60 millones con vida útil normal de 7 años. En línea recta deprecia unos $ 8,6 millones al año; con depreciación acelerada (vida 2 años, redondeando un tercio) deprecia $ 30 millones al año durante 2 años. Con impuesto de 27 %, la acelerada adelanta un ahorro de impuesto de más de $ 5 millones por año en los primeros años, lo que a una tasa de 12 % aumenta el VAN del proyecto. La herramienta compara los métodos financieros clásicos para que veas cómo cambia el valor libro.</p>",
err:"<ul><li>Restar la depreciación del flujo sin volver a sumarla.</li><li>Depreciar terrenos (no se deprecian).</li><li>Usar vidas útiles distintas de las tributarias para calcular impuestos.</li></ul>",
src:["Servicio de Impuestos Internos. Tabla de vidas útiles (Resolución Ex. N.º 43 de 2002 y sus modificaciones).", "Decreto Ley 824, Ley sobre Impuesto a la Renta, artículo 31. Biblioteca del Congreso Nacional.", "Horngren, C., Datar, S., y Rajan, M. (2012). <i>Contabilidad de costos: un enfoque gerencial</i> (14.ª ed.). Pearson."]
};
GUIDE["equilibrio"] = {
que:"<p>El <b>punto de equilibrio</b> es el nivel de ventas en que los ingresos igualan a los costos totales: no hay ganancia ni pérdida. El <b>análisis costo-volumen-utilidad (CVU)</b> estudia cómo cambian las utilidades cuando cambian el precio, el volumen, los costos variables y los costos fijos.</p><p>Responde preguntas cotidianas de gestión: ¿cuánto hay que vender para no perder?, ¿cuánto para ganar $ 4 millones al mes?, ¿qué pasa si el proveedor sube el precio de la materia prima?, ¿conviene bajar el precio para vender más?</p>",
hist:"<p>El gráfico de equilibrio se atribuye al ingeniero Henry Hess, que lo publicó en 1903, y fue popularizado en las décadas siguientes por Walter Rautenstrauch, profesor de ingeniería industrial en la Universidad de Columbia, como herramienta de planificación de utilidades. El concepto de <b>apalancamiento operativo</b> se desarrolló en la literatura financiera de mediados del siglo XX.</p>",
como:"<ul><li><b>Margen de contribución unitario:</b> MC = p − cv. Es lo que cada unidad aporta a cubrir los costos fijos.</li><li><b>Equilibrio en unidades:</b> Q<sub>e</sub> = CF ÷ MC.</li><li><b>Equilibrio en pesos:</b> V<sub>e</sub> = CF ÷ (MC ÷ p).</li><li><b>Utilidad objetivo después de impuesto:</b> Q = [CF + U ÷ (1 − t)] ÷ MC.</li><li><b>Margen de seguridad:</b> (ventas esperadas − ventas de equilibrio) ÷ ventas esperadas.</li><li><b>Grado de apalancamiento operativo:</b> GAO = MC total ÷ utilidad operacional. Indica cuánto cambia la utilidad por cada 1 % de cambio en las ventas.</li></ul><p><b>Supuestos:</b> precio y costo variable constantes, costos fijos constantes en el rango relevante, todo lo producido se vende, mezcla de productos constante.</p>",
pasos:"<ol><li>Separa los costos en fijos y variables (si tienes datos históricos, usa la regresión de costos totales contra volumen).</li><li>Calcula el margen de contribución.</li><li>Calcula el equilibrio y la cantidad para la utilidad objetivo.</li><li>Grafica ingresos y costos totales.</li><li>Analiza escenarios: precio −5 %, costo variable +10 %, costo fijo +15 %.</li></ol>",
caso:"<p><b>Caso tipo: taller de muebles.</b> Costos fijos mensuales de $ 18 millones, precio de $ 12.500 y costo variable de $ 7.400 por unidad. El margen de contribución es $ 5.100 y el equilibrio es de 3.530 unidades al mes. Con ventas esperadas de 5.200 unidades, el margen de seguridad es de 32 %: las ventas pueden caer casi un tercio antes de perder. El GAO cercano a 3 significa que un aumento de 10 % en ventas sube la utilidad operacional alrededor de 30 %, y que una caída de 10 % la reduce en la misma proporción. Esa es la cara riesgosa de tener costos fijos altos.</p>",
err:"<ul><li>Clasificar como fijo un costo que en realidad es semivariable (energía, mano de obra con horas extra).</li><li>Aplicarlo fuera del rango relevante: si para vender más hay que arrendar otra bodega, los costos fijos cambian.</li><li>Ignorar la mezcla de productos en empresas multiproducto.</li></ul>",
src:["Horngren, C., Datar, S., y Rajan, M. (2012). <i>Contabilidad de costos: un enfoque gerencial</i>, cap. 3. Pearson.", "Garrison, R., Noreen, E., y Brewer, P. (2007). <i>Contabilidad administrativa</i> (11.ª ed.). McGraw-Hill.", "Sapag Chain, N. (2011). <i>Proyectos de inversión: formulación y evaluación</i> (2.ª ed.). Pearson."]
};
GUIDE["costeo"] = {
que:"<p>El <b>costeo</b> determina cuánto cuesta producir una unidad de producto o entregar un servicio. Ese costo unitario es la base para fijar precios, decidir si fabricar o comprar (make or buy), evaluar la rentabilidad de cada producto y cliente, y valorizar inventarios en los estados financieros.</p><p>Los costos se clasifican en <b>materia prima directa</b>, <b>mano de obra directa</b> y <b>costos indirectos de fabricación (CIF)</b>: supervisión, energía, mantención, depreciación de la planta, arriendos. A eso se suman los gastos de administración y ventas (GAV).</p>",
hist:"<p>La contabilidad de costos nace con la Revolución Industrial: Josiah Wedgwood analizaba los costos de su fábrica de cerámica en la década de 1770, y Andrew Carnegie controlaba al centavo el costo por tonelada de acero en el siglo XIX. Frederick Taylor y los ingenieros de la administración científica introdujeron los <b>costos estándar</b> a inicios del siglo XX. En 1987, H. Thomas Johnson y Robert Kaplan publicaron <i>Relevance Lost</i>, criticando que los sistemas tradicionales distorsionaban los costos de empresas con muchos productos, y junto con Robin Cooper desarrollaron el <b>costeo basado en actividades (ABC)</b>.</p>",
como:"<ul><li><b>Costeo por absorción:</b> el producto absorbe todos los costos de fabricación, fijos y variables. Es el que exigen las normas contables (NIC 2) para valorizar inventarios.</li><li><b>Costeo variable o directo:</b> el producto solo carga los costos variables; los fijos se tratan como gasto del período. Es mejor para decisiones de corto plazo y análisis CVU.</li><li><b>Costeo ABC:</b> los CIF se asignan a actividades (preparar máquinas, inspeccionar, despachar) y luego a los productos según sus inductores de costo (número de setups, horas de inspección, despachos). Revela que los productos de bajo volumen y alta complejidad suelen costar mucho más de lo que dice el costeo tradicional.</li><li><b>Margen sobre el precio:</b> (p − c) ÷ p. <b>Markup sobre el costo:</b> (p − c) ÷ c. Un markup de 30 % equivale a un margen de 23,1 %.</li></ul>",
pasos:"<ol><li>Obtén la lista de materiales (BOM) y los consumos por unidad.</li><li>Calcula la mano de obra directa con el tiempo estándar × costo de la hora (incluidas leyes sociales).</li><li>Agrupa los CIF y elige la base de asignación (horas máquina, horas hombre o inductores ABC).</li><li>Calcula el costo unitario y compáralo con el precio de mercado.</li><li>Define el precio con un margen que cubra GAV y utilidad, y verifica que sea competitivo.</li></ol>",
caso:"<p><b>Caso tipo: imprenta con muchos formatos.</b> Al repartir los CIF por horas de máquina, los trabajos grandes y repetitivos parecían caros y los pequeños personalizados parecían rentables. Al aplicar ABC, con el número de preparaciones de máquina como inductor, se vio que los trabajos pequeños consumían la mayor parte del tiempo de preparación. La empresa ajustó su lista de precios cobrando un cargo fijo por preparación, práctica habitual en imprentas, metalmecánicas y maestranzas.</p>",
err:"<ul><li>Fijar precios solo con el costo, sin mirar el mercado ni la competencia.</li><li>Olvidar las leyes sociales y las horas improductivas en el costo de la mano de obra.</li><li>Usar costos unitarios con CIF fijos para decisiones de corto plazo (por ejemplo, aceptar un pedido especial).</li></ul>",
src:["Horngren, C., Datar, S., y Rajan, M. (2012). <i>Contabilidad de costos: un enfoque gerencial</i> (14.ª ed.). Pearson.", "Johnson, H. T., y Kaplan, R. S. (1987). <i>Relevance Lost: The Rise and Fall of Management Accounting</i>. Harvard Business School Press.", "Kaplan, R. S., y Cooper, R. (1998). <i>Cost and Effect</i>. Harvard Business School Press."]
};
GUIDE["caue"] = {
que:"<p>El <b>Costo Anual Uniforme Equivalente (CAUE)</b> convierte todos los costos de una alternativa (inversión, operación, mantención y valor de reventa) en una cuota anual constante equivalente. Permite comparar equipos o soluciones con vidas útiles distintas sin tener que construir un horizonte común.</p><p>Es la herramienta típica para elegir entre un equipo caro y durable y otro barato que dura menos, entre motores de distinta eficiencia o entre comprar y arrendar.</p>",
hist:"<p>El método del costo anual equivalente forma parte de la ingeniería económica clásica desarrollada por Eugene Grant y W. Grant Ireson a mediados del siglo XX, y se usa en Estados Unidos con el nombre de <i>Equivalent Uniform Annual Cost (EUAC)</i>.</p>",
como:"<p>CAUE = I × (A/P, i, n) + C<sub>anual</sub> − VR × (A/F, i, n). El primer término reparte la inversión en cuotas que incluyen el costo de capital; el segundo son los costos anuales; el tercero convierte el valor de reventa en un ahorro anual. Si los costos de operación varían, primero se llevan a valor presente y luego se anualizan con (A/P).</p><p><b>Supuesto clave:</b> cada alternativa puede repetirse con los mismos costos al terminar su vida (cadena de reemplazos). Si no es razonable, compara con un horizonte común y valor de desecho.</p>",
pasos:"<ol><li>Recolecta inversión, costos anuales, vida útil y valor residual de cada alternativa.</li><li>Usa la misma tasa de descuento para todas.</li><li>Calcula el CAUE de cada una.</li><li>Elige la de menor CAUE (o mayor beneficio anual equivalente si hay ingresos distintos).</li><li>Revisa factores no económicos: seguridad, confiabilidad, repuestos, servicio técnico.</li></ol>",
caso:"<p><b>Caso tipo:</b> una maestranza compara un torno CNC nuevo ($ 45 millones, costo anual $ 6 millones, 8 años, reventa $ 8 millones) con un torno convencional reacondicionado ($ 18 millones, costo anual $ 11 millones, 5 años, reventa $ 2 millones). Al 10 %, el CNC tiene menor CAUE pese a su mayor inversión, porque su menor costo de operación (menos horas hombre y menos rechazos) compensa. Este resultado es típico: el precio de compra es solo una parte del costo total de propiedad.</p>",
err:"<ul><li>Comparar solo precios de compra.</li><li>Usar distintas tasas para cada alternativa.</li><li>Aplicar CAUE cuando las alternativas tienen distintos ingresos sin incluirlos.</li></ul>",
src:["Blank, L., y Tarquin, A. (2012). <i>Ingeniería económica</i>, cap. 6. McGraw-Hill.", "Sullivan, W., Wicks, E., y Koelling, C. (2014). <i>Ingeniería económica de DeGarmo</i>. Pearson."]
};
GUIDE["vida-economica"] = {
que:"<p>La <b>vida económica</b> de un activo es el número de años que minimiza su costo anual equivalente total. No coincide con la vida física (cuánto tiempo puede funcionar) ni con la contable (cuánto se deprecia). El <b>análisis de reemplazo</b> decide cuándo cambiar un equipo existente (defensor) por uno nuevo (retador).</p><p>Es crítico en flotas de camiones mineros, buses, grúas, servidores computacionales y cualquier equipo cuyo costo de mantención crece con la edad.</p>",
hist:"<p>George Terborgh, del Machinery and Allied Products Institute (MAPI) de Estados Unidos, publicó <i>Dynamic Equipment Policy</i> (1949), obra que formalizó el problema del reemplazo considerando el deterioro y la obsolescencia. El método MAPI se usó durante décadas en la industria estadounidense para decidir renovaciones de maquinaria.</p>",
como:"<p>Para cada posible año de reemplazo n: CAUE(n) = I × (A/P, i, n) − VM<sub>n</sub> × (A/F, i, n) + [Σ CO<sub>t</sub> × (P/F, i, t)] × (A/P, i, n).</p><p>El costo de capital baja con los años (la inversión se reparte en más períodos y el valor de mercado cae cada vez menos), mientras el costo de operación sube (más fallas, más consumo). La suma tiene forma de U y su mínimo es la vida económica.</p><p><b>Reemplazo defensor-retador:</b> se compara el CAUE mínimo del retador con el costo marginal de mantener el defensor un año más. Si mantenerlo un año más cuesta más que el CAUE del retador, se reemplaza.</p>",
pasos:"<ol><li>Registra el valor de mercado esperado al final de cada año (cotizaciones de usados).</li><li>Registra el costo de operación y mantención por año (historial de mantenimiento).</li><li>Calcula el CAUE para cada año posible de reemplazo.</li><li>Identifica el mínimo.</li><li>Repite el análisis cada año con datos actualizados: los costos reales cambian.</li></ol>",
caso:"<p><b>Caso tipo: flota de camionetas de una empresa de servicios mineros.</b> Las camionetas cuestan $ 40 millones, su valor de reventa cae rápido los primeros años y la mantención sube por el uso intensivo en caminos de faena. Con los datos del ejemplo, el CAUE mínimo se alcanza en el sexto año, pero la curva es muy plana entre el cuarto y el séptimo (las diferencias son menores a 3 %). Esa planitud es una conclusión útil: la empresa puede ajustar la renovación a su presupuesto sin un gran costo. Muchas empresas definen sus políticas de renovación por años o kilometraje a partir de este tipo de análisis, en vez de usar los vehículos hasta que fallan.</p>",
err:"<ul><li>Incluir el precio original de compra del defensor (es costo hundido; lo que importa es su valor de mercado hoy).</li><li>No considerar la obsolescencia tecnológica del retador (puede convenir esperar un modelo mejor).</li><li>Ignorar la disponibilidad: un equipo viejo que falla puede detener toda una operación.</li></ul>",
src:["Terborgh, G. (1949). <i>Dynamic Equipment Policy</i>. McGraw-Hill.", "Blank, L., y Tarquin, A. (2012). <i>Ingeniería económica</i>, cap. 11. McGraw-Hill.", "Jardine, A. K. S., y Tsang, A. H. C. (2013). <i>Maintenance, Replacement, and Reliability</i> (2nd ed.). CRC Press."]
};
GUIDE["wacc"] = {
que:"<p>El <b>WACC</b> (costo promedio ponderado del capital) es la rentabilidad mínima que debe obtener una empresa para satisfacer a quienes la financian: accionistas y acreedores. Es la tasa de descuento habitual para evaluar proyectos de riesgo similar al de la empresa. El <b>CAPM</b> (modelo de valoración de activos de capital) estima cuánto exigen los accionistas según el riesgo de mercado del negocio.</p>",
hist:"<p>Franco Modigliani y Merton Miller demostraron en 1958 cómo la estructura de deuda y patrimonio afecta el valor de la empresa cuando hay impuestos, base del WACC moderno (ambos recibieron el Premio Nobel de Economía, en 1985 y 1990). William Sharpe (1964), John Lintner (1965) y Jan Mossin (1966) desarrollaron el CAPM; Sharpe recibió el Nobel en 1990. Robert Hamada (1972) propuso la fórmula para ajustar la beta según el endeudamiento. Aswath Damodaran, profesor de la Universidad de Nueva York, publica cada año betas por industria y primas de riesgo por país que se usan ampliamente, incluido Chile.</p>",
como:"<ul><li><b>CAPM:</b> k<sub>e</sub> = r<sub>f</sub> + β × (E[r<sub>m</sub>] − r<sub>f</sub>) + premios adicionales (riesgo país, tamaño, liquidez).</li><li><b>r<sub>f</sub></b>: tasa libre de riesgo, por ejemplo un bono del Banco Central o de la Tesorería a 10 años.</li><li><b>β</b>: sensibilidad del retorno de la acción frente al mercado. β = 1 se mueve igual que el mercado; minería y construcción suelen tener betas mayores que servicios sanitarios o eléctricos regulados.</li><li><b>Hamada:</b> β<sub>L</sub> = β<sub>U</sub> × [1 + (1 − t) × D/E].</li><li><b>WACC</b> = E/(D+E) × k<sub>e</sub> + D/(D+E) × k<sub>d</sub> × (1 − t). La deuda se multiplica por (1 − t) porque los intereses rebajan impuestos.</li></ul>",
pasos:"<ol><li>Busca la tasa libre de riesgo vigente.</li><li>Obtén la beta desapalancada de la industria (por ejemplo, tablas de Damodaran) y apalánca la con la estructura objetivo de la empresa.</li><li>Define el premio por riesgo de mercado (histórico o implícito).</li><li>Calcula k<sub>e</sub> con CAPM.</li><li>Estima k<sub>d</sub> con la tasa a la que la empresa puede endeudarse hoy.</li><li>Pondera con valores de mercado de deuda y patrimonio.</li></ol>",
caso:"<p><b>Caso tipo:</b> una empresa de alimentos con beta de 0,9, tasa libre de riesgo de 5,5 %, premio de mercado de 6,5 %, deuda al 7 % e impuesto de 27 %, financiada 40 % con deuda. Su k<sub>e</sub> es cercano a 11,4 % y su WACC a 8,9 %. Si evalúa un proyecto minero, no debe usar su propio WACC: debe usar una beta del sector minero, mayor, porque el riesgo es distinto. Usar una sola tasa para todo es uno de los errores más comunes de los comités de inversión.</p>",
err:"<ul><li>Usar valores contables en vez de valores de mercado para ponderar.</li><li>Aplicar el WACC de la empresa a proyectos de riesgo distinto.</li><li>Mezclar tasas nominales con flujos reales.</li></ul>",
src:["Modigliani, F., y Miller, M. (1958). The cost of capital, corporation finance and the theory of investment. <i>American Economic Review, 48</i>(3), 261–297.", "Sharpe, W. F. (1964). Capital asset prices: A theory of market equilibrium under conditions of risk. <i>Journal of Finance, 19</i>(3), 425–442.", "Hamada, R. S. (1972). The effect of the firm's capital structure on the systematic risk of common stocks. <i>Journal of Finance, 27</i>(2), 435–452.", "Damodaran, A. (2012). <i>Investment Valuation</i> (3rd ed.). Wiley. Datos actualizados en pages.stern.nyu.edu/~adamodar.", "Ross, S., Westerfield, R., y Jaffe, J. (2012). <i>Finanzas corporativas</i> (9.ª ed.). McGraw-Hill."]
};
GUIDE["ratios"] = {
que:"<p>Los <b>indicadores financieros</b> resumen la salud de una empresa a partir de sus estados financieros: si puede pagar sus deudas de corto plazo (liquidez), cuánto depende de la deuda (endeudamiento), cuánto gana sobre lo que vende e invierte (rentabilidad) y qué tan bien usa sus activos (actividad).</p><p>El ingeniero los usa para analizar clientes y proveedores (¿podrá pagarnos?, ¿quebrará este proveedor crítico?), preparar presentaciones a la gerencia, evaluar empresas para invertir y en entrevistas de trabajo en banca y consultoría.</p>",
hist:"<p>El <b>modelo DuPont</b> fue creado por F. Donaldson Brown, ingeniero eléctrico que trabajaba en el área de tesorería de DuPont, hacia 1914; descompone la rentabilidad en margen y rotación. Edward Altman (1968) combinó cinco razones financieras en el <b>Z-score</b> para predecir quiebras, aún usado en análisis de crédito. En Chile, las empresas que transan en bolsa publican sus estados financieros bajo normas IFRS en el sitio de la Comisión para el Mercado Financiero (CMF).</p>",
como:"<ul><li><b>Liquidez:</b> razón corriente (AC ÷ PC) y prueba ácida ((AC − inventarios) ÷ PC).</li><li><b>Endeudamiento:</b> deuda/patrimonio, deuda/activos y cobertura de intereses (EBIT ÷ gastos financieros).</li><li><b>Rentabilidad:</b> margen bruto, operacional y neto; ROA (utilidad ÷ activos) y ROE (utilidad ÷ patrimonio).</li><li><b>Actividad:</b> rotación de inventarios, días de inventario, período de cobro y rotación de activos.</li><li><b>DuPont:</b> ROE = margen neto × rotación de activos × multiplicador de capital.</li></ul><p>Ningún indicador se interpreta solo: se compara con la industria, con la historia de la empresa y con los demás indicadores.</p>",
pasos:"<ol><li>Descarga los estados financieros (CMF para empresas abiertas).</li><li>Calcula los indicadores de al menos tres años.</li><li>Compara con empresas del mismo sector.</li><li>Explica las variaciones: ¿bajó el margen por precios o por costos?, ¿subió el endeudamiento por un proyecto?</li><li>Concluye sobre riesgos y fortalezas.</li></ol>",
caso:"<p><b>Caso tipo:</b> al analizar a un proveedor, su razón corriente cae de 1,6 a 0,9 en dos años, sus días de cobro suben de 40 a 85 y su cobertura de intereses baja de 4 a 1,3. Estas señales sugieren problemas de caja y de cobranza; un área de abastecimiento prudente buscaría un proveedor alternativo o pediría garantías antes de entregar un contrato grande.</p>",
err:"<ul><li>Comparar empresas de industrias distintas con los mismos rangos (un supermercado y una minera tienen estructuras muy diferentes).</li><li>Mirar un solo año.</li><li>Olvidar que la utilidad contable no es caja.</li></ul>",
src:["Altman, E. I. (1968). Financial ratios, discriminant analysis and the prediction of corporate bankruptcy. <i>Journal of Finance, 23</i>(4), 589–609.", "Ross, S., Westerfield, R., y Jaffe, J. (2012). <i>Finanzas corporativas</i>, cap. 3. McGraw-Hill.", "Comisión para el Mercado Financiero. Estados financieros de entidades fiscalizadas (cmfchile.cl)."]
};

GUIDE["pronosticos"] = {
que:"<p>Un <b>pronóstico de demanda</b> estima cuánto se venderá o consumirá en los próximos períodos. Es el punto de partida de casi toda la planificación: cuánto producir, cuánto comprar, cuánto personal contratar, qué capacidad instalar y cuánto inventario mantener.</p><p>Los métodos cuantitativos de <b>series de tiempo</b> suponen que el patrón del pasado (nivel, tendencia, estacionalidad) continuará. Los <b>métodos causales</b> (regresión) relacionan la demanda con otras variables (precio, PIB, temperatura). Los <b>métodos cualitativos</b> (juicio de expertos, método Delphi, investigación de mercado) se usan cuando no hay historia, como en el lanzamiento de un producto.</p>",
hist:"<p>El suavizamiento exponencial fue desarrollado por <b>Robert G. Brown</b> en la década de 1950 mientras trabajaba en problemas de inventario para la Armada de Estados Unidos; su libro <i>Statistical Forecasting for Inventory Control</i> (1959) lo difundió en la industria. Charles Holt (1957) agregó la tendencia y Peter Winters (1960) la estacionalidad (método Holt-Winters). George Box y Gwilym Jenkins publicaron en 1970 la metodología ARIMA. Hoy las empresas combinan estos modelos con aprendizaje automático, y el proceso de <b>Planificación de Ventas y Operaciones (S&OP)</b>, popularizado por Oliver Wight en los años ochenta, integra el pronóstico con las decisiones comerciales y productivas.</p>",
como:"<ul><li><b>Promedio móvil simple:</b> F<sub>t+1</sub> = promedio de los últimos n datos. Un n grande suaviza más pero reacciona más lento.</li><li><b>Suavizamiento exponencial simple:</b> F<sub>t+1</sub> = αD<sub>t</sub> + (1 − α)F<sub>t</sub>. Pondera los datos con pesos que decrecen exponencialmente hacia el pasado. α entre 0,1 y 0,3 es típico para demandas estables.</li><li><b>Tendencia lineal:</b> recta de mínimos cuadrados F<sub>t</sub> = a + bt.</li><li><b>Estacionalidad:</b> se calculan índices estacionales (demanda del mes ÷ promedio) y se multiplican por el pronóstico desestacionalizado.</li></ul><p><b>Medición del error:</b> MAD (desviación absoluta media) en unidades; MAPE (error porcentual medio) para comparar productos distintos; MSE penaliza los errores grandes; la <b>señal de rastreo</b> (suma de errores ÷ MAD) detecta sesgo: si se sale de ±4, el método subestima o sobrestima sistemáticamente.</p>",
pasos:"<ol><li>Reúne al menos 2 a 3 años de datos mensuales y limpia anomalías (quiebres de stock, promociones, pandemia).</li><li>Grafica la serie: identifica nivel, tendencia y estacionalidad.</li><li>Separa los datos: usa los primeros para ajustar y los últimos meses para validar (error fuera de muestra).</li><li>Prueba varios métodos y elige el de menor error en validación.</li><li>Monitorea la señal de rastreo cada mes y ajusta.</li><li>Combina con información comercial (promociones, nuevos clientes) en una reunión de S&OP.</li></ol><p>En Excel: PROMEDIO móvil con referencias relativas, PRONOSTICO.LINEAL, PRONOSTICO.ETS (suavizamiento con estacionalidad).</p>",
caso:"<p><b>Caso tipo: distribuidora de insumos de aseo.</b> La demanda mensual de un detergente industrial crece de forma sostenida. El promedio móvil siempre queda atrasado y genera quiebres de stock, porque proyecta el nivel de los meses anteriores. Al comparar con MAD, la tendencia lineal resulta más precisa y la señal de rastreo del promedio móvil muestra sesgo (subestimación permanente). La empresa cambia de método y ajusta su punto de reorden con el nuevo pronóstico. Este es el patrón que muestra el ejemplo de la herramienta.</p><p><b>Caso real conocido:</b> el «efecto látigo» descrito por Hau Lee y colegas (Stanford, 1997) mostró que en la cadena de pañales de Procter & Gamble la variabilidad de los pedidos aumentaba en cada eslabón aunque el consumo final era estable. Compartir pronósticos y datos de venta entre los eslabones fue una de las soluciones.</p>",
err:"<ul><li>Elegir el método que «mejor se ve» en el gráfico y no por su error de validación.</li><li>Pronosticar ventas en vez de demanda (si hubo quiebres, la venta subestima la demanda real).</li><li>Usar un solo método para todos los productos.</li><li>No revisar nunca el pronóstico ni medir su error.</li></ul>",
src:["Hyndman, R. J., y Athanasopoulos, G. (2021). <i>Forecasting: Principles and Practice</i> (3rd ed.). OTexts. Disponible gratis en otexts.com/fpp3.", "Brown, R. G. (1959). <i>Statistical Forecasting for Inventory Control</i>. McGraw-Hill.", "Chopra, S., y Meindl, P. (2013). <i>Administración de la cadena de suministro</i> (5.ª ed.), cap. 7. Pearson.", "Lee, H. L., Padmanabhan, V., y Whang, S. (1997). The bullwhip effect in supply chains. <i>Sloan Management Review, 38</i>(3), 93–102."]
};
GUIDE["eoq"] = {
que:"<p>El <b>lote económico de pedido (EOQ)</b> es la cantidad que conviene comprar cada vez para que la suma del costo de hacer pedidos y el costo de mantener inventario sea mínima. Pedir poco y seguido reduce el inventario pero multiplica los costos de pedido (órdenes, transporte, recepción); pedir mucho de una vez reduce los pedidos pero inmoviliza dinero y espacio. El EOQ encuentra el equilibrio.</p><p>La variante <b>EPQ</b> (lote económico de producción) se usa cuando el lote se fabrica internamente y el inventario se acumula gradualmente mientras se produce y se consume.</p>",
hist:"<p>El modelo fue publicado por <b>Ford Whitman Harris</b>, ingeniero de Westinghouse, en 1913 en el artículo «How many parts to make at once» en la revista <i>Factory, The Magazine of Management</i>. Fue redescubierto y difundido por el consultor R. H. Wilson en 1934, por lo que también se conoce como fórmula de Wilson. E. W. Taft (1918) desarrolló la versión con producción gradual. Es uno de los primeros modelos matemáticos de la gestión de operaciones y sigue enseñándose porque explica de forma muy clara los trade-offs de los inventarios.</p>",
como:"<p>Costo total anual = (D ÷ Q) × S + (Q ÷ 2) × H + D × C.</p><ul><li><b>D</b>: demanda anual. <b>S</b>: costo por pedido (o setup). <b>H</b>: costo de mantener una unidad un año (H = i × C, con i entre 15 % y 35 % según costo de capital, bodegaje, seguros, obsolescencia y mermas). <b>C</b>: costo unitario.</li><li>Derivando e igualando a cero: <b>Q* = √(2DS ÷ H)</b>. En ese punto, el costo de pedir es igual al costo de mantener.</li><li><b>EPQ:</b> Q* = √[2DS ÷ (H(1 − d/p))], con d demanda diaria y p producción diaria.</li><li><b>Punto de reorden:</b> ROP = d × L (más stock de seguridad si la demanda varía).</li><li><b>Descuentos por cantidad:</b> se calcula Q* para cada precio, se ajusta al mínimo del tramo y se elige el de menor costo total incluido el costo de compra.</li></ul><p><b>Robustez:</b> la curva de costo total es muy plana cerca del óptimo. Pedir 20 % más o menos que Q* aumenta el costo de inventario solo cerca de 2 %, por eso se puede redondear a cajas o pallets completos sin problema.</p>",
pasos:"<ol><li>Estima la demanda anual (pronóstico).</li><li>Calcula el costo real de emitir un pedido: horas administrativas, transporte fijo, recepción, inspección.</li><li>Define la tasa de mantención con finanzas (costo de capital) y bodega.</li><li>Calcula Q*, el número de pedidos y el ROP.</li><li>Redondea a la unidad de compra (caja, pallet, contenedor) y verifica capacidad de bodega.</li><li>Revisa cada año o cuando cambien los costos.</li></ol>",
caso:"<p><b>Caso tipo: insumo de una planta de envases.</b> Una planta consume 12.000 unidades al año de un aditivo de $ 4.200, con un costo por pedido de $ 85.000 y una tasa de mantención de 22 %. El EOQ ronda las 1.500 unidades, unos 8 pedidos al año. Antes compraba mensualmente por costumbre (1.000 unidades); el ahorro de cambiar es pequeño, como predice la robustez del modelo. La ganancia mayor apareció al evaluar los descuentos por volumen del proveedor: comprar lotes de 4.000 unidades al precio más bajo reduce el costo total anual en cerca de $ 3 millones respecto de comprar al precio base, porque el ahorro en el precio supera el mayor costo de mantener. La tabla de descuentos de la herramienta muestra este cálculo.</p><p><b>Lección de Toyota:</b> el sistema justo a tiempo atacó el problema desde otro ángulo: en vez de aceptar S como dato, redujo drásticamente el costo de setup (SMED). Si S baja, el lote económico baja y se puede producir en lotes pequeños sin perder eficiencia.</p>",
err:"<ul><li>Usar H como porcentaje anual pero con demanda mensual.</li><li>Ignorar restricciones de bodega, vencimiento o pedido mínimo del proveedor.</li><li>Aplicarlo a demanda muy variable o estacional sin ajustes.</li><li>Olvidar que el costo de pedir debe ser incremental (no todo el sueldo del comprador).</li></ul>",
src:["Harris, F. W. (1913). How many parts to make at once. <i>Factory, The Magazine of Management, 10</i>(2), 135–136.", "Nahmias, S. (2007). <i>Análisis de la producción y las operaciones</i> (5.ª ed.), cap. 4. McGraw-Hill.", "Heizer, J., y Render, B. (2014). <i>Principios de administración de operaciones</i> (9.ª ed.), cap. 12. Pearson.", "Silver, E., Pyke, D., y Thomas, D. (2017). <i>Inventory and Production Management in Supply Chains</i> (4th ed.). CRC Press."]
};
GUIDE["stock-seguridad"] = {
que:"<p>El <b>stock de seguridad</b> es inventario adicional que se mantiene para no quedarse sin producto cuando la demanda es mayor a la esperada o el proveedor se atrasa. El <b>nivel de servicio</b> es la probabilidad de no tener quiebre de stock durante un ciclo de reposición; define cuánto stock de seguridad se necesita.</p><p>Es una decisión de negocio: más servicio significa más inventario y más dinero inmovilizado. Los productos críticos (repuestos de una chancadora, insumos médicos) justifican servicios muy altos; los de bajo impacto, servicios menores.</p>",
hist:"<p>La teoría de inventarios con incertidumbre se formalizó entre 1950 y 1960: Kenneth Arrow, Theodore Harris y Jacob Marschak publicaron en 1951 un modelo de política óptima de inventarios, y la investigación de operaciones de la posguerra (RAND, Stanford) desarrolló los modelos (Q, r) y (s, S). Arrow recibió más tarde el Nobel de Economía (1972) por otros trabajos.</p>",
como:"<ul><li><b>Revisión continua (Q, ROP):</b> se pide Q cada vez que el inventario baja del punto de reorden. SS = z × √(L σ<sub>d</sub>² + d² σ<sub>L</sub>²).</li><li><b>Revisión periódica (T, S):</b> cada T días se pide lo necesario para llegar a S. SS = z × σ durante T + L, porque el riesgo cubre la espera hasta la siguiente revisión más el lead time.</li><li><b>z</b>: valor de la normal estándar para el nivel de servicio (95 % → 1,645; 99 % → 2,326).</li><li><b>Fill rate</b> (porcentaje de unidades servidas) es otra medida de servicio, que se calcula con la función de pérdida normal; suele ser más alta que el nivel de servicio por ciclo.</li></ul><p>Pasar de 95 % a 99 % aumenta el stock de seguridad en más de 40 %: los últimos puntos de servicio son los más caros.</p>",
pasos:"<ol><li>Mide la demanda diaria y su desviación estándar con datos históricos.</li><li>Mide el lead time real del proveedor (no el prometido) y su variabilidad.</li><li>Define el nivel de servicio por clase ABC o por criticidad.</li><li>Calcula SS y ROP; configúralos en el ERP.</li><li>Revisa trimestralmente; si el proveedor mejora su cumplimiento, el SS puede bajar.</li></ol>",
caso:"<p><b>Caso tipo: bodega de repuestos de una mina.</b> Un rodamiento crítico de una correa transportadora tiene un lead time de importación de 45 días con mucha variabilidad. Un quiebre detiene la línea y cuesta mucho más que mantener unidades extra, por lo que se define un nivel de servicio de 99,5 %. En cambio, para artículos de oficina se usa 90 %. Esta diferenciación por criticidad es la práctica habitual en la gestión de repuestos de la gran minería.</p>",
err:"<ul><li>Usar la desviación de la demanda mensual con lead times en días sin convertir.</li><li>Ignorar la variabilidad del lead time, que muchas veces es la mayor fuente de riesgo.</li><li>Fijar un mismo nivel de servicio para todos los productos.</li><li>Suponer normalidad en demandas muy bajas o intermitentes (para repuestos de baja rotación se usan otras distribuciones, como Poisson).</li></ul>",
src:["Silver, E., Pyke, D., y Thomas, D. (2017). <i>Inventory and Production Management in Supply Chains</i>. CRC Press.", "Chopra, S., y Meindl, P. (2013). <i>Administración de la cadena de suministro</i>, cap. 12. Pearson.", "Arrow, K. J., Harris, T., y Marschak, J. (1951). Optimal inventory policy. <i>Econometrica, 19</i>(3), 250–272."]
};
GUIDE["abc"] = {
que:"<p>La <b>clasificación ABC</b> ordena los artículos del inventario según su valor de consumo anual (cantidad × costo). Normalmente un 15 a 20 % de los ítems (clase A) concentra cerca del 80 % del valor; un 30 % (clase B) cerca del 15 %; y el 50 % restante (clase C) apenas el 5 %. Permite concentrar el control, el pronóstico y las negociaciones donde está el dinero.</p>",
hist:"<p>Se basa en el principio de Pareto: el economista italiano <b>Vilfredo Pareto</b> observó en 1896 que alrededor del 80 % de la tierra en Italia pertenecía al 20 % de la población. <b>Joseph Juran</b> generalizó la idea en la gestión de la calidad como «los pocos vitales y los muchos triviales» y la bautizó como principio de Pareto. H. Ford Dickie, de General Electric, la aplicó a los inventarios en 1951 con el nombre de análisis ABC.</p>",
como:"<ol><li>Calcula el valor anual de cada ítem: demanda anual × costo unitario.</li><li>Ordena de mayor a menor.</li><li>Calcula el porcentaje acumulado del valor.</li><li>Asigna A hasta el 80 % acumulado, B hasta el 95 % y C al resto (los cortes pueden ajustarse).</li></ol><p><b>Variantes:</b> ABC por margen, por número de movimientos (útil para ubicar productos en bodega: los de mayor rotación cerca del despacho), y la matriz <b>ABC-XYZ</b>, que combina valor con variabilidad de la demanda. En repuestos se usa además la criticidad (VED: vital, esencial, deseable).</p>",
pasos:"<ol><li>Extrae del ERP el consumo de los últimos 12 meses y el costo unitario.</li><li>Clasifica con la herramienta.</li><li>Define políticas por clase: A con revisión continua, pronóstico fino, conteo cíclico mensual y proveedores con contrato; B con revisión periódica; C con reglas simples y conteo anual.</li><li>Repite la clasificación cada 6 a 12 meses.</li></ol>",
caso:"<p><b>Caso tipo: bodega de una planta metalmecánica con 4.000 ítems.</b> El análisis muestra que unos 600 ítems explican el 80 % del valor inmovilizado. El equipo concentra el conteo cíclico en ellos y logra subir la exactitud de inventario de esos ítems sin agregar personal. Además, al reubicar los 300 ítems de mayor rotación cerca de la zona de despacho (ABC por movimientos), se reducen los recorridos de picking.</p>",
err:"<ul><li>Clasificar solo por precio unitario (un tornillo barato que se consume en grandes cantidades puede ser A).</li><li>Tratar como C un repuesto barato pero crítico: combina ABC con criticidad.</li><li>No actualizar la clasificación.</li></ul>",
src:["Juran, J. M. (1951). <i>Quality Control Handbook</i>. McGraw-Hill.", "Dickie, H. F. (1951). ABC inventory analysis shoots for dollars, not pennies. <i>Factory Management and Maintenance, 109</i>(7), 92–94.", "Ballou, R. H. (2004). <i>Logística: administración de la cadena de suministro</i> (5.ª ed.). Pearson."]
};
GUIDE["mrp"] = {
que:"<p>La <b>planificación de requerimientos de materiales (MRP)</b> calcula qué componentes comprar o fabricar, en qué cantidad y en qué momento, a partir del plan maestro de producción (qué productos terminados se harán y cuándo), la lista de materiales (BOM), el inventario disponible y los tiempos de entrega. Es para la <b>demanda dependiente</b>: la cantidad de ruedas que se necesitan depende de cuántas bicicletas se van a armar, así que no se pronostica, se calcula.</p>",
hist:"<p><b>Joseph Orlicky</b> implementó uno de los primeros sistemas MRP computacionales en J. I. Case Company en 1964 y publicó el libro <i>Material Requirements Planning</i> en 1975. La asociación APICS impulsó la «cruzada MRP» en los años setenta. Oliver Wight extendió el concepto a <b>MRP II</b> (planificación de recursos de manufactura), que integra capacidad y finanzas, y en 1990 la consultora Gartner acuñó el término <b>ERP</b> para los sistemas que integran toda la empresa (SAP, Oracle, Microsoft Dynamics). Más recientemente, Ptak y Smith (2011) propusieron el <b>DDMRP</b>, que agrega amortiguadores de inventario en puntos estratégicos.</p>",
como:"<ul><li><b>Requerimientos brutos (RB):</b> lo que pide el nivel superior (o el plan maestro).</li><li><b>Recepciones programadas (RP):</b> órdenes ya emitidas que llegarán.</li><li><b>Inventario proyectado:</b> inventario anterior + recepciones − requerimientos.</li><li><b>Necesidades netas (NN):</b> máx(0, RB + SS − disponible).</li><li><b>Recepción de órdenes planeadas:</b> NN ajustadas por la política de lote (lote a lote, cantidad fija, EOQ, cantidad periódica).</li><li><b>Lanzamiento de órdenes planeadas:</b> la recepción desplazada hacia atrás según el lead time.</li></ul><p>En un MRP completo, los lanzamientos de un ítem padre multiplicados por la cantidad de la BOM son los requerimientos brutos de cada hijo. Se calcula nivel por nivel (código de nivel más bajo).</p>",
pasos:"<ol><li>Valida la BOM (ingeniería) y el inventario (exactitud &gt; 95 %, si no el MRP planifica sobre datos falsos).</li><li>Define el plan maestro con ventas y operaciones.</li><li>Configura lead times y políticas de lote por ítem.</li><li>Ejecuta el MRP y revisa los mensajes de excepción (adelantar, postergar, cancelar órdenes).</li><li>Verifica capacidad (CRP) antes de liberar órdenes.</li></ol>",
caso:"<p><b>Caso tipo: fábrica de muebles de oficina.</b> Para armar 200 sillas en la semana 8 se necesitan 200 asientos, 200 respaldos y 1.000 ruedas. Si las ruedas tienen 4 semanas de lead time y hay 300 en bodega, el MRP indica lanzar una orden de 700 ruedas en la semana 4 (más el stock de seguridad). Sin MRP, la empresa solía descubrir el faltante cuando ya tenía los asientos listos y debía pagar flete aéreo.</p>",
err:"<ul><li>Inventarios con errores (el error más común y más dañino).</li><li>Lead times inflados «por si acaso», que generan inventario innecesario.</li><li>Plan maestro que cambia todos los días (nerviosismo del sistema).</li><li>Ignorar la capacidad: el MRP clásico supone capacidad infinita.</li></ul>",
src:["Orlicky, J. (1975). <i>Material Requirements Planning</i>. McGraw-Hill.", "Vollmann, T., Berry, W., Whybark, D. C., y Jacobs, F. R. (2005). <i>Planeación y control de la producción: administración de la cadena de suministros</i> (5.ª ed.). McGraw-Hill.", "Ptak, C., y Smith, C. (2011). <i>Orlicky's Material Requirements Planning</i> (3rd ed.). McGraw-Hill."]
};
GUIDE["balanceo"] = {
que:"<p>El <b>balanceo de línea</b> reparte las tareas de un proceso de ensamble entre estaciones de trabajo para que todas tengan una carga parecida y ninguna supere el <b>tiempo takt</b>, el ritmo que exige la demanda. Una línea mal balanceada tiene estaciones ociosas y otras saturadas que se convierten en cuello de botella.</p><p>Se aplica en ensamble de vehículos y electrodomésticos, líneas de envasado, preparación de pedidos en centros de distribución, cocinas industriales, procesos administrativos en serie e incluso en la atención de pacientes en vacunatorios.</p>",
hist:"<p>La línea de ensamble móvil de <b>Henry Ford</b> en Highland Park (1913) redujo el tiempo de montaje del chasis del Modelo T de más de 12 horas a alrededor de hora y media, dividiendo el trabajo en tareas cortas. El problema matemático fue formulado por M. E. Salveson en 1955. W. B. Helgeson y D. P. Birnie publicaron en 1961 el método del <b>peso posicional</b> (RPW), heurística que esta herramienta implementa. El término japonés <i>takt</i> (del alemán «compás») se difundió con el Sistema de Producción Toyota.</p>",
como:"<ul><li><b>Takt</b> = tiempo disponible ÷ demanda. Es el tiempo máximo que puede demorar cada estación.</li><li><b>Mínimo teórico de estaciones</b> = ⌈Σ tiempos ÷ takt⌉.</li><li><b>Diagrama de precedencias:</b> qué tareas deben estar terminadas antes de comenzar otra.</li><li><b>Heurísticas de asignación:</b> se abre una estación y se agregan tareas disponibles (sus precedentes ya asignados y que caben en el tiempo restante), eligiendo por prioridad: mayor peso posicional (tarea + todos sus sucesores), mayor tiempo, o más sucesores.</li><li><b>Eficiencia</b> = Σ tiempos ÷ (N × takt). <b>Retraso del balance</b> = 1 − eficiencia.</li></ul><p>Si una tarea dura más que el takt, hay que dividirla, duplicar la estación en paralelo o aumentar el tiempo disponible (turnos).</p>",
pasos:"<ol><li>Descompón el proceso en tareas elementales y mide sus tiempos estándar.</li><li>Dibuja el diagrama de precedencias.</li><li>Calcula el takt con la demanda real.</li><li>Asigna tareas con la heurística y prueba varias reglas.</li><li>Verifica en terreno con un piloto; ajusta por ergonomía y habilidades.</li><li>Grafica las cargas (gráfico de Yamazumi) y busca mejoras en la estación más cargada.</li></ol>",
caso:"<p><b>Caso tipo: línea de armado de calefactores.</b> La demanda subió a 360 unidades por turno y el takt bajó a 75 segundos. El balance anterior tenía una estación de 92 segundos (cuello de botella). Al recalcular con peso posicional y separar la tarea de soldadura en dos subtareas, se logró un balance de 4 estaciones con eficiencia superior a 85 %, sin contratar personal adicional. El gráfico de cargas por estación (Yamazumi) se pegó en la línea para que todos vieran el estándar.</p>",
err:"<ul><li>Balancear con tiempos estimados en vez de medidos.</li><li>Olvidar la variabilidad de los tiempos: una estación al 100 % del takt fallará en los ciclos lentos.</li><li>Ignorar restricciones de zona (tareas que deben hacerse en el mismo lado del producto) o de herramientas.</li></ul>",
src:["Helgeson, W. B., y Birnie, D. P. (1961). Assembly line balancing using the ranked positional weight technique. <i>Journal of Industrial Engineering, 12</i>(6), 394–398.", "Salveson, M. E. (1955). The assembly line balancing problem. <i>Journal of Industrial Engineering, 6</i>(3), 18–25.", "Chase, R. B., y Jacobs, F. R. (2014). <i>Administración de operaciones</i> (13.ª ed.), cap. 7. McGraw-Hill.", "Ford, H. (1922). <i>My Life and Work</i>. Doubleday."]
};
GUIDE["oee"] = {
que:"<p>El <b>OEE</b> (Overall Equipment Effectiveness, eficiencia general de los equipos) mide qué porcentaje del tiempo planificado un equipo produce piezas buenas a la velocidad ideal. Combina tres pérdidas: <b>disponibilidad</b> (paradas), <b>rendimiento</b> (velocidad) y <b>calidad</b> (defectos). Es el indicador central del mantenimiento productivo total (TPM) y de la mejora en plantas productivas.</p>",
hist:"<p>Fue propuesto por <b>Seiichi Nakajima</b>, del Japan Institute of Plant Maintenance (JIPM), como parte del TPM desarrollado en Japón en los años setenta; su libro <i>Introduction to TPM</i> se publicó en inglés en 1988. Nakajima definió las <b>seis grandes pérdidas</b>: averías, preparación y ajustes, paradas menores, velocidad reducida, defectos y reprocesos, y pérdidas de arranque.</p>",
como:"<ul><li><b>Disponibilidad</b> = tiempo operativo ÷ tiempo planificado.</li><li><b>Rendimiento</b> = (ciclo ideal × unidades totales) ÷ tiempo operativo.</li><li><b>Calidad</b> = unidades buenas ÷ unidades totales.</li><li><b>OEE</b> = A × R × C. Referencia clase mundial cercana a 85 % (90 % × 95 % × 99,9 %).</li></ul><p><b>Capacidad:</b> la capacidad de diseño es el máximo teórico; la efectiva descuenta mezcla de productos, mantenciones programadas y estándares de calidad. <b>Utilización</b> = producción real ÷ capacidad de diseño; <b>eficiencia</b> = producción real ÷ capacidad efectiva.</p>",
pasos:"<ol><li>Define el tiempo planificado (turno menos colación y mantenciones programadas).</li><li>Registra cada parada con su causa (planilla o sensores).</li><li>Fija el tiempo de ciclo ideal (el de diseño o el mejor demostrado).</li><li>Calcula el OEE diario y por turno.</li><li>Haz un Pareto de pérdidas y ataca la mayor con un equipo de mejora.</li></ol>",
caso:"<p><b>Caso tipo: línea de envasado de bebidas.</b> El OEE era 58 % y la gerencia pensaba comprar otra máquina. El desglose mostró que la mayor pérdida eran los cambios de formato (disponibilidad) y las microparadas en la etiquetadora (rendimiento). Con SMED y mejoras en el alimentador de etiquetas, el OEE subió a más de 70 %: se ganó capacidad equivalente a una fracción de máquina nueva sin invertir en equipos. Es un resultado frecuente: medir OEE suele revelar que la capacidad «faltante» está escondida en pérdidas.</p>",
err:"<ul><li>Usar un ciclo ideal lento para que el OEE «se vea bien».</li><li>Comparar OEE entre plantas con definiciones distintas.</li><li>Medirlo y no actuar sobre las pérdidas.</li></ul>",
src:["Nakajima, S. (1988). <i>Introduction to TPM: Total Productive Maintenance</i>. Productivity Press.", "Hansen, R. C. (2001). <i>Overall Equipment Effectiveness</i>. Industrial Press.", "Japan Institute of Plant Maintenance (JIPM). Materiales sobre TPM."]
};
GUIDE["smed"] = {
que:"<p><b>SMED</b> (Single-Minute Exchange of Die, cambio de matriz en minutos de un solo dígito) es una metodología para reducir el tiempo de cambio de formato o preparación de una máquina: el tiempo que pasa desde la última pieza buena de un producto hasta la primera pieza buena del siguiente. La meta original era bajar a menos de 10 minutos.</p><p>Reducir los cambios libera capacidad, permite lotes más pequeños, baja inventarios y acorta los plazos de entrega. Es la base para producir variedad con eficiencia.</p>",
hist:"<p>Fue desarrollada por <b>Shigeo Shingo</b>. En 1950, en la planta de Toyo Kogyo (hoy Mazda), distinguió por primera vez el trabajo que exige la máquina detenida del que puede hacerse con la máquina funcionando. En 1969, en Toyota, el cambio de matriz de una prensa de 1.000 toneladas que tomaba alrededor de cuatro horas se redujo a menos de 10 minutos. Shingo publicó el método en inglés en <i>A Revolution in Manufacturing: The SMED System</i> (1985).</p>",
como:"<ol><li><b>Observar</b> y filmar el cambio completo; listar cada actividad con su duración.</li><li><b>Separar</b> actividades <b>internas</b> (solo con la máquina detenida) de <b>externas</b> (se pueden hacer con la máquina funcionando).</li><li><b>Convertir</b> internas en externas: preparar herramientas, precalentar moldes, tener el material listo, usar carros con todo lo necesario.</li><li><b>Optimizar</b> las internas: sujeciones rápidas en vez de pernos, acoples rápidos, ajustes eliminados con topes y recetas, trabajo en paralelo de dos personas.</li><li><b>Optimizar</b> las externas y <b>estandarizar</b> con una lista de verificación.</li></ol><p><b>Beneficio:</b> horas liberadas = (tiempo antes − tiempo después) × cambios por período. Esas horas valen el margen de contribución de lo que se puede producir en ellas (si hay demanda) o el costo evitado (horas extra, turnos).</p>",
pasos:"<ol><li>Elige la máquina cuello de botella o la de más cambios.</li><li>Forma un equipo con operadores, mantención y calidad.</li><li>Filma al menos dos cambios y analízalos en grupo.</li><li>Usa la herramienta para cuantificar actual y propuesta.</li><li>Implementa primero lo que no cuesta (preparación previa), luego las mejoras de ingeniería.</li><li>Estandariza, capacita y mide el tiempo de cambio cada semana.</li></ol>",
caso:"<p><b>Caso tipo: inyectora de envases plásticos.</b> El ejemplo de la herramienta corresponde a una inyectora con cambios de 78 minutos, cinco veces por semana. Llevar a tiempo externo la búsqueda del molde, el traslado de herramientas y el precalentamiento, y acortar el desmontaje y montaje con sujeciones y acoples rápidos, baja el tiempo con la máquina detenida a 31 minutos. Son casi 4 horas productivas adicionales por semana. Es el mismo caso que desarrolla el ejemplo del generador de informes.</p><p><b>Caso histórico:</b> la reducción de cambios de matrices en las prensas de Toyota fue una de las condiciones para producir en lotes pequeños y nivelar la producción, pilar del justo a tiempo.</p>",
err:"<ul><li>Saltarse la filmación y basarse en la memoria.</li><li>Comprar herramientas antes de separar y convertir (lo más barato y efectivo es organizar).</li><li>No estandarizar: el tiempo vuelve a subir en pocas semanas.</li><li>Valorizar las horas liberadas si no hay demanda para ellas (en ese caso el beneficio es menor inventario o menos horas extra).</li></ul>",
src:["Shingo, S. (1985). <i>A Revolution in Manufacturing: The SMED System</i>. Productivity Press.", "Ohno, T. (1988). <i>Toyota Production System: Beyond Large-Scale Production</i>. Productivity Press.", "Liker, J. K. (2004). <i>The Toyota Way</i>. McGraw-Hill."]
};
GUIDE["vsm"] = {
que:"<p>El <b>mapa de flujo de valor (VSM)</b> dibuja en una sola hoja todos los pasos, inventarios y flujos de información desde que se recibe la materia prima hasta que el producto llega al cliente. Muestra cuánto del tiempo total (lead time) agrega valor y cuánto es espera. Suele revelar que el producto pasa más de 95 % del tiempo detenido en inventario.</p>",
hist:"<p>Toyota usaba «diagramas de flujo de material e información» internamente. <b>Mike Rother y John Shook</b> los sistematizaron en <i>Learning to See</i> (1998), publicado por el Lean Enterprise Institute, que se convirtió en la guía estándar del VSM.</p>",
como:"<ul><li><b>Mapa del estado actual:</b> procesos (cajas con tiempo de ciclo, tiempo de cambio, disponibilidad, operarios), inventarios entre procesos (triángulos), flujo de información (programación, pedidos) y línea de tiempo.</li><li><b>Lead time:</b> por la ley de Little, días de inventario = inventario ÷ demanda diaria.</li><li><b>Eficiencia del ciclo del proceso (PCE)</b> = tiempo de valor agregado ÷ lead time.</li><li><b>Mapa del estado futuro:</b> flujo continuo donde se pueda, supermercados con kanban donde no, un solo punto de programación (marcapasos), nivelación de la mezcla.</li></ul>",
pasos:"<ol><li>Elige una familia de productos.</li><li>Recorre el proceso en terreno desde el despacho hacia atrás.</li><li>Registra datos reales con cronómetro y conteos.</li><li>Dibuja el estado actual y calcula lead time y PCE.</li><li>Diseña el estado futuro y un plan de implementación de 6 a 12 meses.</li></ol>",
caso:"<p><b>Caso tipo: fábrica de estructuras metálicas.</b> Con los datos del ejemplo, una pieza tarda alrededor de 28 días en recorrer la planta, pero recibe apenas unos 4 minutos de trabajo. La mayor parte del inventario se acumula antes de corte y ensamble porque se programa cada proceso por separado. El estado futuro propone programar solo el ensamble y conectar los procesos previos con kanban, con la meta de bajar el lead time a menos de 10 días.</p>",
err:"<ul><li>Hacer el mapa en la oficina sin ir a terreno.</li><li>Mapear toda la planta en vez de una familia de productos.</li><li>Quedarse en el estado actual sin implementar el futuro.</li></ul>",
src:["Rother, M., y Shook, J. (1998). <i>Learning to See: Value Stream Mapping to Add Value and Eliminate Muda</i>. Lean Enterprise Institute.", "Womack, J. P., y Jones, D. T. (1996). <i>Lean Thinking</i>. Simon & Schuster.", "Little, J. D. C. (1961). A proof for the queuing formula L = λW. <i>Operations Research, 9</i>(3), 383–387."]
};
GUIDE["secuenciacion"] = {
que:"<p>La <b>secuenciación</b> decide el orden en que se procesan los trabajos que esperan en un centro de trabajo (una máquina, un taller, un analista, un pabellón quirúrgico). El orden cambia cuánto esperan los trabajos, cuántos se atrasan y cuánto inventario en proceso se acumula. Las <b>reglas de prioridad</b> son criterios simples y fáciles de aplicar en terreno.</p>",
hist:"<p>La teoría de programación de la producción (scheduling) nace en los años cincuenta. W. E. Smith demostró en 1956 que la regla del menor tiempo de proceso (SPT) minimiza el tiempo promedio de flujo en una máquina, y James R. Jackson (1955) que la regla de la fecha de entrega más temprana (EDD) minimiza el atraso máximo. Henry Gantt ya había creado en la década de 1910 sus cartas para visualizar la programación de talleres.</p>",
