CR("ramo-analisis-procesos", 1, "Análisis descriptivo de procesos", "Cómo describir, medir y representar un proceso para entenderlo antes de mejorarlo.",
"Todo lo que hace un ingeniero industrial ocurre dentro de un proceso: fabricar, despachar, atender, facturar. Antes de mejorar hay que describir con precisión qué pasa hoy, con diagramas y datos. Este ramo entrega el lenguaje común (diagramas, indicadores, estadística descriptiva) que se usa en todos los ramos posteriores y en cualquier trabajo.",
[["1. El enfoque de procesos", "<p>Un <b>proceso</b> es un conjunto de actividades relacionadas que transforman entradas en salidas que tienen valor para un cliente. La norma ISO 9001 adoptó el <b>enfoque basado en procesos</b>: gestionar la organización como una red de procesos interrelacionados en vez de departamentos aislados.</p><p>Los procesos se clasifican en <b>estratégicos</b> (planificación, dirección), <b>operativos o clave</b> (los que entregan el producto o servicio: comprar, producir, vender, despachar) y de <b>apoyo</b> (mantenimiento, personas, TI, finanzas). El <b>mapa de procesos</b> muestra estos tres niveles en una lámina, con el cliente a la entrada (requisitos) y a la salida (satisfacción).</p><p>Cada proceso tiene un <b>dueño</b> que responde por su desempeño, <b>límites</b> (dónde empieza y termina), <b>entradas y salidas</b>, <b>recursos</b> e <b>indicadores</b>. La pregunta guía es siempre: ¿qué valor recibe el cliente de este proceso?</p><p><b>Historia:</b> el enfoque de procesos viene de la gestión de la calidad (Deming, Juran) y de la reingeniería de procesos de Michael Hammer y James Champy (<i>Reengineering the Corporation</i>, 1993), que propusieron rediseñar radicalmente los procesos en lugar de mejorar funciones aisladas.</p>"],
["2. Diagramas de procesos", "<p>Representar un proceso gráficamente permite verlo completo, detectar pasos innecesarios y acordar cómo funciona. Los principales diagramas son:</p><ul><li><b>Diagrama de flujo (flujograma):</b> secuencia de actividades y decisiones con símbolos estándar (ANSI): óvalo para inicio y fin, rectángulo para actividad, rombo para decisión, flechas para el flujo.</li><li><b>Diagrama de operaciones del proceso (DOP):</b> muestra solo operaciones (círculo) e inspecciones (cuadrado) en orden, con los materiales que entran.</li><li><b>Diagrama de análisis del proceso (DAP o cursograma analítico):</b> usa los cinco símbolos de la ASME: operación (○), transporte (⇨), inspección (□), demora (D) y almacenamiento (▽), con distancias y tiempos. Permite calcular cuánto del proceso es operación y cuánto es transporte o espera.</li><li><b>Diagrama de recorrido:</b> dibuja el flujo sobre el plano de la planta; revela cruces y retrocesos.</li><li><b>Diagrama de flujo funcional o de carriles (swimlane):</b> separa las actividades por área o persona; útil para ver traspasos entre departamentos.</li><li><b>BPMN 2.0:</b> notación estándar para procesos de negocio, usada en software de gestión de procesos (Bizagi, Camunda).</li><li><b>SIPOC</b> y <b>VSM:</b> visiones de alto nivel y de flujo de valor (ver herramientas).</li></ul><p><b>Historia:</b> Frank y Lillian Gilbreth presentaron en 1921 ante la American Society of Mechanical Engineers (ASME) el «process chart», origen de los símbolos que la ASME estandarizó en 1947.</p>"],
["3. Levantamiento de información en terreno", "<p>Un proceso se describe <b>observándolo</b>, no imaginándolo desde la oficina. Técnicas:</p><ul><li><b>Recorrido (gemba walk):</b> seguir el producto o el documento de principio a fin.</li><li><b>Entrevistas</b> a quienes ejecutan cada paso: ¿qué haces?, ¿qué necesitas para hacerlo?, ¿qué te detiene?, ¿qué pasa si algo sale mal?</li><li><b>Observación y medición:</b> cronometrar, contar inventarios, registrar esperas.</li><li><b>Revisión de documentos:</b> procedimientos, registros, datos del sistema (ERP).</li><li><b>Hojas de verificación:</b> formularios simples para contar eventos por tipo, hora y lugar.</li></ul><p>Regla práctica: el procedimiento escrito y la realidad casi nunca coinciden. El diagrama debe mostrar cómo se trabaja de verdad («as is») antes de diseñar cómo debería ser («to be»).</p>"],
["4. Indicadores de desempeño de un proceso", "<p>Un proceso se evalúa con indicadores de:</p><ul><li><b>Eficacia:</b> ¿logra su resultado? (porcentaje de pedidos completos, cumplimiento del plan).</li><li><b>Eficiencia:</b> ¿cuántos recursos usa? (horas por unidad, costo por pedido).</li><li><b>Calidad:</b> ¿lo hace bien a la primera? (porcentaje de defectos, reprocesos).</li><li><b>Tiempo:</b> lead time, tiempo de ciclo, tiempo de espera.</li><li><b>Capacidad:</b> cuánto puede procesar por unidad de tiempo; el <b>cuello de botella</b> es el paso con menor capacidad y define la capacidad de todo el proceso.</li></ul><p>Relaciones útiles: <b>tiempo de ciclo</b> = tiempo disponible ÷ unidades producidas; <b>ley de Little</b>: inventario en proceso = tasa de salida × tiempo en el proceso; <b>eficiencia del proceso</b> = tiempo que agrega valor ÷ tiempo total.</p>"],
["5. Estadística descriptiva aplicada a procesos", "<p>Los datos de un proceso (tiempos, pesos, defectos) varían. Para describirlos se usan:</p><ul><li>Medidas de tendencia central: media, mediana y moda.</li><li>Medidas de dispersión: rango, varianza, desviación estándar y coeficiente de variación.</li><li>Gráficos: histograma (forma de la distribución), diagrama de caja (atípicos), gráfico de series en el tiempo (tendencias y cambios), Pareto (prioridades).</li></ul><p>La pregunta clave es si la variación es la normal del proceso o si algo cambió. Esa pregunta se responde formalmente con los gráficos de control de Shewhart, que verás en ramos posteriores.</p><p>Practica con las herramientas de estadística descriptiva y Pareto de esta app usando datos reales de tu trabajo o de tu casa (tiempos de traslado, consumos de luz).</p>"]],
["sipoc", "descriptiva", "pareto", "vsm", "ishikawa"],
["Freivalds, A., y Niebel, B. W. (2014). <i>Ingeniería industrial de Niebel: métodos, estándares y diseño del trabajo</i> (13.ª ed.). McGraw-Hill.", "Pérez Fernández de Velasco, J. A. (2012). <i>Gestión por procesos</i> (5.ª ed.). ESIC.", "Hammer, M., y Champy, J. (1994). <i>Reingeniería</i>. Norma.", "Object Management Group. (2011). <i>Business Process Model and Notation (BPMN) v2.0</i>."]);

CR("ramo-nivelacion-matematica", 1, "Nivelación matemática", "Álgebra, funciones, porcentajes y exponenciales: la base para cálculo, finanzas y optimización.",
"Casi todos los errores en los ramos de ingeniería económica, costos y optimización se deben a problemas de álgebra básica: despejar mal, confundir porcentajes o manejar mal exponentes. Este ramo asegura esa base.",
[["1. Álgebra y ecuaciones", "<p>Despejar variables, resolver ecuaciones lineales y cuadráticas, y sistemas de dos ecuaciones son operaciones que se usan a diario. Ejemplo de ingeniería: el punto de equilibrio sale de igualar ingresos y costos, p·Q = CF + cv·Q, y despejar Q = CF ÷ (p − cv).</p><p>Ecuación cuadrática: ax² + bx + c = 0 → x = [−b ± √(b² − 4ac)] ÷ 2a. Aparece en problemas de áreas, trayectorias y en algunos modelos de costos.</p>"],
["2. Porcentajes, proporciones y variaciones", "<ul><li>Variación porcentual = (valor final − valor inicial) ÷ valor inicial.</li><li>Un aumento de 20 % seguido de una baja de 20 % no deja el valor igual: 100 × 1,2 × 0,8 = 96.</li><li>IVA: precio con IVA = neto × 1,19; neto = precio con IVA ÷ 1,19 (no restar 19 %).</li><li>Margen sobre el precio vs markup sobre el costo.</li><li>Regla de tres y proporcionalidad directa e inversa (más operarios, menos tiempo).</li></ul>"],
["3. Funciones", "<p>Una función relaciona una variable de entrada con una de salida. Tipos clave en ingeniería:</p><ul><li><b>Lineal</b> y = mx + b: costos totales (b = costo fijo, m = costo variable).</li><li><b>Cuadrática:</b> ingresos con precio que baja al vender más; tiene un máximo.</li><li><b>Exponencial</b> y = a(1 + r)<sup>t</sup>: interés compuesto, crecimiento de la demanda, depreciación por saldo decreciente.</li><li><b>Logarítmica:</b> inversa de la exponencial; despeja tiempos («¿en cuántos años se duplica?»: t = ln 2 ÷ ln(1 + r)).</li><li><b>Potencia:</b> curva de aprendizaje T<sub>n</sub> = T<sub>1</sub>n<sup>b</sup>.</li></ul>"],
["4. Exponentes y logaritmos", "<ul><li>a<sup>m</sup>·a<sup>n</sup> = a<sup>m+n</sup>; (a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup>; a<sup>−n</sup> = 1 ÷ a<sup>n</sup>; a<sup>1/n</sup> = raíz n-ésima.</li><li>log(ab) = log a + log b; log(a<sup>n</sup>) = n log a.</li><li>Regla del 72: el dinero se duplica en aproximadamente 72 ÷ (tasa en %) años.</li><li>Los decibeles del ruido son logarítmicos: dos fuentes de 85 dB suman 88 dB, no 170.</li></ul>"]],
["equivalencias", "tasas", "equilibrio", "aprendizaje"],
["Stewart, J., Redlin, L., y Watson, S. (2017). <i>Precálculo: matemáticas para el cálculo</i> (7.ª ed.). Cengage.", "Haeussler, E., Paul, R., y Wood, R. (2015). <i>Matemáticas para administración y economía</i> (13.ª ed.). Pearson."]);

CR("ramo-topicos-ingenieria", 1, "Tópicos de ingeniería", "Qué es la ingeniería, cómo resuelve problemas y qué rol cumple el ingeniero industrial.",
"Entender el oficio: cómo piensa un ingeniero, qué responsabilidad ética tiene y por qué la ingeniería industrial es la «ingeniería de los sistemas» que combina personas, máquinas, materiales, información y dinero.",
[["1. La ingeniería y su historia", "<p>La ingeniería aplica conocimiento científico y empírico para diseñar soluciones útiles bajo restricciones de costo, tiempo, seguridad y ambiente. Las primeras escuelas formales fueron la École des Ponts et Chaussées (Francia, 1747) y la École Polytechnique (1794). En Chile, la enseñanza de la ingeniería comenzó en el siglo XIX en la Universidad de Chile, y el Colegio de Ingenieros de Chile se creó en 1958.</p><p><b>La ingeniería industrial</b> nació a fines del siglo XIX con la administración científica de Frederick Taylor, el estudio de movimientos de los Gilbreth y la carta de Henry Gantt. El primer programa universitario de ingeniería industrial se creó en la Universidad Estatal de Pensilvania en 1908. Después de la Segunda Guerra Mundial se incorporaron la investigación de operaciones, la estadística y la computación, y luego la calidad total, el lean y la analítica de datos.</p>"],
["2. El método de ingeniería y la resolución de problemas", "<ol><li><b>Definir el problema</b> con datos: qué, dónde, cuándo, cuánto (no la solución disfrazada de problema).</li><li><b>Investigar</b> antecedentes, restricciones y requisitos.</li><li><b>Generar alternativas</b> (creatividad, benchmarking).</li><li><b>Analizar y evaluar</b> alternativas con criterios técnicos, económicos y de riesgo.</li><li><b>Decidir</b> e implementar.</li><li><b>Verificar</b> resultados y estandarizar.</li></ol><p>Es el mismo ciclo que el PDCA de Deming y el DMAIC de Seis Sigma. Herramientas útiles: árbol de problemas, Ishikawa, 5 porqués, matriz de decisión.</p>"],
["3. Ética profesional", "<p>El ingeniero toma decisiones que afectan la seguridad, la salud y el ambiente. El Código de Ética del Colegio de Ingenieros de Chile establece deberes con la sociedad, los clientes y la profesión: priorizar la seguridad pública, actuar con competencia, honestidad e independencia, y no ocultar riesgos.</p><p><b>Casos de estudio:</b> el colapso del puente de Tacoma Narrows (1940) por un fenómeno aerodinámico no considerado; la explosión del transbordador Challenger (1986), en que los ingenieros advirtieron el riesgo de los sellos con bajas temperaturas y la decisión de lanzar se tomó igual; el derrame del Exxon Valdez (1989); la falla de la represa de relaves de Brumadinho en Brasil (2019). En todos aparece la presión por costos o plazos frente a advertencias técnicas.</p>"],
["4. Sostenibilidad y rol del ingeniero industrial", "<p>Los Objetivos de Desarrollo Sostenible (ONU, 2015) y la economía circular cambian cómo se diseñan procesos y productos: reducir, reutilizar, reciclar y diseñar para desmontar. En Chile la Ley REP (20.920) obliga a los productores a hacerse cargo de sus envases y neumáticos.</p><p>El ingeniero industrial trabaja como integrador: conecta producción, finanzas, personas y clientes con una visión de sistema. Su ventaja es medir, modelar y decidir con datos, y su desafío es implementar cambios con las personas.</p>"]],
["porques", "ishikawa", "factores"],
["Krick, E. V. (2008). <i>Introducción a la ingeniería y al diseño en la ingeniería</i>. Limusa.", "Baca Urbina, G. (2014). <i>Introducción a la ingeniería industrial</i> (2.ª ed.). Patria.", "Colegio de Ingenieros de Chile. Código de Ética Profesional (ingenieros.cl).", "Turner, W. C., Mize, J., Case, K., y Nazemetz, J. (1993). <i>Introducción a la ingeniería industrial</i>. Prentice Hall."]);

CR("ramo-innovacion-1", 1, "Taller de innovación y emprendimiento I", "Design thinking, ideación, prototipos y propuesta de valor.",
"Las empresas necesitan ingenieros que no solo optimicen lo existente, sino que creen productos, servicios y procesos nuevos. Este taller enseña métodos para innovar centrados en el usuario.",
[["1. Qué es innovar", "<p>Innovar es implementar algo nuevo que genera valor: un producto, un proceso, un modelo de negocio o una forma de organizarse. Joseph Schumpeter (1934) la describió como «destrucción creativa». El <b>Manual de Oslo</b> de la OCDE clasifica la innovación en producto, proceso, marketing y organización. Clayton Christensen distinguió la innovación <b>incremental</b> (mejorar lo existente) de la <b>disruptiva</b> (soluciones más simples y baratas que terminan desplazando a las establecidas).</p>"],
["2. Design thinking", "<p>Método popularizado por la consultora IDEO y la d.school de Stanford en la década de 2000, con cinco etapas:</p><ol><li><b>Empatizar:</b> entrevistar y observar a los usuarios para entender sus necesidades reales.</li><li><b>Definir:</b> formular el desafío como pregunta: «¿Cómo podríamos…?».</li><li><b>Idear:</b> generar muchas ideas sin juzgar (lluvia de ideas, SCAMPER).</li><li><b>Prototipar:</b> construir versiones rápidas y baratas para aprender.</li><li><b>Testear:</b> probar con usuarios y volver a iterar.</li></ol><p>Herramientas: mapa de empatía, mapa de viaje del usuario (customer journey), persona, matriz de priorización impacto-esfuerzo.</p>"],
["3. Propuesta de valor y modelo de negocio", "<p>El <b>Value Proposition Canvas</b> conecta los trabajos, dolores y ganancias del cliente con productos, aliviadores de dolor y creadores de ganancia. El <b>Business Model Canvas</b> describe cómo el negocio crea, entrega y captura valor (ver herramienta Canvas).</p>"],
["4. Trabajo en equipo y presentación", "<p>Los equipos innovadores combinan perfiles diversos, acuerdan roles (RACI) y trabajan en ciclos cortos. La presentación final (pitch) debe contar el problema, la solución, el mercado, el modelo de negocio, el equipo y lo que se necesita, en 3 a 5 minutos.</p>"]],
["canvas", "foda", "factores"],
["Brown, T. (2009). <i>Change by Design</i>. HarperBusiness.", "Osterwalder, A., Pigneur, Y., Bernarda, G., y Smith, A. (2015). <i>Diseñando la propuesta de valor</i>. Deusto.", "Christensen, C. M. (1997). <i>The Innovator's Dilemma</i>. Harvard Business School Press.", "OCDE y Eurostat. (2018). <i>Oslo Manual 2018</i> (4th ed.)."]);

CR("ramo-intro-programacion", 1, "Introducción a la programación", "Algoritmos, variables, control de flujo, funciones y estructuras de datos con Python.",
"Programar ya no es exclusivo de informáticos: un ingeniero industrial que automatiza planillas, limpia datos y construye modelos en Python ahorra cientos de horas y resuelve problemas que Excel no puede.",
[["1. Algoritmos y pensamiento computacional", "<p>Un <b>algoritmo</b> es una secuencia finita de pasos para resolver un problema. El pensamiento computacional se basa en descomponer el problema, reconocer patrones, abstraer lo esencial y diseñar el algoritmo. Se representa con pseudocódigo o diagramas de flujo antes de programar.</p>"],
["2. Elementos básicos (Python)", "<ul><li>Variables y tipos: enteros, decimales, texto, booleanos.</li><li>Operadores aritméticos, de comparación y lógicos.</li><li>Condicionales: <code>if / elif / else</code>.</li><li>Ciclos: <code>for</code> (recorrer listas o rangos) y <code>while</code>.</li><li>Funciones: bloques reutilizables con parámetros y retorno.</li><li>Estructuras: listas, diccionarios, tuplas.</li></ul><p>Python fue creado por Guido van Rossum y publicado en 1991; hoy es el lenguaje más usado en análisis de datos.</p>"],
["3. Aplicaciones en ingeniería industrial", "<ul><li><b>pandas</b>: leer y procesar planillas y bases de datos.</li><li><b>matplotlib</b>: gráficos.</li><li><b>PuLP / OR-Tools</b>: programación lineal y entera.</li><li><b>SimPy</b>: simulación de eventos discretos (colas, procesos).</li><li><b>scikit-learn</b>: aprendizaje automático (pronósticos, clasificación).</li></ul><p>Ejemplo: un script que lee el reporte diario de producción, calcula el OEE por máquina y envía un resumen evita una hora diaria de trabajo manual.</p>"],
["4. Buenas prácticas", "<ul><li>Nombres de variables descriptivos.</li><li>Funciones cortas con una sola responsabilidad.</li><li>Comentarios que explican el porqué, no el qué.</li><li>Probar con casos simples cuyo resultado conoces.</li><li>Control de versiones con Git.</li></ul>"]],
["pronosticos", "programacion-lineal", "simulacion-mc"],
["Downey, A. (2015). <i>Think Python</i> (2nd ed.). O'Reilly. Disponible gratis en greenteapress.com.", "McKinney, W. (2022). <i>Python for Data Analysis</i> (3rd ed.). O'Reilly.", "Documentación oficial de Python (docs.python.org/es)."]);

CR("ramo-fisica-medicion", 2, "Elementos de física y medición", "Sistema Internacional, mediciones, incertidumbre, cinemática y metrología industrial.",
"Medir bien es la base de la calidad y de cualquier decisión con datos. Un instrumento descalibrado o una medición mal hecha invalida un estudio de capacidad, un control de procesos o un balance de energía.",
[["1. Sistema Internacional y unidades", "<p>El SI tiene siete unidades base: metro, kilogramo, segundo, amperio, kelvin, mol y candela. Las demás son derivadas (newton, joule, watt, pascal). En Chile la metrología legal está a cargo de la Red Nacional de Metrología coordinada por el Instituto Nacional de Normalización (INN).</p>"],
["2. Medición, error e incertidumbre", "<ul><li><b>Exactitud:</b> cercanía al valor verdadero. <b>Precisión:</b> cercanía entre mediciones repetidas.</li><li><b>Error sistemático</b> (sesgo, se corrige calibrando) y <b>error aleatorio</b> (se reduce promediando).</li><li><b>Cifras significativas:</b> el resultado no puede ser más preciso que el instrumento.</li><li><b>Propagación de incertidumbre</b> en sumas, productos y funciones.</li><li><b>Estudio R&R</b> (repetibilidad y reproducibilidad): mide cuánto de la variación observada viene del sistema de medición. Regla AIAG: menos de 10 % aceptable, 10–30 % condicional, más de 30 % inaceptable.</li></ul>"],
["3. Instrumentos de medición en planta", "<p>Pie de metro (calibrador vernier), micrómetro, reloj comparador, galgas, balanzas, termómetros y termocuplas, manómetros, flujómetros, sonómetros, luxómetros. Todo instrumento usado para control de calidad debe tener un programa de calibración con trazabilidad a patrones nacionales (requisito de ISO 9001, cláusula 7.1.5).</p>"],
["4. Cinemática y dinámica básica", "<p>Movimiento rectilíneo uniforme y acelerado (v = v₀ + at; x = x₀ + v₀t + ½at²), movimiento en dos dimensiones y leyes de Newton. Aplicaciones: tiempos de recorrido de grúas horquilla, distancia de frenado de camiones, velocidad de correas transportadoras (capacidad = carga por metro × velocidad).</p>"]],
["conversor", "capacidad", "descriptiva"],
["Serway, R., y Jewett, J. (2018). <i>Física para ciencias e ingeniería</i> (10.ª ed.). Cengage.", "AIAG. (2010). <i>Measurement Systems Analysis (MSA)</i> (4th ed.).", "JCGM. (2008). <i>Guía para la expresión de la incertidumbre de medida (GUM)</i>."]);

CR("ramo-fundamentos-matematicas", 2, "Fundamentos de matemáticas", "Funciones, trigonometría, vectores, matrices y sistemas de ecuaciones lineales.",
"Las matrices y los sistemas de ecuaciones son el lenguaje de la programación lineal, el MRP (listas de materiales), las cadenas de Markov y los modelos de redes.",
[["1. Funciones y gráficas", "<p>Dominio, recorrido, composición, inversa, funciones por tramos (tarifas con descuentos por volumen) y transformaciones de gráficas.</p>"],
["2. Trigonometría y vectores", "<p>Razones trigonométricas, teorema de Pitágoras, ley de senos y cosenos. Vectores: suma, producto punto y aplicaciones en fuerzas sobre estructuras y distancias en planos de planta (distancia euclidiana vs rectilínea, usada en localización y layout).</p>"],
["3. Matrices", "<p>Suma, multiplicación, transpuesta, inversa y determinante. Aplicaciones: la lista de materiales multinivel se representa como matriz; la multiplicación por el vector de demanda da los requerimientos totales de componentes. Las matrices de transición describen cadenas de Markov (participación de mercado, estados de una máquina).</p>"],
["4. Sistemas de ecuaciones lineales", "<p>Métodos de sustitución, eliminación de Gauss y Gauss-Jordan, y regla de Cramer. Un sistema puede tener una, infinitas o ninguna solución. El método Simplex de programación lineal es, en el fondo, una secuencia de operaciones de Gauss-Jordan sobre la tabla del problema.</p>"]],
["programacion-lineal", "mrp", "localizacion"],
["Grossman, S. (2012). <i>Álgebra lineal</i> (7.ª ed.). McGraw-Hill.", "Stewart, J., Redlin, L., y Watson, S. (2017). <i>Precálculo</i>. Cengage."]);

CR("ramo-quimica-ambiente", 2, "Química y ambiente", "Materia, reacciones, combustión, agua, residuos y gestión ambiental.",
"Los procesos industriales transforman materia y energía, y generan emisiones y residuos. Entender la química básica permite hacer balances de masa, calcular emisiones y cumplir la normativa ambiental.",
[["1. Materia, estequiometría y reacciones", "<p>Átomos, moléculas, mol, masa molar y balance de ecuaciones químicas. La estequiometría permite calcular cuánto reactivo se necesita y cuánto producto se obtiene. Ejemplo minero: en la lixiviación de minerales oxidados de cobre se usa ácido sulfúrico; su consumo por tonelada de mineral es un costo clave.</p>"],
["2. Combustión y emisiones", "<p>La combustión de hidrocarburos produce CO₂ y agua: C<sub>n</sub>H<sub>m</sub> + O₂ → CO₂ + H₂O. Por estequiometría, quemar un litro de diésel emite cerca de 2,7 kg de CO₂, base de la huella de carbono. La combustión incompleta genera CO y material particulado (MP2,5), regulado por normas de calidad del aire.</p>"],
["3. Agua y residuos", "<p>Parámetros de calidad del agua (pH, DBO, sólidos), tratamiento de riles (residuos industriales líquidos), residuos peligrosos (DS 148), y jerarquía de residuos: prevenir, reutilizar, reciclar, valorizar y, al final, eliminar. Ley REP (20.920) de responsabilidad extendida del productor.</p>"],
["4. Gestión ambiental", "<p>Ley 19.300 de bases del medio ambiente y el <b>Sistema de Evaluación de Impacto Ambiental (SEIA)</b>: los proyectos con impactos significativos presentan una Declaración (DIA) o un Estudio de Impacto Ambiental (EIA). Norma ISO 14001 de sistemas de gestión ambiental: aspectos e impactos, requisitos legales, objetivos y mejora continua. Economía circular y análisis de ciclo de vida (ISO 14040).</p>"]],
["huella"],
["Chang, R., y Goldsby, K. (2017). <i>Química</i> (12.ª ed.). McGraw-Hill.", "Ley 19.300 sobre Bases Generales del Medio Ambiente. BCN.", "ISO 14001:2015. Sistemas de gestión ambiental.", "Servicio de Evaluación Ambiental (sea.gob.cl)."]);

CR("ramo-intro-optimizacion", 2, "Introducción a los métodos de optimización", "Modelación matemática, programación lineal, método gráfico y Solver.",
"Optimizar es encontrar la mejor decisión dentro de lo posible. Es la herramienta que más distingue al ingeniero industrial: decidir con modelos en vez de intuición.",
[["1. Modelación matemática", "<p>Traducir un problema real a un modelo con <b>variables de decisión</b>, <b>función objetivo</b> y <b>restricciones</b>. La parte más difícil y valiosa es la modelación, no el cálculo. Preguntas guía: ¿qué decido?, ¿qué quiero lograr?, ¿qué me limita?</p>"],
["2. Programación lineal y método gráfico", "<p>Con dos variables, cada restricción es una recta y la región factible es un polígono; el óptimo está en un vértice. Casos especiales: soluciones múltiples (función objetivo paralela a una restricción), no acotada, infactible. Practica con la herramienta de programación lineal, que dibuja la región factible.</p>"],
["3. Solver de Excel", "<ol><li>Celdas de variables, celda objetivo con SUMAPRODUCTO, celdas de restricciones.</li><li>Datos → Solver: objetivo, celdas cambiantes, restricciones, «Convertir variables sin restricciones en no negativas», método Simplex LP.</li><li>Informe de sensibilidad: precios sombra y rangos.</li></ol>"],
["4. Problemas típicos", "<p>Mezcla de productos, dieta y mezclas (minerales, alimentos), planificación de producción multiperíodo, asignación de turnos, transporte, inversión con presupuesto limitado (programación entera binaria: invertir o no en cada proyecto).</p>"]],
["programacion-lineal", "transporte", "asignacion"],
["Hillier, F. S., y Lieberman, G. J. (2010). <i>Introducción a la investigación de operaciones</i>. McGraw-Hill.", "Winston, W. L., y Albright, S. C. (2015). <i>Practical Management Science</i> (5th ed.). Cengage."]);

CR("ramo-calculo", 3, "Cálculo diferencial e integral", "Límites, derivadas, optimización e integrales con aplicaciones a la gestión.",
"La derivada es la herramienta matemática de la optimización (costos mínimos, utilidades máximas) y del análisis marginal; la integral, de los acumulados (producción total, consumo de energía, probabilidades).",
[["1. Límites y continuidad", "<p>Concepto de límite, límites laterales, continuidad. Aplicación: la capitalización continua es el límite de (1 + r/m)<sup>m</sup> cuando m tiende a infinito, que da e<sup>r</sup>.</p>"],
["2. Derivadas y análisis marginal", "<p>La derivada mide la tasa de cambio. En economía: <b>costo marginal</b> (cuánto cuesta producir una unidad más), <b>ingreso marginal</b> y <b>utilidad marginal</b>. Reglas: potencia, producto, cociente y cadena.</p>"],
["3. Optimización", "<p>Los máximos y mínimos ocurren donde la derivada es cero (y se verifica con la segunda derivada). <b>Ejemplo clásico: el EOQ.</b> CT(Q) = DS/Q + HQ/2. Derivando: −DS/Q² + H/2 = 0 → Q* = √(2DS/H). La segunda derivada 2DS/Q³ es positiva, así que es un mínimo. Otros: precio que maximiza la utilidad, dimensiones de un envase con menor costo de material.</p>"],
["4. Integrales", "<p>La integral suma cantidades continuas: área bajo una curva. Aplicaciones: producción acumulada a partir de una tasa variable, consumo de energía (integral de la potencia en el tiempo), valor presente de un flujo continuo, probabilidades con funciones de densidad (el área bajo la normal entre dos valores).</p>"]],
["eoq", "equilibrio", "capacidad"],
["Stewart, J. (2018). <i>Cálculo de una variable: trascendentes tempranas</i> (8.ª ed.). Cengage.", "Haeussler, E., Paul, R., y Wood, R. (2015). <i>Matemáticas para administración y economía</i>. Pearson."]);

CR("ramo-ingles", 3, "Inglés I a IV (inglés técnico)", "Vocabulario técnico de ingeniería industrial y comunicación profesional en inglés.",
"Los manuales de equipos, las normas internacionales, el software y buena parte de la bibliografía están en inglés. Además, la minería, la banca y las multinacionales en Chile valoran el inglés en sus procesos de selección y para cargos de jefatura.",
[["1. Vocabulario de operaciones", "<p><b>Lead time</b> (tiempo de entrega), <b>throughput</b> (tasa de salida), <b>bottleneck</b> (cuello de botella), <b>work in process (WIP)</b>, <b>yield</b> (rendimiento), <b>scrap</b> (desecho), <b>rework</b> (reproceso), <b>setup / changeover</b> (cambio de formato), <b>downtime</b> (tiempo detenido), <b>uptime</b>, <b>shift</b> (turno), <b>backlog</b> (trabajo pendiente).</p>"],
["2. Vocabulario de calidad y logística", "<p><b>Root cause</b>, <b>corrective action</b>, <b>nonconformity</b>, <b>audit</b>, <b>supplier</b>, <b>purchase order (PO)</b>, <b>bill of materials (BOM)</b>, <b>stock-out</b> (quiebre de stock), <b>fill rate</b>, <b>on-time delivery</b>, <b>warehouse</b>, <b>picking</b>, <b>freight</b> (flete), <b>incoterms</b> (FOB, CIF, EXW, DDP).</p>"],
["3. Vocabulario financiero y de proyectos", "<p><b>Net present value (NPV)</b> = VAN, <b>internal rate of return (IRR)</b> = TIR, <b>payback</b>, <b>cash flow</b>, <b>capital expenditure (CAPEX)</b>, <b>operating expenditure (OPEX)</b>, <b>break-even</b>, <b>milestone</b> (hito), <b>scope</b> (alcance), <b>stakeholder</b> (interesado), <b>deliverable</b> (entregable).</p>"],
["4. Comunicación profesional", "<p>Correos: asunto claro, saludo («Dear Mr. Smith» / «Hi Ana»), propósito en la primera línea, cierre con acción («Could you please confirm by Friday?»). Reuniones: «Let's go through the agenda», «Could you clarify…?», «To sum up…». Presentaciones: «The main finding is…», «As shown in the chart…».</p>"]],
[],
["Ibbotson, M. (2008). <i>Cambridge English for Engineering</i>. Cambridge University Press.", "Cambridge Dictionary (dictionary.cambridge.org)."]);

CR("ramo-mecanica", 3, "Mecánica", "Estática, dinámica, trabajo, energía y potencia aplicadas a equipos industriales.",
"Permite entender cómo funcionan los equipos que el ingeniero gestiona (correas, grúas, bombas, motores), dimensionar potencias y conversar con mantención con fundamento técnico.",
[["1. Estática", "<p>Equilibrio de fuerzas (ΣF = 0) y de momentos (ΣM = 0), diagramas de cuerpo libre, fricción. Aplicaciones: cargas en estanterías (racks), estabilidad de grúas horquilla (el centro de gravedad de la carga respecto del eje delantero), tensiones en eslingas de izaje.</p>"],
["2. Dinámica", "<p>Segunda ley de Newton (F = ma), movimiento circular, impulso y cantidad de movimiento. Aplicaciones: fuerza necesaria para acelerar una carga, frenado de vehículos, choques.</p>"],
["3. Trabajo, energía y potencia", "<p>Trabajo W = F·d; energía cinética ½mv² y potencial mgh; potencia P = W/t. Potencia de una correa que eleva material: P = caudal másico × g × altura ÷ eficiencia. Eficiencia de motores y bombas; consumo eléctrico = potencia × horas (kWh), base del costo de energía.</p>"],
["4. Máquinas y transmisiones", "<p>Palancas, poleas, engranajes y reductores: relación de transmisión y torque. Torque × velocidad angular = potencia. Selección de motores y vida útil de rodamientos (base del mantenimiento).</p>"]],
["conversor", "vida-economica"],
["Beer, F., Johnston, E. R., y Mazurek, D. (2017). <i>Mecánica vectorial para ingenieros: estática</i> (11.ª ed.). McGraw-Hill.", "Hibbeler, R. C. (2016). <i>Ingeniería mecánica: dinámica</i> (14.ª ed.). Pearson."]);

CR("ramo-innovacion-2", 3, "Taller de innovación y emprendimiento II", "Validación de negocios, producto mínimo viable, pitch, financiamiento y propiedad intelectual.",
"Pasar de una idea a un negocio validado: probar hipótesis con clientes, construir lo mínimo necesario y conseguir financiamiento.",
[["1. Lean startup", "<p>Eric Ries (2011) propuso el ciclo <b>construir–medir–aprender</b>: lanzar un <b>producto mínimo viable (MVP)</b>, medir el comportamiento real de los clientes y decidir si perseverar o pivotar. Steve Blank aportó el «desarrollo de clientes»: salir de la oficina a validar el problema antes que la solución.</p>"],
["2. Validación y métricas", "<p>Entrevistas de problema (sin vender la solución), pruebas de humo (landing page con lista de espera), preventas, pilotos pagados. Métricas: costo de adquisición de clientes (CAC), valor de vida del cliente (LTV), tasa de conversión, retención.</p>"],
["3. Financiamiento en Chile", "<p>Fondos públicos: <b>CORFO</b> (Semilla Inicia, Semilla Expande y otros instrumentos), <b>Start-Up Chile</b>, Sercotec (Capital Semilla, Capital Abeja), ANID para innovación con base científica. Fondos privados: ángeles inversionistas, capital de riesgo, aceleradoras universitarias. Revisa siempre las bases vigentes de cada convocatoria.</p>"],
["4. Propiedad intelectual y formalización", "<p>Marcas y patentes en el <b>INAPI</b>; derechos de autor para software. Constitución de empresa en un día en el registro de Empresas y Sociedades (Ley 20.659), inicio de actividades en el SII.</p>"]],
["canvas", "van-tir", "equilibrio", "simulacion-mc"],
["Ries, E. (2012). <i>El método Lean Startup</i>. Deusto.", "Blank, S., y Dorf, B. (2013). <i>El manual del emprendedor</i>. Gestión 2000.", "CORFO (corfo.cl), INAPI (inapi.cl)."]);
/* ============ MALLA — TRIMESTRES 4 A 6 ============ */
CR("ramo-procesos-industriales", 4, "Procesos en sistemas industriales", "Tipos de procesos, operaciones unitarias, manufactura, minería y alimentos; balances de masa y energía.",
"El ingeniero industrial gestiona procesos que no diseñó: debe entender cómo funcionan físicamente para mejorar su costo, calidad y seguridad, y para dialogar con ingenieros de proceso, mecánicos y químicos.",
[["1. Tipos de procesos productivos", "<ul><li><b>Por proyecto:</b> producto único (un puente, una planta).</li><li><b>Taller (job shop):</b> gran variedad, bajo volumen, máquinas agrupadas por función (maestranza).</li><li><b>Por lotes:</b> variedad media, volumen medio (farmacéutica, panadería industrial).</li><li><b>Línea o flujo repetitivo:</b> alto volumen, poca variedad (ensamble de electrodomésticos).</li><li><b>Continuo:</b> producto homogéneo sin interrupciones (refinería, celulosa, concentradora de cobre).</li></ul><p>La <b>matriz producto-proceso</b> de Hayes y Wheelwright (1979) relaciona el ciclo de vida del producto con el tipo de proceso más adecuado.</p>"],
["2. Procesos de manufactura", "<ul><li><b>Conformado:</b> fundición, forja, laminación, extrusión, estampado.</li><li><b>Mecanizado:</b> torneado, fresado, taladrado, rectificado; control numérico (CNC).</li><li><b>Plásticos:</b> inyección, soplado, extrusión, termoformado.</li><li><b>Unión:</b> soldadura (arco, MIG, TIG), remachado, adhesivos.</li><li><b>Tratamientos:</b> térmicos, superficiales, pintura.</li><li><b>Manufactura aditiva</b> (impresión 3D) para prototipos y repuestos.</li></ul>"],
["3. Procesos mineros del cobre", "<p>Chile es el primer productor mundial de cobre. La cadena del cobre:</p><ol><li><b>Extracción</b> a rajo abierto o subterránea: perforación, tronadura, carguío y transporte (camiones de más de 300 toneladas).</li><li><b>Sulfuros:</b> chancado → molienda (molinos SAG y de bolas) → <b>flotación</b> (separa el mineral con espumas) → concentrado (alrededor de 25–30 % de cobre) → fundición y refinería → cátodos de 99,99 %.</li><li><b>Óxidos:</b> chancado → <b>lixiviación</b> en pilas con ácido sulfúrico → extracción por solventes (SX) → <b>electroobtención</b> (EW) → cátodos.</li><li><b>Relaves:</b> residuos de la flotación depositados en tranques; su estabilidad es un tema crítico de seguridad y ambiente.</li></ol><p>Indicadores clave: ley del mineral (% de cobre), recuperación metalúrgica, toneladas por hora procesadas, consumo de agua y energía por tonelada, costo C1 (centavos de dólar por libra).</p>"],
["4. Procesos de alimentos y otros continuos", "<p>Alimentos: recepción y selección, lavado, procesamiento (cocción, pasteurización, congelado, deshidratado), envasado y cadena de frío; inocuidad con HACCP. Celulosa: astillado, cocción, lavado, blanqueo y secado. Energía: generación térmica, hidroeléctrica, solar fotovoltaica y eólica.</p>"],
["5. Balances de masa y energía", "<p><b>Lo que entra = lo que sale + lo que se acumula</b> (en estado estacionario, la acumulación es cero). Ejemplo: si una planta procesa 100.000 t de mineral con 0,7 % de cobre y la recuperación es 88 %, obtiene 616 t de cobre fino. El balance de energía sigue la misma lógica y permite detectar pérdidas (calor no aprovechado, fugas de aire comprimido).</p>"]],
["oee", "balanceo", "vsm", "huella"],
["Groover, M. P. (2007). <i>Fundamentos de manufactura moderna</i> (3.ª ed.). McGraw-Hill.", "Hayes, R. H., y Wheelwright, S. C. (1979). Link manufacturing process and product life cycles. <i>Harvard Business Review, 57</i>(1), 133–140.", "Cochilco. Anuario de estadísticas del cobre y otros minerales (cochilco.cl).", "Consejo Minero. Cifras actualizadas de la minería (consejominero.cl)."]);

CR("ramo-base-datos", 4, "Base de datos", "Modelo relacional, diagramas entidad-relación, normalización y SQL.",
"Las decisiones de la empresa se toman con datos que viven en bases de datos (ERP, sistemas de ventas, sensores). Saber consultarlos con SQL es una de las habilidades más pedidas en ofertas de trabajo para ingenieros.",
[["1. Modelo relacional", "<p>Propuesto por Edgar F. Codd (IBM) en 1970. Los datos se organizan en <b>tablas</b> (relaciones) con filas (registros) y columnas (atributos). Cada tabla tiene una <b>clave primaria</b> que identifica cada fila, y las <b>claves foráneas</b> relacionan tablas (un pedido pertenece a un cliente).</p>"],
["2. Modelamiento entidad-relación y normalización", "<p>El diagrama entidad-relación (Peter Chen, 1976) representa entidades, atributos y relaciones (1 a 1, 1 a muchos, muchos a muchos). La <b>normalización</b> (1FN, 2FN, 3FN) evita redundancias y errores de actualización: cada dato se guarda en un solo lugar.</p>"],
["3. SQL", "<ul><li><code>SELECT</code> columnas <code>FROM</code> tabla <code>WHERE</code> condición <code>ORDER BY</code>.</li><li><code>JOIN</code> para combinar tablas (INNER, LEFT).</li><li><code>GROUP BY</code> con <code>SUM</code>, <code>COUNT</code>, <code>AVG</code> y <code>HAVING</code>.</li><li>Subconsultas y funciones de ventana (<code>ROW_NUMBER</code>, promedios móviles).</li><li><code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>.</li></ul><p>Ejemplo: ventas por producto y mes: <code>SELECT producto, MONTH(fecha) AS mes, SUM(cantidad) FROM ventas GROUP BY producto, MONTH(fecha);</code></p>"],
["4. Del dato a la decisión", "<p>Bases transaccionales (OLTP) vs almacenes de datos (data warehouse) y modelos en estrella para análisis (OLAP). Calidad de datos: completitud, exactitud, consistencia, oportunidad. Herramientas de visualización (Power BI, Tableau) se conectan a estas bases para construir tableros de indicadores.</p>"]],
["abc", "pronosticos", "regresion"],
["Elmasri, R., y Navathe, S. (2016). <i>Fundamentos de sistemas de bases de datos</i> (7.ª ed.). Pearson.", "Codd, E. F. (1970). A relational model of data for large shared data banks. <i>Communications of the ACM, 13</i>(6), 377–387."]);

CR("ramo-investigacion-operativa", 4, "Investigación operativa", "Programación lineal y entera, dualidad, transporte, asignación, redes, colas y decisiones.",
"Es el corazón cuantitativo de la carrera: modelos para decidir la mejor asignación de recursos escasos en producción, logística, finanzas y servicios.",
[["1. Programación lineal y Simplex", "<p>Forma estándar, variables de holgura y artificiales, tabla Simplex, método de dos fases y M grande. Interpretación económica del óptimo.</p>"],
["2. Dualidad y sensibilidad", "<p>Todo problema lineal tiene un problema dual cuyas variables son los precios sombra de los recursos. El análisis de sensibilidad responde: ¿cuánto puede cambiar un precio sin cambiar la solución óptima?, ¿cuánto vale una hora extra de máquina?</p>"],
["3. Modelos de redes", "<p>Transporte, asignación, transbordo, ruta más corta (Dijkstra), árbol de expansión mínima (Kruskal, Prim) y flujo máximo (Ford-Fulkerson, 1956). Muchas decisiones logísticas son problemas de redes.</p>"],
["4. Programación entera", "<p>Variables enteras o binarias (sí/no): localización de bodegas, selección de proyectos, programación de turnos, problema de la mochila. Se resuelven con ramificación y acotamiento (branch and bound). Redondear una solución lineal puede dar resultados infactibles o lejos del óptimo.</p>"],
["5. Modelos probabilísticos", "<p>Teoría de colas (M/M/1, M/M/s), cadenas de Markov, teoría de decisiones y simulación. Ver las herramientas de colas, decisiones y Monte Carlo.</p>"]],
["programacion-lineal", "transporte", "asignacion", "ruta-corta", "colas", "decisiones"],
["Hillier, F. S., y Lieberman, G. J. (2010). <i>Introducción a la investigación de operaciones</i> (9.ª ed.). McGraw-Hill.", "Taha, H. A. (2012). <i>Investigación de operaciones</i> (9.ª ed.). Pearson.", "Winston, W. L. (2005). <i>Investigación de operaciones</i>. Thomson."]);

CR("ramo-metodos-cuantitativos", 5, "Taller de métodos cuantitativos", "Probabilidad, distribuciones, inferencia, pruebas de hipótesis, regresión y ANOVA aplicados.",
"Decidir con datos exige saber cuándo una diferencia es real y cuándo es azar. Este taller entrega las herramientas estadísticas que se usan en calidad, pronósticos, estudios de tiempos y análisis de datos.",
[["1. Probabilidad y distribuciones", "<ul><li><b>Binomial:</b> número de éxitos en n ensayos (defectuosos en una muestra).</li><li><b>Poisson:</b> eventos por intervalo (llegadas por hora, fallas por mes).</li><li><b>Normal:</b> mediciones continuas; teorema central del límite.</li><li><b>Exponencial:</b> tiempo entre eventos (entre fallas, entre llegadas).</li><li><b>t de Student, chi cuadrado y F:</b> para inferencia con muestras.</li></ul>"],
["2. Estimación e intervalos de confianza", "<p>Un intervalo de 95 % significa que el método atrapa el valor verdadero en 95 de cada 100 muestras. Media: x̄ ± t·s/√n; proporción: p ± z√[p(1−p)/n].</p>"],
["3. Pruebas de hipótesis", "<p>H₀ (no hay efecto) vs H₁. El <b>p-valor</b> es la probabilidad de observar datos tan extremos si H₀ fuera cierta; si es menor que α (0,05) se rechaza H₀. Errores tipo I (falso positivo) y tipo II (falso negativo). Pruebas: t para una y dos medias, pareada (antes y después de una mejora), proporciones, chi cuadrado de independencia.</p>"],
["4. Regresión y ANOVA", "<p>Regresión simple y múltiple para relacionar variables; ANOVA para comparar más de dos medias (¿difieren los rendimientos de tres turnos?). Introducción al diseño de experimentos (factoriales 2<sup>k</sup>) para encontrar los parámetros de proceso que maximizan la calidad.</p>"]],
["descriptiva", "muestra", "regresion", "control-xr"],
["Walpole, R., Myers, R., Myers, S., y Ye, K. (2012). <i>Probabilidad y estadística para ingeniería y ciencias</i> (9.ª ed.). Pearson.", "Montgomery, D. C., y Runger, G. C. (2014). <i>Applied Statistics and Probability for Engineers</i>. Wiley.", "Montgomery, D. C. (2017). <i>Design and Analysis of Experiments</i> (9th ed.). Wiley."]);

CR("ramo-costos-presupuestos", 5, "Costos y presupuestos", "Clasificación de costos, costeo, análisis CVU, presupuesto maestro y control de gestión.",
"Toda propuesta de mejora termina en una pregunta: ¿cuánto cuesta y cuánto ahorra? Este ramo enseña a calcular costos correctamente y a planificar y controlar el uso de los recursos con presupuestos.",
[["1. Clasificación de costos", "<p>Fijos y variables (según volumen); directos e indirectos (según su asignación al producto); del producto y del período; relevantes e irrelevantes para una decisión; costos hundidos y de oportunidad.</p>"],
["2. Sistemas de costeo", "<p>Por órdenes de trabajo (maestranzas, construcción), por procesos (industria continua), por absorción vs variable, costeo ABC y costos estándar. Ver herramienta de costeo.</p>"],
["3. Análisis costo-volumen-utilidad", "<p>Margen de contribución, punto de equilibrio, utilidad objetivo, margen de seguridad y apalancamiento operativo. Decisiones de corto plazo: aceptar un pedido especial, fabricar o comprar, eliminar una línea de productos.</p>"],
["4. Presupuesto maestro", "<p>Secuencia: presupuesto de ventas → producción → materiales, mano de obra y CIF → costo de ventas → gastos → estado de resultados presupuestado → presupuesto de caja → balance. Presupuesto flexible (ajustado al volumen real) vs estático.</p>"],
["5. Control presupuestario y varianzas", "<p>Varianza de precio y de cantidad (eficiencia) en materiales y mano de obra: ¿se gastó más porque subió el precio o porque se usó más material? El análisis de varianzas apunta al área responsable.</p>"]],
["costeo", "equilibrio", "ratios"],
["Horngren, C., Datar, S., y Rajan, M. (2012). <i>Contabilidad de costos: un enfoque gerencial</i> (14.ª ed.). Pearson.", "Garrison, R., Noreen, E., y Brewer, P. (2007). <i>Contabilidad administrativa</i>. McGraw-Hill."]);

CR("ramo-sistemas-productivos", 5, "Sistemas productivos", "Estrategia de operaciones, capacidad, layout, planificación, inventarios y justo a tiempo.",
"Es el núcleo de la gestión de operaciones: cómo diseñar, planificar y controlar un sistema que produce bienes o servicios con eficiencia, calidad y flexibilidad.",
[["1. Estrategia de operaciones", "<p>Prioridades competitivas: costo, calidad, rapidez, flexibilidad y confiabilidad. Wickham Skinner (1969) planteó que la manufactura debe alinearse con la estrategia de la empresa («focused factory»). Trade-offs: no se puede ser el mejor en todo a la vez.</p>"],
["2. Capacidad y localización", "<p>Capacidad de diseño, efectiva y real; utilización y eficiencia; decisiones de ampliación (adelantarse o seguir a la demanda); teoría de restricciones de Goldratt (<i>La meta</i>, 1984): el cuello de botella define el ritmo de todo el sistema.</p>"],
["3. Distribución en planta (layout)", "<p>Layout por producto (línea), por proceso (funcional), celular y de posición fija. Métodos: análisis de flujo (matriz desde-hacia), planeación sistemática de la distribución (SLP de Richard Muther, 1961) con diagrama de relaciones de cercanía (A, E, I, O, U, X).</p>"],
["4. Planificación jerárquica", "<p>Planificación agregada (6 a 18 meses: estrategias de persecución, nivelación o mixta) → plan maestro de producción (MPS) → MRP → programación de corto plazo → control de piso.</p>"],
["5. Justo a tiempo y Toyota", "<p>El Sistema de Producción Toyota (Taiichi Ohno) se basa en dos pilares: <b>justo a tiempo</b> (producir lo necesario, cuando se necesita, con kanban y flujo continuo) y <b>jidoka</b> (detener ante anomalías). Requiere nivelación (heijunka), cambios rápidos (SMED) y calidad en la fuente.</p>"]],
["oee", "balanceo", "mrp", "eoq", "smed", "secuenciacion"],
["Chase, R. B., y Jacobs, F. R. (2014). <i>Administración de operaciones</i> (13.ª ed.). McGraw-Hill.", "Heizer, J., y Render, B. (2014). <i>Principios de administración de operaciones</i> (9.ª ed.). Pearson.", "Goldratt, E. M., y Cox, J. (1984). <i>La meta</i>. Ediciones Castillo.", "Skinner, W. (1969). Manufacturing: missing link in corporate strategy. <i>Harvard Business Review, 47</i>(3), 136–145."]);

CR("ramo-integrador-1", 6, "Integrador I: seminario de ingeniería", "Método de investigación aplicada, formulación de proyectos y comunicación técnica.",
"Es el primer ejercicio completo de ingeniería: elegir un problema real, investigarlo con método y comunicarlo en un informe y una presentación profesional. Prepara el proyecto de título.",
[["1. Del tema al problema", "<p>Un tema («la bodega») no es un problema. Un problema tiene síntoma medible, impacto y alcance: «el 12 % de los pedidos se despacha incompleto, lo que genera reclamos y fletes de reenvío por $ 8 millones al mes». Herramientas: árbol de problemas (causas abajo, efectos arriba), Pareto, 5 porqués.</p>"],
["2. Objetivos y alcance", "<p>Objetivo general (qué se logrará y para qué) y específicos (pasos para lograrlo). Verbos medibles. Alcance: qué incluye y qué no, supuestos y limitaciones.</p>"],
["3. Marco teórico y estado del arte", "<p>Búsqueda bibliográfica en bases académicas (Scopus, Web of Science, Google Académico, ScienceDirect, SciELO), libros y normas. Solo se incluye lo que se usa. Citas en APA.</p>"],
["4. Metodología y plan de trabajo", "<p>Qué datos se recogerán, cómo y con qué herramientas se analizarán; carta Gantt con hitos; riesgos del proyecto.</p>"],
["5. Comunicación", "<p>Informe con estructura estándar y presentación de 15 a 20 minutos. Usa el generador de informes y las plantillas de esta app.</p>"]],
["generador-informe", "citas-apa", "cpm", "pareto"],
["Hernández Sampieri, R., Fernández, C., y Baptista, P. (2014). <i>Metodología de la investigación</i> (6.ª ed.). McGraw-Hill.", "Minto, B. (2009). <i>The Pyramid Principle</i>. Pearson."]);

CR("ramo-ingenieria-economica", 6, "Ingeniería económica", "Valor del dinero en el tiempo, VAN, TIR, CAUE, depreciación, reemplazo, inflación e impuestos.",
"Toda decisión de ingeniería es también una decisión económica. Este ramo entrega el lenguaje con que se aprueban o rechazan las inversiones en cualquier organización.",
[["1. Valor del dinero en el tiempo", "<p>Interés simple y compuesto, diagramas de flujo de caja, factores P/F/A/G, tasas nominales y efectivas. Ver herramientas de equivalencias y tasas.</p>"],
["2. Criterios de evaluación", "<p>VAN, TIR, TIR modificada, período de recuperación, índice de rentabilidad, CAUE. Comparación de alternativas mutuamente excluyentes, análisis incremental, alternativas con vidas distintas.</p>"],
["3. Depreciación e impuestos", "<p>Métodos de depreciación y su efecto en el flujo después de impuestos. En Chile: impuesto de primera categoría, depreciación normal y acelerada según el SII.</p>"],
["4. Reemplazo e inflación", "<p>Vida económica, defensor vs retador, costos hundidos. Flujos nominales y reales, UF, ecuación de Fisher.</p>"],
["5. Riesgo", "<p>Análisis de sensibilidad, escenarios, punto de equilibrio de una variable, árboles de decisión y simulación Monte Carlo.</p>"]],
["van-tir", "equivalencias", "tasas", "caue", "vida-economica", "depreciacion", "simulacion-mc"],
["Blank, L., y Tarquin, A. (2012). <i>Ingeniería económica</i> (7.ª ed.). McGraw-Hill.", "Sullivan, W., Wicks, E., y Koelling, C. (2014). <i>Ingeniería económica de DeGarmo</i>. Pearson."]);

CR("ramo-logistica", 6, "Logística y sistemas productivos", "Cadena de suministro, abastecimiento, inventarios, bodegas, transporte y distribución.",
"La logística representa una parte importante del costo de los productos y define el nivel de servicio al cliente. Es una de las áreas que más contrata ingenieros industriales en Chile (retail, consumo masivo, minería, puertos).",
[["1. Cadena de suministro", "<p>Red de proveedores, plantas, centros de distribución, transportistas y clientes. Flujos de materiales, información y dinero. Michael Porter (1985) ubicó la logística de entrada y salida como actividades primarias de la cadena de valor. Efecto látigo y colaboración (CPFR, S&OP).</p>"],
["2. Abastecimiento y compras", "<p>Selección y evaluación de proveedores, compras estratégicas (matriz de Kraljic, 1983: estratégicos, apalancados, cuello de botella, rutinarios), licitaciones, contratos, Incoterms 2020 para comercio internacional.</p>"],
["3. Gestión de inventarios", "<p>EOQ, stock de seguridad, revisión continua y periódica, ABC, indicadores de rotación y cobertura.</p>"],
["4. Bodegaje (warehousing)", "<p>Procesos: recepción, almacenamiento, picking, packing y despacho. Diseño: tipos de racks, pasillos, slotting (ubicar productos de alta rotación cerca del despacho). Sistemas WMS, códigos de barra y RFID. El picking suele ser la actividad más costosa de una bodega.</p>"],
["5. Transporte y distribución", "<p>Modos (camión, tren, marítimo, aéreo), costos fijos y variables, consolidación de carga, ruteo de vehículos, última milla en e-commerce. Indicadores: OTIF, costo logístico sobre ventas, fill rate.</p>"]],
["eoq", "stock-seguridad", "abc", "transporte", "ruta-corta", "localizacion", "pronosticos"],
["Ballou, R. H. (2004). <i>Logística: administración de la cadena de suministro</i> (5.ª ed.). Pearson.", "Chopra, S., y Meindl, P. (2013). <i>Administración de la cadena de suministro</i> (5.ª ed.). Pearson.", "Kraljic, P. (1983). Purchasing must become supply management. <i>Harvard Business Review, 61</i>(5), 109–117."]);

CR("ramo-modelamiento-procesos", 6, "Modelamiento y diseño de procesos", "BPMN, simulación de eventos discretos, rediseño y automatización de procesos.",
"Antes de cambiar un proceso real conviene probar el cambio en un modelo. La simulación y el modelamiento permiten estimar el efecto de una mejora sin detener la operación.",
[["1. Modelamiento con BPMN", "<p>Eventos (inicio, fin, intermedios), actividades, compuertas (exclusiva, paralela), carriles por rol y flujos de mensajes. Permite documentar y automatizar procesos en motores de flujo de trabajo.</p>"],
["2. Simulación de eventos discretos", "<p>El sistema cambia en instantes discretos (llega un cliente, termina un servicio). Elementos: entidades, recursos, colas, distribuciones de tiempos. Software: Arena, FlexSim, Simio, AnyLogic, o Python con SimPy. Pasos: formular, recolectar datos, construir, verificar (el modelo hace lo que quiero), validar (se parece a la realidad), experimentar y analizar con réplicas.</p>"],
["3. Rediseño de procesos", "<p>Eliminar actividades sin valor, paralelizar, reducir traspasos, mover controles al origen, estandarizar. Reingeniería (Hammer y Champy) vs mejora continua (kaizen).</p>"],
["4. Automatización", "<p>Automatización robótica de procesos (RPA) para tareas administrativas repetitivas, sistemas de flujo de trabajo, integración con ERP. Indicadores antes y después: tiempo de ciclo, costo por transacción, errores.</p>"]],
["sipoc", "vsm", "colas", "simulacion-mc"],
["Law, A. M. (2015). <i>Simulation Modeling and Analysis</i> (5th ed.). McGraw-Hill.", "Dumas, M., La Rosa, M., Mendling, J., y Reijers, H. (2018). <i>Fundamentals of Business Process Management</i> (2nd ed.). Springer.", "Kelton, W. D., Sadowski, R., y Zupick, N. (2015). <i>Simulation with Arena</i> (6th ed.). McGraw-Hill."]);
/* ============ MALLA — TRIMESTRES 7 Y 8 ============ */
CR("ramo-mineria-datos", 7, "Minería de datos", "Proceso CRISP-DM, preparación de datos, clasificación, agrupamiento, predicción y evaluación de modelos.",
"Las empresas acumulan datos de ventas, sensores, clientes y operaciones. La minería de datos convierte esos datos en predicciones y segmentaciones que mejoran decisiones: qué cliente se irá, qué máquina fallará, cuánto se venderá.",
[["1. CRISP-DM", "<p>Metodología publicada en 2000 por un consorcio europeo (SPSS, NCR, Daimler-Chrysler) con seis fases: comprensión del negocio, comprensión de los datos, preparación, modelado, evaluación y despliegue. La mayor parte del tiempo de un proyecto (a menudo más de la mitad) se va en preparar los datos.</p>"],
["2. Preparación de datos", "<p>Limpieza (valores faltantes, atípicos, duplicados), transformación (normalización, variables categóricas a numéricas), creación de variables (días desde la última compra, promedio móvil) y división en entrenamiento y prueba.</p>"],
["3. Técnicas", "<ul><li><b>Clasificación:</b> árboles de decisión, regresión logística, bosques aleatorios. Ej.: predecir si un cliente abandonará (churn).</li><li><b>Regresión:</b> predecir valores numéricos (demanda, tiempo de entrega).</li><li><b>Agrupamiento (clustering):</b> k-medias para segmentar clientes o productos sin etiquetas previas.</li><li><b>Reglas de asociación:</b> productos que se compran juntos (análisis de canasta).</li></ul>"],
["4. Evaluación y ética", "<p>Matriz de confusión, exactitud, precisión, sensibilidad, error cuadrático medio, validación cruzada y sobreajuste. Ética: sesgos en los datos, privacidad (en Chile, Ley 19.628 y la nueva Ley 21.719 de protección de datos personales), transparencia de los modelos.</p>"]],
["regresion", "pronosticos", "descriptiva", "abc"],
["Han, J., Kamber, M., y Pei, J. (2011). <i>Data Mining: Concepts and Techniques</i> (3rd ed.). Morgan Kaufmann.", "Chapman, P. et al. (2000). <i>CRISP-DM 1.0: Step-by-step data mining guide</i>. SPSS.", "James, G., Witten, D., Hastie, T., y Tibshirani, R. (2021). <i>An Introduction to Statistical Learning</i> (2nd ed.). Springer. Gratis en statlearning.com."]);

CR("ramo-portafolio-proyectos", 7, "Portafolio de proyectos", "Selección y priorización de proyectos, PMO, ciclo de vida, PMBOK, ágil y control con valor ganado.",
"Las organizaciones tienen más ideas que recursos. La gestión de portafolio elige qué proyectos hacer, y la gestión de proyectos asegura que se entreguen a tiempo, dentro del presupuesto y con el alcance acordado.",
[["1. Portafolio, programa y proyecto", "<p>Un <b>proyecto</b> es temporal y crea un resultado único; un <b>programa</b> agrupa proyectos relacionados; un <b>portafolio</b> es el conjunto de proyectos y programas que la organización elige para cumplir su estrategia. La oficina de proyectos (<b>PMO</b>) estandariza métodos y reporta el avance.</p>"],
["2. Selección y priorización", "<p>Criterios financieros (VAN, TIR, IVAN), estratégicos (alineamiento), de riesgo y de capacidad. Herramientas: matriz de puntaje ponderado, programación entera para elegir el conjunto de proyectos que maximiza el VAN con presupuesto limitado, matriz valor vs esfuerzo.</p>"],
["3. Dirección de proyectos (PMBOK)", "<p>El PMI publicó la primera guía PMBOK en 1996; la 7.ª edición (2021) se organiza en principios y dominios de desempeño. Áreas clave: alcance (EDT), cronograma (CPM, Gantt), costos (presupuesto, línea base), calidad, recursos, comunicaciones, riesgos, adquisiciones e interesados.</p>"],
["4. Enfoques ágiles", "<p>El Manifiesto Ágil (2001) prioriza individuos, software funcionando, colaboración con el cliente y respuesta al cambio. Scrum: roles (product owner, scrum master, equipo), eventos (sprint, daily, review, retrospectiva) y artefactos (backlog). Kanban para flujo continuo. En ingeniería se combinan enfoques híbridos.</p>"],
["5. Control con valor ganado", "<p>PV, EV, AC, SPI, CPI y proyección del costo final (EAC). Ver la página de gestión de proyectos.</p>"]],
["cpm", "raci", "factores", "van-tir", "simulacion-mc"],
["Project Management Institute. (2021). <i>PMBOK Guide</i> (7th ed.).", "Kerzner, H. (2017). <i>Project Management</i> (12th ed.). Wiley.", "Schwaber, K., y Sutherland, J. (2020). <i>La Guía de Scrum</i> (scrumguides.org)."]);

CR("ramo-evaluacion-proyectos", 7, "Evaluación de proyectos", "Estudios de mercado, técnico, organizacional, legal y financiero; flujos de caja; sensibilidad y evaluación social.",
"Es el ramo que integra la carrera: para saber si un proyecto conviene hay que estimar su mercado, diseñar su operación, calcular sus costos e inversiones y medir su rentabilidad y riesgo.",
[["1. Etapas de un proyecto", "<p>Idea → perfil → prefactibilidad → factibilidad → inversión → operación. En cada etapa se reduce la incertidumbre a cambio de gastar más en estudios.</p>"],
["2. Estudio de mercado", "<p>Demanda (fuentes primarias y secundarias, proyección), oferta y competencia, precio, comercialización. Errores típicos: sobreestimar la participación de mercado y la velocidad de penetración.</p>"],
["3. Estudio técnico, organizacional y legal", "<p>Tamaño, localización, proceso, equipos, layout, inversiones y costos de operación; estructura organizacional y remuneraciones; permisos, patentes municipales, evaluación ambiental, normativa sectorial.</p>"],
["4. Estudio financiero", "<p>Flujo de caja puro y del inversionista, capital de trabajo, valor de desecho, tasa de descuento (CAPM, WACC). Indicadores: VAN, TIR, PRI.</p>"],
["5. Riesgo y evaluación social", "<p>Sensibilidad (unidimensional, de Hertz), escenarios y Monte Carlo. Evaluación social: beneficios y costos para el país con precios sociales (Ministerio de Desarrollo Social y Familia), tasa social de descuento y externalidades.</p>"]],
["flujo-caja", "van-tir", "wacc", "simulacion-mc", "localizacion", "pronosticos"],
["Sapag Chain, N., Sapag Chain, R., y Sapag Puelma, J. M. (2014). <i>Preparación y evaluación de proyectos</i> (6.ª ed.). McGraw-Hill.", "Baca Urbina, G. (2013). <i>Evaluación de proyectos</i> (7.ª ed.). McGraw-Hill.", "Fontaine, E. (2008). <i>Evaluación social de proyectos</i>. Pearson."]);

CR("ramo-planificacion-mejora", 7, "Planificación y mejora de procesos", "Lean, Seis Sigma, kaizen, teoría de restricciones y gestión del cambio.",
"Las empresas compiten mejorando continuamente. Este ramo integra las metodologías de mejora y enseña a liderar proyectos que realmente se implementan.",
[["1. Lean", "<p>Valor, flujo de valor, flujo, pull y perfección (Womack y Jones, 1996). Ocho desperdicios, 5S, SMED, kanban, trabajo estandarizado, VSM. Ver la página Lean y mejora continua.</p>"],
["2. Seis Sigma y DMAIC", "<p>Reducir la variación con datos: Definir, Medir, Analizar, Mejorar, Controlar. Roles: champion, black belt, green belt. Lean Six Sigma combina la velocidad del lean con el rigor estadístico.</p>"],
["3. Teoría de restricciones", "<p>Eliyahu Goldratt (<i>La meta</i>, 1984) propuso cinco pasos: identificar la restricción, explotarla, subordinar todo a ella, elevarla y volver a empezar. Sistema tambor-amortiguador-cuerda (DBR) para programar según el cuello de botella.</p>"],
["4. Kaizen y gestión diaria", "<p>Eventos kaizen de 3 a 5 días, gestión visual, reuniones diarias de 15 minutos frente a un tablero de indicadores, ciclo PDCA, estandarización.</p>"],
["5. Gestión del cambio", "<p>John Kotter (1996) propuso 8 pasos: crear urgencia, formar una coalición, visión, comunicarla, eliminar obstáculos, victorias tempranas, consolidar y anclar en la cultura. La mayoría de las mejoras fracasa por resistencia de las personas, no por errores técnicos.</p>"]],
["vsm", "smed", "oee", "pareto", "ishikawa", "porques", "control-xr", "capacidad"],
["Womack, J. P., y Jones, D. T. (1996). <i>Lean Thinking</i>. Simon & Schuster.", "Goldratt, E. M., y Cox, J. (1984). <i>La meta</i>. Ediciones Castillo.", "Kotter, J. P. (1996). <i>Leading Change</i>. Harvard Business School Press.", "Imai, M. (1986). <i>Kaizen: la clave de la ventaja competitiva japonesa</i>. CECSA."]);

CR("ramo-transformacion-digital", 8, "Gestión de la transformación digital", "Industria 4.0, IoT, analítica, nube, ERP, inteligencia artificial, ciberseguridad y gestión del cambio.",
"La tecnología cambia cómo operan todas las industrias. El ingeniero industrial lidera la transformación porque entiende los procesos y puede traducir tecnología en valor de negocio.",
[["1. Industria 4.0", "<p>Término presentado en la feria de Hannover en 2011 por una iniciativa del gobierno alemán. Tecnologías: Internet de las cosas industrial (sensores conectados), sistemas ciberfísicos, gemelos digitales, robótica colaborativa, manufactura aditiva, computación en la nube, analítica avanzada e inteligencia artificial.</p>"],
["2. Casos de uso", "<ul><li>Mantenimiento predictivo con vibraciones y temperatura.</li><li>Centros de operación remota en minería, que supervisan faenas desde ciudades.</li><li>Camiones autónomos en minas a rajo abierto.</li><li>Trazabilidad con códigos y RFID en alimentos.</li><li>Pronósticos con aprendizaje automático en retail.</li><li>Automatización de procesos administrativos (RPA) en banca.</li></ul>"],
["3. Sistemas empresariales", "<p>ERP (SAP, Oracle, Microsoft Dynamics, Defontana en pymes chilenas), MES (ejecución de manufactura), WMS (bodegas), CRM (clientes), BI (tableros). La integración de datos entre sistemas es el mayor desafío.</p>"],
["4. Estrategia y madurez digital", "<p>Una transformación digital no es comprar software: es rediseñar procesos y modelos de negocio. Etapas de madurez, hoja de ruta, casos de negocio con VAN, pilotos y escalamiento. Ciberseguridad: en Chile la Ley 21.663 (2024), ley marco de ciberseguridad, crea la Agencia Nacional de Ciberseguridad.</p>"],
["5. Personas y cambio", "<p>Nuevas competencias (datos, automatización), reconversión de puestos, liderazgo y cultura. La adopción por parte de los usuarios define el éxito.</p>"]],
["van-tir", "factores", "cpm", "regresion"],
["Schwab, K. (2016). <i>La cuarta revolución industrial</i>. Debate.", "Westerman, G., Bonnet, D., y McAfee, A. (2014). <i>Leading Digital</i>. Harvard Business Review Press.", "Ley 21.663 (2024). Ley marco de ciberseguridad. BCN."]);

CR("ramo-responsabilidad-social", 8, "Responsabilidad social", "RSE, sostenibilidad, criterios ESG, grupos de interés, reportes y ética empresarial.",
"Las empresas son evaluadas no solo por sus utilidades sino por su impacto en trabajadores, comunidades y ambiente. Inversionistas, clientes y reguladores exigen gestión y reportes de sostenibilidad.",
[["1. Conceptos", "<p>Responsabilidad social empresarial (RSE), sostenibilidad y triple resultado (económico, social, ambiental; John Elkington, 1994), valor compartido (Porter y Kramer, 2011), criterios ESG (ambientales, sociales y de gobierno corporativo) usados por inversionistas.</p>"],
["2. Marcos y estándares", "<p>Pacto Global de la ONU (2000), Objetivos de Desarrollo Sostenible (2015), ISO 26000 (2010, guía de responsabilidad social), estándares GRI para reportes de sostenibilidad. En Chile, la CMF exige a las empresas que transan en bolsa reportar información de sostenibilidad en su memoria anual (Norma de Carácter General 461, 2021).</p>"],
["3. Grupos de interés y comunidades", "<p>Mapa de grupos de interés (trabajadores, clientes, proveedores, comunidades, autoridades), matriz de materialidad, relacionamiento comunitario. En minería y energía, la licencia social para operar y la consulta indígena (Convenio 169 de la OIT, vigente en Chile desde 2009) son determinantes.</p>"],
["4. Ética y cumplimiento", "<p>Ley 20.393 de responsabilidad penal de las personas jurídicas (2009, ampliada por la Ley 21.595 de delitos económicos en 2023): las empresas deben tener modelos de prevención de delitos. Canales de denuncia, conflictos de interés, libre competencia (FNE).</p>"]],
["huella", "iper", "foda"],

CR("ramo-integrador-2", 8, "Integrador II: proyecto de título", "Desarrollo completo de un proyecto de ingeniería con diagnóstico, propuesta, evaluación económica y defensa.",

  return h;
}

/* ============ EXPORTACIÓN: QUÉ SE EXPORTA ============ */
function tmpEl(html){ const d = document.createElement("div"); d.className = "doc"; d.style.cssText = "position:absolute;left:-10000px;top:0;width:900px"; d.innerHTML = html; document.body.appendChild(d); return d; }
async function doExport(kind, fmt, id){
  const P = S.proj, who = [["Autor", P.autor], ["Organización", P.empresa], ["Fecha", P.fecha]].filter(x => x[1]);
  if (kind === "calc") { const el = tmpEl("<h2>1. Datos de entrada</h2>" + inputSummary(id) + "<h2>2. Resultados y desarrollo</h2>" + demote(safeCalc(id)));
    try { await exportDoc(fmt, { kind:"Memoria de cálculo", title:C[id].t, subtitle:(P.nombre ? P.nombre + " · " : "") + C[id].ey, lines:who, author:P.autor, toc:false }, el); } finally { el.remove(); } }
  else if (kind === "guia") { const g = GUIDE[id] || {}, c = C[id]; let html = ""; let n = 0; GSEC.forEach(s => { if (g[s[0]]) html += "<h2>" + (++n) + ". " + s[1] + "</h2>" + g[s[0]] + (s[0] === "como" && c.learn ? "<h3>Notas prácticas</h3>" + c.learn : ""); }); if (g.src) html += "<h2>Referencias</h2>" + g.src.map(x => "<p>" + x + "</p>").join("");
    const el = tmpEl(html); try { await exportDoc(fmt, { kind:"Guía de estudio", title:c.t, subtitle:c.ey, lines:[["Fuente", "Biblia del Ingeniero Industrial"]], toc:true }, el); } finally { el.remove(); } }
  else if (kind === "ramo") { const c = COURSES.find(x => x.id === id); let html = "<h2>Por qué es importante</h2><p>" + c.why + "</p>" + c.u.map(u => "<h2>" + u[0] + "</h2>" + u[1]).join("") + "<h2>Bibliografía recomendada</h2>" + c.src.map(s => "<p>" + s + "</p>").join("");
    const el = tmpEl(html); try { await exportDoc(fmt, { kind:"Apuntes de estudio · " + c.tri + "° trimestre", title:c.t, subtitle:c.d, lines:[["Programa", "Ingeniería Industrial Advance"]], toc:true }, el); } finally { el.remove(); } }
  else if (kind === "ind") { const x = IND.find(i => indId(i) === id), el = tmpEl("<h2>1. Cómo funciona el sector</h2>" + x[3] + "<h2>2. Qué hace un ingeniero industrial</h2>" + x[4] + "<h2>3. Indicadores</h2><p>" + x[5] + "</p><h2>4. Herramientas</h2><p>" + x[6] + "</p><h2>5. Normativa</h2><p>" + x[7] + "</p><h2>6. Ejemplo de proyecto</h2>" + x[8]);
    try { await exportDoc(fmt, { kind:"Ficha de industria", title:x[1], subtitle:x[2], toc:false }, el); } finally { el.remove(); } }
  else if (kind === "informe") { const v = vals("generador-informe"), tipo = { tec:"Informe técnico", prac:"Informe de práctica profesional", eje:"Informe ejecutivo", av:"Informe de avance" }[v.tipo];
    await exportDoc(fmt, { kind:tipo, title:v.tit || "Informe", subtitle:v.org || "", lines:[["Autor", v.aut], ["Organización", v.org], ["Dirigido a", v.dest], ["Fecha", v.fec]].filter(x => x[1]), author:v.aut, toc:true }, document.getElementById("docout")); }
  else if (kind === "memoria") await exportDoc(fmt, { kind:"Memoria de cálculo", title:P.nombre || "Memoria de cálculo", lines:who, author:P.autor, toc:true }, document.getElementById("repdoc"));
}

/* ============ RENDER ============ */
let cur = "inicio";
function searchHits(q){
  const nz = t => String(t || "").replace(/<[^>]+>/g, "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); q = nz(q).trim(); if (q.length < 2) return [];
  const H = []; PAGES.forEach(p => { if (p.id !== "inicio" && nz(p.t + " " + (p.d || "") + " " + (C[p.id] ? C[p.id].ey : "")).includes(q)) H.push({ go:p.id, t:p.t, k:GROUPS[p.g] || "Sección" }); });
  COURSES.forEach(c => c.u.forEach(u => { if (nz(u[0]).includes(q) || (q.length > 3 && nz(u[1]).includes(q))) H.push({ go:c.id, t:c.t + " · " + u[0].replace(/^\d+\.\s*/, ""), k:"Ramo" }); }));
  Object.keys(GUIDE).forEach(id => { if (q.length > 3 && GSEC.some(s => nz(GUIDE[id][s[0]]).includes(q)) && !H.some(x => x.go === id)) H.push({ go:id, t:C[id].t + " (guía)", k:"Guía de estudio" }); });
  Object.keys(GLOS).forEach(g => { if (nz(g + " " + GLOS[g]).includes(q)) H.push({ go:"glosario", t:g + ": " + GLOS[g].slice(0, 50) + "…", k:"Glosario" }); });
  return H.slice(0, 16);
}
const hitsHTML = (H, q) => H.map(x => '<button type="button" data-go="' + x.go + '"><span class="k">›</span>' + esc(x.t) + ' <small class="hint">' + esc(x.k) + "</small></button>").join("") || (q.trim().length >= 2 ? '<p class="hint" style="padding:4px 8px;margin:0">Sin resultados</p>' : "");
function renderSide(){
  let closed = null; try { closed = JSON.parse(localStorage.getItem(KEY + "-side2") || "null"); } catch (e) {}
  if (!closed) closed = Object.keys(GROUPS).filter(g => g !== "malla");
  const cg = pageOf(cur).g;
  let h = '<div class="gsw"><input type="search" id="gsearch" placeholder="Buscar ramo, herramienta o término…" aria-label="Buscar en la app" autocomplete="off"><div id="gsres"></div></div><button type="button" data-go="inicio" aria-current="' + (cur === "inicio") + '"><span class="k">⌂</span>Inicio</button>';
  Object.keys(GROUPS).forEach(g => { const ps = PAGES.filter(p => p.g === g); const op = g === cg || !closed.includes(g);
    h += '<details class="sgp" data-sgp="' + g + '"' + (op ? " open" : "") + "><summary>" + GROUPS[g] + "</summary>" + ps.map(p => '<button type="button" data-go="' + p.id + '" aria-current="' + (p.id === cur) + '"><span class="k">' + (p.calc ? "ƒ" : p.tri ? "T" + p.tri : "·") + "</span>" + p.t + (S.done[p.id] || (S.malla && S.malla[p.id]) ? '<span class="done">✓</span>' : "") + "</button>").join("") + "</details>"; });
  document.getElementById("side").innerHTML = h;
  const p = pageOf(cur);
  document.getElementById("crumb").textContent = cur === "inicio" ? "" : (GROUPS[p.g] ? GROUPS[p.g] + " › " : "") + p.t;
  document.getElementById("backBtn").hidden = cur === "inicio";
  const tb = tabOf(cur);
  document.getElementById("tabbar").innerHTML = TABS.map(t => '<button type="button" data-go="' + t[0] + '" aria-current="' + (t[0] === tb) + '"><span class="ic">' + t[1] + "</span><span>" + t[2] + "</span></button>").join("");
}
function render(keepScroll){
  const p = pageOf(cur); let html;
  try { html = p.r(); } catch (e) { html = note("Error al mostrar esta sección: " + esc(e.message), "bad"); }
  document.getElementById("app").innerHTML = html;
  renderSide();
  if (cur === "tablas") tfTable();
  document.title = (cur === "inicio" ? "" : p.t + " · ") + "Biblia del Ingeniero Industrial";
  if (!keepScroll) window.scrollTo(0, 0);
}
function go(id){
  if (!PAGES.find(p => p.id === id)) id = "inicio";
  cur = id; if (pageOf(id).g !== "hub" && id !== "inicio") { S.last = id; save(); }
  try { if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id); } catch (e) {}
  render();
}
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h !== cur && PAGES.find(p => p.id === h)) { cur = h; render(); } });

/* ============ EVENTOS ============ */
function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
function collect(id){ const o = {}; C[id].f.forEach(f => { if (f.t === "calcs") { const box = document.getElementById("f-" + id + "-" + f.k); if (box) o[f.k] = [...box.querySelectorAll("input:checked")].map(x => x.value).join(","); return; } const el = document.getElementById("f-" + id + "-" + f.k); if (el) o[f.k] = el.value; }); return o; }
function selectEl(el){ try { const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {} }
function copyText(el){ const t = el.innerText; const fb = () => { selectEl(el); toast("Texto seleccionado: cópialo con Ctrl+C"); };
  try { navigator.clipboard.writeText(t).then(() => toast("Copiado"), fb); } catch (e) { fb(); } }
function copyRich(el){ const html = '<div style="font-family:Calibri,Arial,sans-serif">' + el.innerHTML.replace(/<button[^>]*>.*?<\/button>/g, "") + "</div>", t = el.innerText;
  try { if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) { navigator.clipboard.write([new ClipboardItem({ "text/html":new Blob([html], { type:"text/html" }), "text/plain":new Blob([t], { type:"text/plain" }) })]).then(() => toast("Copiado con formato"), () => copyText(el)); return; } } catch (e) {}
  copyText(el); }
let busy = false;
document.addEventListener("click", async e => {
  const t = e.target.closest ? e.target.closest("[data-go],[data-act],[data-qz]") : null; if (!t) return;
  if (t.dataset.go) { e.preventDefault(); go(t.dataset.go); return; }
  if (t.dataset.qz != null) { const i = +t.dataset.qz, j = +t.dataset.op; S.quiz = S.quiz || {}; S.quizSel = S.quizSel || {}; if (S.quiz[i] === undefined) { S.quiz[i] = j === QZ[i][3]; S.quizSel[i] = j; save(); render(true); } return; }
  const a = t.dataset.act, id = t.dataset.c;
  if (a === "calc") { S.v[id] = collect(id); S.done[id] = Date.now(); S.snap[id] = JSON.stringify(S.v[id]); save(); render(true); const r = document.getElementById("res"); if (r) r.scrollIntoView({ behavior:"smooth", block:"start" }); }
  else if (a === "ex") { delete S.v[id]; delete S.done[id]; delete S.snap[id]; save(); render(true); toast("Ejemplo cargado"); }
  else if (a === "clr") { const o = {}; C[id].f.forEach(f => o[f.k] = f.t === "sel" ? (typeof f.o === "function" ? "" : f.o[0][0]) : ""); S.v[id] = o; delete S.done[id]; delete S.snap[id]; save(); render(true); }
  else if (a === "undone") { delete S.done[id]; save(); render(true); }
  else if (a === "clrall") { if (t.dataset.sure) { S.done = {}; save(); render(); toast("Resultados quitados"); } else { t.dataset.sure = "1"; t.textContent = "Confirmar: quitar todo"; } }
  else if (a === "copytext") { const el = document.getElementById(t.dataset.t); if (el) copyText(el); }
  else if (a === "copyrich") { const el = document.getElementById(t.dataset.t); if (el) copyRich(el); }
  else if (a === "quizreset") { S.quiz = {}; S.quizSel = {}; save(); render(true); }
  else if (a === "toguide") { const g = document.getElementById("guia"); if (g) { g.querySelector("details").open = true; g.scrollIntoView({ behavior:"smooth", block:"start" }); } }
  else if (a === "exp") { if (busy) return; busy = true; t.disabled = true; try { await doExport(t.dataset.kind, t.dataset.fmt, id); } finally { busy = false; t.disabled = false; } }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "gsearch" || el.id === "gsearch2") { const box = document.getElementById(el.id === "gsearch" ? "gsres" : "gsres2"); if (box) box.innerHTML = hitsHTML(searchHits(el.value), el.value); return; }
  if (el.id === "glf") { const q = el.value.toLowerCase().trim(); document.querySelectorAll("#gll dt,#gll dd").forEach(x => { const k = x.dataset.k, dd = x.tagName === "DD" ? x.textContent.toLowerCase() : (x.nextElementSibling ? x.nextElementSibling.textContent.toLowerCase() : ""); x.hidden = q && !(k.includes(q) || dd.includes(q)); }); return; }
  if (el.id === "tfi" || el.id === "tfn") { tfTable(); return; }
  if (el.dataset.malla) return;
  if (el.dataset.pj) { S.proj[el.dataset.pj] = el.value; save(); const d = document.querySelector("#repdoc h1"); if (d && el.dataset.pj === "nombre") d.textContent = el.value || "Proyecto sin nombre"; return; }
  if (el.dataset.c && el.dataset.k) { const id = el.dataset.c; S.v[id] = collect(id); save();
    if (S.done[id] && !document.querySelector("#res .stale")) { const r = document.getElementById("res"); if (r) { const d = document.createElement("div"); d.className = "note stale"; d.innerHTML = '<span>Cambiaste datos después de calcular: este resultado ya no corresponde.</span><button class="btn small" type="button" data-act="calc" data-c="' + id + '">Recalcular</button>'; const sh = r.querySelector(".sechead"); sh.parentNode.insertBefore(d, sh.nextSibling); } } }
});
document.addEventListener("change", e => { const el = e.target;
  if (el.dataset && el.dataset.malla) { S.malla = S.malla || {}; if (el.checked) S.malla[el.dataset.malla] = 1; else delete S.malla[el.dataset.malla]; save(); render(true); return; }
  if (el.dataset && el.dataset.re && el.dataset.c) { const id = el.dataset.c; S.v[id] = collect(id); save(); render(true); } });
document.addEventListener("toggle", e => { const d = e.target; if (!d.dataset || !d.dataset.sgp) return; let closed = null; try { closed = JSON.parse(localStorage.getItem(KEY + "-side2") || "null"); } catch (er) {} if (!closed) closed = Object.keys(GROUPS).filter(g => g !== "malla"); closed = closed.filter(x => x !== d.dataset.sgp); if (!d.open) closed.push(d.dataset.sgp); try { localStorage.setItem(KEY + "-side2", JSON.stringify(closed)); } catch (er) {} }, true);
document.getElementById("backBtn").addEventListener("click", () => { const p = pageOf(cur); go(p.g === "hub" ? "inicio" : PARENT[p.g] === cur ? "inicio" : PARENT[p.g] || "inicio"); });

/* ============ INICIO ============ */
(function(){ const h = location.hash.slice(1); cur = h && PAGES.find(p => p.id === h) ? h : "inicio"; render(); })();
})();
</script>
