<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e1524">
<title>Órbita · redirigiendo…</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#0e1524;color:#e7ecf6;text-align:center;padding:24px}
  .box{max-width:420px}
  .spin{width:44px;height:44px;margin:0 auto 18px;border-radius:50%;
    border:3px solid rgba(255,255,255,.2);border-top-color:#5b8cff;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  h1{font-size:1.2rem;font-weight:800;margin:0 0 6px}
  p{color:#9aa6bd;font-size:.9rem;margin:0 0 16px}
  a{color:#5b8cff;font-weight:700;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <h1>Órbita se movió a su propia carpeta</h1>
    <p>Te llevamos a la nueva dirección y limpiamos la versión anterior. Tus datos se conservan.</p>
    <p><a href="orbita/ORGANIZADOR_PERSONAL.html">Entrar a Órbita ›</a></p>
  </div>
<script>
/* Limpieza puntual: desregistra SOLO el service worker viejo de Órbita que
   estaba en la raíz (el que ocupaba todo el sitio y hacía que el Portal se
   abriera dentro de Órbita). No borra ningún dato guardado. */
(function(){
  var go=function(){ location.replace('orbita/ORGANIZADOR_PERSONAL.html'); };
  if(!('serviceWorker' in navigator)){ setTimeout(go,300); return; }
  navigator.serviceWorker.getRegistrations().then(function(regs){
    var jobs=[];
    regs.forEach(function(r){
      var url=(r.active&&r.active.scriptURL)||(r.installing&&r.installing.scriptURL)||(r.waiting&&r.waiting.scriptURL)||'';
      // sólo SW de la raíz (no los que ya viven en /orbita/ o /estudio/)
      if(/\/sw\.js$/.test(url) && url.indexOf('/orbita/')===-1 && url.indexOf('/estudio/')===-1){
        jobs.push(r.unregister());
      }
    });
    return Promise.all(jobs);
  }).catch(function(){}).then(function(){
    if(window.caches){ return caches.delete('orbita-v2').catch(function(){}); }
  }).catch(function(){}).then(function(){ setTimeout(go,400); });
  setTimeout(go,2500);
})();
</script>
</body>
</html>
