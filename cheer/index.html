/* --- agarre de barra: posición sin atravesar el cuerpo + IK de brazos --- */
function ik2(s,t,l1,l2,pole){const T=THREE;const d=_v().subVectors(t,s);let L=d.length();const mx=l1+l2-0.05;let tt=t.clone();if(L>mx){d.setLength(mx);tt=s.clone().add(d);L=mx}
 const dir=d.clone().normalize();const a=(l1*l1+L*L-l2*l2)/(2*L);const h=Math.sqrt(Math.max(0,l1*l1-a*a));
 const pv=_v().subVectors(pole,s);pv.addScaledVector(dir,-pv.dot(dir));if(pv.lengthSq()<1e-6)pv.set(0,-1,0);pv.normalize();
 return [s.clone().addScaledVector(dir,a).addScaledVector(pv,h),tt]}
function segDist2(P,A,B){const ax=B.x-A.x,ay=B.y-A.y,L=ax*ax+ay*ay;let t=L?((P.x-A.x)*ax+(P.y-A.y)*ay)/L:0;t=Math.max(0,Math.min(1,t));const dx=P.x-(A.x+ax*t),dy=P.y-(A.y+ay*t);return Math.sqrt(dx*dx+dy*dy)}
function barIK(J,an){const b=an.bar;if(!b)return;const T=THREE;
 const up=_v().subVectors(J.S,J.M).normalize();const lat=new T.Vector3(0,0,J._m?-1:1);lat.addScaledVector(up,-lat.dot(up)).normalize();const fw=_v().crossVectors(up,lat).normalize();
 let C,push;
 if(b.t==='back'){C=J.S.clone().addScaledVector(fw,-9.8).addScaledVector(up,2.4);push=fw.clone().negate()}
 else if(b.t==='front'){C=J.S.clone().addScaledVector(fw,8.4).addScaledVector(up,2.6);push=fw.clone()}
 else if(b.t==='hip'){C=J.H.clone();C.y+=9.5;push=new T.Vector3(0,1,0)}
 else{C=J.W1.clone().lerp(J.W2,.5);push=b.push==='up'?new T.Vector3(0,1,0):fw.clone();push.z=0;if(push.lengthSq()<1e-4)push.set(1,0,0);push.normalize()}
 C.z=0;
 const caps=[[J.H,J.M,7.4],[J.M,J.S,7.8],[J.S,J.N,4],[J.N,J.N,8],[J.p1,J.K1,6.6],[J.K1,J.A1,4.6],[J.p2,J.K2,6.6],[J.K2,J.A2,4.6]];
 for(let i=0;i<60;i++){let bad=false;for(const [A,B,r] of caps)if(segDist2(C,A,B)<r+1.3){bad=true;break}if(!bad)break;C.addScaledVector(push,.5)}
 const g=b.g||22;J.BAR=C;
 for(const n of [1,2]){const sg=Math.sign(J['s'+n].z)||(n===1?1:-1),s=J['s'+n];const G=C.clone();G.z=sg*g;
  const out=new T.Vector3(0,0,sg);let pole;
  if(b.t==='back')pole=s.clone().addScaledVector(up,-1).addScaledVector(fw,-.6).addScaledVector(out,1.2);
  else if(b.t==='front')pole=s.clone().addScaledVector(fw,1.3).addScaledVector(out,.5).addScaledVector(up,-.2);
  else pole=J['E'+n].clone().addScaledVector(out,.6);
  let [E,W]=ik2(s,G,LN.ua,LN.fa,pole);const fd=_v().subVectors(G,E).normalize();[E,W]=ik2(s,G.clone().addScaledVector(fd,-2.4),LN.ua,LN.fa,pole);
  J['E'+n]=E;J['W'+n]=W}
}

 const local=()=>{ST.mode='local';ST.prefs=Object.assign(JSON.parse(JSON.stringify(DEF_PREFS)),LS.get('gc.prefs',{}));ST.logs=LS.get('gc.logs',[]);ST.athletes=LS.get('gc.athletes',[]);ST.ready=true;migrate();render()};

 fuerza5:{n:'Fuerza · 5 semanas',d:'Sobrecarga progresiva hacia cargas altas y descarga final.',w:[{t:'Volumen',s:4,r:8,rpe:7},{t:'Volumen',s:4,r:6,rpe:7.5},{t:'Intensidad',s:5,r:5,rpe:8},{t:'Intensidad alta',s:5,r:3,rpe:8.5},{t:'Descarga',s:3,r:5,rpe:6,dl:1}]},
 potencia6:{n:'Potencia · 6 semanas',d:'Fuerza que se transforma en explosividad para tumbling y lanzamientos.',w:[{t:'Fuerza base',s:4,r:6,rpe:7.5},{t:'Fuerza',s:4,r:5,rpe:8},{t:'Fuerza alta',s:5,r:4,rpe:8.5},{t:'Potencia',s:5,r:3,rpe:8},{t:'Potencia alta',s:6,r:2,rpe:8.5},{t:'Descarga',s:3,r:3,rpe:6,dl:1}]}
};
function progWeek(){const P=ST.prefs.program||{};const pr=PROGRAMS[P.id]||PROGRAMS.base4;const st=P.start?new Date(P.start+'T12:00'):mon(new Date());const wk=Math.floor((mon(new Date())-mon(st))/(7*864e5));const L=pr.w.length;const i=((wk%L)+L)%L;return {pr,i,w:pr.w[i],cycle:Math.floor(Math.max(0,wk)/L)+1}}
/* ===================== CARGA SUGERIDA ===================== */
function lastSets(exId){for(const l of ST.logs){const it=(l.items||[]).find(x=>x.id===exId&&x.sets&&x.sets.some(s=>s.done));if(it)return {date:l.date,sets:it.sets.filter(s=>s.done),target:it.r}}return null}
function suggestLoad(exId){const L=lastSets(exId);if(!L)return null;const ws=L.sets.filter(s=>+s.w>0);if(!ws.length)return null;const top=Math.max(...ws.map(s=>+s.w));const rpes=L.sets.map(s=>+s.rpe).filter(Boolean);const avg=rpes.length?rpes.reduce((a,b)=>a+b,0)/rpes.length:8;
 const tr=parseInt(L.target)||0;const missed=tr&&L.sets.some(s=>+s.r&&+s.r<tr);let f=1,why='';
 if(missed||avg>=9.6){f=.95;why='la vez pasada faltaron repeticiones o fue máximo: baja un poco'}else if(avg<=7.5){f=1.05;why='la vez pasada sobró margen (RPE '+avg.toFixed(1)+'): sube'}else if(avg<=8.5){f=1.025;why='buen esfuerzo (RPE '+avg.toFixed(1)+'): sube un poco'}else{why='esfuerzo alto (RPE '+avg.toFixed(1)+'): mantén la carga'}
 const step=top>=40?2.5:1;let w=Math.round(top*f/step)*step;if(f>1&&w<=top)w=top+step;if(f<1&&w>=top)w=Math.max(step,top-step);return {w,top,why,date:L.date}}

const EXI={};EX.forEach(e=>EXI[e.id]=e);
function parseRx(rx){const m=/^(\d+)x([^@]+)@(\d+)$/.exec(rx)||[0,3,'10',60];const r=m[2];const t=/^(\d+)s(\/lado)?$/.exec(r);const mm=/^(\d+)min$/.exec(r);return {s:+m[1],r,rest:+m[3],mode:(t||mm)?'time':'reps',work:t?+t[1]:mm?+mm[1]*60:0,side:/\/lado/.test(r)}}
function estSecs(it){const per=it.mode==='time'?it.work*(it.side?2:1)+5:(parseInt(it.r)||8)*3.2*(it.side?2:1)+15;if(it.mode==='tabata')return 4*60+30;return it.s*per+Math.max(0,it.s-1)*it.rest+30}
function recentIds(n){const s=new Set();ST.logs.slice(0,n).forEach(l=>(l.items||[]).forEach(i=>s.add(i.id)));return s}
const FOCUS={fuerza:{n:'Fuerza',d:'F'},gimnasia:{n:'Gimnasia',d:'G'},cheer:{n:'Cheer',d:'C'},mixto:{n:'Mixto',d:'FGC'}};
function pool(pred,avail,lvl,focusD){return EX.filter(e=>eqOk(e.eq,avail)&&e.lv<=lvl&&[...focusD].some(c=>e.d.includes(c))&&pred(e))}
function pickFrom(list,used,recent,seed){const fresh=list.filter(e=>!used.has(e.id)&&!recent.has(e.id));const L=fresh.length?fresh:list.filter(e=>!used.has(e.id));if(!L.length)return null;return L[(seed)%L.length]}
function mkItem(e,block,wk){const p=parseRx(e.rx);let it={id:e.id,n:e.n,block,s:p.s,r:p.r,rest:p.rest,mode:p.mode,work:p.work,side:p.side};
 if(block==='main'&&(e.ty==='fuerza'||e.ty==='potencia')&&p.mode==='reps'&&wk){it.s=e.ty==='potencia'?Math.max(3,Math.min(6,wk.s)):wk.s;const reps=e.ty==='potencia'?Math.min(5,Math.max(2,Math.round(wk.r/2)+1)):wk.r;it.r=String(reps)+(p.side?'/lado':'');it.rpe=wk.rpe;it.rest=Math.max(p.rest,wk.r<=5?150:90)}
 else if(wk&&wk.dl&&block!=='cal'&&block!=='calma')it.s=Math.max(1,Math.round(it.s*.6));
 if(block==='cal'||block==='calma'){it.s=1;if(it.mode==='time'&&it.work>300){it.work=300;it.r='5min'}if(it.mode==='reps'&&!/lado|min/.test(it.r))it.r=String(Math.min(12,parseInt(it.r)||10));it.rest=0}
 return it}
function genSession(o){
 const {place,dur,lvl}=o;const avail=o.eq;const fk=o.focus||PLACES[place].focus;const fd=FOCUS[fk].d;const wk=progWeek().w;
 const used=new Set(),recent=recentIds(2);let seed=(ST.logs.length*7+new Date().getDate())%97;const items=[];const total=dur*60;let tUsed=0;
 const add=(e,block)=>{if(!e)return false;const it=mkItem(e,block,wk);const t=estSecs(it);items.push(it);used.add(e.id);tUsed+=t;seed+=3;return true};
 /* calentamiento ~15 % */
 const calT=Math.max(240,total*.15);let ct=0;
 const calP=pool(e=>e.ty==='movilidad'||(e.ty==='acond'&&e.lv===1),avail,3,'FGC');
 const calOrder=['jog','jacks','jumprope','armcirc','inchworm','legswing','catcow',fd.includes('G')||fd.includes('C')?'wrists':'ext_shoulder','skip'];
 for(const id of calOrder){if(ct>=calT)break;const e=EXI[id];if(e&&calP.includes(e)&&!used.has(id)){add(e,'cal');ct+=estSecs(items[items.length-1])}}
 /* vuelta a la calma ~10 % (se reserva) */
 const calmaT=Math.max(180,total*.1);
 let flexP=pool(e=>e.ty==='flex'&&e.lv<=Math.max(1,lvl),avail,lvl,fd==='F'?'F':fd);if(flexP.length<2)flexP=pool(e=>e.ty==='flex',avail,lvl,'FGC');
 /* bloque principal ~45 % */
 const mainT=total*.45;let mt=0;
 const mainSlots={fuerza:[['piernas','fuerza'],['empuje','fuerza'],['tiron','fuerza'],['cadera','fuerza'],['cuerpo','potencia']],
  gimnasia:[['acrobacia','tecnica'],['aparatos','tecnica'],['aparatos','fuerza'],['empuje','fuerza'],['acrobacia','tecnica'],['salto','tecnica']],
  cheer:[['acrobacia','tecnica'],['saltos','tecnica'],['empuje','potencia'],['piernas','fuerza'],['hombro','fuerza'],['equilibrio','tecnica']],
  mixto:[['piernas','fuerza'],['empuje','fuerza'],['tiron','fuerza'],['acrobacia','tecnica'],['cadera','fuerza'],['cuerpo','potencia']]}[fk];
 const rot=(seed%mainSlots.length);const slots=mainSlots.slice(rot).concat(mainSlots.slice(0,rot));
 for(const [g,ty] of slots){if(mt>=mainT)break;let L=pool(e=>e.g===g&&e.ty===ty,avail,lvl,fd);if(!L.length)L=pool(e=>e.g===g&&(e.ty==='fuerza'||e.ty==='tecnica'||e.ty==='potencia'),avail,lvl,fd);const e=pickFrom(L,used,recent,seed);if(e&&add(e,'main'))mt+=estSecs(items[items.length-1])}
 /* accesorios y core */
 const accT=total-calT-calmaT-mt-(dur>=40?270:0);let at=0;
 const accG=['core','hombro','tobillo','cadera','tiron','piernas','empuje','core'];let gi=seed%accG.length;let guard=0;
 while(at<accT-60&&guard++<20){const g=accG[gi++%accG.length];const L=pool(e=>e.g===g&&(e.ty==='fuerza'||e.ty==='movilidad'),avail,lvl,fk==='gimnasia'||fk==='cheer'?fd+'F':fd);const e=pickFrom(L,used,recent,seed);if(e&&add(e,'acc'))at+=estSecs(items[items.length-1])}
 /* acondicionamiento (Tabata) si hay tiempo */
 if(dur>=40){const L=pool(e=>e.ty==='acond'&&e.id!=='jog'&&e.id!=='sprint'&&e.id!=='shuttle',avail,3,'FGC');const e=pickFrom(L,used,recent,seed);if(e){const it=mkItem(e,'cond',wk);it.mode='tabata';it.s=8;it.r='20s';it.work=20;it.rest=10;items.push(it);used.add(e.id)}}
 /* vuelta a la calma */
 let lt=0;for(let k=0;k<6&&lt<calmaT;k++){const e=pickFrom(flexP,used,new Set(),seed+k);if(!e)break;add(e,'calma');lt+=estSecs(items[items.length-1])}
 const title=FOCUS[fk].n+' · '+PLACES[place].n;
 return {id:rid(),date:today(),place,dur,focus:fk,title,items,cur:0,started:Date.now(),week:progWeek().i+1}}
function sessionMins(s){return Math.round(s.items.reduce((a,i)=>a+estSecs(i),0)/60)}
function alternatives(it,avail){const e=EXI[it.id];return EX.filter(x=>x.id!==e.id&&x.g===e.g&&(x.ty===e.ty||(['fuerza','potencia'].includes(x.ty)&&['fuerza','potencia'].includes(e.ty)))&&eqOk(x.eq,avail)&&x.lv<=Math.max(e.lv,ST.prefs.lvl))}

const TM={on:false,q:[],cur:null,h:null,mode:'',rounds:0,up:0,laps:[]};
function tmEl(){let t=$('#tmr');if(!t){t=document.createElement('div');t.id='tmr';t.setAttribute('role','timer');t.setAttribute('aria-live','polite');document.body.appendChild(t)}return t}
function tmRun(segs,opt={}){audioOn();if(!TM.on)try{history.pushState({gcTimer:1},'');TM.hist=true}catch(e){}TM.on=true;TM.q=segs.slice();TM.opt=opt;TM.mode=opt.mode||'seq';TM.rounds=0;TM.laps=[];wakeOn();tmNext()}
function tmNext(){const c=TM.q.shift();if(!c){tmFinish();return}TM.cur=Object.assign({},c,{end:Date.now()+c.secs*1000,warn:{},paused:false});if(c.kind==='work')beep(660,.12);tmPaint(true);if(!TM.h)TM.h=setInterval(tmTick,150);tmTick()}
function tmFinish(){const cb=TM.opt&&TM.opt.onAll;tmClose(true);bigBeep();vib([300,120,300]);if(cb)cb()}
function tmClose(silent,fromPop){const hadH=TM.hist;TM.hist=false;if(hadH&&!fromPop&&typeof histBack==='function')histBack();TM.on=false;clearInterval(TM.h);TM.h=null;TM.cur=null;const t=$('#tmr');if(t)t.remove();if(!ST.prefs.active)wakeOff();if(!silent&&TM.opt&&TM.opt.onClose)TM.opt.onClose()}
function tmPaint(full){const t=tmEl(),c=TM.cur;if(!c)return;if(full){t.className=c.kind||'rest';
 const extra=TM.mode==='amrap'?`<button data-t="round">+1 ronda</button>`:TM.mode==='watch'?`<button data-t="lap">Vuelta</button>`:'';
 t.innerHTML=`<div class="tl">${esc(c.label)}</div><div class="tn num" id="tmN">0:00</div><div class="ring"><i id="tmR"></i></div><div class="ts" id="tmS">${esc(c.sub||'')}</div><div class="tnext">${esc(c.next||'')}</div>
 <div class="tb"><button data-t="-15">−15 s</button><button data-t="pause" id="tmP">Pausa</button><button data-t="+15">+15 s</button>${extra}<button data-t="skip">Saltar</button><button data-t="close" aria-label="Cerrar temporizador">Cerrar</button></div>`;
 t.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>tmBtn(b.dataset.t))}}
function tmBtn(a){const c=TM.cur;if(!c)return;audioOn();
 if(a==='close'){tmClose();return}
 if(a==='skip'){const cb=c.onEnd;tmNext();cb&&cb();return}
 if(a==='pause'){if(c.paused){c.end=Date.now()+c.left*1000;c.paused=false;$('#tmP').textContent='Pausa'}else{c.left=(c.end-Date.now())/1000;c.paused=true;$('#tmP').textContent='Seguir'}return}
 if(a==='round'){TM.rounds++;beep(1000,.08);$('#tmS').textContent='Rondas: '+TM.rounds;return}
 if(a==='lap'){TM.laps.push(TM.up);$('#tmS').textContent='Vueltas: '+TM.laps.map(fmt).join(' · ');return}
 const d=+a;if(c.paused)c.left=Math.max(1,c.left+d);else c.end=Math.max(Date.now()+1000,c.end+d*1000);c.secs=Math.max(1,c.secs+d);tmTick()}
function tmTick(){const c=TM.cur;if(!c)return;const N=$('#tmN'),Rg=$('#tmR');
 if(TM.mode==='watch'){if(!c.paused)TM.up=(Date.now()-c.start0)/1000;if(N)N.textContent=fmt(TM.up);return}
 const left=c.paused?c.left:(c.end-Date.now())/1000;const L=Math.ceil(left);if(N)N.textContent=fmt(L);if(Rg)Rg.style.width=(100*(1-left/c.secs))+'%';if(c.paused)return;
 if(L===10&&c.secs>=25&&!c.warn[10]){c.warn[10]=1;beep(600,.12);vib(80);note('Quedan 10 s: '+(c.next||c.label))}
 if(L<=3&&L>0&&!c.warn[L]){c.warn[L]=1;beep(880,.1);vib(40)}
 if(left<=0){bigBeep();vib([250,100,250]);const t=$('#tmr');if(t){t.classList.add('flash');setTimeout(()=>t&&t.classList.remove('flash'),1100)}note(c.endMsg||'¡Tiempo!');const cb=c.onEnd;tmNext();cb&&cb()}}

 <p class="small mute">RPE: esfuerzo de 6 a 10. 8 = te quedaban 2 repeticiones. ${it.mode==='time'?'Al tocar ▶ corre el tiempo de trabajo y luego el descanso.':'Al marcar la serie empieza el descanso con aviso sonoro.'}</p>`}

/* ===================== PROGRESO ===================== */
function weekKey(d){return iso(mon(d))}
function weekStats(){const done=doneDays(),t=ST.prefs.target||4;const out=[];const m=mon(new Date());for(let w=0;w<8;w++){const s=new Date(m);s.setDate(m.getDate()-7*w);let n=0;for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);if(done.has(iso(d)))n++}out.push({k:iso(s),n,ok:n>=t||!!(ST.prefs.weeksDone||{})[iso(s)]})}return out}
function weekStreak(){const ws=weekStats();let n=0;for(let i=(ws[0].ok?0:1);i<ws.length&&ws[i].ok;i++)n++;return n}
function vProgreso(){const p=ST.prefs,pw=progWeek();const ws=weekStats();const comp=Math.round(100*ws.slice(0,4).reduce((a,w)=>a+Math.min(w.n,p.target||4),0)/(4*(p.target||4)));
 let h=`<h1>Progreso</h1><div class="statrow"><div class="card stat"><span class="eyebrow">Racha</span><span class="big num">${streakDays()}</span><span class="small mute">días seguidos</span></div><div class="card stat"><span class="eyebrow">Semanas</span><span class="big num">${weekStreak()}</span><span class="small mute">cumpliendo meta</span></div><div class="card stat"><span class="eyebrow">Cumplimiento</span><span class="big num">${comp}%</span><span class="small mute">últimas 4 sem.</span></div></div>`;
 h+=`<div class="card stack"><div class="row between"><h3>Programa</h3><span class="pill acc">Ciclo ${pw.cycle}</span></div><div class="chips">${Object.entries(PROGRAMS).map(([k,v])=>`<button class="chip ${(p.program||{}).id===k?'on':''}" data-act="prog" data-k="${k}">${v.n}</button>`).join('')}</div>
 <p class="small mute">${esc(pw.pr.d)}</p><div class="meso" aria-label="Semanas del bloque">${pw.pr.w.map((w,i)=>`<i class="${i<=pw.i?'on':''} ${w.dl?'dl':''} ${i===pw.i?'cur':''}" title="${esc(w.t)}"></i>`).join('')}</div>
 <dl class="kv"><dt>Esta semana</dt><dd><b>${pw.i+1} de ${pw.pr.w.length} · ${esc(pw.w.t)}</b></dd><dt>Básicos</dt><dd>${pw.w.s} series × ${pw.w.r} reps · RPE ${pw.w.rpe}${pw.w.dl?' · semana de descarga: menos series, misma técnica':''}</dd><dt>Ajuste de carga</dt><dd>Automático según el peso, repeticiones y RPE que registres.</dd></dl>
 <div class="row"><label class="lbl" for="progStart" style="margin:0">Inicio del bloque</label><input class="inp" id="progStart" type="date" data-ch="progstart" value="${esc((p.program||{}).start||iso(mon(new Date())))}" style="width:auto"></div>
 <div class="row"><span class="small mute">Meta semanal:</span>${[2,3,4,5,6].map(n=>`<button class="chip ${p.target===n?'on':''}" data-act="target" data-k="${n}">${n}</button>`).join('')}</div></div>`;
 h+=calHTML();
 h+=`<div class="card stack"><h3>Series por semana</h3>${volChart()}</div>`;
 const pr={};for(const l of ST.logs)for(const it of l.items||[])for(const z of it.sets||[])if(z.done&&+z.w>0){if(!pr[it.id]||+z.w>pr[it.id].w)pr[it.id]={w:+z.w,r:z.r,d:l.date,n:it.n}}
 const prs=Object.values(pr).sort((a,b)=>b.w-a.w).slice(0,8);
 h+=`<div class="card stack"><h3>Mejores marcas registradas</h3>${prs.length?`<table class="tbl"><tr><th>Ejercicio</th><th class="r">Peso</th><th class="r">Reps</th><th class="r">Fecha</th></tr>${prs.map(r=>`<tr><td>${esc(r.n)}</td><td class="r">${r.w} kg</td><td class="r">${esc(r.r||'–')}</td><td class="r">${r.d.slice(5)}</td></tr>`).join('')}</table>`:'<div class="empty small">Registra el peso de tus series y aquí verás tus mejores marcas.</div>'}</div>`;
 h+=`<div class="card stack"><h3>Sesiones recientes</h3>${ST.logs.length?`<div class="list">${ST.logs.slice(0,10).map(l=>`<button class="li" style="background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%" data-act="logsheet" data-k="${l.id}"><span class="grow"><b>${esc(l.title)}</b><span class="small mute">${l.date} · ${l.mins||l.dur} min · ${(l.items||[]).reduce((a,i)=>a+(i.sets||[]).filter(z=>z.done).length,0)} series</span></span><span class="pill ok">✓</span></button>`).join('')}</div>`:'<div class="empty small">Aún no hay sesiones. Genera la primera en Hoy.</div>'}</div>`;
 return h}
function calHTML(){const now=new Date();const m=UI.calM||{y:now.getFullYear(),mo:now.getMonth()};const first=new Date(m.y,m.mo,1,12);const pad=(first.getDay()+6)%7;const days=new Date(m.y,m.mo+1,0).getDate();const done=doneDays();const wd=ST.prefs.weeksDone||{};
 let h=`<div class="card stack"><div class="row between"><button class="iconbtn" data-act="calm" data-k="-1" aria-label="Mes anterior">‹</button><h3>${MON[m.mo][0].toUpperCase()+MON[m.mo].slice(1)} ${m.y}</h3><button class="iconbtn" data-act="calm" data-k="1" aria-label="Mes siguiente">›</button></div>
 <div class="cal">${DAYN.map(d=>`<div class="small mute" style="text-align:center;font-weight:700">${d[0]}</div>`).join('')}`;
 for(let i=0;i<pad;i++)h+='<div class="c x"></div>';for(let d=1;d<=days;d++){const k=iso(new Date(m.y,m.mo,d,12));h+=`<button class="c ${done.has(k)?'done':''} ${k===today()?'today':''}" data-act="calday" data-k="${k}" aria-label="${d} ${done.has(k)?'entrenado':'sin entrenar'}">${d}</button>`}
 h+=`</div><p class="small mute">Toca un día para marcarlo o desmarcarlo a mano. Las sesiones terminadas se marcan solas.</p><div class="list">`;
 const ws=weekStats().slice(0,4);for(const w of ws){h+=`<div class="li"><span class="grow"><b>Semana del ${w.k.slice(8)}/${w.k.slice(5,7)}</b><span class="small mute">${w.n} de ${ST.prefs.target||4} sesiones</span></span><button class="chip ${wd[w.k]||w.n>=(ST.prefs.target||4)?'on':''}" data-act="wkdone" data-k="${w.k}">${w.n>=(ST.prefs.target||4)?'Cumplida':wd[w.k]?'Marcada':'Marcar completa'}</button></div>`}
 return h+'</div></div>'}
function volChart(){const ws=weekStats().slice().reverse();const vals=ws.map(w=>{const s=new Date(w.k+'T12:00'),e=new Date(s);e.setDate(s.getDate()+7);return ST.logs.filter(l=>{const d=new Date(l.date+'T12:00');return d>=s&&d<e}).reduce((a,l)=>a+(l.items||[]).reduce((b,i)=>b+(i.sets||[]).filter(z=>z.done).length,0),0)});

 <div class="card stack"><h3>Desequilibrios</h3>${z.imb.length?`<ul class="dots small">${z.imb.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="small">Ninguno detectado con los datos actuales.</p>'}</div>
 <div class="card stack"><h3>Habilidades listas para progresar</h3>${z.ready.length?`<ul class="dots small">${z.ready.map(r=>`<li>${esc(r.n)} <span class="mute">(${esc(r.ap)})</span></li>`).join('')}</ul>`:'<p class="small">Marca las habilidades dominadas en la pestaña Habilidades.</p>'}</div>
 <div class="card stack" style="border-color:var(--acc)"><h3>Foco para el siguiente bloque</h3><ul class="dots">${z.rec.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}
function athSummary(a){const D=DISC[a.disc]||DISC.mag;const z=analyze(a);const ev=(a.evals||[]).slice().sort((x,y)=>x.date<y.date?-1:1);let s=`# ${a.name}\n\n- Disciplina: ${D.n}\n- Nivel: ${D.lv[a.lvl]||''}\n${a.year?'- Año de nacimiento: '+a.year+'\n':''}${a.notes?'- Notas: '+a.notes+'\n':''}\n## Habilidades dominadas\n`;
 for(const A of D.ap){const dn=A.el.filter(e=>a.skills&&a.skills[e[0]]);s+=`\n**${A.n}** (${dn.length}/${A.el.length})\n`+(dn.length?dn.map(e=>'- '+e[1]).join('\n'):'- Ninguna aún')+'\n'}
 s+='\n## Evaluaciones\n\n';if(ev.length){const keys=TESTS.filter(T=>ev.some(e=>e.tests[T.k]!=null));s+='| Fecha | '+keys.map(T=>T.n+' ('+T.u+')').join(' | ')+' |\n|'+'---|'.repeat(keys.length+1)+'\n'+ev.map(e=>'| '+e.date+' | '+keys.map(T=>e.tests[T.k]??'').join(' | ')+' |').join('\n')+'\n'}else s+='Sin evaluaciones.\n';
 s+='\n## Análisis\n\n'+(z.trend.length?z.trend.map(t=>`- ${t.n}: ${t.t} (${t.eq?'igual':t.good?'mejora':'empeora'})`).join('\n')+'\n':'')+(z.imb.length?'\n**Desequilibrios:** '+z.imb.join('; ')+'\n':'')+(z.ready.length?'\n**Listas para progresar:** '+z.ready.map(r=>r.n).join('; ')+'\n':'')+'\n**Foco del siguiente bloque:**\n'+z.rec.map(r=>'- '+r).join('\n')+'\n\n_Generado con GimnastiCheer el '+today()+'._\n';return s}
async function exportText(name,text){try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data:text});toast('Archivo listo');return}}catch(e){if(e&&e.code==='declined')return}

function setDone(j){const s=sess(),it=s.items[s.cur],z=it.sets[j];audioOn();

 const finishSet=()=>{z.done=true;if(!z.r&&it.mode==='reps')z.r=String(parseInt(it.r)||'');if(!z.r&&it.mode==='time')z.r=String(it.work);if(!z.w){const sg=suggestLoad(it.id);if(sg&&EXI[it.id]&&['fuerza','potencia'].includes(EXI[it.id].ty))z.w=''}saveSess();render()};
 const last=it.sets.every((x,k)=>k===j||x.done);const nextIt=s.items[s.cur+1];
 const rest=it.rest>0?[{label:last?'Descanso: cambia de ejercicio':'Descanso',secs:it.rest,kind:'rest',next:last?(nextIt?'Siguiente: '+nextIt.n:'Último ejercicio terminado'):'Serie '+(j+2)+' de '+it.sets.length+' · '+it.n,endMsg:last?(nextIt?'¡Vamos con '+nextIt.n+'!':'¡Terminaste!'):'¡Siguiente serie!'}]:[];

 const nav=$('#nav');nav.innerHTML=Object.keys(VIEWN).map(k=>`<button class="${UI.view===k?'on':''}" data-act="nav" data-v="${k}" aria-current="${UI.view===k?'page':'false'}">${ICON[k]}<span>${VIEWN[k]}</span></button>`).join('');
 mountDemos(app)}

applyTheme();
