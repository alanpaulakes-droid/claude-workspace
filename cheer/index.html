<!DOCTYPE html>
<html lang="es">
<head>

<meta name="theme-color" content="#e0245e">
<title>Cheer Pro Anual</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f6f5fa;--card:#fff;--card2:#f1eff7;--ink:#1b1630;--mute:#6b6684;--line:#e6e3ef;--acc:#e0245e;--acc2:#7c3aed;--ok:#0f9d6f;--warn:#d97706;--shadow:0 1px 2px rgba(20,10,40,.06),0 4px 14px rgba(20,10,40,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d18;--card:#1a1726;--card2:#221e31;--ink:#eeeaf7;--mute:#9a94b3;--line:#2c2742;--ok:#34d399;--warn:#fbbf24;--shadow:none}}
:root[data-theme="dark"]{--bg:#0f0d18;--card:#1a1726;--card2:#221e31;--ink:#eeeaf7;--mute:#9a94b3;--line:#2c2742;--ok:#34d399;--warn:#fbbf24;--shadow:none}
:root{--skin:#e8b391;--skin2:#c98e6b;--hair:#3a2418;--top:#e0245e;--top2:#a51a46;--short:#2d2748;--short2:#1c1830;--shoe:#ffffff;--shoe2:#cfcbe0;--hl:#ff7a1a;--stc:#2f9bff;--floor:#ebe8f3;--mat:#3f6fd8;--equip:#4a4560;--equip2:#8f8aa8;--hlt:#b9500a;--stt:#1f6fc4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--short:#5a5288;--short2:#3e3864;--shoe:#f1f0f7;--shoe2:#a9a5bd;--floor:#1b1828;--equip:#a29dbd;--equip2:#615c7d;--mat:#3a62c4;--hlt:#ff9a4d;--stt:#6bb8ff}}
:root[data-theme="dark"]{--short:#5a5288;--short2:#3e3864;--shoe:#f1f0f7;--shoe2:#a9a5bd;--floor:#1b1828;--equip:#a29dbd;--equip2:#615c7d;--mat:#3a62c4;--hlt:#ff9a4d;--stt:#6bb8ff}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button,select,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 10px}
header h1{font-size:1.1rem;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
header h1 img{width:26px;height:26px;border-radius:7px}
#hdr{font-size:.82rem;color:var(--mute);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:600;background:var(--card2);color:var(--ink);white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:14px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
h2{font-size:1.15rem;margin-bottom:8px}
h3{font-size:1rem;margin-bottom:6px}
.mute{color:var(--mute);font-size:.86rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:.88rem}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:4px 9px;font-size:.8rem}
.daytabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.daytabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;cursor:pointer;font-size:.8rem;text-align:center;min-width:58px}
.daytabs button b{display:block;font-size:.85rem}
.daytabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.daytabs button.today:not(.on){border-color:var(--acc)}
.ex{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--card)}
.ex.done{opacity:.6}
.ex .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex .nm{font-weight:700}
.ex .rx{font-size:.85rem;margin-top:2px}
.ex .tip{font-size:.8rem;color:var(--mute);margin-top:4px}
.tag{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--mute);white-space:nowrap}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sets button{width:44px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--card2);cursor:pointer;font-weight:700}
.sets button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.demo-w{margin:10px auto 0;max-width:340px}
.demo{display:block;width:100%;aspect-ratio:4/3;border-radius:14px;border:1px solid var(--line);cursor:pointer;background:var(--card2)}
.demo-w figcaption{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.72rem;color:var(--mute);margin-top:5px}
.demo-w .mu{font-weight:700;color:var(--hlt)}.demo-w .mu.st{color:var(--stt)}
.demo-w.slowon .slow{color:var(--acc);font-weight:700}
.kg{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:.8rem;color:var(--mute)}
.kg input{width:80px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card2)}
ul.plain{padding-left:18px;font-size:.9rem}
ul.plain li{margin:3px 0}
.bar{height:6px;border-radius:9px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);width:0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;font-size:.68rem;color:var(--mute);cursor:pointer;padding:4px 6px;gap:1px;min-width:52px}
nav button span{font-size:1.25rem}
nav button.on{color:var(--acc);font-weight:700}
#timer{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:9;max-width:744px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 14px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#timer.show{display:block}
#timer.work{background:var(--acc);color:#fff}
#timer.alert{animation:fl .5s 3}
@keyframes fl{50%{transform:scale(1.03)}}
#timer .t{display:flex;align-items:center;justify-content:space-between;gap:10px}
#tLbl{font-size:.85rem;font-weight:600;opacity:.9}
#tNum{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#timer .bar{background:rgba(127,127,127,.35);margin-top:8px}
#timer .bar>i{background:currentColor}
#timer .tb{display:flex;gap:6px;margin-top:8px}
#timer .tb button{flex:1;border:0;border-radius:9px;padding:7px 4px;background:rgba(127,127,127,.25);color:inherit;font-weight:700;cursor:pointer;font-size:.82rem}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;background:var(--ok);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;display:none;max-width:90vw;text-align:center}
.grid52{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px}
.wk{border-radius:9px;padding:6px 2px;text-align:center;font-size:.75rem;font-weight:700;color:#fff;cursor:pointer;position:relative;border:2px solid transparent}
.wk small{display:block;font-size:.6rem;font-weight:600;opacity:.9}
.wk.cur{border-color:var(--ink);transform:scale(1.06)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.avail td,.avail th{text-align:center}
.avail input{width:20px;height:20px;accent-color:var(--acc)}
label.f{display:block;font-size:.82rem;color:var(--mute);margin:10px 0 4px}
.inp{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card2)}
.plan-day{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.plan-day:last-child{border:0}
.plan-day b{width:82px;flex:none;font-size:.88rem}
.plan-day select{flex:1;min-width:0;padding:7px;border-radius:9px;border:1px solid var(--line);background:var(--card2);font-size:.85rem}
.obj{border-left:4px solid var(--acc);padding-left:12px}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.75rem;margin:8px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.tests input{width:100%;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card2)}
.warnbox{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:12px;padding:10px;font-size:.84rem;margin-bottom:12px}
.hidden{display:none}
</style>
</head>

/* ===================== ESTADO ===================== */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const mondayOf=d=>{const x=new Date(d);x.setHours(0,0,0,0);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x};
const defAvail=()=>DAYS.map((_,i)=>({pesas:i<5,pasto:i===1||i===3||i===5,suelo:i===1||i===3||i===5}));
let S=Object.assign({start:iso(new Date()),role:'base',nDays:5,sound:true,avail:defAvail(),plan:null,preview:null,view:'hoy',day:null},LS.get('cheer.v1',{}));
if(!ROLE[S.role])S.role='base';
const save=()=>LS.set('cheer.v1',S);

function realWeek(){const ms=mondayOf(new Date())-mondayOf(new Date(S.start+'T00:00'));return Math.floor(Math.round(ms/864e5)/7)+1}
function curAbsWeek(){return S.preview||Math.max(1,realWeek())}
function wInYear(w){return ((w-1)%52)+1}
function yearOf(w){return Math.floor((w-1)/52)+1}
function phaseOf(wy){return PHASES.find(p=>wy>=p.w[0]&&wy<=p.w[1])}
function isDeload(wy){return DELOAD.includes(wy)}
function rpe(wy){if(isDeload(wy))return 'RPE 6 · descarga';const ph=phaseOf(wy);const i=(wy-ph.w[0])%4;return ['RPE 7','RPE 7.5–8','RPE 8–8.5','RPE 8.5–9'][i]}
function weekDate(absW,d){const m=mondayOf(new Date(S.start+'T00:00'));m.setDate(m.getDate()+(absW-1)*7+d);return m}

function rotation(phId){const pw=['fuerza','potencia','comp'].includes(phId)?'W_POWER':'P_PLYO';return ['W_LOWER','G_TUMB','W_UPPER','W_BASE','P_COND',pw]}
function buildPlan(){
 const ph=phaseOf(wInYear(curAbsWeek()));const order=rotation(ph.id).slice(0,S.nDays);const plan=Array(7).fill(null);
 for(const s of order){let best=null;
  for(let d=0;d<7;d++){if(plan[d])continue;
   for(const [tk,v,pen] of OPT[s]){if(!S.avail[d][v])continue;let sc=pen+d*0.01;
    for(const a of [d-1,d+1]){if(a<0||a>6)continue;const p=plan[a];if(!p)continue;sc+=0.6;if(T[p.k].tag===T[tk].tag&&T[tk].tag!=='light')sc+=2.5;if(['legs','run'].includes(T[p.k].tag)&&['legs','run'].includes(T[tk].tag))sc+=1}
    if(!best||sc<best.sc)best={d,tk,v,sc}}}
  if(best)plan[best.d]={k:best.tk,v:best.v}}
 S.plan=plan;S.planPhase=ph.id;save();
}
if(!S.plan||S.planVer!==2||S.planPhase!==phaseOf(wInYear(curAbsWeek())).id){S.planVer=2;buildPlan()}

function exercisesFor(tk,ph,wy){
 const out=[];
 for(const e of T[tk].ex){
  if(e.skills){SKILLS[ph.id].forEach(n=>out.push({n,t:'skill',tip:'Habilidades nuevas SOLO con entrenador/spotter y colchoneta. Calidad > cantidad.'}));continue}
  if(e.only&&!e.only.includes(ph.id))continue;if(e.not&&e.not.includes(ph.id))continue;out.push(e)}
 const r=ROLE[S.role];if(r&&r.add[tk])out.push(...r.add[tk]);
 return out.map(e=>{let [s,rep,rest]=e.c?e.c[ph.id]:ph.p[e.t];if(e.r&&!e.c)rep=e.r;
  if(isDeload(wy)&&e.t!=='flex'&&e.t!=='bal')s=Math.max(e.c?1:2,Math.round(s*0.6));
  return Object.assign({},e,{s,rep,rest,tip:(e.tipBy&&e.tipBy[ph.id])||e.tip})});
}
function secsOf(rep){let m=/^(\d+)s$/.exec(rep);if(m)return +m[1];m=/^(\d+) min$/.exec(rep);if(m)return +m[1]*60;return 0}
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtRep=r=>{const s=secsOf(r);if(/s$/.test(r)&&s>=60)return fmt(s)+' min';return r};
const restTxt=r=>r>=60?(r%60?fmt(r)+' min':r/60+' min'):r+' s';

/* ===================== AUDIO / AVISOS ===================== */
let AC=null;
function audio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(f=880,d=.15,v=.25){if(!S.sound||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function bigBeep(){beep(988,.18);setTimeout(()=>beep(1319,.35,.3),200)}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function notify(msg){try{if(document.hidden&&'Notification' in window&&Notification.permission==='granted')new Notification('Cheer Pro',{body:msg,icon:'icon.svg',tag:'cheer-timer'})}catch(e){}}
function toast(msg,ms=2200){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms)}
let wake=null;async function keepAwake(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}}catch(e){}}

/* ===================== TEMPORIZADOR ===================== */
let TQ=[],TC=null,TH=null;
const tEl=document.getElementById('timer');
function runQueue(q){TQ=q;tNext()}
function tNext(){TC=TQ.shift();if(!TC){tEl.className='';clearInterval(TH);TH=null;return}
 TC.end=Date.now()+TC.secs*1000;TC.warn={};TC.paused=false;document.getElementById('tPause').textContent='Pausa';
 tEl.className='show'+(TC.kind==='work'?' work':'');document.getElementById('tLbl').textContent=TC.label;document.getElementById('tNext').textContent=TC.next||'';
 if(TC.kind==='work'){beep(660,.12)}
 if(!TH)TH=setInterval(tick,200);tick();keepAwake()}
function tick(){if(!TC)return;const left=TC.paused?TC.left:(TC.end-Date.now())/1000;const L=Math.ceil(left);
 document.getElementById('tNum').textContent=fmt(L);document.getElementById('tBar').style.width=(100*(1-left/TC.secs))+'%';
 if(TC.paused)return;
 if(L===10&&TC.secs>=25&&!TC.warn[10]){TC.warn[10]=1;beep(700,.12);vib(80);if(TC.kind==='rest')notify('10 s: prepárate para '+(TC.next||'la siguiente serie'))}
 if(L<=3&&L>0&&!TC.warn[L]){TC.warn[L]=1;beep(880,.1)}
 if(left<=0){bigBeep();vib([250,100,250]);tEl.classList.add('alert');setTimeout(()=>tEl.classList.remove('alert'),1600);
  const m=TC.endMsg||'¡Tiempo!';notify(m);toast(m);const cb=TC.onEnd;tNext();cb&&cb()}}
tEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!TC)return;const a=b.dataset.t;
 if(a==='skip'){const cb=TC.onEnd;tNext();cb&&cb();return}
 if(a==='pause'){if(TC.paused){TC.end=Date.now()+TC.left*1000;TC.paused=false;b.textContent='Pausa'}else{TC.left=(TC.end-Date.now())/1000;TC.paused=true;b.textContent='Seguir'}return}
 const d=+a;if(TC.paused)TC.left=Math.max(1,TC.left+d);else TC.end=Math.max(Date.now()+1000,TC.end+d*1000);TC.secs=Math.max(TC.secs+d,1);tick()});

function progKey(aw,d,tk){return 'cheer.p.'+iso(weekDate(aw,d))+'.'+tk}
function vHoy(){
 const aw=curAbsWeek(),wy=wInYear(aw),ph=phaseOf(wy);const todayIdx=(new Date().getDay()+6)%7;const isCur=!S.preview&&realWeek()===aw;
 if(S.day==null)S.day=isCur?todayIdx:0;const d=S.day;
 let html=`<div class="daytabs">${DAYS.map((n,i)=>{const p=S.plan[i];return `<button data-d="${i}" class="${i===d?'on':''} ${isCur&&i===todayIdx?'today':''}"><b>${n.slice(0,3)}</b>${p?VEN[p.v].i:'😴'} ${weekDate(aw,i).getDate()}</button>`}).join('')}</div>`;

 const tpl=T[p.k],exs=exercisesFor(p.k,ph,wy),key=progKey(aw,d,p.k),prog=LS.get(key,{});
 const tot=exs.reduce((a,e)=>a+e.s,0),dn=exs.reduce((a,e,i)=>a+Math.min(e.s,prog[i]||0),0);
 html+=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${tpl.n}</h2><span class="pill">${VEN[p.v].i} ${VEN[p.v].n}</span></div>
 <p class="mute" style="margin-top:4px">Objetivos: ${tpl.obj} · ${ph.n} · ${rpe(wy)}</p>
 ${isDeload(wy)?'<div class="warnbox" style="margin-top:8px">Semana de descarga: menos series y cargas ~10 % más bajas. Es parte del progreso: aquí se asimila el trabajo.</div>':''}
 ${VENUE_NOTE[p.k+'|'+p.v]?`<div class="warnbox" style="margin-top:8px">${VENUE_NOTE[p.k+'|'+p.v]}</div>`:''}
 <div class="bar" style="margin-top:10px"><i style="width:${tot?100*dn/tot:0}%"></i></div><p class="mute" style="margin-top:4px">${dn}/${tot} series</p></div>
 <details class="card"><summary><b>🔥 Calentamiento (10–12 min)</b></summary><ul class="plain" style="margin-top:8px">${WARM.all.concat(WARM[p.v]).map(x=>'<li>'+x+'</li>').join('')}</ul></details>`;
 exs.forEach((e,i)=>{const n=prog[i]||0;const hold=secsOf(e.rep)>0;
  const last=(LS.get('cheer.kg',{})[e.n]||[]).slice(-1)[0];
  html+=`<div class="ex ${n>=e.s?'done':''}"><div class="top"><div><div class="nm">${i+1}. ${e.n}</div>
  <div class="rx"><b>${e.s} × ${fmtRep(e.rep)}</b>${e.side?' por lado':''} · descanso <b>${e.rest?restTxt(e.rest):'—'}</b></div></div><span class="tag">${TYPE[e.t]}</span></div>
  ${demoHTML(e.n)}
  <div class="tip">${e.tip||''}</div>
  <div class="sets">${Array.from({length:e.s},(_,j)=>`<button data-ex="${i}" data-set="${j}" class="${j<n?'ok':''}">${j<n?'✓':(hold?'▶':j+1)}</button>`).join('')}</div>
  ${e.kg&&p.v==='pesas'?`<div class="kg">Carga: <input type="number" inputmode="decimal" step="0.5" data-kg="${i}" placeholder="kg"> ${last?`Último: <b>${last.kg} kg</b> (${last.d})`:''}</div>`:''}</div>`});
 html+=`<details class="card"><summary><b>🧊 Vuelta a la calma</b></summary><ul class="plain" style="margin-top:8px">${COOL.map(x=>'<li>'+x+'</li>').join('')}</ul></details>
 ${p.k!=='G_FLEX'?'<div class="card mute">➕ Flexibilidad diaria mínima: 10 min de splits (3 lados) y puente al final, aunque hoy no toque sesión de flexibilidad.</div>':''}
 <div class="card mute">Progresión: si completas todas las series con el RPE indicado, sube 2,5–5 % la carga (o 1–2 reps / 5 s) la próxima vez. Dolor articular agudo (muñeca, lumbar, rodilla) = parar ese ejercicio.</div>`;
 app.innerHTML=html;bindDays();initDemos(app);

}
function bindDays(){app.querySelectorAll('.daytabs button').forEach(b=>b.onclick=()=>{S.day=+b.dataset.d;save();render()})}
function setTap(exs,i,j,key){
 const prog=LS.get(key,{});const n=prog[i]||0;
 if(j<n){prog[i]=j;LS.set(key,prog);render();return}
 const e=exs[i];const setNo=n+1;const lastSet=setNo>=e.s;const nextEx=exs[i+1];
 const nextLbl=lastSet?(nextEx?'Siguiente: '+nextEx.n:''):`Siguiente: serie ${setNo+1}/${e.s} de ${e.n}`;
 const markDone=()=>{const p2=LS.get(key,{});p2[i]=Math.max(p2[i]||0,setNo);LS.set(key,p2);if(lastSet&&!nextEx){const all=exs.every((x,k)=>(p2[k]||0)>=x.s);if(all){toast('🏆 ¡Sesión completada!',3500);bigBeep()}}render()};
 const rest=(lastSet&&!nextEx)?[]:(e.rest?[{kind:'rest',secs:e.rest,label:lastSet?'Descanso · cambia de ejercicio':'Descanso entre series',next:nextLbl,endMsg:lastSet&&nextEx?'¡Vamos! '+nextEx.n:'¡Siguiente serie!'}]:[]);
 const w=secsOf(e.rep);
 if(w>0){const q=[];
  if(e.side){q.push({kind:'work',secs:w,label:`${e.n} · lado 1 · serie ${setNo}`,endMsg:'¡Cambia de lado!'},{kind:'rest',secs:5,label:'Cambia de lado',next:'Lado 2'},{kind:'work',secs:w,label:`${e.n} · lado 2 · serie ${setNo}`,endMsg:'Serie terminada',onEnd:markDone})}
  else q.push({kind:'work',secs:w,label:`${e.n} · serie ${setNo}/${e.s}`,endMsg:'Serie terminada',onEnd:markDone});
  if(w>=120)q.unshift({kind:'rest',secs:5,label:'Prepárate…',next:e.n});
  runQueue(q.concat(rest))}
 else{markDone();if(rest.length)runQueue(rest);else if(lastSet&&!nextEx){}}
}

function vSemana(){
 const aw=curAbsWeek(),wy=wInYear(aw),ph=phaseOf(wy);
 const opts=[['','😴 Descanso']];Object.keys(OPT).forEach(s=>OPT[s].forEach(([tk,v])=>{const id=tk+'|'+v;if(!opts.find(o=>o[0]===id))opts.push([id,VEN[v].i+' '+T[tk].n+' ('+VEN[v].n+')'])}));
 app.innerHTML=`<div class="card"><h2>¿Dónde puedes entrenar cada día?</h2><p class="mute">Marca la disponibilidad real de cada lugar. El plan se arma solo, respetando recuperación (no dos días seguidos de piernas, fuerza separada de tumbling).</p>
 <div style="overflow-x:auto;margin-top:8px"><table class="avail"><tr><th></th>${Object.keys(VEN).map(v=>`<th title="${VEN[v].n}">${VEN[v].i}<br><small>${VEN[v].n.replace('Gimnasio de ','')}</small></th>`).join('')}</tr>
 ${DAYS.map((n,i)=>`<tr><th style="text-align:left">${n}</th>${Object.keys(VEN).map(v=>`<td><input type="checkbox" data-a="${i}|${v}" ${S.avail[i][v]?'checked':''}></td>`).join('')}</tr>`).join('')}</table></div>
 <label class="f">Días de entrenamiento por semana</label><select class="inp" id="nDays">${[3,4,5,6].map(n=>`<option ${S.nDays===n?'selected':''}>${n}</option>`).join('')}</select>
 <div class="row" style="margin-top:10px"><button class="btn pri" id="regen">Generar plan semanal</button></div></div>
 <div class="card"><h2>Plan · semana ${wy} (${ph.n})</h2><p class="mute">Puedes cambiar cualquier día manualmente.</p>
 ${DAYS.map((n,i)=>{const p=S.plan[i];const cur=p?p.k+'|'+p.v:'';return `<div class="plan-day"><b>${n}</b><select data-p="${i}">${opts.map(o=>`<option value="${o[0]}" ${o[0]===cur?'selected':''}>${o[1]}</option>`).join('')}</select><button class="btn sm" data-go="${i}">Ver</button></div>`}).join('')}
 </div>
 <div class="card"><h3>Prioridad de sesiones según días</h3><ol class="plain">${rotation(ph.id).map((s,i)=>`<li ${i>=S.nDays?'class="mute"':''}>${T[s].n}</li>`).join('')}</ol><p class="mute" style="margin-top:6px">Con 3–4 días se priorizan fuerza y tumbling; la flexibilidad se cubre al final del tumbling y con 10 min diarios. La sesión de flexibilidad completa se puede elegir manualmente en cualquier día. Si no tienes gimnasio de pesas, la fuerza se hace en versión calistenia.</p></div>`;
 app.querySelectorAll('[data-a]').forEach(c=>c.onchange=()=>{const [d,v]=c.dataset.a.split('|');S.avail[+d][v]=c.checked;save()});
 document.getElementById('nDays').onchange=e=>{S.nDays=+e.target.value;save()};
 document.getElementById('regen').onclick=()=>{buildPlan();render();toast('Plan generado')};
 app.querySelectorAll('[data-p]').forEach(s=>s.onchange=()=>{const v=s.value;S.plan[+s.dataset.p]=v?{k:v.split('|')[0],v:v.split('|')[1]}:null;save()});
 app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.day=+b.dataset.go;go('hoy')});
}

function vAnual(){
 const aw=curAbsWeek(),wy=wInYear(aw);const rw=wInYear(Math.max(1,realWeek()));
 app.innerHTML=`<div class="card"><h2>Periodización anual · 52 semanas</h2><p class="mute">La semana avanza sola según tu fecha de inicio: series, repeticiones, descansos, habilidades y ejercicios cambian con cada fase. Toca una semana para previsualizarla.</p>
 <div class="legend">${PHASES.map(p=>`<span><i style="background:${p.c}"></i>${p.n}</span>`).join('')}<span>D = descarga · T = tests</span></div>
 <div class="grid52">${Array.from({length:52},(_,i)=>{const w=i+1,p=phaseOf(w);return `<div class="wk ${w===wy?'cur':''}" data-w="${w}" style="background:${p.c};${w===rw&&S.preview?'outline:2px dashed var(--ink)':''}">${w}<small>${isDeload(w)?'D':''}${TESTW.includes(w)?'T':''}&nbsp;</small></div>`}).join('')}</div></div>
 ${PHASES.map(p=>`<div class="card obj" style="border-left-color:${p.c}"><h3>Semanas ${p.w[0]}–${p.w[1]} · ${p.n}</h3><p style="font-size:.9rem">${p.goal}</p>
 <table style="margin-top:8px"><tr><th>Tipo</th><th>Series × reps</th><th>Descanso</th></tr>${['main','power','acc','plyo','skill','core','flex'].map(t=>`<tr><td>${TYPE[t]}</td><td>${p.p[t][0]} × ${p.p[t][1]}</td><td>${restTxt(p.p[t][2])}</td></tr>`).join('')}</table>
 <p class="mute" style="margin-top:6px">Tumbling: ${SKILLS[p.id].join(' · ')}</p></div>`).join('')}
 <div class="card"><h3>Año 2 en adelante</h3><p style="font-size:.9rem">Al terminar la semana 52 el ciclo se repite automáticamente partiendo de tus nuevos récords: cargas más altas, habilidades del nivel siguiente y metas de test nuevas.</p></div>`;
 app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const w=+b.dataset.w;const base=(yearOf(Math.max(1,realWeek()))-1)*52;const t=base+w;S.preview=(t===Math.max(1,realWeek()))?null:t;S.day=0;save();buildPlan();go('hoy')});
}

function vTests(){
 const db=LS.get('cheer.tests',[]);const wy=wInYear(curAbsWeek());
 const first=k=>{const r=db.find(x=>x[k]!=null&&x[k]!=='');return r?r[k]:'—'};const last=k=>{const r=[...db].reverse().find(x=>x[k]!=null&&x[k]!=='');return r?r[k]:'—'};
 app.innerHTML=`<div class="card"><h2>Tests de rendimiento</h2><p class="mute">Semanas de test: ${TESTW.join(', ')}. ${TESTW.includes(wy)?'<b>¡Esta semana toca test!</b>':'Próximo test: semana '+(TESTW.find(w=>w>wy)||1)+'.'} Hazlos descansada/o, con buen calentamiento.</p>
 <div class="tests" style="margin-top:8px"><table><tr><th>Prueba</th><th>Inicio</th><th>Último</th><th>Hoy</th></tr>
 ${TESTS.map(([k,n,u])=>`<tr><td>${n} <span class="mute">(${u})</span></td><td>${first(k)}</td><td>${last(k)}</td><td><input type="number" step="0.1" inputmode="decimal" data-t="${k}"></td></tr>`).join('')}</table></div>
 <div class="row" style="margin-top:10px"><button class="btn pri" id="saveT">Guardar resultados</button></div><p class="mute" style="margin-top:8px">Toma también 3 fotos (frente, lado, espalda) con la misma luz en cada semana de test: es la mejor medida del objetivo estético.</p></div>
 <div class="card"><h3>Historial</h3>${db.length?`<div style="overflow-x:auto"><table><tr><th>Fecha</th>${TESTS.map(t=>`<th>${t[0]}</th>`).join('')}</tr>${db.map(r=>`<tr><td>${r.d}</td>${TESTS.map(t=>`<td>${r[t[0]]??''}</td>`).join('')}</tr>`).join('')}</table></div>`:'<p class="mute">Aún no hay registros. Haz tu primer test en la semana 1 para tener tu punto de partida.</p>'}</div>`;
 document.getElementById('saveT').onclick=()=>{const r={d:iso(new Date())};let any=0;app.querySelectorAll('[data-t]').forEach(i=>{if(i.value!==''){r[i.dataset.t]=+i.value;any=1}});if(!any)return toast('Ingresa al menos un valor');db.push(r);LS.set('cheer.tests',db);toast('Resultados guardados');render()};
}

function vObj(){
 app.innerHTML=`
 <div class="card obj"><h2>💪 Fuerza</h2><ul class="plain"><li><b>Cómo:</b> sentadilla, peso muerto rumano, press militar/push press, dominadas, olímpicos; periodización hipertrofia → fuerza → potencia.</li><li><b>En cheer:</b> como base sostienes, lanzas y atrapas a la flyer; en el tumbling necesitas fuerza relativa para bloquear brazos y potencia de piernas para despegar.</li><li><b>Referencias a 1 año (orientativas, hombre):</b> sentadilla 5RM ≈ 1,5–1,75× peso corporal · press militar 5RM ≈ 0,7–0,8× · push press 1RM ≈ 1× · dominadas estrictas 12–15 (o lastradas +20 kg) · plancha 2 min.</li></ul></div>
 <div class="card obj" style="border-left-color:#f59e0b"><h2>🫀 Resistencia</h2><ul class="plain"><li><b>Cómo:</b> base aeróbica (zona 2) → intervalos → circuitos de 2:30 (duración de una rutina) → simulaciones completas.</li><li><b>Meta:</b> terminar una rutina completa con la misma técnica y sonrisa del inicio; 5 rondas de circuito 2:30 con descanso de 2:30.</li><li>Los descansos cortos de core y accesorios también entrenan resistencia muscular.</li></ul></div>
 <div class="card obj" style="border-left-color:#8b5cf6"><h2>🧘 Flexibilidad</h2><ul class="plain"><li><b>Cómo:</b> 1–2 sesiones largas/semana + 10 min diarios. Siempre en caliente.</li><li><b>Método:</b> estático 45–60 s + contraer-relajar (PNF): 5 s empujando contra el estiramiento, relajar y avanzar, 3 veces.</li><li><b>Flexibilidad activa:</b> elevaciones de pierna y arch hold: de nada sirve el rango si no puedes sostenerlo en un heel stretch o un salto.</li><li><b>Meta:</b> split frontal cerca del suelo, middle split funcional para el toe touch, puente con hombros sobre las manos (arcos del flick y walkovers) y hombros con rango overhead completo para bloquear en las elevaciones.</li></ul></div>
 <div class="card obj" style="border-left-color:#10b981"><h2>✨ Físico estético</h2><ul class="plain"><li><b>Entreno:</b> el bloque de hipertrofia (sem. 9–20) construye masa en hombros, espalda, pecho y piernas; la fuerza la mantiene; la resistencia mejora la composición corporal.</li><li><b>Para ganar masa:</b> superávit ligero (200–300 kcal/día) en el bloque de hipertrofia; en competición, mantenimiento.</li><li><b>Proteína:</b> 1,6–2,2 g por kg de peso/día, repartida en 3–5 comidas.</li><li><b>Energía:</b> carbohidratos alrededor del entrenamiento; no hagas dietas muy restrictivas: comer poco baja la fuerza para sostener elevaciones y aumenta el riesgo de lesión.</li><li><b>Hábitos:</b> dormir 8–9 h · 8–10 mil pasos/día · agua ~35 ml/kg · creatina 3–5 g/día es una opción con buena evidencia.</li><li><b>Medir:</b> fotos y cintura en cada semana de test, no solo el peso.</li></ul></div>
 <div class="card"><h3>Reglas del programa</h3><ul class="plain"><li><b>RPE</b> (esfuerzo 1–10): RPE 8 = te quedan ~2 repeticiones en reserva.</li><li>Cada 4.ª semana es <b>descarga</b>: menos series, misma técnica.</li><li>Si tienes práctica de cheer con el equipo, cuenta como sesión de técnica/resistencia: evita pesas de piernas pesadas el mismo día antes de la práctica.</li><li>Señales de alerta: dolor de muñeca, lumbar o tibias que dura más de 48 h → baja la carga y consulta a un profesional.</li></ul></div>`;
}

function vAjustes(){
 app.innerHTML=`<div class="card"><h2>Ajustes</h2>
 <label class="f">Fecha de inicio del programa (semana 1)</label><input type="date" class="inp" id="st" value="${S.start}">
 <label class="f">Tu posición en las elevaciones</label><select class="inp" id="role">${Object.entries(ROLE).map(([k,r])=>`<option value="${k}" ${S.role===k?'selected':''}>${r.n}</option>`).join('')}</select>
 <p class="mute" style="margin-top:4px">Añade ejercicios específicos: base = overhead, lanzamiento y agarre; backspot = estabilidad overhead y atrapadas.</p>
 <label class="f">Sonido del temporizador</label><select class="inp" id="snd"><option value="1" ${S.sound?'selected':''}>Activado</option><option value="0" ${!S.sound?'selected':''}>Desactivado (solo vibración)</option></select>
 <div class="row" style="margin-top:12px"><button class="btn" id="tb">🔊 Probar aviso</button><button class="btn" id="nt">🔔 Activar notificaciones</button></div>
 <p class="mute" style="margin-top:6px">Las notificaciones avisan del fin del descanso si la pantalla está en otra app. Mantén esta página abierta durante la sesión (la pantalla se mantiene encendida mientras corre el temporizador).</p></div>
 <div class="card"><h3>Datos</h3><p class="mute">Todo se guarda en este dispositivo.</p><div class="row" style="margin-top:8px"><button class="btn" id="exp">Exportar respaldo</button><label class="btn">Importar<input type="file" id="imp" accept=".json" class="hidden"></label><button class="btn" id="rst">Borrar todo</button></div></div>`;
 document.getElementById('st').onchange=e=>{S.start=e.target.value;S.preview=null;S.day=null;save();buildPlan();render()};
 document.getElementById('role').onchange=e=>{S.role=e.target.value;save()};
 document.getElementById('snd').onchange=e=>{S.sound=e.target.value==='1';save()};
 document.getElementById('tb').onclick=()=>{audio();beep(880,.1);setTimeout(bigBeep,300);vib([200,100,200])};
 document.getElementById('nt').onclick=async()=>{if(!('Notification' in window))return toast('Este navegador no soporta notificaciones');const r=await Notification.requestPermission();toast(r==='granted'?'Notificaciones activadas':'Permiso no concedido')};
 document.getElementById('exp').onclick=()=>{const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('cheer.'))o[k]=localStorage.getItem(k)}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='cheer-respaldo-'+iso(new Date())+'.json';a.click()};
 document.getElementById('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);Object.keys(o).forEach(k=>{if(k.startsWith('cheer.'))localStorage.setItem(k,o[k])});location.reload()}catch(err){toast('Archivo no válido')}})};
 document.getElementById('rst').onclick=()=>{if(!confirm('¿Borrar todo el progreso y ajustes?'))return;Object.keys(localStorage).filter(k=>k.startsWith('cheer.')).forEach(k=>localStorage.removeItem(k));location.reload()};
}

const VIEWS={hoy:vHoy,semana:vSemana,anual:vAnual,tests:vTests,obj:vObj,ajustes:vAjustes};
function go(v){S.view=v;save();render();window.scrollTo(0,0)}
function render(){header();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));(VIEWS[S.view]||vHoy)()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(b.dataset.v==='hoy'&&S.view!=='hoy')S.day=null;go(b.dataset.v)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TC)tick()});
S.day=null;render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
