:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface2:#F5F7F9; --ink:#14202C; --muted:#56657A; --line:#D2DAE2;
  --blue:#1E4E78; --blue-soft:#E2EBF4; --copper:#B0522A; --copper-soft:#F7E8DF;
  --ok:#2A7848; --ok-soft:#E3F1E8; --warn:#93600A; --warn-soft:#F9EED7; --bad:#AE2A21; --bad-soft:#FAE4E2;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"Source Sans 3","Segoe UI",Arial,sans-serif; --f-mono:"JetBrains Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F161D; --surface:#17212B; --surface2:#1D2935; --ink:#E6ECF2; --muted:#9AA9B8; --line:#2C3A48;
  --blue:#8DB8E0; --blue-soft:#1C3046; --copper:#E89366; --copper-soft:#3A2519;
  --ok:#6CC490; --ok-soft:#173326; --warn:#E5B357; --warn-soft:#382A11; --bad:#F08A80; --bad-soft:#3D1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161D; --surface:#17212B; --surface2:#1D2935; --ink:#E6ECF2; --muted:#9AA9B8; --line:#2C3A48;
  --blue:#8DB8E0; --blue-soft:#1C3046; --copper:#E89366; --copper-soft:#3A2519;
  --ok:#6CC490; --ok-soft:#173326; --warn:#E5B357; --warn-soft:#382A11; --bad:#F08A80; --bad-soft:#3D1C1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;top:0;right:0;bottom:0;left:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
.top-in{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.brand b{color:var(--copper)}
.crumb{color:var(--muted);font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none!important}
.backb[hidden]{display:none}
.layout{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding-bottom:10px}
.side h4{font-family:var(--f-body);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px;font-weight:700}
.side h4:first-child{margin-top:0}
.side button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;background:none;color:var(--ink);font-family:var(--f-body);font-size:15px;padding:6px 10px;border-radius:6px;cursor:pointer}
.side button .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:18px}
.side button:hover{background:var(--surface)}
.side button[aria-current="true"]{background:var(--blue);color:var(--surface);font-weight:600}
.side button[aria-current="true"] .k{color:var(--surface)}
.side .done{margin-left:auto;font-size:12px;color:var(--ok)}
.side button[aria-current="true"] .done{color:var(--surface)}
main{min-width:0}
h1{font-family:var(--f-display);font-size:30px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0 0 8px}
.eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--copper);letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px}
.lead{color:var(--muted);max-width:70ch;margin:0 0 20px;font-size:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
.card.form{border-top:3px solid var(--blue)}
.card.result{border-top:3px solid var(--copper)}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sechead .tag{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:3px 9px;border-radius:5px;background:var(--blue-soft);color:var(--blue)}
.card.result .sechead .tag{background:var(--copper-soft);color:var(--copper)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:14.5px;font-weight:700}
.field .unit{font-weight:400;color:var(--muted)}
.field small{color:var(--muted);font-size:13px;line-height:1.4}
input,select{font-family:var(--f-body);font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--ink);width:100%;min-width:0}
input:focus,select:focus{border-color:var(--blue)}
input[type=checkbox]{width:18px;height:18px;margin-top:3px;flex:0 0 auto}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.btn{font-family:var(--f-body);font-weight:700;font-size:15px;padding:10px 18px;border-radius:7px;border:1px solid var(--blue);background:var(--blue);color:var(--surface);cursor:pointer}
.btn.calc{background:var(--copper);border-color:var(--copper);font-size:16px;padding:11px 24px}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,abbr:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.hint{font-size:13.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{font-weight:700;text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
th abbr{text-transform:none}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td input,td select{padding:7px 8px;font-size:14.5px}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:13.5px;white-space:nowrap}
tr.sel td{background:var(--ok-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;font-family:var(--f-body)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--blue-soft);color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
.kpi.ok{border-color:var(--ok)} .kpi.bad{border-color:var(--bad)}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px}
.step .sn{width:34px;height:34px;border-radius:50%;background:var(--blue);color:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px}
.step.ok .sn{background:var(--ok)} .step.bad .sn{background:var(--bad)} .step.warn .sn{background:var(--warn)}
.step .sb{min-width:0;border-bottom:1px solid var(--line);padding-bottom:14px}
.step:last-child .sb{border-bottom:0;padding-bottom:0}
.step h4{font-family:var(--f-display);font-size:16.5px;margin:4px 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step .q{margin:0 0 6px;color:var(--ink)}
.fl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 2px}
.f{font-family:var(--f-mono);font-size:14px;background:var(--blue-soft);color:var(--blue);padding:8px 11px;border-radius:7px;overflow-x:auto;white-space:nowrap}
.f.s{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.r{margin:8px 0 0;font-weight:700;font-size:16px}
.r span{font-family:var(--f-mono);color:var(--copper)}
.why{margin:8px 0 0;font-size:15px;color:var(--muted)}
.why b{color:var(--ink)}
.note{font-size:14.5px;padding:11px 13px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin:12px 0}
.note.info{background:var(--blue-soft);color:var(--blue)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.stale{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
abbr{text-decoration:underline dotted;cursor:help;text-underline-offset:3px}
details.learn,details.item{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:12px}
details.learn>summary,details.item>summary{cursor:pointer;padding:14px 16px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
details>summary::-webkit-details-marker{display:none}
details.learn>summary::before,details.item>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details.learn .body,details.item .body{padding:0 16px 16px}
details.rgrp{border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--surface)}details.rgrp>summary{cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;list-style:none}details.rgrp>summary::before{content:"▸";color:var(--muted);transition:transform .15s}details.rgrp>summary .hint{flex-basis:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}details.rgrp[open]>summary .hint{white-space:normal}details.rgrp .tbl-wrap{padding:0 8px 8px}
details.learn{background:var(--surface2)}
details.learn>summary{font-family:var(--f-display)}
.learn p{max-width:72ch}
.gl{display:grid;grid-template-columns:minmax(80px,130px) minmax(0,1fr);gap:8px 16px;margin:0}
.gl dt{font-family:var(--f-mono);font-weight:600;color:var(--copper)}
.gl dd{margin:0}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.home .card{cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;color:inherit;margin:0}
.home .card:hover{border-color:var(--blue)}
.home .card h2{margin:0}
.home .card ul{margin:0;padding-left:18px;color:var(--muted);font-size:14.5px}
.home .go{margin-top:auto;font-weight:700;color:var(--blue)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.rowact{white-space:nowrap}
#tip{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-top:14px;background:var(--surface);border-top:3px solid var(--copper)}
.tip-in{max-width:1000px;margin:0 auto;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.tip-in b{font-family:var(--f-mono);color:var(--copper);font-size:16px}.tip-in p{margin:4px 0 0;max-width:72ch}
#tip{max-height:65vh;overflow-y:auto}
#tipd{margin-top:4px;max-width:80ch}
.whyl{margin:4px 0 8px;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.whyl li{padding:9px 11px;border-radius:8px;font-size:14.5px}
.whyl .badc{background:var(--bad-soft)} .whyl .badc>b{color:var(--bad)}
.whyl .okc{background:var(--ok-soft)} .whyl .okc>b{color:var(--ok)}
.whyl .fx{color:var(--ink);font-weight:600}
.stbtn{border:0;border-radius:999px;font-family:var(--f-body);font-weight:700;font-size:13px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.stbtn.ok{background:var(--ok-soft);color:var(--ok)} .stbtn.bad{background:var(--bad);color:var(--surface)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.tabbar{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{display:grid;grid-template-columns:48px minmax(0,1fr);grid-template-rows:auto auto;gap:2px 12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;font:inherit;color:inherit;min-height:76px}
.tile:hover{border-color:var(--blue)}
.tile .ti{grid-row:1/3;width:48px;height:48px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:16px}
.tile .tt{font-family:var(--f-display);font-weight:700;font-size:16px}
.tile .td{font-size:13.5px;color:var(--muted)}
.tile .pill{grid-column:2;justify-self:start;margin-top:4px}
.fcard{border-top:3px solid var(--ok)}
.fcard .sechead .tag{background:var(--ok-soft);color:var(--ok)}
.flist{display:flex;flex-direction:column;gap:8px}
.f.big{font-size:16px;padding:10px 13px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:16px}
.vars td{padding:6px 6px}
.vars .sym{font-family:var(--f-mono);font-weight:600;color:var(--copper);white-space:nowrap}
.hand{margin:0;padding-left:20px}.hand li{margin-bottom:4px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;padding:7px 12px;font-family:var(--f-body);font-size:14px;font-weight:600;cursor:pointer}
.chip span{color:var(--muted);font-weight:400}
.cq table{font-size:13.5px}
.cq th{font-size:11px;text-align:center;border:1px solid var(--line);background:var(--surface2)}
.cq td{border:1px solid var(--line);padding:4px}
.cq td input,.cq td select{padding:6px;font-size:13.5px;min-width:56px}
.cq td select{width:auto;min-width:0;padding-right:24px}
.cq td{white-space:nowrap}
.cq td.calcd{background:var(--blue-soft);color:var(--blue);font-weight:600}
.cq tfoot th{font-size:13px;color:var(--ink);background:var(--copper-soft)}
.cq tfoot .num{font-family:var(--f-mono)}
figure.ill{margin:12px 0 16px;padding:12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px}
figure.ill svg{display:block;width:100%;height:auto;max-height:340px}
figure.ill .sv{overflow-x:auto}
@media (max-width:600px){figure.ill svg{min-width:540px;max-height:none}}
figure.ill figcaption{font-size:14px;color:var(--muted);margin-top:8px;max-width:75ch}
.ill text{fill:var(--ink);font-family:var(--f-body);font-size:13px}
.ill .tb{font-weight:700}.ill .ts{fill:var(--muted);font-size:12px}.ill .bad{fill:var(--bad)}.ill .ok{fill:var(--ok)}
.ill .s-ink{stroke:var(--ink)}.ill .s-mut{stroke:var(--muted)}.ill .s-line{stroke:var(--line)}
.ill .f-ink{fill:var(--ink)}.ill .f-surf{fill:var(--surface)}.ill .f-surf2{fill:var(--surface2)}.ill .f-mut{fill:var(--muted)}.ill .f-line{fill:var(--line)}
.simwrap{position:relative;height:min(64vh,600px);min-height:360px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);margin-bottom:16px}
.simwrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.sim-nav{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:5px;align-items:flex-end;width:118px;z-index:6}
.sim-nav select{font-size:12.5px;padding:4px 6px;background:var(--surface);width:100%}
.sim-nav .nb{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%}.sim-nav .nb2{display:flex;flex-direction:column;gap:4px;width:100%}
.sim-nav .nb button,.sim-nav .nb2 button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:3px 4px;font:700 13px var(--f-body);cursor:pointer;min-height:28px}.sim-nav .nb2 button{font-size:11.5px;min-height:26px}
.sim-nav .nb2 button[aria-pressed="true"]{background:var(--blue);color:var(--surface);border-color:var(--blue)}
.sim-nav .eb.bad{background:var(--bad);color:#fff;border-color:var(--bad)}.sim-nav .eb.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.sim-sheet{position:absolute;left:8px;right:134px;top:8px;bottom:64px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sim-sheet[hidden]{display:none}.sh-h{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}.sh-h button{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:6px;width:28px;height:28px;cursor:pointer}
.sh-b{overflow:auto;padding:8px 10px;font-size:14px}.sh-b figure.ill{margin:4px 0 8px}.sh-b figure.ill svg{min-width:480px;max-height:none}
.simwrap:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.sim-place{position:absolute;left:8px;right:8px;bottom:72px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 8px}
.sim-place[hidden]{display:none}
.pb-t{display:flex;gap:5px;flex-wrap:wrap}
.pb-t button{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;padding:6px 11px;font:700 13px var(--f-body);cursor:pointer}
.pb-t button[aria-pressed="true"]{background:var(--copper);border-color:var(--copper);color:#fff}
.sim-place select{width:auto;font-size:13.5px;padding:6px 8px}
.pb-w{color:var(--warn);font-size:13px;font-weight:600}
.conds{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.conds span{display:flex;align-items:center;gap:8px;font-size:13px}
.conds i{display:inline-block;width:28px;height:9px;border-radius:5px;border:1px solid #8a8a8a}
table.pt td{white-space:nowrap}table.pt td.ex select{width:auto;margin-right:4px}table.pt select{width:auto}
tr.selrow td{background:var(--copper-soft)}
.sim-tools{position:absolute;left:0;right:0;bottom:0;display:flex;gap:5px;padding:6px;overflow-x:auto;background:linear-gradient(transparent,rgba(0,0,0,.18))}
.sim-tools button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:0;min-width:58px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 6px;font:700 11px var(--f-body);cursor:pointer}
.sim-tools .ic{font-family:var(--f-mono);font-size:14px}
.sim-tools button[aria-pressed="true"]{background:var(--copper);border-color:var(--copper);color:#fff}

        s = "R = ".concat(nf(V), " \xF7 ").concat(nf(I), " = ").concat(nf(R), " \u03A9 \xB7 P = ").concat(nf(V), " \xD7 ").concat(nf(I), " = ").concat(n0(Pw), " W");
        break;
      case "VR":
        I = V / R;
        Pw = V * V / R;
        f = "I = V \xF7 R \xB7 P = V\xB2 \xF7 R";
        s = "I = ".concat(nf(V), " \xF7 ").concat(nf(R), " = ").concat(nf(I), " A \xB7 P = ").concat(nf(V), "\xB2 \xF7 ").concat(nf(R), " = ").concat(n0(Pw), " W");
        break;
      case "IR":
        V = I * R;
        Pw = I * I * R;
        f = "V = I \xD7 R \xB7 P = I\xB2 \xD7 R";
        s = "V = ".concat(nf(I), " \xD7 ").concat(nf(R), " = ").concat(nf(V), " V \xB7 P = ").concat(nf(I), "\xB2 \xD7 ").concat(nf(R), " = ").concat(n0(Pw), " W");
        break;
      case "PV":
        I = Pw / V;
        R = V * V / Pw;
        f = "I = P \xF7 V \xB7 R = V\xB2 \xF7 P";
        s = "I = ".concat(n0(Pw), " \xF7 ").concat(nf(V), " = ").concat(nf(I), " A \xB7 R = ").concat(nf(V), "\xB2 \xF7 ").concat(n0(Pw), " = ").concat(nf(R), " \u03A9");
        break;
      case "PI":
        V = Pw / I;
        R = Pw / (I * I);
        f = "V = P \xF7 I \xB7 R = P \xF7 I\xB2";
        s = "V = ".concat(n0(Pw), " \xF7 ").concat(nf(I), " = ").concat(nf(V), " V \xB7 R = ").concat(n0(Pw), " \xF7 ").concat(nf(I), "\xB2 = ").concat(nf(R), " \u03A9");
        break;
      case "PR":
        I = Math.sqrt(Pw / R);
        V = Math.sqrt(Pw * R);
        f = "I = \u221A(P \xF7 R) \xB7 V = \u221A(P \xD7 R)";
        s = "I = \u221A(".concat(n0(Pw), " \xF7 ").concat(nf(R), ") = ").concat(nf(I), " A \xB7 V = \u221A(").concat(n0(Pw), " \xD7 ").concat(nf(R), ") = ").concat(nf(V), " V");
        break;
    }
    return kpis([kpi("Tensi\xF3n", nf(V), "V"), kpi("Corriente", nf(I), "A"), kpi("Resistencia", nf(R), "\u03A9"), kpi("Potencia", n0(Pw), "W")]) + steps([{ t: "Valores que faltaban", f, s, r: "V ".concat(nf(V), " V \xB7 I ").concat(nf(I), " A \xB7 R ").concat(nf(R), " \u03A9 \xB7 P ").concat(n0(Pw), " W"), why: "sirve, por ejemplo, para comprobar la resistencia de un calefactor o estimar la corriente de un equipo resistivo." }]);
  }
  function pgConceptos() {
    const c = (t, img, h) => '<section class="card"><h2>'.concat(t, "</h2>").concat(img || "").concat(h, "</section>");
    return '<p class="eyebrow">Aprender</p><h1>Conceptos b\xE1sicos</h1><p class="lead">Lo m\xEDnimo que hay que entender para que cada c\xE1lculo tenga sentido, explicado de forma simple y con im\xE1genes.</p>\n  '.concat(c("Tensi\xF3n, corriente y resistencia", ILL.ohm(), "<p>Piensa en una ca\xF1er\xEDa de agua. La <b>tensi\xF3n</b> (".concat(ab("V"), ", volts) es la presi\xF3n que empuja el agua. La <b>corriente</b> (").concat(ab("I"), ", amperes) es cu\xE1nta agua pasa por segundo. La <b>resistencia</b> (").concat(ab("R"), ", ohm) es qu\xE9 tan angosta es la ca\xF1er\xEDa. La ley de Ohm las une: <b>I = V \xF7 R</b>.</p>")), "\n  ").concat(c("Potencia", "", "<p>La <b>potencia</b> (".concat(ab("P"), ", watts) es cu\xE1nta energ\xEDa usa un equipo por segundo: <b>P = V \xD7 I</b>. Un hervidor de 2.000 W a 220 V toma unos 9 A. Las cuentas de luz cobran energ\xEDa, que es potencia por tiempo (kWh).</p>")), "\n  ").concat(c("Monof\xE1sico y trif\xE1sico", ILL.monotri(), "<p>En trif\xE1sico la carga se reparte en tres conductores, por eso se usa en casas grandes o con equipos potentes.</p>"), "\n  ").concat(c("Colores de los conductores", ILL.colores(), "<p>Los colores permiten que cualquier t\xE9cnico identifique cada conductor sin medir. Nunca uses verde o verde/amarillo para otra cosa que no sea tierra.</p>"), "\n  ").concat(c("C\xF3mo se conecta un circuito", ILL.circuito(), "<p>La fase lleva la energ\xEDa al equipo y el neutro la devuelve. La tierra (PE) no lleva corriente en condiciones normales: solo act\xFAa si hay una falla. El termomagn\xE9tico va siempre en la fase.</p>"), "\n  ").concat(c("Factor de potencia y condensadores", ILL.condensador(), "<p>En equipos con motor o fuente electr\xF3nica, parte de la corriente va y viene sin hacer trabajo \xFAtil: es la potencia reactiva (".concat(ab("Q"), "). El ").concat(ab("cos \u03C6"), " indica la fracci\xF3n \xFAtil. Con cos \u03C6 = 0,8, para la misma potencia se necesita un 25 % m\xE1s de corriente.</p><p>Un <b>condensador</b> almacena energ\xEDa en un campo el\xE9ctrico y entrega esa potencia reactiva cerca del equipo, as\xED la red no tiene que hacerlo. En viviendas casi no se usan; aparecen dentro de motores (condensador de arranque) y en industrias para corregir el factor de potencia.</p>")), "\n  ").concat(c("Por qu\xE9 se calienta un cable", "", "<p>Toda corriente que pasa por un cable lo calienta, y el calor crece con el cuadrado de la corriente: el doble de corriente produce cuatro veces m\xE1s calor. Si supera lo que soporta la aislaci\xF3n, esta se derrite y puede producir un cortocircuito o un incendio. Por eso cada secci\xF3n tiene una corriente m\xE1xima (".concat(ab("Iz"), ").</p>")), "\n  ").concat(c("Ca\xEDda de tensi\xF3n", ILL.caida(), "<p>La norma permite 3 % en el alimentador y 5 % en total hasta el punto m\xE1s lejano.</p>"), "\n  ").concat(c("Sobrecarga, cortocircuito y el termomagn\xE9tico", ILL.termo(), "<p>Una <b>sobrecarga</b> es conectar m\xE1s de lo que el circuito soporta: la corriente sube un poco por mucho rato. Un <b>cortocircuito</b> es cuando fase y neutro se tocan: la corriente sube cientos de veces en un instante. El termomagn\xE9tico (".concat(ab("TM"), "), tambi\xE9n llamado disyuntor o autom\xE1tico, cubre ambos casos.</p>")), "\n  ").concat(c("Contacto directo e indirecto: el diferencial", ILL.diferencial(), "<p><b>Contacto directo</b>: tocar un cable con tensi\xF3n. <b>Contacto indirecto</b>: tocar la carcasa de un equipo que qued\xF3 con tensi\xF3n por una falla. Contra ambos protege el diferencial (".concat(ab("DR"), ").</p>")), "\n  ").concat(c("Puesta a tierra", ILL.tierra(), "<p>La tierra de servicio debe medir 20 \u03A9 o menos, y la de protecci\xF3n debe ser lo bastante baja para que la carcasa en falla no supere la tensi\xF3n de seguridad (".concat(ab("UL"), ").</p>")), "\n  ").concat(c("El tablero", ILL.tablero(), "<p>Las barras de neutro y de tierra van separadas (esquema ".concat(ab("TN-S"), "). Se deja 25 % de espacio libre para ampliar.</p>")), "\n  ").concat(c("Instrumentos de medici\xF3n", ILL.instrumentos(), "<p>Puedes practicar con todos estos instrumentos en el <b>Simulador 3D</b>.</p>"), "\n  ").concat(c("Los pliegos RIC que usa la app", "", '<ul style="margin:0;padding-left:20px"><li><b>RIC N\xB002</b>: tableros.</li><li><b>RIC N\xB003</b>: alimentadores, demanda y ca\xEDda de tensi\xF3n.</li><li><b>RIC N\xB004</b>: conductores y canalizaciones.</li><li><b>RIC N\xB005</b>: protecci\xF3n contra tensiones peligrosas.</li><li><b>RIC N\xB006</b>: puesta a tierra.</li><li><b>RIC N\xB010</b>: alumbrado y enchufes, incluido lo exigido en viviendas.</li><li><b>RIC N\xB017, N\xB018, N\xB019</b>: mantenimiento, declaraci\xF3n TE-1 y puesta en servicio.</li></ul>'));
  }

  function pgTablas() {
    return '<p class="eyebrow">Aprender \xB7 datos de referencia</p><h1>Tablas que usa la app</h1><p class="lead">La tabla de capacidad de corriente es editable: reempl\xE1zala por los valores del RIC N\xB004 o del fabricante y todos los c\xE1lculos la usar\xE1n.</p>\n  '.concat(formCard("Capacidad de corriente del cable " + ab("Iz") + " (cobre)", "".concat(note("Valores referenciales para cobre aislado a 70 \xB0C, hasta 3 conductores en ducto y 30 \xB0C de ambiente. No fueron verificados contra el texto vigente del RIC N\xB004."), '<div class="tbl-wrap"><table><thead><tr><th class="num">Secci\xF3n</th><th>Iz [A]</th></tr></thead><tbody>').concat(SECC.map((s) => '<tr><td class="num">'.concat(sStr(s), ' mm\xB2</td><td><input id="f_amp_').concat(String(s).replace(".", "_"), '" type="text" inputmode="decimal" data-path="amp.').concat(String(s).replace(".", "_"), '" data-num="1" value="').concat(esc(shownum(S.amp[s])), '" style="width:90px" aria-label="Iz ').concat(sStr(s), ' mm\xB2"></td></tr>')).join(""), "</tbody></table></div>"), { calc: false, tag: "Editable", extra: '<button class="btn ghost" type="button" data-act="ampdef">Restaurar valores referenciales</button><span class="hint">Los cambios se guardan al escribir.</span>' }), '\n  <section class="card"><h2>Secciones m\xEDnimas (RIC N\xB004, 5.4)</h2><table><tbody><tr><td>Iluminaci\xF3n</td><td class="num">1,5 mm\xB2</td></tr><tr><td>Enchufes y mixtos</td><td class="num">2,5 mm\xB2</td></tr><tr><td>Subalimentador</td><td class="num">2,5 mm\xB2</td></tr><tr><td>Alimentador</td><td class="num">4 mm\xB2</td></tr></tbody></table></section>\n  <section class="card"><h2>Factor de demanda en viviendas (RIC N\xB003, Tabla 3.1)</h2><table><tbody><tr><td>Primeros 3 kW</td><td class="num">1,00</td></tr><tr><td>De 3 a 120 kW</td><td class="num">0,35</td></tr><tr><td>Sobre 120 kW</td><td class="num">0,25</td></tr></tbody></table></section>\n  <section class="card"><h2>Tipo de cable seg\xFAn ambiente (RIC N\xB004, Tabla 4.2)</h2><div class="tbl-wrap"><table><thead><tr><th>Cable</th><th>Temp.</th><th>Uso</th></tr></thead><tbody><tr><td>THHN</td><td>90 \xB0C</td><td>Ductos, molduras y bandejas, ambiente seco</td></tr><tr><td>THWN-2</td><td>90 \xB0C</td><td>Igual que THHN, tambi\xE9n h\xFAmedo</td></tr><tr><td>H07Z1-K</td><td>70 \xB0C</td><td>Libre de hal\xF3genos; lugares de reuni\xF3n; solo circuitos</td></tr><tr><td>RV / RV-K</td><td>90 \xB0C</td><td>Alimentadores; RV-K puede ir enterrado</td></tr></tbody></table></div></section>\n  <section class="card"><h2>Colores de conductores (RIC N\xB004, 5.32)</h2>').concat(ILL.colores(), '</section>\n  <section class="card"><h2>Canalizaciones (RIC N\xB004)</h2><ul style="margin:0;padding-left:20px"><li>Ductos no met\xE1licos retardantes de llama y autoextinguibles.</li><li>Un solo circuito por tuber\xEDa.</li><li>Uniones solo dentro de cajas, con 25 % de volumen libre y chicotes de 15 cm.</li><li>Sobre 6 mm\xB2 se usa cable multifilar.</li><li>Nunca en el mismo ducto que el gas; 0,15 m de ductos de aire caliente.</li></ul></section>');

    { id: "c1", m: "cond", t: "Conductores: tipos, secciones y colores", body: () => cuSec("Partes y tipos", CI.cable() + cuTbl(["Tipo", "Temperatura", "D\xF3nde se usa"], [["NYA / H07V-U (alambre PVC)", "70 \xB0C", "Ductos en lugar seco, circuitos"], ["H07V-K (cable flexible PVC)", "70 \xB0C", "Ductos, tableros, conexiones"], ["THHN", "90 \xB0C", "Ductos y bandejas en lugar seco"], ["THWN-2", "90 \xB0C", "Como THHN y tambi\xE9n en lugar h\xFAmedo"], ["H07Z1-K (libre de hal\xF3genos)", "70 \xB0C", "Lugares de reuni\xF3n de personas: no emite humo t\xF3xico"], ["RV-K / XTU (con chaqueta, 0,6/1 kV)", "90 \xB0C", "Alimentadores, bandejas, enterrado (RV-K)"], ["Cord\xF3n flexible (H05VV-F)", "70 \xB0C", "Alargadores y conexi\xF3n de equipos; nunca como instalaci\xF3n fija"]]) + "<p>La temperatura es la m\xE1xima que soporta la aislaci\xF3n en uso continuo. Con m\xE1s temperatura admisible, el cable puede llevar algo m\xE1s de corriente.</p>") + cuSec("Secciones", '<p>La secci\xF3n es el \xE1rea del cobre en mm\xB2. M\xE1s secci\xF3n: menos resistencia, menos calor y menos ca\xEDda de tensi\xF3n.</p>' + cuTbl(["Uso", "Secci\xF3n m\xEDnima"], [["Alumbrado", "1,5 mm\xB2"], ["Enchufes y circuitos mixtos", "2,5 mm\xB2"], ["Alimentador de vivienda", "4 mm\xB2"], ["Del electrodo de tierra al tablero", "4 mm\xB2 (seg\xFAn RIC N\xB006)"]]) + cuTbl(["AWG (norma americana)", "≈ mm\xB2"], [["14 AWG", "2,08"], ["12 AWG", "3,31"], ["10 AWG", "5,26"], ["8 AWG", "8,37"]]) + "<p>Sobre 6 mm\xB2 se usan cables multifilares: un alambre grueso es dif\xEDcil de pasar y de doblar.</p>") + cuSec("Colores (RIC N\xB004)", ILL.colores() + "<p>El retorno (el conductor que vuelve del interruptor a la luz) es una fase interrumpida: se usa un color de fase. Nunca uses blanco, verde ni verde/amarillo para una fase.</p>") + cuKey(["Elige el tipo de cable seg\xFAn el ambiente: seco, h\xFAmedo, enterrado o lugar de reuni\xF3n.", "M\xEDnimos: 1,5 mm\xB2 alumbrado, 2,5 mm\xB2 enchufes, 4 mm\xB2 alimentador.", "Fases azul, negro o rojo; neutro blanco; tierra verde o verde/amarillo."]), q: [["\xBFQu\xE9 cable es libre de hal\xF3genos y se usa en lugares de reuni\xF3n de personas?", ["NYA", "THHN", "H07Z1-K", "RV-K"], 2, "Al quemarse no emite humos t\xF3xicos ni corrosivos."], ["\xBFSecci\xF3n m\xEDnima para un circuito de enchufes?", ["1 mm\xB2", "1,5 mm\xB2", "2,5 mm\xB2", "4 mm\xB2"], 2, "2,5 mm\xB2 para enchufes y circuitos mixtos."], ["\xBFQu\xE9 color corresponde a la tierra de protecci\xF3n?", ["Blanco", "Verde o verde/amarillo", "Negro", "Azul"], 1, "El verde y el verde/amarillo son exclusivos de la tierra."], ["Un cord\xF3n de alargador…", ["Sirve como instalaci\xF3n fija si se clava al muro", "No se usa como instalaci\xF3n fija", "Reemplaza al alimentador", "Es igual a un THHN"], 1, "Los cordones son para equipos y alargadores, no para la instalaci\xF3n fija."]] },
    { id: "c2", m: "cond", t: "Capacidad de corriente y factores de correcci\xF3n", body: () => cuSec("La capacidad de corriente (Iz)", "<p>Cada secci\xF3n soporta una corriente m\xE1xima continua sin que la aislaci\xF3n pase su temperatura l\xEDmite. Esa corriente de tabla (Iz) vale para condiciones est\xE1ndar: ambiente de 30 \xB0C y pocos conductores juntos. Si las condiciones son peores, se multiplica por factores menores que 1.</p>" + '<div class="f big">Iz corregida = Iz de tabla \xD7 factor de temperatura (ft) \xD7 factor de agrupamiento (fa)</div>' + "<p>Y siempre debe cumplirse: <b>corriente del circuito ≤ protecci\xF3n (In) ≤ Iz corregida</b>.</p>") + cuSec("Factor de agrupamiento: varios conductores en un ducto", CI.agrupa() + "<p>Cada conductor con corriente genera calor. Si van muchos juntos, se calientan entre ellos. La tierra no cuenta (no lleva corriente normal); el neutro de un circuito monof\xE1sico s\xED cuenta.</p>" + '<div class="fgrid"><div><h3>Por cantidad de conductores con corriente</h3>' + cuTbl(["Conductores en el ducto", "Factor"], [["1 a 3", "1,00"], ["4 a 6", "0,80"], ["7 a 24", "0,70"], ["25 a 42", "0,60"], ["M\xE1s de 42", "0,50"]]) + '<p class="hint">Criterio de la antigua NCh Elec. 4/2003, muy usado en Chile.</p></div><div><h3>Por cantidad de circuitos agrupados (IEC 60364-5-52)</h3>' + cuTbl(["Circuitos", "Factor"], FAGI.map(([a, b]) => [a, nf(b, 2)])) + "</div></div>") + cuSec("Factor de temperatura ambiente", cuTbl(["Ambiente", "Aislaci\xF3n 70 \xB0C (PVC)", "Aislaci\xF3n 90 \xB0C"], Object.keys(FT[70]).map((t) => [t + " \xB0C", nf(FT[70][t], 2), nf(FT[90][t], 2)])) + "<p>Un entretecho en verano puede pasar los 45 \xB0C: ah\xED un cable de 70 \xB0C soporta casi un 20 % menos.</p>" + cuRef) + cuFcCalc() + cuKey(["Iz corregida = Iz \xD7 ft \xD7 fa.", "M\xE1s de 3 conductores con corriente en un ducto obligan a corregir.", "La protecci\xF3n nunca puede ser mayor que la Iz corregida."]), q: [["Un ducto lleva 6 conductores con corriente. \xBFFactor de agrupamiento (criterio NCh 4/2003)?", ["1,00", "0,80", "0,70", "0,50"], 1, "De 4 a 6 conductores: 0,80."], ["\xBFCuenta el conductor de tierra para el agrupamiento?", ["S\xED, siempre", "No, porque no lleva corriente en servicio normal", "Solo si es verde", "Solo en trif\xE1sico"], 1, "El PE no lleva corriente en condiciones normales."], ["Cable de Iz 20 A, ft 0,87 y fa 0,8. \xBFIz corregida?", ["20 A", "17,4 A", "13,9 A", "16 A"], 2, "20 \xD7 0,87 \xD7 0,8 = 13,9 A."], ["Si la Iz corregida es 13,9 A, \xBFel disyuntor m\xE1ximo permitido?", ["16 A", "10 A", "20 A", "13 A"], 1, "El comercial inmediatamente menor o igual: 10 A."]] },
    { id: "k1", m: "canal", t: "Ductos y sistemas de canalizaci\xF3n", body: () => cuSec("Para qu\xE9 sirve la canalizaci\xF3n", "<p>Protege los conductores de golpes, humedad y del fuego, y permite cambiarlos sin romper muros. En viviendas todo conductor de la instalaci\xF3n fija va dentro de una canalizaci\xF3n o es un cable dise\xF1ado para ir a la vista.</p>" + CI.canal() + cuTbl(["Sistema", "Uso t\xEDpico", "Ojo con"], [["Tubo conduit PVC r\xEDgido", "Embutido en muros y losas, o a la vista", "Retardante de llama y autoextinguible"], ["Tubo met\xE1lico EMT", "A la vista en garajes, bodegas, zonas de golpe", "Unir a tierra; coplas y conectores apretados"], ["Ca\xF1er\xEDa de acero galvanizado", "Exteriores, impactos fuertes", "Roscas y tierra"], ["Tubo flexible corrugado", "Solo embutido (losa, tabique, muro)", "No va a la vista: se da\xF1a con golpes y sol"], ["Flexible met\xE1lico", "Tramos cortos a equipos con vibraci\xF3n", "Largo corto, con conectores"], ["Canaleta o moldura", "Sobrepuesta en ampliaciones", "Con tapa, un circuito por v\xEDa"], ["Bandeja o escalerilla", "Alimentadores y muchos cables", "Cables con chaqueta, no unipolares sueltos"]])) + cuSec("Reglas de instalaci\xF3n", '<ul><li>Un solo circuito por tuber\xEDa en la instalaci\xF3n domiciliaria (as\xED cada circuito se mide y se cambia por separado).</li><li>Nada de uniones dentro del ducto: se hacen en cajas.</li><li>Los extremos del tubo llevan boquilla o conector para no cortar la aislaci\xF3n al pasar el cable.</li><li>La canalizaci\xF3n el\xE9ctrica no comparte ducto con gas, agua ni datos (las corrientes d\xE9biles van aparte) y se separa de fuentes de calor.</li><li>En exteriores y lugares h\xFAmedos se usan materiales y uniones aptas, con drenaje y sello.</li><li>A la vista se fija con abrazaderas a distancias regulares, en l\xEDneas rectas y paralelas a muros y cielos.</li><li>Los tubos met\xE1licos se unen a la tierra de protecci\xF3n.</li></ul>' + cuRef) + cuKey(["Corrugado solo embutido; a la vista, tubo r\xEDgido o canaleta.", "Un circuito por tubo, uniones solo en cajas.", "Boquillas en los extremos; met\xE1licos unidos a tierra."]), q: [["\xBFD\xF3nde se puede usar el tubo flexible corrugado?", ["A la vista en exteriores", "Solo embutido", "En bandejas", "En cualquier lugar"], 1, "A la vista se da\xF1a con golpes y luz solar."], ["\xBFSe pueden hacer uniones dentro del tubo?", ["S\xED, con buena cinta", "No, solo en cajas", "S\xED, si el tubo es met\xE1lico", "Solo en el alimentador"], 1, "Las uniones van en cajas accesibles."], ["Un tubo met\xE1lico EMT…", ["No necesita tierra", "Se une a la tierra de protecci\xF3n", "Se une al neutro", "Se a\xEDsla con cinta"], 1, "Si un conductor da\xF1ado lo toca, la tierra permite que act\xFAe la protecci\xF3n."]] },
    { id: "k2", m: "canal", t: "Llenado del ducto, curvas y recorridos", body: () => cuSec("Llenado m\xE1ximo", '<p>Los cables deben pasar sin forzarse y con aire para disipar calor. Se compara la suma de las \xE1reas exteriores de los cables con el \xE1rea interior del tubo (criterio pr\xE1ctico de la NEC y de la antigua NCh Elec. 4/2003; el RIC N\xB004 pide instalar los conductores sin esfuerzo y con espacio para disipar el calor):</p>' + cuTbl(["Conductores en el tubo", "Llenado m\xE1ximo"], [["1", "53 %"], ["2", "31 %"], ["3 o m\xE1s", "40 %"]]) + "<p>Con 2 conductores el l\xEDmite es menor porque tienden a trabarse lado a lado.</p>") + cuFillCalc() + cuSec("Curvas y cajas de paso", '<ul><li>Cada curva aumenta la fuerza para pasar el cable (gu\xEDa) y el riesgo de da\xF1ar la aislaci\xF3n.</li><li>Como regla pr\xE1ctica, entre dos cajas no deber\xEDa haber m\xE1s de 2 a 3 curvas de 90\xB0; si hay m\xE1s, se agrega una caja de paso.</li><li>Las curvas se hacen con piezas de f\xE1brica o con curvadora, con radio amplio (del orden de 6 veces el di\xE1metro del tubo), sin aplastar el tubo.</li><li>Los recorridos van en l\xEDneas horizontales y verticales: as\xED cualquiera sabe por d\xF3nde pasa un ducto embutido y no lo perfora.</li><li>Los ductos no cruzan vanos de puertas bajo el dintel ni pasan junto a ca\xF1er\xEDas de gas.</li></ul>' + cuRef) + cuKey(["Llenado: 53 % un cable, 31 % dos, 40 % tres o m\xE1s.", "Pocas curvas entre cajas; si no, caja de paso.", "Recorridos rectos, horizontales y verticales."]), q: [["\xBFLlenado m\xE1ximo con 3 o m\xE1s conductores?", ["31 %", "40 %", "53 %", "75 %"], 1, "40 % para 3 o m\xE1s conductores."], ["\xBFPor qu\xE9 se usan recorridos horizontales y verticales?", ["Por est\xE9tica", "Para saber por d\xF3nde van y no perforarlos", "Para gastar menos tubo", "Para que haya m\xE1s curvas"], 1, "Un recorrido diagonal embutido es dif\xEDcil de adivinar."], ["Hay 5 curvas de 90\xB0 entre dos cajas. \xBFQu\xE9 haces?", ["Nada", "Uso m\xE1s cinta", "Agrego una caja de paso", "Uso cable m\xE1s delgado"], 2, "Una caja de paso divide el tramo y facilita el cableado."]] },
    { id: "u1", m: "union", t: "Uniones (empalmes) de conductores", body: () => cuSec("Qu\xE9 es una buena uni\xF3n", '<p>En instalaciones se llama <b>empalme</b> o <b>uni\xF3n</b> a la conexi\xF3n de dos o m\xE1s conductores (no confundir con el empalme de la distribuidora). Una mala uni\xF3n es una de las causas m\xE1s comunes de incendio: tiene resistencia, se calienta, oxida y se suelta.</p><ol class="hand"><li><b>Mec\xE1nicamente firme:</b> no se suelta al tirar.</li><li><b>El\xE9ctricamente continua:</b> el cobre queda bien apretado, sin \xF3xido.</li><li><b>Aislada:</b> con una aislaci\xF3n equivalente a la del cable (capuch\xF3n, conector o cinta).</li><li><b>Accesible:</b> dentro de una caja con tapa, nunca dentro de un ducto ni enterrada en el muro.</li><li><b>Sin tracci\xF3n:</b> el cable no queda tirante.</li><li><b>Mismo color con mismo color:</b> fase con fase, neutro con neutro, tierra con tierra.</li></ol>') + cuSec("Tipos de uniones a mano", CI.uniones() + cuTbl(["Uni\xF3n", "Uso"], [["Cola de rata", "La m\xE1s usada en cajas: conductores paralelos torcidos juntos y aislados con capuch\xF3n o cinta"], ["Western Union", "Prolongar un conductor con buena resistencia a la tracci\xF3n"], ["Derivaci\xF3n en T", "Sacar un conductor desde otro que contin\xFAa"], ["Derivaci\xF3n anudada", "Como la T, con un nudo para m\xE1s firmeza"]]) + "<p>T\xE9cnica: corta el cable a la medida dejando un chicote de unos 15 cm, pela con alicate pelacables sin marcar el cobre (solo lo necesario), tuerce apretado con alicate universal, corta la punta, a\xEDsla y dobla con cuidado dentro de la caja.</p>") + cuSec("Uniones con conectores", CI.conectores() + "<ul><li>El conector se elige para la secci\xF3n y la cantidad de cables que indica su fabricante.</li><li>Sobre 6 mm\xB2 y en alimentadores se usan terminales y manguitos a compresi\xF3n, apretados con la herramienta adecuada.</li><li>En los bornes de equipos y tableros: el cable multifilar lleva terminal (puntera) para que no se abran los hilos; apriete con el torque indicado; m\xE1ximo 2 conductores por borne.</li></ul>") + cuKey(["Uni\xF3n firme, continua, aislada, accesible y sin tracci\xF3n.", "Siempre dentro de cajas; chicotes de unos 15 cm.", "Multifilar con puntera; m\xE1ximo 2 cables por borne."]), q: [["\xBFD\xF3nde se hacen las uniones?", ["Dentro del ducto", "En cajas accesibles", "Embutidas en el muro", "Donde sea con buena cinta"], 1, "Deben poder inspeccionarse."], ["\xBFQu\xE9 uni\xF3n se usa m\xE1s en cajas de derivaci\xF3n?", ["Western Union", "Cola de rata", "Soldadura de plata", "Nudo de marinero"], 1, "La cola de rata con capuch\xF3n o conector."], ["\xBFPor qu\xE9 una uni\xF3n floja puede causar un incendio?", ["Porque cambia de color", "Porque tiene resistencia y se calienta", "Porque baja la tensi\xF3n a 0", "No puede causarlo"], 1, "La potencia perdida en la uni\xF3n (I\xB2 \xD7 R) se vuelve calor."], ["\xBFQu\xE9 lleva un cable multifilar al ir a un borne de tornillo?", ["Cinta", "Puntera (terminal)", "Soldadura con est\xF1o siempre", "Nada"], 1, "La puntera evita que los hilos se abran y se suelten."]] },
    { id: "u2", m: "union", t: "Cajas de derivaci\xF3n, de aparatos y de paso", body: () => cuSec("Tipos de cajas", cuTbl(["Caja", "Para qu\xE9"], [["De derivaci\xF3n", "Repartir un circuito hacia varios puntos (ah\xED est\xE1n las uniones)"], ["De aparato (rectangular)", "Montar interruptores y enchufes"], ["De centro (octogonal o redonda)", "Colgar una luz en el cielo"], ["De paso", "Cortar un tramo largo o con muchas curvas para poder pasar el cable"], ["Estanca (IP)", "Exteriores y lugares h\xFAmedos, con sello y prensaestopas"]]) + CI.caja()) + cuSec("Reglas", "<ul><li>Toda uni\xF3n y toda derivaci\xF3n se hace dentro de una caja.</li><li>Las cajas quedan accesibles: tapa a la vista, nunca tapadas con estuco, cer\xE1mica o muebles fijos.</li><li>Deben tener volumen suficiente: se deja al menos un 25 % del volumen libre para que los conductores no se aprieten ni se calienten.</li><li>Los conductores dejan chicotes de unos 15 cm.</li><li>La caja se fija firme, al ras del muro o del cielo terminado.</li><li>Las cajas met\xE1licas se unen a tierra.</li><li>En exteriores y ba\xF1os se usan cajas con grado IP adecuado.</li></ul>" + cuRef) + cuSec("Practica", '<p>En el <b>Simulador 3D</b> puedes abrir cada caja de derivaci\xF3n y hacer t\xFA los empalmes: la app te dice si uniste fase con neutro, si el retorno qued\xF3 mal, etc.</p><button class="btn" type="button" data-go="sim">Ir al Simulador 3D →</button>') + cuKey(["Uniones solo en cajas accesibles.", "25 % del volumen libre y chicotes de 15 cm.", "Cajas met\xE1licas a tierra; en exterior, cajas estancas."]), q: [["\xBFQu\xE9 caja se usa para un interruptor?", ["Octogonal", "Rectangular de aparato", "De paso", "Ninguna"], 1, "La caja rectangular aloja interruptores y enchufes."], ["\xBFSe puede tapar una caja de derivaci\xF3n con cer\xE1mica?", ["S\xED, si queda pareja", "No, debe quedar accesible", "S\xED, en el ba\xF1o", "Solo si es de PVC"], 1, "Se debe poder abrir para revisar y mantener."], ["\xBFQu\xE9 volumen libre m\xEDnimo se deja en la caja?", ["5 %", "10 %", "25 %", "75 %"], 2, "Al menos un 25 % libre."]] },
    { id: "p1", m: "puntos", t: "Alumbrado, enchufes, interruptores y recintos", body: () => cuSec("Puntos m\xEDnimos por recinto (RIC N\xB010)", cuTbl(["Recinto", "Luz", "Enchufes"], [["Dormitorio, living, comedor, estar", "1 centro hasta 10 m\xB2; 2 sobre 10 m\xB2", "1 cada 8 m de per\xEDmetro (redondeando hacia arriba)"], ["Cocina", "Seg\xFAn \xE1rea", "3 enchufes en circuito exclusivo de 16 A"], ["Lavadero", "Seg\xFAn \xE1rea", "1 enchufe (circuito de cocina y lavadero)"], ["Ba\xF1o", "Seg\xFAn \xE1rea", "Fuera de las zonas de agua, con diferencial"]]) + "<p>Los circuitos: m\xEDnimo 2 en viviendas de menos de 30 m\xB2 y 3 desde 30 m\xB2; la cocina y el lavadero llevan circuito exclusivo; el horno o cocina el\xE9ctrica, circuito independiente de al menos 16 A. Se proyecta 100 W por centro de luz y 250 W por enchufe.</p>") + cuSec("Interruptores", '<ul><li><b>9/12 simple:</b> enciende una luz o grupo de luces desde un lugar.</li><li><b>9/15 doble:</b> dos efectos (dos grupos de luces) en una misma placa.</li><li><b>9/24 escalera o conmutaci\xF3n:</b> se usan dos para encender la misma luz desde dos lugares (pasillos, escaleras).</li><li>El interruptor <b>siempre corta la fase</b>, nunca el neutro: si cortara el neutro, la ampolleta apagada seguir\xEDa con tensi\xF3n.</li><li>Se montan entre 0,80 y 1,40 m del piso, junto a la puerta y del lado de la manilla.</li></ul>' + ILL.circuito()) + cuSec("Enchufes", "<ul><li>En Chile se usa el enchufe tipo L (tres patas en l\xEDnea) de 10 A y 16 A, y el tipo C (dos patas) en equipos peque\xF1os sin tierra.</li><li>Siempre con tierra (2P+T) en la instalaci\xF3n: la pata central es la tierra.</li><li>En la cocina, sobre el mes\xF3n, a una altura c\xF3moda y lejos del lavaplatos.</li><li>En exteriores y lugares h\xFAmedos: con tapa y grado IP adecuado.</li></ul>") + cuSec("Ba\xF1os y lugares h\xFAmedos", CI.bano()) + cuKey(["M\xEDnimos: 1 enchufe cada 8 m de per\xEDmetro en piezas; 3 en cocina.", "El interruptor corta la fase. 9/12 simple, 9/15 doble, 9/24 escalera.", "Ba\xF1o: nada de enchufes en las zonas de agua; todo con diferencial."]), q: [["\xBFQu\xE9 interruptor permite encender una luz desde dos lugares?", ["9/12", "9/15", "9/24 (escalera)", "Un diferencial"], 2, "Se usan dos interruptores de escalera."], ["\xBFQu\xE9 conductor corta el interruptor?", ["El neutro", "La fase", "La tierra", "Ambos"], 1, "Siempre la fase."], ["Un dormitorio de 14 m de per\xEDmetro necesita como m\xEDnimo…", ["1 enchufe", "2 enchufes", "3 enchufes", "4 enchufes"], 1, "⌈ 14 \xF7 8 ⌉ = 2."], ["\xBFCu\xE1ntos enchufes m\xEDnimo en la cocina?", ["1", "2", "3", "6"], 2, "3 enchufes en un circuito exclusivo de 16 A."]] },
    { id: "p2", m: "puntos", t: "El tablero y sus protecciones", body: () => cuSec("Qu\xE9 lleva un tablero domiciliario", ILL.tablero() + "<ul><li><b>Interruptor general</b> de corte omnipolar (fase y neutro), m\xEDnimo 25 A en una vivienda.</li><li><b>Diferenciales de 30 mA</b>, m\xE1ximo 3 circuitos por diferencial.</li><li><b>Un disyuntor por circuito</b>: curva B en alumbrado, C en enchufes y equipos.</li><li><b>Barras de neutro y de tierra separadas</b>.</li><li><b>Reserva</b> de espacio (alrededor de 25 %) para crecer.</li><li><b>Rotulaci\xF3n</b>: nombre, tensi\xF3n, corriente, cuadro de circuitos y diagrama unilineal.</li><li>Mandos entre 0,45 y 2,0 m del piso y 0,90 m libres al frente.</li><li>Grado IP seg\xFAn el lugar (interior, bajo techo, intemperie).</li></ul>") + cuSec("Practica", '<p>Arma un tablero desde cero, elige cada protecci\xF3n, ub\xEDcala y con\xE9ctala en el juego.</p><button class="btn" type="button" data-go="tg">⚡ Ir al juego Armar tablero →</button> <button class="btn ghost" type="button" data-go="p6">Paso 6: Tablero →</button>') + cuSec("Protecciones", ILL.termo() + ILL.diferencial()) + cuKey(["General omnipolar, diferenciales de 30 mA y un disyuntor por circuito.", "Neutro y tierra en barras separadas.", "Tablero rotulado, accesible y con reserva."]), q: [["\xBFCu\xE1ntos circuitos puede proteger como m\xE1ximo un diferencial en vivienda?", ["1", "3", "5", "Ilimitados"], 1, "M\xE1ximo 3 para que las fugas normales no lo hagan disparar."], ["\xBFQu\xE9 curva se usa en circuitos de enchufes?", ["B", "C", "D", "Ninguna"], 1, "Curva C: tolera el pico de arranque de los equipos."], ["\xBFQu\xE9 significa corte omnipolar?", ["Corta solo la fase", "Corta fase y neutro a la vez", "Corta la tierra", "Corta con retardo"], 1, "El general corta todos los polos activos."]] },
    { id: "pl1", m: "planos", t: "Simbolog\xEDa el\xE9ctrica", body: () => cuSec("S\xEDmbolos m\xE1s usados en planos domiciliarios", '<div class="symg">'.concat(SYM.map(([t, s]) => '<div class="sym">'.concat(symIcon(s), "<span>").concat(t, "</span></div>")).join(""), "</div>") + '<p class="hint">Los s\xEDmbolos se basan en la simbolog\xEDa normalizada que se usa en Chile para planos de instalaciones. Cada plano debe traer su propia tabla de simbolog\xEDa, as\xED no queda espacio para interpretaciones.</p>') + cuSec("Juego: \xBFqu\xE9 s\xEDmbolo es?", cuSymGame()) + cuKey(["Cada plano lleva su tabla de simbolog\xEDa.", "Centro de luz: c\xEDrculo con una X; enchufe: semic\xEDrculo; tablero: rect\xE1ngulo.", "L\xEDnea llena: canalizaci\xF3n embutida; segmentada: por piso."]), q: [["Un c\xEDrculo con una X adentro representa…", ["Un enchufe", "Un centro de luz", "Un medidor", "Una caja"], 1, "Es el centro de luz."], ["Un semic\xEDrculo con dos rayas es…", ["Un enchufe", "Un interruptor", "Un timbre", "Un motor"], 0, "Es el enchufe."], ["Un rect\xE1ngulo relleno representa…", ["Un tablero general", "Una ventana", "Un ducto", "Una ampolleta"], 0, "Rect\xE1ngulo lleno: tablero general."]] },
    { id: "pl2", m: "planos", t: "Tipos de planos y c\xF3mo se leen", body: () => cuSec("El juego de planos de un proyecto", "<p>El RIC N\xB018 define c\xF3mo se presentan los proyectos. En una vivienda normalmente se entrega:</p>" + cuTbl(["Documento", "Qu\xE9 muestra"], [["Plano de planta", "La arquitectura con cada punto, sus circuitos, canalizaciones y el tablero"], ["Diagrama unilineal", "Las protecciones y conductores de cada circuito en una l\xEDnea"], ["Cuadro de cargas", "Potencia, corriente, protecci\xF3n y secci\xF3n de cada circuito, y los totales"], ["Diagrama del tablero", "C\xF3mo se ordenan las protecciones y barras"], ["Plano de ubicaci\xF3n", "D\xF3nde est\xE1 el inmueble y el empalme"], ["Detalles", "Puesta a tierra, cajas, montajes especiales"], ["Memoria explicativa", "El texto que justifica los c\xE1lculos y las decisiones"]]) + "<p>Escalas habituales para planta: 1:50 o 1:100. Cada l\xE1mina lleva una <b>vi\xF1eta</b> (cuadro de rotulaci\xF3n) con el nombre del proyecto, propietario, direcci\xF3n, instalador con su licencia SEC y firma, escala, fecha y n\xFAmero de l\xE1mina.</p>") + cuSec("Plano de planta", CI.planta()) + cuSec("Diagrama unilineal", CI.unilineal()) + cuSec("Diagrama frontal del tablero", CI.frontal()) + cuSec("Cuadro de cargas", cuTbl(["Circ.", "Uso", "Puntos", "P (W)", "I (A)", "Protecci\xF3n", "Secci\xF3n"], [["C1", "Alumbrado", "10", "1.000", "4,5", "10 A curva B", "1,5 mm\xB2"], ["C2", "Enchufes", "8", "2.000", "9,1", "16 A curva C", "2,5 mm\xB2"], ["C3", "Cocina y lavadero", "4", "1.000", "4,5", "16 A curva C", "2,5 mm\xB2"], ["", "<b>Total</b>", "", "<b>4.000</b>", "", "General 25 A", "Alim. 6 mm\xB2"]]) + '<p>Arma tu propio cuadro en la <button class="linkb" type="button" data-go="cuadro">planilla de cuadro de carga</button> o genera planos y memoria desde el <button class="linkb" type="button" data-go="rep">m\xF3dulo de Reportes</button>.</p>') + cuKey(["Planta + unilineal + cuadro de cargas son la base del proyecto.", "Cada l\xE1mina lleva vi\xF1eta con instalador y licencia SEC.", "Planta a escala 1:50 o 1:100."]), q: [["\xBFQu\xE9 documento muestra las protecciones de cada circuito en una sola l\xEDnea?", ["Plano de planta", "Diagrama unilineal", "Plano de ubicaci\xF3n", "Memoria"], 1, "El diagrama unilineal."], ["\xBFQu\xE9 es la vi\xF1eta?", ["El dibujo del tablero", "El cuadro de rotulaci\xF3n de la l\xE1mina", "Un tipo de interruptor", "La simbolog\xEDa"], 1, "Contiene los datos del proyecto y del instalador."], ["Escala habitual de un plano de planta de vivienda:", ["1:5", "1:50 o 1:100", "1:1.000", "1:10.000"], 1, "1:50 o 1:100."]] },
    { id: "s1", m: "seg", t: "Efectos de la corriente y seguridad el\xE9ctrica", body: () => cuSec("Qu\xE9 le pasa al cuerpo", CI.cuerpo() + "<p>La corriente que pasa por el cuerpo es <b>I = V \xF7 R</b>. Con la piel seca la resistencia del cuerpo puede ser de miles de ohm; mojada baja mucho. A 220 V, con unos 1.000 Ω circulan unos 220 mA: suficiente para un paro card\xEDaco.</p><p>Adem\xE1s del choque el\xE9ctrico hay otros peligros: <b>quemaduras</b> (por la corriente o por el arco), <b>arco el\xE9ctrico</b> (destello de miles de grados y proyecci\xF3n de metal fundido), <b>ca\xEDdas</b> por la reacci\xF3n al choque, <b>incendios</b> por sobrecargas y malas uniones, y <b>explosiones</b> en ambientes con gases.</p>") + cuSec("Contacto directo e indirecto", ILL.tierra() + cuTbl(["Tipo", "Qu\xE9 es", "C\xF3mo se protege"], [["Contacto directo", "Tocar una parte que normalmente tiene tensi\xF3n (un cable pelado, un borne)", "Aislaci\xF3n, tapas, envolventes, distancia, diferencial de 30 mA como respaldo"], ["Contacto indirecto", "Tocar una carcasa que qued\xF3 con tensi\xF3n por una falla", "Puesta a tierra de protecci\xF3n + diferencial, doble aislaci\xF3n, muy baja tensi\xF3n"]])) + cuSec("Las barreras de seguridad de una instalaci\xF3n", "<ol class='hand'><li>Buena aislaci\xF3n de conductores y aparatos.</li><li>Envolventes cerradas: tableros con tapa, cajas con tapa.</li><li>Puesta a tierra de todas las partes met\xE1licas.</li><li>Diferenciales de 30 mA en todos los circuitos.</li><li>Termomagn\xE9ticos coordinados con los cables (contra sobrecarga e incendio).</li><li>Polaridad correcta: el interruptor corta la fase.</li></ol>") + cuKey(["El peligro lo da la corriente: I = V \xF7 R, y el agua baja R.", "Contacto directo: aislar y cubrir. Indirecto: tierra + diferencial.", "Tambi\xE9n hay arco el\xE9ctrico, quemaduras, ca\xEDdas e incendios."]), q: [["\xBFQu\xE9 aumenta m\xE1s la corriente por el cuerpo?", ["Usar zapatos", "Tener la piel mojada", "Que sea de d\xEDa", "Usar guantes"], 1, "El agua baja la resistencia del cuerpo."], ["Tocar la carcasa de una lavadora que qued\xF3 con tensi\xF3n por una falla es…", ["Contacto directo", "Contacto indirecto", "Arco el\xE9ctrico", "Sobrecarga"], 1, "La carcasa normalmente no tiene tensi\xF3n."], ["Aproximadamente, \xBFdesde qu\xE9 corriente no puedes soltar lo que tocas?", ["0,5 mA", "10 mA", "1 A", "10 A"], 1, "Es el umbral de no soltar, del orden de 10 mA."], ["\xBFQu\xE9 protege contra el contacto indirecto?", ["Solo el disyuntor", "La tierra de protecci\xF3n junto con el diferencial", "La cinta aislante", "El medidor"], 1, "La tierra deriva la falla y el diferencial corta."]] },
    { id: "s2", m: "seg", t: "Trabajo seguro: reglas de oro, bloqueo y EPP", body: () => cuSec("Las cinco reglas de oro", CI.reglas() + "<p>El <b>bloqueo y etiquetado</b> (en ingl\xE9s LOTO) significa poner un candado personal en la protecci\xF3n abierta y una tarjeta con tu nombre: solo t\xFA puedes retirarlos. Si trabajan varios, cada uno pone su candado.</p><p>Para <b>verificar ausencia de tensi\xF3n</b> se usa un detector o mult\xEDmetro de la categor\xEDa adecuada (CAT III o CAT IV para tableros), prob\xE1ndolo antes y despu\xE9s en una fuente conocida.</p>") + cuSec("Elementos de protecci\xF3n personal", CI.epp() + "<ul><li>Los guantes diel\xE9ctricos se revisan antes de cada uso (se inflan para ver si tienen fugas) y se usan con un guante protector de cuero encima.</li><li>Nada de anillos, relojes, cadenas ni ropa sint\xE9tica que se derrite.</li><li>Las herramientas aisladas no se reparan con cinta: si est\xE1n da\xF1adas, se cambian.</li><li>Escaleras de fibra de vidrio, nunca met\xE1licas, para trabajos el\xE9ctricos.</li></ul>") + cuSec("Si hay que trabajar con tensi\xF3n", "<p>Solo personal calificado, con procedimiento escrito, autorizaci\xF3n, EPP completo, herramientas aisladas y un compa\xF1ero que pueda cortar la energ\xEDa y prestar auxilio. En una vivienda casi nunca se justifica: se corta el circuito.</p>") + cuKey(["Cortar, bloquear, verificar, poner a tierra y se\xF1alizar.", "Candado y tarjeta personales: solo el due\xF1o los retira.", "EPP: casco, protecci\xF3n facial, guantes diel\xE9ctricos, calzado, ropa ign\xEDfuga, herramientas 1.000 V."]), q: [["\xBFCu\xE1l es la tercera regla de oro?", ["Se\xF1alizar", "Verificar ausencia de tensi\xF3n", "Cortar", "Poner a tierra"], 1, "Cortar, bloquear, verificar, tierra, se\xF1alizar."], ["\xBFQui\xE9n puede retirar un candado de bloqueo?", ["El supervisor", "Cualquiera que lo necesite", "Solo la persona que lo puso", "El cliente"], 2, "El bloqueo es personal."], ["\xBFQu\xE9 escalera se usa en trabajos el\xE9ctricos?", ["Met\xE1lica", "De fibra de vidrio", "De aluminio", "Cualquiera"], 1, "La fibra de vidrio no conduce."], ["Guantes diel\xE9ctricos clase 0 sirven hasta…", ["50 V", "1.000 V", "10.000 V", "36.000 V"], 1, "Clase 0: hasta 1.000 V CA."]] },
    { id: "r1", m: "prev", t: "Peligros, riesgos, actos y condiciones subest\xE1ndar", body: () => cuSec("Conceptos", cuTbl(["Concepto", "Qu\xE9 es", "Ejemplo"], [["Peligro", "Algo que puede causar da\xF1o", "La electricidad de un tablero"], ["Riesgo", "La probabilidad de que ese da\xF1o ocurra y su gravedad", "Electrocutarse al abrir un tablero sin tapa"], ["Incidente", "Evento que pudo causar da\xF1o (cuasi accidente)", "Salta un arco y nadie se lesiona"], ["Accidente", "Evento que causa lesi\xF3n o da\xF1o", "Quemadura por arco"], ["Acto subest\xE1ndar (inseguro)", "Lo que HACE una persona en contra de lo seguro", "Trabajar sin cortar la energ\xEDa"], ["Condici\xF3n subest\xE1ndar (insegura)", "C\xF3mo EST\xC1 el lugar, el equipo o la instalaci\xF3n", "Un cable pelado"]]) + "<p>Casi todos los accidentes tienen varias causas: <b>causas inmediatas</b> (actos y condiciones subest\xE1ndar) y <b>causas b\xE1sicas</b> detr\xE1s de ellas (falta de capacitaci\xF3n, apuro, mala mantenci\xF3n, falta de procedimientos).</p>") + cuSec("Juego 1: encuentra los 8 problemas", '<p class="hint" style="margin-top:0">Toca la imagen donde veas algo inseguro. A = acto, C = condici\xF3n.</p><div class="escwrap">'.concat(escSVG(), "</div>").concat(cuEscList(), "")) + cuSec("Juego 2: \xBFacto o condici\xF3n?", cuAcq()) + cuSec("Evaluar el riesgo", CI.matriz() + "<p>La <b>IPER</b> (Identificaci\xF3n de Peligros y Evaluaci\xF3n de Riesgos) se hace antes de trabajar: se listan las tareas, sus peligros, se eval\xFAa cada riesgo con la matriz y se definen controles hasta dejarlo aceptable.</p>" + CI.jerarquia()) + cuSec("Marco legal en Chile", "<ul><li><b>Ley 16.744</b>: seguro obligatorio contra accidentes del trabajo y enfermedades profesionales (mutualidades: ACHS, IST, Mutual de Seguridad, o el ISL).</li><li><b>DS 40</b>: obligaci\xF3n de informar los riesgos laborales (\xABderecho a saber\xBB).</li><li><b>DS 594</b>: condiciones sanitarias y ambientales b\xE1sicas en los lugares de trabajo.</li><li>Reglamento de seguridad de instalaciones de consumo y pliegos RIC (SEC).</li></ul>") + cuKey(["Peligro = lo que puede da\xF1ar; riesgo = probabilidad \xD7 gravedad.", "Acto = lo que se hace; condici\xF3n = c\xF3mo est\xE1.", "Controles: eliminar, sustituir, ingenier\xEDa, administrativos y por \xFAltimo EPP."]), q: [["\xBFQu\xE9 es un acto subest\xE1ndar?", ["Un cable pelado", "Una acci\xF3n insegura de una persona", "Un tablero viejo", "Un d\xEDa de lluvia"], 1, "Es lo que la persona hace."], ["Un tablero sin tapa es…", ["Acto subest\xE1ndar", "Condici\xF3n subest\xE1ndar", "Accidente", "Incidente"], 1, "Describe c\xF3mo est\xE1 el lugar."], ["\xBFCu\xE1l es el control m\xE1s efectivo?", ["Usar EPP", "Poner un letrero", "Eliminar el peligro (trabajar sin tensi\xF3n)", "Capacitar"], 2, "La jerarqu\xEDa empieza por eliminar."], ["\xBFQu\xE9 ley crea el seguro de accidentes del trabajo?", ["Ley 16.744", "Ley 19.300", "DS 594", "NCh 4/2003"], 0, "La Ley 16.744."]] },
    { id: "r2", m: "prev", t: "Emergencias el\xE9ctricas y primeros auxilios", body: () => cuSec("Si alguien se est\xE1 electrocutando", '<ol class="hand"><li><b>No lo toques</b> mientras siga en contacto con la corriente.</li><li><b>Corta la energ\xEDa</b>: baja el general o el autom\xE1tico.</li><li>Si no puedes cortar, sep\xE1ralo con un objeto seco y aislante (palo de madera seco, silla pl\xE1stica), parado sobre algo seco.</li><li><b>Llama al SAMU 131</b>.</li><li>Si no respira o no responde, inicia reanimaci\xF3n (RCP) y usa un desfibrilador (DEA) si hay uno.</li><li>Toda persona que recibi\xF3 una descarga debe ser evaluada por un m\xE9dico, aunque se sienta bien: la corriente puede da\xF1ar el coraz\xF3n y \xF3rganos internos sin que se note.</li></ol>') + cuSec("Incendio de origen el\xE9ctrico", '<ul><li>Corta la energ\xEDa si es seguro hacerlo.</li><li><b>Nunca uses agua</b> sobre equipos energizados: conduce la corriente.</li><li>Usa extintor de CO₂ o de polvo qu\xEDmico seco (PQS) apto para fuego clase C (equipos energizados).</li><li>Llama a Bomberos (132). Carabineros: 133.</li></ul>') + cuSec("Se\xF1alizaci\xF3n", '<p>Los tableros llevan la se\xF1al de riesgo el\xE9ctrico (tri\xE1ngulo amarillo con un rayo). En trabajos se delimita el \xE1rea con conos y cinta, y se cuelgan tarjetas de \xABNo operar\xBB en las protecciones bloqueadas.</p>') + cuKey(["Primero cortar la energ\xEDa; no tocar a la v\xEDctima energizada.", "SAMU 131, Bomberos 132, Carabineros 133.", "Fuego el\xE9ctrico: CO₂ o PQS, nunca agua."]), q: [["\xBFQu\xE9 haces primero si alguien est\xE1 pegado a un cable?", ["Lo tiras de la mano", "Cortas la energ\xEDa", "Le echas agua", "Esperas"], 1, "Si lo tocas, la corriente pasa tambi\xE9n por ti."], ["\xBFQu\xE9 extintor usas en un tablero energizado?", ["De agua", "CO₂ o polvo qu\xEDmico seco", "Espuma", "Arena mojada"], 1, "No conducen la electricidad."], ["\xBFN\xFAmero del SAMU en Chile?", ["131", "132", "133", "134"], 0, "SAMU 131."]] },
    { id: "m1", m: "serv", t: "Inspecci\xF3n, ensayos, mantenci\xF3n y fallas t\xEDpicas", body: () => cuSec("Antes de energizar (RIC N\xB019)", cuTbl(["Ensayo", "C\xF3mo", "Criterio"], [["Inspecci\xF3n visual", "Secciones, colores, uniones en cajas, rotulado", "Todo seg\xFAn proyecto"], ["Continuidad de tierra", "Fuente de baja tensi\xF3n, cada enchufe y carcasa", "Debe haber continuidad"], ["Resistencia de aislamiento", "Meg\xF3hmetro a 500 V CC, circuito sin tensi\xF3n", "≥ 0,5 MΩ"], ["Puesta a tierra", "Telur\xF3metro", "Seg\xFAn RIC N\xB006 y la protecci\xF3n usada"], ["Diferenciales", "Probador: corriente y tiempo de disparo", "Dispara bajo IΔn y r\xE1pido"], ["Polaridad", "El interruptor corta la fase", "Fase en el borne del interruptor"]]) + '<p>Practica con los instrumentos en el <button class="linkb" type="button" data-go="sim">Simulador 3D</button> y registra los ensayos en el <button class="linkb" type="button" data-go="p8">paso 8</button>.</p>' + ILL.instrumentos()) + cuSec("Mantenci\xF3n (RIC N\xB017)", "<ul><li>Probar los diferenciales con su bot\xF3n de prueba peri\xF3dicamente (el fabricante suele indicar cada mes).</li><li>Revisar apriete de bornes y se\xF1ales de calentamiento (decoloraci\xF3n, olor) en tablero y enchufes.</li><li>Medir la puesta a tierra peri\xF3dicamente.</li><li>No agregar circuitos ni cambiar protecciones por unas mayores sin recalcular.</li></ul>") + cuSec("Fallas t\xEDpicas y su causa probable", cuTbl(["S\xEDntoma", "Causa probable", "Qu\xE9 revisar"], [["Salta el diferencial al encender un equipo", "Fuga a tierra en ese equipo", "Aislaci\xF3n del equipo y su cord\xF3n"], ["Salta el diferencial al llover", "Humedad en cajas o enchufes exteriores", "Estanqueidad, cajas IP"], ["Salta el autom\xE1tico al usar muchos equipos", "Sobrecarga", "Repartir cargas, nuevo circuito"], ["Salta el autom\xE1tico al instante", "Cortocircuito", "Uniones, equipos, cables da\xF1ados"], ["Luces bajan su brillo al encender equipos", "Uni\xF3n floja o secci\xF3n peque\xF1a", "Empalmes y ca\xEDda de tensi\xF3n"], ["Enchufe caliente o derretido", "Contacto flojo o sobrecarga", "Reemplazar enchufe, revisar carga"], ["Corriente en la carcasa (\xABda la corriente\xBB)", "Falla a carcasa y tierra cortada", "Continuidad de tierra y equipo"]])) + cuKey(["Aislamiento ≥ 0,5 MΩ a 500 V CC.", "Probar diferenciales y reapretar bornes peri\xF3dicamente.", "Nunca cambiar una protecci\xF3n por una mayor \xABporque salta\xBB."]), q: [["\xBFValor m\xEDnimo de aislamiento en un circuito de vivienda?", ["0,05 MΩ", "0,5 MΩ", "50 Ω", "5 Ω"], 1, "≥ 0,5 MΩ a 500 V CC."], ["El autom\xE1tico de 16 A salta seguido. \xBFQu\xE9 haces?", ["Pongo uno de 32 A", "Busco la causa: sobrecarga o falla", "Lo puenteo", "Lo cubro con cinta"], 1, "Una protecci\xF3n mayor dejar\xEDa el cable sin protecci\xF3n."], ["\xBFQu\xE9 instrumento mide la resistencia de aislamiento?", ["Telur\xF3metro", "Meg\xF3hmetro", "Pinza amperim\xE9trica", "Lux\xF3metro"], 1, "El meg\xF3hmetro aplica 500 V CC."]] }
  ];
  const CI2 = {};
  CI2.ohm = () => {
    let g = '<rect x="20" y="30" width="170" height="120" rx="12" class="s-ink f-surf" stroke-width="2"/>' + tx(105, 62, "V = I × R", "tb") + tx(105, 92, "P = V × I × cos φ", "tb") + tx(105, 122, "E = P × t", "tb");
    g += '<rect x="220" y="30" width="400" height="120" rx="12" class="s-ink f-surf2" stroke-width="1.5"/>';
    g += tx(240, 55, "V tensión (volt, V): la «presión» que empuja", "ts", "start") + tx(240, 78, "I corriente (ampere, A): el caudal de cargas", "ts", "start") + tx(240, 101, "R resistencia (ohm, Ω): lo que se opone al paso", "ts", "start") + tx(240, 124, "P potencia (watt, W) · E energía (kWh)", "ts", "start");
    return fig("0 0 640 180", g, "Las cuatro relaciones que se usan en todo cálculo domiciliario.", "Fórmulas de tensión, corriente, resistencia, potencia y energía");
  };
  CI2.caida = () => {
    let g = '<rect x="14" y="50" width="92" height="80" rx="8" class="s-ink f-surf" stroke-width="2"/>' + tx(60, 78, "Tablero", "tb") + tx(60, 102, "220 V", "ts");
    g += wl(106, 76, 520, 76, WC.R) + wl(106, 104, 520, 104, WC.N);
    g += '<rect x="520" y="50" width="104" height="80" rx="8" class="s-ink f-surf" stroke-width="2"/>' + tx(572, 78, "Carga", "tb") + tx(572, 102, "≈ 213 V", "ts");
