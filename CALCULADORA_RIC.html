  const CU_ADD = [
    ["f2", { id: "f3", m: "fund", t: "Magnitudes eléctricas y cálculos básicos", body: () => cuSec("Tensión, corriente, resistencia y potencia", CI2.ohm() + "<p>Todo cálculo de una instalación domiciliaria parte de cuatro relaciones. La <b>ley de Ohm</b> (V = I × R) explica por qué un mal contacto, que tiene resistencia, se calienta. La <b>potencia</b> (P = V × I × cos φ) permite pasar de los watts de los equipos a la corriente que deben soportar los cables y las protecciones.</p>" + cuTbl(["Magnitud", "Símbolo", "Unidad", "Instrumento"], [["Tensión", "V", "volt (V)", "Multímetro (voltímetro), en paralelo"], ["Corriente", "I", "ampere (A)", "Pinza amperimétrica, abrazando un solo conductor"], ["Resistencia", "R", "ohm (Ω)", "Multímetro, siempre sin tensión"], ["Potencia", "P", "watt (W)", "Vatímetro o cálculo V × I × cos φ"], ["Energía", "E", "kilowatt-hora (kWh)", "Medidor de la distribuidora"]])) + cuSec("Monofásico y trifásico", "<ul><li><b>Monofásico</b> (fase y neutro, 220 V): I = P ÷ (220 × cos φ). Con cargas resistivas (ampolletas incandescentes, hervidor, estufa) cos φ ≈ 1.</li><li><b>Trifásico</b> (380 V entre fases): I = P ÷ (√3 × 380 × cos φ). La misma potencia se reparte en tres fases y la corriente por conductor es menor.</li><li>Los motores, los equipos con fuente electrónica y los fluorescentes tienen cos φ menor que 1: piden más corriente para la misma potencia útil.</li></ul>" + '<div class="f s">Ejemplo: hervidor de 2.000 W a 220 V → I = 2.000 ÷ 220 ≈ 9,1 A. En 10 minutos consume 2 kW × 1/6 h ≈ 0,33 kWh.</div>') + cuSec("Potencias típicas de una vivienda", cuTbl(["Equipo", "Potencia aprox.", "Corriente a 220 V"], [["Ampolleta LED", "9 a 12 W", "≈ 0,05 A"], ["Televisor", "100 a 150 W", "≈ 0,6 A"], ["Refrigerador", "150 a 300 W", "≈ 1,4 A (más al partir)"], ["Lavadora", "500 a 2.000 W", "hasta 9 A"], ["Microondas", "1.000 a 1.500 W", "≈ 6,8 A"], ["Hervidor", "2.000 a 2.200 W", "≈ 10 A"], ["Horno eléctrico", "2.000 a 3.500 W", "≈ 16 A"], ["Ducha o calefont eléctrico", "4.000 a 7.500 W", "≈ 20 a 34 A"]]) + "<p>Por eso los equipos grandes (horno, cocina eléctrica, calefont eléctrico, aire acondicionado) van en un <b>circuito propio</b>: sumarlos a un circuito de enchufes lo sobrecarga.</p>" + cuRef) + cuKey(["V = I × R; P = V × I × cos φ; E = P × t.", "A 220 V, cada 1.000 W resistivos son unos 4,5 A.", "La corriente define la sección del cable y la protección."]), q: [["Una estufa de 1.500 W a 220 V, ¿cuánta corriente toma?", ["0,15 A", "6,8 A", "15 A", "330 A"], 1, "I = 1.500 ÷ 220 ≈ 6,8 A."], ["¿Qué instrumento mide la corriente sin cortar el circuito?", ["Megóhmetro", "Telurómetro", "Pinza amperimétrica", "Probador de diferencial"], 2, "La pinza abraza un solo conductor y mide su campo magnético."], ["Un equipo de 2 kW funciona 3 horas. ¿Cuánta energía consume?", ["0,67 kWh", "2 kWh", "5 kWh", "6 kWh"], 3, "E = 2 kW × 3 h = 6 kWh."], ["¿Por qué un empalme flojo se calienta?", ["Porque baja la tensión de la red", "Porque tiene resistencia y disipa P = I² × R", "Porque aumenta la frecuencia", "Porque el neutro queda abierto"], 1, "La resistencia de contacto convierte energía en calor: P = I² × R."]] }],
    ["c2", { id: "c3", m: "cond", t: "Caída de tensión y elección de la sección", body: () => cuSec("Límites del RIC N°03", CI2.caida() + "<p>Todo conductor tiene resistencia, así que en el extremo de un circuito largo llega menos tensión. El <b>RIC N°03 (5.1.3)</b> fija:</p><ul><li>En alimentadores, subalimentadores y circuitos, la caída con la corriente máxima no debe superar el <b>3 %</b> de la tensión nominal (6,6 V a 220 V).</li><li>La caída <b>total</b> hasta el punto más desfavorable no debe superar el <b>5 %</b> (11 V a 220 V).</li></ul>" + '<div class="f s">ΔV (V) = 2 × L × I × ρ ÷ S   ·   ΔV % = ΔV ÷ 220 × 100   ·   S mínima = 2 × L × I × ρ ÷ ΔV máx</div>') + cuSec("Cómo se elige la sección, paso a paso", '<ol class="hand"><li><b>Corriente de proyecto (Ib)</b>: potencia del circuito ÷ tensión. El RIC N°10 (5.1.4.1) pide considerar la potencia requerida más un 10 %.</li><li><b>Protección (In)</b>: el valor comercial inmediatamente superior a Ib (6, 10, 16, 20, 25, 32 A…).</li><li><b>Capacidad del cable (Iz)</b>: de la tabla de RIC N°04, corregida por temperatura y agrupamiento. Debe cumplirse <b>Ib ≤ In ≤ Iz</b>.</li><li><b>Caída de tensión</b>: con el largo real del recorrido. Si pasa del límite, sube a la sección siguiente.</li><li><b>Mínimos</b>: 1,5 mm² alumbrado, 2,5 mm² enchufes y mixtos, 2,5 mm² subalimentadores, 4 mm² alimentadores (RIC N°04, 5.4). El neutro, igual a la fase (RIC N°10, 5.1.5.3).</li></ol>') + cuSec("Ejemplo resuelto", cuTbl(["Dato", "Valor"], [["Circuito", "Enchufes de un dormitorio al fondo de la casa"], ["Potencia", "2.000 W → Ib = 9,1 A"], ["Protección", "16 A curva C"], ["Largo del recorrido", "28 m"], ["Con 2,5 mm²", "ΔV = 2 × 28 × 9,1 × 0,018 ÷ 2,5 = 3,67 V → 1,7 % ✓"], ["Con 1,5 mm²", "No se permite: mínimo 2,5 mm² en enchufes"]]) + "<p>Si ese mismo circuito tuviera 60 m, con 2,5 mm² la caída sería 7,9 V (3,6 %): habría que usar 4 mm² (4,9 V, 2,2 %). Recuerda sumar también la caída del alimentador para verificar el 5 % total.</p>" + '<button class="btn" type="button" data-go="t_caida">Calcular en la app →</button>' + cuRef) + cuKey(["Caída ≤ 3 % por tramo y ≤ 5 % total (RIC N°03, 5.1.3).", "En monofásico el largo se cuenta dos veces: ida por la fase y vuelta por el neutro.", "Se cumple Ib ≤ In ≤ Iz y después se revisa la caída."]), q: [["¿Cuál es la caída de tensión total máxima hasta el punto más desfavorable?", ["1 %", "3 %", "5 %", "10 %"], 2, "RIC N°03, 5.1.3: el 5 % de la tensión nominal."], ["A 220 V, ¿cuántos volts son el 3 %?", ["2,2 V", "6,6 V", "11 V", "22 V"], 1, "220 × 0,03 = 6,6 V."], ["¿Por qué en monofásico se usa 2 × L?", ["Por seguridad", "Porque la corriente va por la fase y vuelve por el neutro", "Porque hay dos circuitos", "Por la tierra"], 1, "El circuito completo mide el doble del recorrido."], ["Si la caída calculada pasa del límite, ¿qué haces?", ["Subo la protección", "Uso la sección siguiente", "Bajo la tensión", "Elimino el neutro"], 1, "Más sección significa menos resistencia y menos caída."], ["¿Qué orden se debe cumplir entre corriente de proyecto, protección y cable?", ["In ≤ Ib ≤ Iz", "Iz ≤ In ≤ Ib", "Ib ≤ In ≤ Iz", "Ib ≤ Iz ≤ In"], 2, "La protección es mayor que la carga y menor que lo que soporta el cable."]] }],
    ["p2", { id: "p3", m: "puntos", t: "Circuitos, cuadro de cargas y demanda", body: () => cuSec("Circuitos mínimos de una vivienda (RIC N°10, 5.2)", cuTbl(["Exigencia", "Detalle"], [["Empalme y alimentador", "Protección del empalme de 25 A como mínimo y alimentador de 4 mm² como mínimo"], ["Cantidad de circuitos", "Mínimo 2 si la vivienda tiene menos de 30 m²; mínimo 3 desde 30 m²"], ["Cocina y lavadero", "Al menos un circuito exclusivo para sus enchufes, de 16 A o más"], ["Horno o cocina eléctrica", "Un circuito adicional e independiente de 16 A o más"], ["Protecciones", "Todos los circuitos con diferencial y con protección de sobrecarga y cortocircuito"], ["Diferenciales", "30 mA como máximo, hasta 3 circuitos por diferencial (5.1.3.5 y 5.1.3.7)"], ["Esquema de tierra", "TN-S"]])) + cuSec("Cómo se carga cada circuito", "<ul><li>Si no se conoce la potencia, se proyectan <b>100 W por centro de iluminación</b> (5.1.4.5) y <b>250 W por enchufe</b> (5.1.4.6).</li><li>La suma de las potencias de los puntos no puede superar el <b>90 %</b> de la capacidad del circuito (5.1.4.4).</li><li>La protección se elige con la potencia requerida <b>más un 10 %</b> y el valor nominal inmediatamente superior (5.1.4.1).</li><li>Los enchufes deben ser de <b>alvéolos protegidos</b> y de capacidad no inferior a la protección del circuito (5.1.2.8 y 5.1.2.9).</li></ul>" + '<div class="f s">Ejemplo: circuito de enchufes de 16 A → capacidad 16 × 220 = 3.520 W → 90 % = 3.168 W → hasta 12 enchufes de 250 W.</div>') + cuSec("Demanda máxima y alimentador (RIC N°03)", "<p>No todos los equipos funcionan a la vez. Para dimensionar el <b>alimentador</b> se aplica un factor de demanda a la potencia instalada de alumbrado (RIC N°03, tabla 3.1, casa habitación):</p>" + cuTbl(["Tramo de potencia de alumbrado", "Factor de demanda"], [["Primeros 3 kW", "1,00"], ["De 3 kW a 120 kW", "0,35"], ["Sobre 120 kW", "0,25"]]) + "<p>Estos factores <b>no se aplican</b> a subalimentadores ni a circuitos finales: cada circuito se calcula con su carga completa. Si varias viviendas comparten un empalme se usa además el factor de simultaneidad de la tabla 3.2.</p>" + '<div class="f s">Ejemplo: 7.000 W instalados → 3.000 × 1 + 4.000 × 0,35 = 4.400 W de demanda → I ≈ 20 A → general de 25 A y alimentador según caída de tensión (mínimo 4 mm²).</div>' + '<button class="btn" type="button" data-go="cuadro">Armar el cuadro de cargas →</button>' + cuRef) + cuKey(["2 circuitos bajo 30 m², 3 desde 30 m²; cocina y lavadero exclusivo de 16 A.", "100 W por centro y 250 W por enchufe; carga hasta el 90 % del circuito.", "La demanda reduce solo el alimentador, nunca los circuitos."]), q: [["Una vivienda de 45 m², ¿cuántos circuitos tiene como mínimo?", ["1", "2", "3", "5"], 2, "Desde 30 m² se exigen al menos 3 circuitos (RIC N°10, 5.2 b)."], ["Sin datos del equipo, ¿qué potencia se proyecta por enchufe?", ["100 W", "150 W", "250 W", "1.000 W"], 2, "250 W por enchufe hembra (5.1.4.6)."], ["¿Hasta qué porcentaje de su capacidad se puede cargar un circuito?", ["50 %", "80 %", "90 %", "100 %"], 2, "La suma no puede pasar del 90 % (5.1.4.4)."], ["¿Dónde se aplican los factores de demanda del RIC N°03?", ["En cada circuito", "En el alimentador", "En los enchufes", "En la puesta a tierra"], 1, "Solo en alimentadores; no en subalimentadores ni circuitos."], ["¿Qué protección mínima tiene el circuito del horno eléctrico?", ["6 A", "10 A", "16 A", "40 A"], 2, "Circuito independiente de al menos 16 A (5.2 e)."]] }],
    ["p3", { id: "p4", m: "puntos", t: "Armado del tablero según RIC N°02", body: () => cuSec("Cómo se ordena un tablero", CI2.tableroRIC() + cuTbl(["Regla", "Qué exige", "RIC N°02"], [["Luz piloto", "Obligatoria, salvo en tableros domiciliarios de hasta 3 circuitos", "6.2.14"], ["Alimentación del piloto", "Circuito independiente protegido con 10 A o menos", "6.2.15"], ["Cableado entre equipos", "No se cablea equipo a equipo", "6.2.4"], ["Excepción", "Un disyuntor puede alimentar por cable a un solo diferencial", "6.2.4.1"], ["Diferencial a varios disyuntores", "Con barra o peine, nunca con puentes de cable", "6.2.4.2"], ["Peines", "Se usan con el 100 % de sus accesorios de fábrica (tapas, terminales)", "6.2.4.3"], ["Protección del diferencial", "Todo diferencial queda protegido por un disyuntor", "6.2.6"], ["Canaletas", "Obligatorias desde 8 circuitos", "6.1.16.1"], ["Regletas de salida", "Desde 8 circuitos", "6.2.12"], ["Reserva", "Al menos 25 % de espacio libre", "6.1.16.3"]])) + cuSec("Otras exigencias que se revisan", '<ul><li><b>Sin uniones dentro del tablero</b>: las uniones de conductores no se permiten en tableros ni en ductos (RIC N°04, 5.34).</li><li><b>Ubicación</b>: nunca en dormitorios, baños, lavaderos, clósets ni lugares de difícil acceso (RIC N°10, 5.1.3.2).</li><li><b>Barras separadas</b> de neutro y de tierra de protección (esquema TN-S): el neutro de cada diferencial sale a sus circuitos y la tierra llega a la barra PE.</li><li><b>Colores</b>: fase azul, negro o rojo; neutro blanco; tierra verde o verde/amarillo (RIC N°04, 5.32).</li><li><b>Rotulado</b>: cada protección identificada con el circuito que alimenta y un cuadro de circuitos en la puerta.</li></ul>') + cuSec("Orden de montaje recomendado", '<ol class="hand"><li>Fija la caja y los rieles DIN; deja la canaleta y la reserva.</li><li>Monta el interruptor general y, a su lado, el disyuntor del piloto (si hay 4 o más circuitos).</li><li>Monta los diferenciales y alimenta su entrada con peine o con un cable desde el general (si es uno solo).</li><li>Monta los disyuntores de cada grupo y únelos con un peine desde la salida de su diferencial.</li><li>Instala las barras de neutro y de tierra, peina los conductores por la canaleta y aprieta los bornes con el torque del fabricante.</li><li>Rotula y verifica con los ensayos del RIC N°19 antes de energizar.</li></ol>' + '<button class="btn" type="button" data-go="tg">⚡ Practicar en el juego Armar tablero →</button>' + cuRef) + cuKey(["Piloto desde 4 circuitos, con su propia protección de 10 A o menos.", "Diferencial a varios disyuntores: peine o barra; nada de puentes de cable.", "Canaletas y regletas desde 8 circuitos; 25 % de reserva."]), q: [["Un tablero domiciliario con 3 circuitos, ¿necesita luz piloto?", ["Sí, siempre", "No, es opcional hasta 3 circuitos", "Solo si es trifásico", "Solo con 2 diferenciales"], 1, "RIC N°02, 6.2.14: se exime a los tableros domiciliarios de hasta 3 circuitos."], ["Un diferencial alimenta 3 disyuntores. ¿Cómo se conectan?", ["Con puentes de cable entre bornes", "Con un peine o barra", "Con una regleta de salida", "Con cables en paralelo"], 1, "6.2.4.2: barra o peine."], ["¿Desde cuántos circuitos se exigen canaletas?", ["4", "6", "8", "12"], 2, "RIC N°02, 6.1.16.1."], ["¿Con qué se protege el circuito de la luz piloto?", ["Con el general", "Con una protección de 10 A o menos", "Con un diferencial de 300 mA", "No necesita"], 1, "6.2.15: circuito independiente protegido a 10 A o menos."], ["¿Se pueden hacer uniones de conductores dentro del tablero?", ["Sí, con huincha", "Sí, si son de la misma sección", "No", "Solo en el neutro"], 2, "RIC N°04, 5.34: no se permiten uniones en tableros ni ductos."]] }],
    ["p4", { id: "p5", m: "puntos", t: "Baños, cocinas, exteriores y lugares húmedos", body: () => cuSec("Por qué son lugares de riesgo", "<p>El agua baja mucho la resistencia del cuerpo y el contacto con pisos y cañerías aumenta la corriente que pasaría en una falla. Por eso en lugares húmedos la <b>tensión de seguridad</b> baja de 50 V a <b>24 V</b> en alterna (RIC N°05, 5.8) y se recomienda la <b>conexión equipotencial</b> de las partes metálicas (8.6.4).</p>" + CI2.bano() + "<ul><li>Todos los circuitos de alumbrado y enchufes van con diferencial de 30 mA o menos (RIC N°10, 5.1.3.5).</li><li>Las unidades interruptor-enchufe solo se aceptan en baños de viviendas de menos de 30 m² y con protección diferencial (RIC N°10, 5.1.2.10).</li><li>Las exigencias específicas de baños están en la <b>sección 6 del RIC N°11</b>.</li><li>Todo centro de iluminación lleva conductor de protección (RIC N°10, 5.1.2.13).</li></ul>") + cuSec("Cocina y lavadero", "<ul><li>Cocina: mínimo <b>3 enchufes</b> dobles o triples de 10/16 A; lavadero: mínimo <b>1</b> (RIC N°10, 5.2).</li><li>Sus enchufes van en un <b>circuito exclusivo</b> de 16 A o más.</li><li>Horno o cocina eléctrica: un enchufe de 16 A por equipo, en circuito independiente; si no hay módulo adecuado, conexión fija sin enchufe.</li><li>Si la carga real supera 16 A (por ejemplo, encimera de inducción), se proyecta un circuito a la medida de esa demanda.</li></ul>") + cuSec("Exteriores", cuTbl(["Ubicación", "Grado de protección mínimo"], [["Bajo alero, fuera del alcance de la lluvia", "IP44"], ["Expuesto a la intemperie", "IP54"], ["Con exposición solar", "Además, protección UV"]]) + '<p>El primer número del código IP indica la protección contra sólidos y el segundo contra el agua: IP44 resiste salpicaduras; IP54 además el polvo. Las canalizaciones exteriores y enterradas usan materiales aptos y cajas estancas.</p>' + cuRef) + cuKey(["Lugares húmedos: tensión de seguridad 24 V y equipotencialidad.", "Cocina 3 enchufes, lavadero 1, en circuito exclusivo de 16 A.", "Exterior bajo alero IP44; a la intemperie IP54 y protección UV."]), q: [["¿Cuál es la tensión de seguridad en alterna en lugares húmedos?", ["12 V", "24 V", "50 V", "110 V"], 1, "RIC N°05, 5.8: 24 V en alterna en lugares húmedos o mojados."], ["Un foco expuesto a la lluvia, ¿qué grado IP mínimo necesita?", ["IP20", "IP44", "IP54", "IP68"], 2, "A la intemperie, IP54 (RIC N°10, 5.2)."], ["¿Cuántos enchufes como mínimo lleva la cocina?", ["1", "2", "3", "4"], 2, "Tres enchufes dobles o triples de 10/16 A."], ["¿Qué pliego trae las exigencias específicas de baños?", ["RIC N°02", "RIC N°06", "RIC N°11", "RIC N°18"], 2, "El RIC N°10 remite a la sección 6 del RIC N°11."]] }],
    ["s2", { id: "t1", m: "tierra", t: "Contactos eléctricos y esquemas de conexión a tierra", body: () => cuSec("Contacto directo e indirecto (RIC N°05)", cuTbl(["Tipo", "Qué es", "Cómo se protege"], [["Contacto directo", "Tocar una parte que normalmente tiene tensión (un borne, un cable pelado)", "Aislación, barreras o envolventes (mínimo IP2X), obstáculos, distancia; el diferencial de 30 mA es solo complementario"], ["Contacto indirecto", "Tocar una masa metálica que quedó con tensión por una falla", "Tierra de protección + desconexión automática (diferencial o disyuntor)"]]) + "<p>Tensiones de seguridad (RIC N°05, 5.8): <b>50 V</b> en alterna en lugares secos y <b>24 V</b> en lugares húmedos. Si una falla deja una masa sobre ese valor, la protección debe desconectar a tiempo: a 220 V el tiempo máximo es <b>0,4 s</b> (tabla 5.1).</p>" + note("Un diferencial de 30 mA no reemplaza a la aislación ni a la tierra: es una protección complementaria (RIC N°05, 7.8).", "info")) + cuSec("Esquemas de conexión a tierra", CI2.esquemas() + cuTbl(["Esquema", "Cómo funciona", "Dónde"], [["TN-S", "Neutro y tierra de protección separados en toda la instalación", "Exigido para viviendas por el RIC N°10 (5.2 f)"], ["TT", "Las masas tienen una tierra propia, distinta a la de la fuente", "Redes públicas de baja tensión (RIC N°05, 6.7.1.1)"], ["IT", "La fuente está aislada de tierra o unida con una impedancia alta", "Quirófanos, procesos que no pueden detenerse"], ["TN-C / TN-C-S", "Neutro y protección comparten conductor en parte o en todo", "Solo con justificación técnica; no admiten diferencial en el tramo combinado"]]) + "<p>En la práctica: <b>nunca</b> se une el neutro con la tierra dentro del tablero de la vivienda ni en un enchufe. Si se unieran, la corriente normal circularía por la tierra y el diferencial dispararía.</p>" + cuRef) + cuKey(["Directo: tocar algo con tensión. Indirecto: una masa que quedó con tensión por falla.", "50 V secos, 24 V húmedos; a 220 V desconectar en 0,4 s o menos.", "Vivienda: TN-S, neutro y PE separados."]), q: [["Tocar la carcasa de una lavadora con una falla de aislación es…", ["Contacto directo", "Contacto indirecto", "Arco eléctrico", "Inducción"], 1, "La carcasa normalmente no tiene tensión: es contacto indirecto."], ["¿Qué esquema exige el RIC N°10 para viviendas?", ["TN-C", "TT", "TN-S", "IT"], 2, "RIC N°10, 5.2 f: TN-S."], ["A 220 V, ¿tiempo máximo de desconexión ante una falla?", ["0,1 s", "0,2 s", "0,4 s", "5 s"], 2, "RIC N°05, tabla 5.1: 0,4 s a 220 V."], ["¿Por qué no se une N con PE en el tablero de la vivienda?", ["Porque se gasta más cable", "Porque la corriente normal pasaría por la tierra y el diferencial dispararía", "Porque baja la tensión", "Porque lo prohíbe la distribuidora por costo"], 1, "En TN-S neutro y tierra van separados."]] }],
    ["t1", { id: "t2", m: "tierra", t: "Sistema de puesta a tierra: electrodos, conductores y medición", body: () => cuSec("Partes de la puesta a tierra (RIC N°06)", CI2.pat() + cuTbl(["Elemento", "Exigencia"], [["Electrodos", "De cobre nuevo (8.9): barras, planchas, conductores desnudos o mallas"], ["Barras verticales", "Separación mínima de 2 veces el largo de cada barra; unión entre ellas de 16 mm² o más (8.3.2)"], ["Conductor desnudo enterrado", "25 mm² como mínimo (8.7)"], ["Conductor al tablero", "4 mm² como mínimo (7.11 b)"], ["Uniones bajo tierra", "Soldadura exotérmica o conector para enterramiento (7.11 c)"], ["Punto de medición", "Camarilla de 160 mm de diámetro o caja de 30 × 30 cm accesible (5.15)"]])) + cuSec("Sección del conductor de protección (PE)", cuTbl(["Sección de fase S", "PE mínimo (cobre)"], [["S ≤ 25 mm²", "Igual a S"], ["25 < S ≤ 50 mm²", "25 mm²"], ["S > 50 mm²", "S ÷ 2"]]) + "<p>En una vivienda con circuitos de 1,5 y 2,5 mm², el PE de cada circuito es de la misma sección que la fase. El PE nunca se interrumpe ni pasa por interruptores o protecciones.</p>") + cuSec("Valor de resistencia y medición", "<p>La resistencia de la tierra de protección se calcula con <b>R = Vs ÷ I0</b> (RIC N°06, 7.3): tensión de seguridad dividida por la corriente que hace operar la protección. Con un diferencial de 30 mA en lugar seco: 50 ÷ 0,03 ≈ 1.667 Ω teóricos. Aun así, el proyecto fija un valor bastante menor, porque el terreno cambia con la humedad y las estaciones. Para la <b>tierra de servicio</b> el máximo es <b>20 Ω</b> (6.1).</p>" + CI2.medicion() + '<ol class="hand"><li>Desconecta la puesta a tierra de la instalación en la camarilla.</li><li>Clava el electrodo de corriente C a una distancia de al menos 6 veces la diagonal mayor de la puesta a tierra.</li><li>Clava el electrodo de potencial P a cerca del 62 % de esa distancia.</li><li>Mide con un telurómetro de cuatro terminales calibrado (certificado de 24 meses o menos, 11.4) y registra el valor.</li><li>Vuelve a conectar y aprieta la unión.</li></ol><p>La pinza de tierra solo sirve para inspeccionar sistemas existentes, no para la recepción inicial (anexo 6.3).</p>' + cuRef) + cuKey(["Electrodos de cobre, barras separadas al doble de su largo, unión de 16 mm² o más.", "PE igual a la fase hasta 25 mm²; al tablero, 4 mm² o más.", "Medición por caída de potencial: C a 6 diagonales y P al 62 %."]), q: [["Dos barras de 1,5 m, ¿a qué distancia mínima se separan?", ["0,75 m", "1,5 m", "3 m", "6 m"], 2, "Al menos el doble del largo: 3 m (8.3.2)."], ["Circuito de 2,5 mm², ¿sección del conductor de protección?", ["1 mm²", "1,5 mm²", "2,5 mm²", "4 mm²"], 2, "Hasta 25 mm² el PE es igual a la fase."], ["En la medición por caída de potencial, ¿dónde va el electrodo P?", ["Junto al electrodo E", "A cerca del 62 % de la distancia a C", "Más allá de C", "En la camarilla"], 1, "Aproximadamente al 62 %."], ["¿Para qué sirve la camarilla de registro?", ["Para decorar", "Para tener un punto accesible de medición y mantención", "Para guardar herramientas", "Para drenar agua"], 1, "RIC N°06, 5.15: punto accesible de medición."], ["¿Cómo se unen los conductores bajo tierra?", ["Con huincha aisladora", "Torciéndolos", "Con soldadura exotérmica o conector para enterramiento", "Con regleta"], 2, "RIC N°06, 7.11 c."]] }],
    ["m1", { id: "m2", m: "serv", t: "Verificación inicial y declaración de la instalación", body: () => cuSec("Ensayos antes de energizar (RIC N°19)", "<p>El RIC N°19 fija la inspección visual y una secuencia de ensayos (7.1.3). Si un ensayo falla, se corrige y se repiten ese ensayo y los anteriores que la falla pudo afectar (7.1.6).</p>" + cuTbl(["#", "Ensayo", "Cómo y criterio"], [["1", "Inspección inicial", "Antes de energizar: conformidad con el proyecto, materiales, rotulado y medidas de protección"], ["2", "Continuidad de conductores", "Fuente de 4 a 24 V y al menos 0,2 A en conductores de protección y equipotenciales"], ["3", "Resistencia de aislamiento", "Hasta 500 V: ensayo a 500 V CC y mínimo 0,5 MΩ, con los equipos desconectados (tabla 19.1)"], ["4", "Separación de circuitos", "Por resistencia de aislamiento según la tabla 19.1"], ["5", "Resistencia de tierra", "Con corriente alterna; telurómetro"], ["6", "Desconexión automática", "Impedancia de bucle en TN; en TT, resistencia de tierra y protecciones"], ["7", "Protección complementaria", "Prueba de los diferenciales: disparan con su corriente nominal y a tiempo"], ["8", "Polaridad", "Los interruptores unipolares cortan la fase, nunca el neutro"], ["9", "Orden de fases", "Solo en circuitos trifásicos"], ["10", "Caída de tensión", "Medición o cálculo, dentro del 3 % y 5 %"], ["11", "Funcionalidad", "Cada punto, interruptor y protección funciona como se proyectó"]]) + '<button class="btn" type="button" data-go="sim">Practicar con los instrumentos en el Simulador 3D →</button>') + cuSec("Declaración y documentos", "<ul><li>La instalación la declara el <b>instalador eléctrico autorizado</b> por la SEC de la clase que corresponde, una vez terminada por completo (9.1.2), mediante el sistema electrónico de declaración (e-declarador); la declaración se conoce como <b>TE1</b>.</li><li>Debe avisar la puesta en servicio con <b>15 días hábiles</b> de anticipación (9.1.1).</li><li>Se adjuntan: <b>planos como construido</b> y <b>memoria explicativa</b> según el RIC N°18, la declaración del instalador de que la obra y los ensayos cumplen el proyecto, el <b>informe de verificación inicial</b> y certificados de terceros si corresponden (9.2.9).</li><li>El instalador responde por lo que declara con su clave personal (9.1.3).</li></ul>" + '<button class="btn ghost" type="button" data-go="rep">Generar planos y memoria en Reportes →</button>' + cuRef) + cuKey(["Orden: inspección, continuidad, aislamiento, tierra, desconexión, diferenciales, polaridad, caída, funcionalidad.", "Aislamiento hasta 500 V: 500 V CC y ≥ 0,5 MΩ.", "Declara el instalador autorizado, con planos como construido, memoria e informe de verificación."]), q: [["¿Con qué tensión se ensaya la aislación de un circuito de 220 V?", ["24 V CC", "250 V CC", "500 V CC", "1.000 V CC"], 2, "Tabla 19.1: hasta 500 V se ensaya a 500 V CC."], ["¿Valor mínimo de aislamiento en ese caso?", ["0,05 MΩ", "0,25 MΩ", "0,5 MΩ", "10 MΩ"], 2, "0,5 MΩ como mínimo."], ["Un ensayo falla y se corrige. ¿Qué se repite?", ["Nada", "Solo ese ensayo", "Ese ensayo y los anteriores que la falla pudo afectar", "Toda la obra"], 2, "RIC N°19, 7.1.6."], ["¿Con cuánta anticipación se avisa la puesta en servicio?", ["24 horas", "5 días hábiles", "15 días hábiles", "30 días corridos"], 2, "9.1.1: 15 días hábiles."], ["La prueba de polaridad comprueba que…", ["El diferencial dispare", "El interruptor corte la fase", "La tierra mida menos de 20 Ω", "El neutro sea blanco"], 1, "Un interruptor que corta el neutro deja la luz con tensión aunque esté apagada."]] }]
  ];
  CU_ADD.forEach(([after, l]) => {
    if (CU.some((x) => x.id === l.id)) return;
    const i = CU.findIndex((x) => x.id === after);
    CU.splice(i < 0 ? CU.length : i + 1, 0, l);
  });
  function cuStaticQuiz(q) {
    return '<section class="card cuqz"><h2>Autoevaluación</h2>' + q.map((x, i) => '<div class="cuq"><p><b>' + (i + 1) + ". " + x[0] + '</b></p><ol type="a" class="xopts">' + x[1].map((o) => "<li>" + o + "</li>").join("") + '</ol><details class="xans"><summary>Ver respuesta</summary><p><b>' + String.fromCharCode(97 + x[2]) + ") " + x[1][x[2]] + "</b>" + (x[3] ? ". " + x[3] : "") + "</p></details></div>").join("") + "</section>";
  }
  function cuExportHTML() {
    cuInit();
    const css = [...document.querySelectorAll("style")].map((x) => x.textContent).join("\n");
    const fonts = [...document.querySelectorAll('link[rel="stylesheet"]')].map((l) => '<link rel="stylesheet" href="' + esc(l.href) + '">').join("");
    const mk = (h) => {
      const d = document.createElement("div");
      d.innerHTML = h;
      return d.firstElementChild;
    };
    let n = 0, body = "";
    const toc = CU_M.map(([m, t, ic]) => '<li><a href="#m-' + m + '">' + ic + " " + t + "</a><ol>" + CU.filter((l) => l.m === m).map((l) => '<li><a href="#l-' + l.id + '">' + l.t + "</a></li>").join("") + "</ol></li>").join("");
    CU_M.forEach(([m, t, ic]) => {
      body += '<section class="xmod" id="m-' + m + '"><h2 class="xmh"><span class="cuic">' + ic + "</span> " + t + "</h2>";
      CU.filter((l) => l.m === m).forEach((l) => {
        n++;
        let b = "";
        try {
          b = l.body();
        } catch (e) {
          b = note("No se pudo generar esta lecci\xF3n.", "bad");
        }
        body += '<article class="xles" id="l-' + l.id + '"><p class="eyebrow">Lecci\xF3n ' + n + " de " + CU.length + " \xB7 " + t + '</p><h3 class="xlt">' + l.t + "</h3>" + b + cuStaticQuiz(l.q) + '<p class="xtop"><a href="#indice">↑ Volver al \xEDndice</a></p></article>';
      });
      body += "</section>";
    });

    render();
    window.scrollTo({ top: 0 });
  }
  function go(id) {
    if (id === cur) return;
    HIST.push(cur);
    if (HIST.length > 50) HIST.shift();
    try {
      history.pushState({ id }, "");
    } catch (e) {
    }
    show(id);
  }
  function back() {
    let id = HIST.pop();
    if (!id) {
      const p = pageOf(cur);
      id = PARENT[p.g] || "home";
    }
    show(id);
  }
  window.addEventListener("popstate", () => {
    const id = HIST.pop() || PARENT[pageOf(cur).g] || "home";
    show(id);
  });
  try {
    history.replaceState({ id: cur }, "");
  } catch (e) {
  }
  function doCalc() {
    const p = pageOf(cur);
    if (!p.c) return;
    RES[cur] = resultCard(p.c());
    SNAP[cur] = snapOf(cur);
    render();
    const r = document.getElementById("res");
    if (r) r.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  }
  function markStale() {
    if (!RES[cur]) return;
    const r = document.getElementById("res");
    if (!r || r.querySelector(".stale")) return;
    if (SNAP[cur] !== snapOf(cur)) r.insertAdjacentHTML("afterbegin", '<div class="note stale"><span>Cambiaste datos despu\xE9s de calcular: este resultado ya no corresponde.</span><button class="btn small" type="button" data-act="calc">Recalcular</button></div>');
  }
  function readEl(el) {
    const path = el.dataset.path;
    if (!path) return false;
    let v;
    if (el.dataset.bool) v = el.checked;
    else if (el.dataset.num) v = parseNum(el.value);
    else v = el.value;
    if (path.startsWith("amp.")) {
      if (v > 0) S.amp[path.slice(4).replace("_", ".")] = v;
      return true;
    }
    if (path.startsWith("ens.aisl.")) {
      const i = +path.split(".")[2];
      S.ens.aisl[i] = v;
      return true;
    }
    if (path.startsWith("ens.items.")) {
      S.ens.items[path.split(".")[2]] = v;
      return true;
    }
    setP(path, v);
    const m = path.match(/^circuits\.(\d+)\.tipo$/);
    if (m) {
      const c = S.circuits[+m[1]];
      if (c.tipo === "alumbrado") c.potUnit = 100;
      else if (c.tipo === "enchufes" || c.tipo === "cocina") c.potUnit = 250;
      if (c.tipo === "horno" && !(+c.pot > 0)) c.pot = Math.max(1500, +S.proj.potHorno || 1500);
    }
    const m2 = path.match(/^tools\.cargas\.rows\.(\d+)\.tipo$/);
    if (m2) {
      const r = S.tools.cargas.rows[+m2[1]];
      r.w = v === "alumbrado" ? 100 : v === "horno" ? 2e3 : v === "especial" ? 1e3 : 250;
      if (v === "horno" || v === "especial") r.cant = 1;
    }
    if (path === "tools.conductor.uso") S.tools.conductor.lim = v === "alim" ? 3 : 5;
    if (path === "proj.potHorno") S.circuits.forEach((c) => {
      if (c.tipo === "horno") c.pot = Math.max(1500, v || 1500);
    });
    return true;
  }
  function live() {
    if (cur === "cuadro") cqLive();
    if (cur === "t_potencias") potLive();
  }
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (!(el instanceof HTMLElement) || !el.dataset.path || el.tagName === "SELECT" || el.dataset.bool) return;
    if (readEl(el)) {
      save();
      markStale();
      live();
    }
  });
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el && el.id === "rjsonin" && el.files && el.files[0]) {
      const fr = new FileReader();
      fr.onload = () => {
        const m = document.getElementById("rmsg");
        try {
          const o = JSON.parse(fr.result), d = o && o.data ? o.data : o;
          if (!d || !d.proj) throw 0;
          S = d;
          if (!S.tools) S.tools = toolBlank();
          {
            const bb = toolBlank();
            for (const k in bb) if (!S.tools[k]) S.tools[k] = bb[k];
          }
          if (!S.cuadro) S.cuadro = cuadroBlank();
          if (!S.amp) S.amp = Object.assign({}, AMP_DEF);
          if (!S.sim2) S.sim2 = sim2Blank();
          save();
          render();
          const m2 = document.getElementById("rmsg");
          if (m2) m2.textContent = "Proyecto abierto.";
        } catch (err) {
          if (m) m.textContent = "Ese archivo no es un proyecto de esta app.";
        }
      };
      fr.readAsText(el.files[0]);
      return;
    }
  }, true);
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (!(el instanceof HTMLElement) || !el.dataset.path) return;
    if (!readEl(el)) return;
    save();
    if (el.dataset.re || el.dataset.bool && el.closest("table")) render(true);
    else {
      markStale();
      live();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.matches && e.target.matches("input[data-path]") && !e.target.dataset.bool) {
      e.preventDefault();
      readEl(e.target);
      save();
      if (pageOf(cur).c) doCalc();
      else {
        const f = [...document.querySelectorAll("main input[data-path],main select[data-path]")], i = f.indexOf(e.target);
        if (f[i + 1]) f[i + 1].focus();
        live();
      }
      return;
    }
    const a = e.target.closest && e.target.closest("abbr[data-ab]");
    if (a && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      showTip(a.dataset.ab);
    }
    if (e.key === "Escape") document.getElementById("tip").hidden = true;
    if (e.key === "Escape" && cur === "tg" && tgFull) {
      tgSetFull(false);
      tgRender();
    }
  });
  function showTip(k) {
    const t = document.getElementById("tip");
    delete t.dataset.row;
    document.getElementById("tipk").textContent = k;
    document.getElementById("tipd").textContent = GLOS[k] || "";
    t.hidden = false;
  }
  function showWhy(i) {
    const t = document.getElementById("tip");
    t.dataset.row = i;
    document.getElementById("tipk").textContent = "Verificaci\xF3n del circuito";
    document.getElementById("tipd").innerHTML = cqWhy(i);
    t.hidden = false;
    t.scrollTop = 0;
  }
  function closeMenu() {
    const s = document.getElementById("side");
    if (matchMedia("(max-width:900px)").matches) {
      s.hidden = true;
      document.getElementById("menuBtn").setAttribute("aria-expanded", "false");
    }
  }
  document.getElementById("backBtn").addEventListener("click", back);
  document.getElementById("menuBtn").addEventListener("click", () => {
    const s = document.getElementById("side");
    s.hidden = !s.hidden;
    document.getElementById("menuBtn").setAttribute("aria-expanded", String(!s.hidden));
  });
  function listOf(path) {
    return getP(path);
  }
  document.addEventListener("click", (e) => {
    const a = e.target.closest("abbr[data-ab]");
    if (a) {
      e.preventDefault();
      showTip(a.dataset.ab);
      return;
    }
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.go) {
      go(b.dataset.go);
      return;
    }
    const act = b.dataset.act;
    if (!act) return;
    if (act === "tipclose") {
      document.getElementById("tip").hidden = true;
      return;
    }
    if (act === "tpl") {
      const keep = S.sim2 ? { done: S.sim2.done, score: S.sim2.score, log: S.sim2.log } : {};
      S.sim2 = Object.assign(simTemplate(b.dataset.k), keep);
      simInsp = null;
      simSel = null;
      simPC = null;
      simSheet = null;
      save();
      if (cur === "sim") {
        simRefresh([["ok", "Plantilla cargada: " + (TPLS.find((t) => t[0] === b.dataset.k) || [])[2]]]);
      } else go("sim");
      return;
    }
    if (act === "rpdf") {
      try {
        window.print();
      } catch (err) {
        const m = document.getElementById("rmsg");
        if (m) m.textContent = "Tu navegador no permite imprimir aqu\xED: usa Compartir \u2192 Imprimir.";
      }
      return;
    }
    if (act === "rxls") {
      const m = document.getElementById("rmsg");
      if (m) m.textContent = "Generando Excel\u2026";
      repXLSX(m);
      return;
    }
    if (act === "rsvg") {
      const m = document.getElementById("rmsg");
      dlFile("plano-planta.svg", new Blob([planSVG(S.sim2)], { type: "image/svg+xml" })).then((rr) => {
        if (m) m.textContent = dlMsg(rr, "Plano descargado.");
      });
      return;
    }
    if (act === "rmem") {
      const m = document.getElementById("rmsg");
      dlFile("memoria-explicativa.html", new Blob([memoriaHTML(S.sim2, true)], { type: "text/html" })).then((rr) => {
        if (m) m.textContent = dlMsg(rr, "Memoria descargada: \xE1brela con Word o el navegador.");
      });
      return;
    }
    if (act === "rcopy") {
      const txt = repCSV(), m = document.getElementById("rmsg");
      try {
        navigator.clipboard.writeText(txt).then(() => {
          m.textContent = "Copiado: p\xE9galo en Excel.";
        }, () => {
          m.textContent = "No se pudo copiar.";
        });
      } catch (err) {
        m.textContent = "No se pudo copiar.";
      }
      return;
    }
    if (act === "rjson") {
      const ok = dlFile((S.proj && S.proj.nombre || "proyecto-ric").replace(/[^\w\-]+/g, "_") + ".json", new Blob([JSON.stringify({ app: "calculadora-ric", v: 3, data: S }, null, 1)], { type: "application/json" }));
      const m = document.getElementById("rmsg");
      ok.then((rr) => {
        if (m) m.textContent = dlMsg(rr, "Proyecto guardado como archivo.");
      });
      return;
    }
    if (act === "cqwhy") {
      showWhy(+b.dataset.i);
      return;
    }
    if (act === "calc") {
      doCalc();
      return;
    }
    if (act === "add") {
      const L = listOf(b.dataset.list);
      if (b.dataset.list === "rooms") L.push({ nombre: "", tipo: "dormitorio", area: 0, perim: 0, centros: 0, enchufes: 0, horno: false });
      else if (b.dataset.list === "circuits") L.push({ nombre: "", tipo: "enchufes", puntos: 0, potUnit: 250, pot: 0, L: 0, inForz: "auto" });
      else if (b.dataset.list === "cuadro.rows") L.push(cqRow());
      else if (b.dataset.list === "tools.potencias.rows") L.push({ n: "", cant: 0, w: 0 });
      else L.push({ n: "", tipo: "enchufes", cant: 0, w: 250, L: 0 });
    }
    if (act === "del") {
      listOf(b.dataset.list).splice(+b.dataset.i, 1);
      if (b.dataset.list === "circuits") S.ens.aisl = [];
    }
    if (act === "dup") {
      const L = listOf(b.dataset.list), i = +b.dataset.i, o = Object.assign({}, L[i]);
      if ("nombre" in o) o.nombre = (o.nombre || "") + " (copia)";
      if ("n" in o) o.n = (o.n || "") + " (copia)";
      L.splice(i + 1, 0, o);
      if (b.dataset.list === "circuits") S.ens.aisl = [];
    }
    if (act === "gen") {
      S.circuits = genCircuits(S);
      S.ens.aisl = [];
    }
    if (act === "cqclear") S.tools.cargas.rows = [];
    if (act === "padd") {
      const L = S.tools.potencias.rows, ex = L.find((r) => r.n === b.dataset.n && +r.w === +b.dataset.w);
      if (ex) ex.cant = (+ex.cant || 0) + 1;
      else L.push({ n: b.dataset.n, cant: 1, w: +b.dataset.w });
    }
    if (act === "pclear") S.tools.potencias.rows = [];
    if (act === "p2prot" || act === "p2cond") {
      const P = potTotal(S.tools.potencias), k = act === "p2prot" ? "proteccion" : "conductor";
      Object.assign(S.tools[k], { ent: "P", P });
      save();
      go("t_" + k);
      doCalc();
      return;
    }
    if (act === "cqdef") Object.assign(S.cuadro, { V: 220, Hz: 50, wPL: 100, wEG: 250, wE2: 500, wE3: 1200 });
    if (act === "del" && b.dataset.list === "cuadro.rows") document.getElementById("tip").hidden = true;
    if (act === "cqempty") {
      if (b.dataset.ok !== "1") {
        b.dataset.ok = "1";
        b.textContent = "\xBFSeguro? Toca otra vez";
        return;
      }
      S.cuadro.rows = [];
    }
    if (act === "cqcopy") {
      const txt = cqCSV(), msg = document.getElementById("cqmsg");
      const fb = () => {
        const ta = document.createElement("textarea");
        ta.value = txt;
        ta.style.width = "100%";
        ta.rows = 6;
        msg.replaceWith(ta);
        ta.select();
      };
      try {
        navigator.clipboard.writeText(txt).then(() => {
          msg.textContent = "Copiado. P\xE9galo en Excel.";
        }, fb);
      } catch (err) {
        fb();
      }
      return;
    }
    if (act === "tclear") {
      S.tools[b.dataset.k] = toolBlank()[b.dataset.k];
      delete RES["t_" + b.dataset.k];
    }
    if (act === "tex") {
      S.tools[b.dataset.k] = toolExample(b.dataset.k);
      save();
      render();
      doCalc();
      return;
    }
    if (act === "ampdef") S.amp = Object.assign({}, AMP_DEF);
    if (act === "askproj") {
      const ex = b.dataset.k === "ex";
      document.getElementById("confirm").innerHTML = '<span class="hint">'.concat(ex ? "Se reemplazar\xE1 tu proyecto por el ejemplo." : "Se borrar\xE1n recintos, circuitos y mediciones.", '</span> <button class="btn danger small" type="button" data-act="doproj" data-k="').concat(b.dataset.k, '">S\xED, ').concat(ex ? "cargar ejemplo" : "borrar", '</button> <button class="btn ghost small" type="button" data-act="noproj">Cancelar</button>');
      return;
    }
    if (act === "noproj") {
      document.getElementById("confirm").innerHTML = "";
      return;
    }
    if (act === "doproj") {
      const np = b.dataset.k === "ex" ? exampleProject() : blankProject();
      Object.assign(S, np);
      PAGES.filter((p) => p.g === "proy").forEach((p) => {
        delete RES[p.id];
        delete SNAP[p.id];
      });
    }
    save();
    render();
  });
  render();
})();

</script>


</body></html>
